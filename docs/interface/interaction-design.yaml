version: 1
kind: interaction-design
id: PREP-INTERACTION-DESIGN

interaction_roles:
  - id: IX-ROLE-TARGET-SELECTED-COMPARISON
    concept_ref: C-TARGET
    meaning: A Target is included in the current candidate comparison set; this role may coexist with active-target when reconsidering an already active Target.
    entry: The user selects the Target for comparison in IX-TARGET-DIRECTION.
    exit: The Target leaves the comparison set, the comparison context ends, or the user designates it as the candidate to continue with.
    transitions:
      - {to: IX-ROLE-TARGET-CANDIDATE-CONTINUE, trigger: choose-target-to-continue}
    side_effects:
      - Include the Target in the comparison projection over the existing learner evidence basis.
    forbidden_side_effects:
      - Activate or establish the Target.
      - Mutate learner state, evidence, Target identity or Target requirements.
    observable_distinction: Comparison membership must be distinguishable from active Target commitment; selecting for comparison never implies activation.

  - id: IX-ROLE-TARGET-CANDIDATE-CONTINUE
    concept_ref: C-TARGET
    meaning: A compared Target has been chosen as the candidate whose context will be carried into active-Target establishment/refinement.
    entry: The user chooses one compared Target to continue with.
    exit: Establishment/refinement is accepted, rejected, left unresolved, or the user returns to comparison and changes the candidate.
    transitions:
      - {to: IX-ROLE-TARGET-ACTIVE, trigger: accepted-target-establishment}
      - {to: IX-ROLE-TARGET-SELECTED-COMPARISON, trigger: reconsider-candidate}
    side_effects:
      - Carry the chosen Target context from IX-TARGET-DIRECTION into IX-TARGET.
    forbidden_side_effects:
      - Silently activate the Target before an accepted target-establishment outcome.
      - Mutate learner state or historical evidence.
    observable_distinction: Continuation intent must be distinguishable from both comparison membership and accepted active Target state.

  - id: IX-ROLE-TARGET-ACTIVE
    concept_ref: C-TARGET
    meaning: The accepted Target is the current preparation purpose/context used for target-relative state, gaps and focus interpretation.
    entry: Target establishment/refinement is accepted in IX-TARGET, either from a candidate-to-continue or from directly provided target context.
    exit: A replacement/refinement is accepted or active Target context is explicitly cleared by a future accepted semantic contract.
    transitions:
      - {to: IX-ROLE-TARGET-SELECTED-COMPARISON, trigger: acquire-additional-comparison-role-for-reconsideration}
    side_effects:
      - Establish the shared active Target context for target-relative preparation interpretation.
    forbidden_side_effects:
      - Rewrite reusable Knowledge/Capability identity or historical evidence.
    observable_distinction: Active Target commitment must remain recoverable and distinguishable from comparison selection and continuation intent.

contexts:
  - id: IX-TARGET-DIRECTION
    purpose: Compare plausible Targets against the same evidence-backed learner capability basis and choose which direction to continue with.
    task_refs: [TASK-U-COMPARE-TARGETS]
    concept_refs: [C-TARGET-COMPARISON, C-TARGET, C-CURRENT-STATE, C-GAP]
    actions:
      - select-candidate-targets
      - inspect-shared-and-target-specific-requirements
      - inspect-per-target-current-state-and-gaps
      - choose-target-to-continue
      - leave-direction-unresolved
    machine_operations: [prep.targets.compare]
    states: [loading, ready, partial, unresolved, dependency-unavailable]
    transition_rules:
      - "candidate Targets + compare -> per-target requirement/state/gap projections over the same learner evidence basis"
      - "choose candidate -> continue to IX-TARGET with the chosen target context; comparison itself does not activate or mutate Target/learner state"
    recovery: Incomplete target requirements and insufficient/stale evidence remain explicit per candidate; comparison may remain unresolved and no scalar fit/readiness score is synthesized.

  - id: IX-TARGET
    purpose: Establish or refine the active Target and understand what performance is required.
    task_refs: [TASK-U-ESTABLISH-TARGET, TASK-U-UNDERSTAND-REQUIREMENTS]
    concept_refs: [C-TARGET, C-TARGET-REQUIREMENT, C-REQUIRED-CAPABILITY, C-KNOWLEDGE]
    actions:
      - provide-or-select-target-context
      - refine-unresolved-target
      - inspect-requirements
      - inspect-required-knowledge-focus
      - request-missing-preparation-support
    machine_operations: [prep.target.establish, prep.target.requirements.get, prep.support.prepare.request]
    states: [loading, ready, unresolved, submitting, rejected, dependency-unavailable, stale-context]
    transition_rules:
      - "target context + establish -> accepted Target or explicit unresolved/rejected result"
      - "accepted Target + inspect requirements -> requirement projection with semantic basis, including direct Knowledge focus per required performance where present"
      - "required Capability performance + inspect Knowledge focus -> reusable Subject Knowledge refs without implying learner state, sufficiency or a Subject Knowledge predicate"
      - "missing usable target/support -> enter IX-PREP-SUPPORT while preserving motivating context"
    recovery: Preserve target/source input after unresolved, rejected, unavailable or stale outcomes; target refinement never becomes learner evidence.

  - id: IX-DIRECTION
    purpose: Understand current evidence-backed position, inspect gaps/uncertainty and choose the next focus from explicit priority/external-constraint/support-availability context.
    task_refs: [TASK-U-REVIEW-CURRENT-STATE, TASK-U-REVIEW-GAPS, TASK-U-CHOOSE-NEXT-FOCUS]
    concept_refs: [C-CURRENT-STATE, C-EVIDENCE-BASIS, C-GAP, C-NEXT-FOCUS]
    actions:
      - inspect-current-state
      - inspect-why-this-state
      - inspect-gaps-and-uncertainty
      - inspect-focus-decision-context
      - choose-or-revise-next-focus
    machine_operations: [prep.current_state.get, prep.evidence.get, prep.gaps.get, prep.focus.set]
    states: [loading, ready, insufficient-evidence, challenged, submitting-focus, rejected, dependency-unavailable, stale-context]
    transition_rules:
      - "current state -> inspect evidence basis without converting unknown into failure"
      - "gaps/uncertainty + priority rationale + accepted external constraints + support-availability summary + choose focus + current basis -> accepted PreparationIntent or stale/rejected outcome"
    recovery: STALE_BASIS refreshes the visible basis before reconsideration; rejected/unavailable focus changes preserve the inspected gap and user rationale.

  - id: IX-KNOWLEDGE
    purpose: Orient within relevant reusable Subject Knowledge while retaining target/focus context and optionally bounding exploration by a selected Required Capability.
    task_refs: [TASK-U-EXPLORE-KNOWLEDGE]
    concept_refs: [C-KNOWLEDGE, C-KNOWLEDGE-SCOPE, C-REQUIRED-CAPABILITY, C-NEXT-FOCUS]
    actions:
      - query-knowledge
      - narrow-or-expand-scope
      - apply-required-capability-scope
      - clear-required-capability-scope
      - select-knowledge
      - follow-meaningful-relation
      - move-between-overview-and-detail
    machine_operations: [prep.knowledge.query]
    states: [loading, empty, ready, selected, dependency-unavailable]
    focus_semantics: Selection reveals meaning/detail without silently changing target/focus or Knowledge identity; scope changes are reversible projections. A selected Required Capability may bound the Knowledge projection using its direct Knowledge focus as anchors plus accepted bounded semantic expansion. Clearing the filter restores the broader target/focus scope. This does not require inverse Knowledge-to-Capability browsing.
    recovery: Query/unavailable outcomes preserve target/focus and current semantic scope.
    accessibility: Every task-critical inspect/traverse action has a non-spatial keyboard-operable path; graph/direct-manipulation is optional downstream presentation.

  - id: IX-ACTIVITY
    purpose: Inspect learner-adaptive support fit, carry out the selected learning/practice/diagnostic/retention/transfer activity as applicable, then understand what resulting evidence does or does not establish.
    task_refs: [TASK-U-SELECT-SUPPORT, TASK-U-PERFORM-ACTIVITY, TASK-U-REVIEW-CHANGE]
    system_task_refs: [TASK-S-CAPTURE-PERFORMANCE, TASK-S-EVALUATE-EVIDENCE]
    concept_refs: [C-NEXT-FOCUS, C-REQUIRED-CAPABILITY, C-SUPPORT, C-ACTIVITY, C-EVIDENCE, C-EVIDENCE-BASIS, C-CHANGE]
    actions:
      - inspect-support
      - inspect-support-fit
      - choose-support
      - start-activity
      - submit-or-complete-attempt
      - inspect-evidence-basis
      - review-change
      - continue-or-return-to-direction
    machine_operations: [prep.support.list, prep.activity.start, prep.activity.complete, prep.evidence.get, prep.change.get]
    states: [loading-support, no-suitable-support, ready, activity-active, submitting-attempt, evidence-processing, reviewed, unresolved, challenged, no-change, increased-uncertainty, dependency-unavailable, stale-context]
    transition_rules:
      - "support option + inspect fit -> intended CapabilitySpecification, PreparationIntent purpose, applicable learner basis, expected assistance/conditions, fit basis and limitations"
      - "selected support + current basis -> semantic activity attempt; runtime guidance/feedback/repetition may adapt within Learning Design constraints without becoming evidence by themselves"
      - "materially distinct attributable executions -> distinct Performance semantics before accepted capture/evaluate/review inference; activity completion alone never becomes capability evidence"
      - "reviewed result -> explicit continuation choice even for no-change/challenge/unresolved inference"
    recovery: Dependency unavailability may preserve the same current activity attempt; historical accepted Performance/Observations are never rolled back because later inference is unresolved/rejected.
    cancellation: Leaving the interaction is not represented as cancelling a machine/process occurrence unless a future accepted machine contract explicitly supports cancellation.

  - id: IX-PREP-SUPPORT
    purpose: Request missing preparation support from fragmented sources and return with accepted support plus explicit remaining gaps.
    task_refs: [TASK-U-REQUEST-PREPARATION-SUPPORT]
    system_task_refs: [TASK-S-PREPARE-SUPPORT]
    concept_refs: [C-PREPARATION-REQUEST, C-SUPPORT, C-TARGET, C-NEXT-FOCUS]
    actions:
      - inspect-missing-support
      - provide-source-context
      - request-preparation
      - inspect-accepted-partial-support
      - inspect-unresolved-or-rejected-remainder
      - resume-after-source-or-dependency-change
      - return-to-origin
    machine_operations: [prep.support.prepare.request, prep.support.prepare.get]
    states: [ready, requesting, partial, unresolved, rejected, dependency-unavailable, stale-context, complete]
    transition_rules:
      - "missing-support context + request -> PreparationRequest preserving motivation/provenance"
      - "owner-scoped accepted results + explicit remainder -> partial or complete review"
      - "current request + source/dependency availability -> continuation without discarding accepted owner results"
    recovery: Preserve request, source provenance and motivating target/focus; stale context refreshes before dependent continuation.

shared_contracts:
  context_continuity:
    - Active Target remains visible/recoverable context across all preparation interactions.
    - Next focus scopes Knowledge/Activity/Evidence interactions when present and is never silently changed by navigation.
    - IX-PREP-SUPPORT always retains and returns to its originating interaction context.
  capability_and_focus_distinction:
    - Required Capability expresses required performance and may be applied or cleared as a reversible Knowledge-scope criterion; this does not choose, revise or imply Next focus.
    - Next focus is PreparationIntent used as preparation context; choosing or revising it does not mutate Capability identity or silently apply/clear Required Capability Knowledge scope.
    - Where both meanings participate in the same interaction flow, their role in the interaction must remain observably distinguishable downstream.

  outcome_visibility:
    - SUCCESS, UNRESOLVED, REJECTED, DEPENDENCY_UNAVAILABLE and STALE_BASIS remain visibly distinct where applicable.
    - Unknown/insufficient evidence is not rendered as generic failure.
    - OPERATIONAL_FAILURE is shown as an operational inability without inventing domain rejection or accepted mutation.
  input_and_focus:
    - Task-critical actions are keyboard reachable in semantic order.
    - Validation/rejection preserves entered source/rationale/attempt context when semantically safe.
    - Completion of background/process work does not steal focus unexpectedly.
    - Pointer hover, drag or spatial manipulation is never the only way to reveal task-critical information or invoke required actions.
  pending_and_duplicate_submission:
    - A consumer-visible mutation exposes pending state until a terminal machine outcome is known.
    - Duplicate submission of the same pending semantic command is prevented unless a future accepted contract explicitly supports independent concurrent occurrences.
  currentness:
    - Commands based on prior reads carry the relevant semantic basis.
    - STALE_BASIS preserves user context, refreshes accepted meaning and requires reconsideration rather than silent replay.
  presentation_boundary:
    - Contexts do not define pages, view inventory, routes, regions, component hierarchy, graph/list choice or 2D/3D presentation.

no_ui_dispositions: []
unresolved_questions: []
