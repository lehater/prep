version: 1
kind: interaction-design
id: PREP-INTERACTION-DESIGN

contexts:
  - id: I-L-SELECT-TARGET
    task_refs: [TASK-L-SELECT-TARGET]
    concept_refs: [LEARNING-TARGET]
    actions: [search-targets, select-target]
    inputs: [text query, target selection]
    machine_operations: [learning.targets.list, learning.targets.get]
    visible_responses: [target results with total context, active target context, empty results, recoverable load failure]
    states: [loading, empty, ready, failure]
    recovery: Preserve the selection task and query on recoverable failure.

  - id: I-L-OVERVIEW
    task_refs: [TASK-L-UNDERSTAND-TARGET]
    concept_refs: [LEARNING-TARGET, TARGET-REQUIREMENTS, PREPARATION-DIAGNOSTIC, LEARNING-EVIDENCE]
    actions: [inspect-requirements, inspect-support-status, choose-next-learning-task]
    inputs: [active target]
    machine_operations: [learning.targets.get, learning.target.study_set.build, learning.target.evidence.get]
    visible_responses: [read-only capability requirements, current support/diagnostics, factual evidence summary, unavailable distinction]
    states: [loading, ready, partial-unavailable, failure]
    recovery: Keep the active target while retrying independently unavailable projections.

  - id: I-L-KNOWLEDGE
    task_refs: [TASK-L-EXPLORE-KNOWLEDGE]
    concept_refs: [KNOWLEDGE, RELATIONAL-KNOWLEDGE]
    actions: [search-knowledge, filter-knowledge, select-knowledge, follow-related-knowledge, set-explicit-focus, clear-focus, inspect-detail]
    inputs: [text query, semantic filters, predicate filters, selected Knowledge identity, explicit focus intent]
    machine_operations: [learning.target.knowledge.list, learning.target.knowledge.projection]
    visible_responses: [bounded semantic results, selected detail, predicate/participant meaning, current focus/filter state, presentation-degradation status]
    states: [loading, empty, ready, selected, focused, degraded, query-failure]
    focus_semantics: Selection exposes detail without implicitly changing the semantic result set; explicit focus may narrow/emphasize the exploration context and is reversible.
    keyboard_semantics: Search, result selection, detail inspection and relation traversal remain completable without spatial direct manipulation.
    recovery: Presentation degradation preserves semantic access; data-query retry preserves target/filter context.

  - id: I-L-STUDY
    task_refs: [TASK-L-STUDY-QUESTIONS, TASK-L-EXPORT-STUDY]
    concept_refs: [STUDY-MATERIAL, STUDY-SET, PREPARATION-DIAGNOSTIC, EXTERNAL-RUNTIME]
    actions: [inspect-study-material, build-study-preview, navigate-supporting-knowledge, export-preview, rebuild-stale-preview, retry-export]
    inputs: [active target, selected compatibility item, materialization token]
    machine_operations: [learning.target.questions.list, learning.target.study_set.build, learning.target.study_set.export]
    visible_responses: [material detail, exact Study Set subset, preparation diagnostics, valid-empty preview, stale-preview conflict, per-item export outcomes, runtime unavailable, partial external failure]
    states: [loading, empty, preview-ready, preview-stale, exporting, exported, partial-failure, runtime-unavailable, operational-failure]
    recovery: Conflict requires rebuild/reinspect; recoverable external failures retain preview/target context and item outcomes.

  - id: I-L-STATISTICS
    task_refs: [TASK-L-REVIEW-FACTS]
    concept_refs: [LEARNING-EVIDENCE]
    actions: [sync-evidence, inspect-aggregates, inspect-evidence-history]
    inputs: [active target, optional Question-compatible item context, explicit sync action]
    machine_operations: [learning.target.evidence.get, learning.question.evidence.get, learning.evidence.sync]
    visible_responses: [factual Observation history/aggregates, provenance/context, sync summary, item-level failures, runtime unavailable]
    states: [loading, empty, ready, syncing, partial-failure, runtime-unavailable, operational-failure]
    recovery: Sync failure preserves already recorded evidence and permits retry.

  - id: I-C-TARGETS
    task_refs: [TASK-C-MAINTAIN-TARGETS]
    concept_refs: [LEARNING-TARGET, TARGET-REQUIREMENTS, CAPABILITY]
    actions: [search-targets, create-target, edit-target, compose-requirement-expression]
    inputs: [text query, target fields, CapabilitySpecification selection/expression composition]
    machine_operations: [curation.targets.list, curation.targets.get, curation.targets.create, curation.targets.update, curation.capabilities.list]
    visible_responses: [collection/detail/edit state, expression validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editor input/context for correction or retry.

  - id: I-C-KNOWLEDGE
    task_refs: [TASK-C-MAINTAIN-KNOWLEDGE]
    concept_refs: [KNOWLEDGE, RELATIONAL-KNOWLEDGE]
    actions: [search-knowledge, inspect-knowledge-context, create-knowledge, edit-knowledge]
    inputs: [text query, KnowledgeObject fields or KnowledgeProposition predicate/participants/conditions]
    machine_operations: [curation.knowledge.list, curation.knowledge.get, curation.knowledge.create, curation.knowledge.update, curation.knowledge.projection]
    visible_responses: [bounded results, semantic context/detail, validation rejection, conflict, successful mutation]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    focus_semantics: Exploration selection/focus remains distinct from semantic mutation; presentation manipulation never edits Knowledge.
    recovery: Preserve editing/selection context; rejected predicate/participant semantics are not coerced.

  - id: I-C-CAPABILITIES
    task_refs: [TASK-C-MAINTAIN-CAPABILITIES]
    concept_refs: [CAPABILITY, KNOWLEDGE]
    actions: [search-capabilities, create-capability, edit-capability, select-knowledge-focus]
    inputs: [text query, PerformanceExpectation, condition/criterion information, Capability standard/scope information, Knowledge focus]
    machine_operations: [curation.capabilities.list, curation.capabilities.get, curation.capabilities.create, curation.capabilities.update, curation.knowledge.list]
    visible_responses: [collection/editor state, reference/semantic validation rejection, conflict, successful mutation]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editing state after rejected capability/reference changes.

  - id: I-C-STUDY-MATERIAL
    task_refs: [TASK-C-MAINTAIN-QUESTIONS]
    concept_refs: [STUDY-MATERIAL, KNOWLEDGE]
    actions: [search-study-material, create-question-compatible-material, edit-question-compatible-material, map-knowledge, unmap-knowledge]
    inputs: [text query, prompt/response compatibility fields, Knowledge selection]
    machine_operations: [curation.questions.list, curation.questions.get, curation.questions.create, curation.questions.update, curation.questions.knowledge.align, curation.questions.knowledge.unalign]
    visible_responses: [collection/editor state, compatibility mapping state, validation rejection, conflict, successful mutation]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editable material and accepted mappings after rejection.

  - id: I-C-IMPORT
    task_refs: [TASK-C-IMPORT-DATA]
    actions: [select-prepared-document, apply-import, inspect-item-outcomes, correct-and-retry]
    inputs: [prepared-data document]
    machine_operations: [curation.import.apply]
    visible_responses: [aggregate counts, created/updated/duplicate/rejected item outcomes, rejection reason/category]
    states: [idle, validating, applied, partially-applied, envelope-rejected, operational-failure]
    recovery: Invalid/rejected items remain identifiable for correction; accepted independent peers are preserved.

  - id: I-RUNTIME-STATUS
    task_refs: [TASK-I-CHECK-RUNTIME]
    concept_refs: [EXTERNAL-RUNTIME]
    actions: [inspect-runtime-status]
    inputs: []
    machine_operations: [integration.external_runtime.status.get]
    visible_responses: [reachable/compatible status, unavailable/incompatible status, non-secret profile summary]
    states: [loading, reachable, unavailable, incompatible, operational-failure]
    recovery: Status can be retried without changing canonical learning state.

task_dispositions: []
