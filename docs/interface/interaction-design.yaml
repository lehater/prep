version: 2
kind: interaction-design
id: PREP-INTERACTION-DESIGN

contexts:
  - id: I-L-ESTABLISH-TARGET
    task_refs: [TASK-L-ESTABLISH-TARGET]
    concept_refs: [TARGET, TARGET-REQUIREMENTS]
    actions: [search-targets, select-target, start-target-preparation]
    inputs: [text query, target selection, optional external target context]
    machine_operations: [learning.targets.list, learning.targets.get]
    visible_responses: [target results, target requirement summary, empty results, preparation-needed state, recoverable failure]
    states: [loading, empty, ready, preparation-needed, failure]
    recovery: Preserve query and motivating target context when routing to preparation or retrying.

  - id: I-C-SELECT-PREPARATION-PATH
    task_refs: [TASK-C-SELECT-PREPARATION-PATH]
    concept_refs: [TARGET, CORPUS, IMPORT-CONTRACT]
    actions: [inspect-missing-prerequisites, choose-bulk-preparation, choose-incremental-curation, choose-mixed-preparation]
    inputs: [motivating target/source context, empty or materially incomplete target/corpus state, optional known corpus diagnostics]
    machine_operations: [learning.targets.list, curation.quality.get, curation.import.contract.get]
    visible_responses: [missing or unknown preparation prerequisites, bulk/import availability, incremental curation areas, chosen preparation path]
    states: [not-needed, empty-corpus, partial-corpus, path-selected, diagnostics-unavailable, failure]
    recovery: Preserve motivating target/source context and accepted corpus data when changing preparation path or retrying diagnostics.

  - id: I-L-UNDERSTAND-TARGET
    task_refs: [TASK-L-UNDERSTAND-TARGET]
    concept_refs: [TARGET, TARGET-REQUIREMENTS, CAPABILITY, KNOWLEDGE]
    actions: [inspect-target-context, inspect-required-capabilities, inspect-relevant-knowledge]
    inputs: [active target]
    machine_operations: [learning.targets.get, learning.target.knowledge.list]
    visible_responses: [target definition, capability requirement structure, standards/conditions, related knowledge]
    states: [loading, ready, partial-unavailable, failure]
    recovery: Preserve active target while retrying independently unavailable projections.

  - id: I-L-CURRENT-STATE
    task_refs: [TASK-L-ESTABLISH-CURRENT-STATE]
    concept_refs: [CURRENT-STATE, OBSERVATION, EVIDENCE-BASIS, LEARNER-CLAIM, TARGET-REQUIREMENTS, DIAGNOSTIC-ACTIVITY]
    actions: [inspect-current-state, inspect-evidence-basis, inspect-unresolved-areas, choose-diagnostic-opportunity]
    inputs: [active target, optional requirement fragment]
    machine_operations: [learning.target.state.get, learning.target.evidence.get, learning.target.diagnostics.list]
    visible_responses: [satisfied/unresolved/challenged fragments, evidence basis, uncertainty, available diagnostic opportunities]
    states: [loading, ready, insufficient-evidence, conflicting-evidence, failure]
    recovery: Missing evidence remains unresolved and may route to diagnostics without becoming failure.

  - id: I-L-GAPS
    task_refs: [TASK-L-REVIEW-GAPS, TASK-L-CHOOSE-NEXT-FOCUS]
    concept_refs: [GAP, CURRENT-STATE, LEARNING-FOCUS]
    actions: [inspect-gap, inspect-gap-basis, choose-learning-focus, choose-diagnostic-focus, revise-focus]
    inputs: [active target, gap selection, intent kind, optional rationale]
    machine_operations: [learning.target.gaps.get, learning.target.focus.get, learning.target.focus.set]
    visible_responses: [satisfied/unresolved/challenged requirement fragments, gap basis, uncertainty, current focus, accepted focus change]
    states: [loading, no-material-gaps, ready, focus-selected, conflict, failure]
    recovery: Preserve selected gap and user rationale after recoverable conflict/failure.

  - id: I-L-KNOWLEDGE
    task_refs: [TASK-L-EXPLORE-RELEVANT-KNOWLEDGE]
    concept_refs: [KNOWLEDGE, CAPABILITY, LEARNING-FOCUS]
    actions: [search-knowledge, filter-knowledge, select-knowledge, follow-related-knowledge, set-explicit-focus, clear-focus, inspect-detail]
    inputs: [active target, optional learning focus, text query, semantic filters, selected Knowledge identity]
    machine_operations: [learning.target.knowledge.list, learning.target.knowledge.projection]
    visible_responses: [semantic results, detail, relation meaning, current target/focus/filter context, presentation-degradation status]
    states: [loading, empty, ready, selected, focused, degraded, query-failure]
    focus_semantics: Selection exposes detail without silently changing semantic scope; explicit focus is reversible.
    keyboard_semantics: Search, result selection, detail inspection and relation traversal remain possible without spatial direct manipulation.
    recovery: Presentation degradation preserves semantic access and active target/focus context.

  - id: I-L-LEARNING
    task_refs: [TASK-L-LEARN-OR-PRACTISE]
    concept_refs: [LEARNING-FOCUS, LEARNING-SUPPORT, KNOWLEDGE, EXTERNAL-RUNTIME]
    actions: [inspect-support, choose-support, start-activity, inspect-support-diagnostics, delegate-to-runtime]
    inputs: [active target, current focus, selected support]
    machine_operations: [learning.target.support.list, learning.target.activity.start, integration.external_runtime.status.get]
    visible_responses: [available material/tasks, preparation diagnostics, activity context, runtime availability]
    states: [loading, empty-support, ready, activity-active, runtime-unavailable, failure]
    recovery: Missing support remains explicit and may route to Curation without losing target/focus context.

  - id: I-L-DIAGNOSTICS
    task_refs: [TASK-L-COLLECT-EVIDENCE]
    concept_refs: [DIAGNOSTIC-ACTIVITY, OBSERVATION, EVIDENCE-BASIS, LEARNER-CLAIM, CURRENT-STATE]
    actions: [inspect-diagnostic-opportunities, start-diagnostic, sync-evidence, inspect-observations, inspect-derived-claims]
    inputs: [active target, optional focus/gap, selected diagnostic, explicit sync]
    machine_operations: [learning.target.diagnostics.list, learning.target.activity.start, learning.evidence.sync, learning.target.evidence.get]
    visible_responses: [diagnostic opportunities, Performance/Observation facts, provenance, supported/challenged claims, sync outcomes]
    states: [loading, empty, ready, activity-active, syncing, partial-failure, runtime-unavailable, failure]
    recovery: Sync/activity failure preserves accepted evidence and target context.

  - id: I-L-PROGRESS
    task_refs: [TASK-L-REVIEW-PROGRESS]
    concept_refs: [PROGRESS, CURRENT-STATE, GAP, OBSERVATION, EVIDENCE-BASIS, LEARNER-CLAIM, LEARNING-FOCUS]
    actions: [inspect-state-change, inspect-changed-gaps, inspect-new-evidence, continue-focus, choose-another-focus]
    inputs: [active target, optional prior projection]
    machine_operations: [learning.target.progress.get, learning.target.state.get, learning.target.gaps.get, learning.target.focus.set]
    visible_responses: [changed/unchanged target fragments, gap changes, evidence basis, current focus]
    states: [loading, no-change, changed, increased-uncertainty, failure]
    recovery: Preserve historical comparison context and allow retry without rewriting prior evidence.

  - id: I-C-IMPORT
    task_refs: [TASK-C-PREPARE-BULK-DATA, TASK-C-IMPORT-BULK-DATA]
    concept_refs: [IMPORT-CONTRACT, IMPORT-RESULT, CORPUS]
    actions: [inspect-import-contract, copy-or-export-example, select-prepared-document, validate-import, inspect-item-outcomes, apply-import, correct-and-retry]
    inputs: [prepared-data document, optional validation identity]
    machine_operations: [curation.import.contract.get, curation.import.validate, curation.import.apply]
    visible_responses: [schema/version, supported kinds, examples, validation summary, item outcomes, aggregate apply result]
    states: [idle, contract-ready, validating, validation-rejected, ready-to-apply, applying, applied, partially-applied, operational-failure]
    recovery: Rejected items remain identifiable; validation never silently applies data; accepted independent peers remain visible after partial application.

  - id: I-C-TARGETS
    task_refs: [TASK-C-MAINTAIN-TARGETS]
    concept_refs: [TARGET, TARGET-REQUIREMENTS, CAPABILITY]
    actions: [search-targets, create-target, edit-target, compose-requirement-expression]
    inputs: [target context, CapabilitySpecification selection/expression]
    machine_operations: [curation.targets.list, curation.targets.get, curation.targets.create, curation.targets.update, curation.capabilities.list]
    visible_responses: [collection/detail/editor state, validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editor input/context for correction or retry.

  - id: I-C-CAPABILITIES
    task_refs: [TASK-C-MAINTAIN-CAPABILITIES]
    concept_refs: [CAPABILITY, KNOWLEDGE]
    actions: [search-capabilities, create-capability, edit-capability, select-knowledge-focus]
    inputs: [PerformanceExpectation, conditions, criteria, standard, Knowledge focus]
    machine_operations: [curation.capabilities.list, curation.capabilities.get, curation.capabilities.create, curation.capabilities.update, curation.knowledge.list]
    visible_responses: [collection/editor state, validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editing state after rejected changes.

  - id: I-C-KNOWLEDGE
    task_refs: [TASK-C-MAINTAIN-KNOWLEDGE]
    concept_refs: [KNOWLEDGE]
    actions: [search-knowledge, inspect-knowledge-context, create-knowledge, edit-knowledge]
    inputs: [Knowledge content, proposition predicate/participants/conditions]
    machine_operations: [curation.knowledge.list, curation.knowledge.get, curation.knowledge.create, curation.knowledge.update, curation.knowledge.projection]
    visible_responses: [semantic results, detail, validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editing/selection context; rejected semantics are not coerced.

  - id: I-C-LEARNING-SUPPORT
    task_refs: [TASK-C-MAINTAIN-LEARNING-SUPPORT]
    concept_refs: [LEARNING-SUPPORT, CAPABILITY, KNOWLEDGE]
    actions: [search-support, create-support, edit-support, relate-capability, relate-knowledge, inspect-support-diagnostics]
    inputs: [LearningMaterial or TaskSpecification data, capability/knowledge references]
    machine_operations: [curation.learning_support.list, curation.learning_support.get, curation.learning_support.create, curation.learning_support.update]
    visible_responses: [collection/editor state, support diagnostics, validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve accepted support and editor input after rejection.

  - id: I-C-ASSESSMENT
    task_refs: [TASK-C-MAINTAIN-ASSESSMENT-DESIGN]
    concept_refs: [DIAGNOSTIC-ACTIVITY, OBSERVATION, EVIDENCE-BASIS, LEARNER-CLAIM, CAPABILITY]
    actions: [search-assessment-designs, create-assessment-design, edit-assessment-design, inspect-evidence-semantics]
    inputs: [TaskSpecification, ObservationSpecification, EvidencePattern, EvidentialWarrant, SamplingSpecification]
    machine_operations: [curation.assessment_design.list, curation.assessment_design.get, curation.assessment_design.create, curation.assessment_design.update]
    visible_responses: [collection/editor state, semantic validation rejection, conflict, success]
    states: [loading, empty, ready, editing, validation-rejected, conflict, failure]
    recovery: Preserve editor context; incomplete design never produces unjustified learner claims.

  - id: I-C-QUALITY
    task_refs: [TASK-C-REVIEW-CORPUS-QUALITY]
    concept_refs: [CORPUS]
    actions: [inspect-quality-diagnostics, navigate-to-owner-area]
    inputs: []
    machine_operations: [curation.quality.get]
    visible_responses: [known structural/semantic preparation issues, owning correction area]
    states: [loading, empty, ready, failure]
    recovery: Absence of diagnostics is not represented as proof of corpus completeness.

  - id: I-RUNTIME-STATUS
    task_refs: [TASK-I-CHECK-RUNTIME]
    concept_refs: [EXTERNAL-RUNTIME]
    actions: [inspect-runtime-status]
    inputs: []
    machine_operations: [integration.external_runtime.status.get]
    visible_responses: [reachable/compatible status, unavailable/incompatible status, non-secret profile summary]
    states: [loading, reachable, unavailable, incompatible, operational-failure]
    recovery: Status can be retried without changing canonical learning state.

task_dispositions:
  - task_ref: TASK-L-COLLECT-EVIDENCE
    note: Evidence collection may be entered from diagnostic activity or from supported learning/practice activity that yields interpretable observations.
