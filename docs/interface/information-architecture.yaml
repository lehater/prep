version: 1
kind: information-architecture-design
id: PREP-INFORMATION-ARCHITECTURE

locations:
  - {id: APP-SHELL, purpose: Preserve explicit Learning/Curation mode switching and global runtime status., concept_refs: [LEARNING, CURATION, EXTERNAL-RUNTIME], scope: global}
  - {id: TARGET-WORKSPACE, purpose: Preserve the selected LearningTarget while moving between learner tasks., concept_refs: [LEARNING, LEARNING-TARGET], scope: target}
  - {id: CURATION-WORKSPACE, purpose: Preserve authoring context while moving between reusable learning-system areas., concept_refs: [CURATION], scope: global}
  - {id: LEARNING-TARGETS, purpose: Find and choose a prepared target., concept_refs: [LEARNING, LEARNING-TARGET], scope: global}
  - {id: TARGET-OVERVIEW, purpose: Understand the active target requirements, support diagnostics and factual evidence context., concept_refs: [LEARNING-TARGET, TARGET-REQUIREMENTS, PREPARATION-DIAGNOSTIC, LEARNING-EVIDENCE], scope: target}
  - {id: TARGET-KNOWLEDGE, purpose: Find and explore target-relevant reusable Knowledge and relational propositions., concept_refs: [KNOWLEDGE, RELATIONAL-KNOWLEDGE], scope: target}
  - {id: TARGET-STUDY, purpose: Inspect the current Study Set, its diagnostics and delegated-study readiness., concept_refs: [STUDY-MATERIAL, STUDY-SET, PREPARATION-DIAGNOSTIC, EXTERNAL-RUNTIME], scope: target}
  - {id: TARGET-STATISTICS, purpose: Inspect factual learning evidence and history without broad learner-state inference., concept_refs: [LEARNING-EVIDENCE, STUDY-MATERIAL], scope: target}
  - {id: CURATION-TARGETS, purpose: Maintain prepared LearningTargets and their RequirementExpressions., concept_refs: [CURATION, LEARNING-TARGET, TARGET-REQUIREMENTS], scope: global}
  - {id: CURATION-KNOWLEDGE, purpose: Maintain reusable KnowledgeObject/KnowledgeProposition semantics., concept_refs: [CURATION, KNOWLEDGE, RELATIONAL-KNOWLEDGE], scope: global}
  - {id: CURATION-CAPABILITIES, purpose: Maintain reusable Capability definitions used by target requirements., concept_refs: [CURATION, CAPABILITY, KNOWLEDGE], scope: global}
  - {id: CURATION-STUDY-MATERIAL, purpose: Maintain material used by supported study profiles, including the current Question-compatible profile., concept_refs: [CURATION, STUDY-MATERIAL, KNOWLEDGE], scope: global}
  - {id: CURATION-IMPORT, purpose: Import supported prepared data in its curation context., concept_refs: [CURATION], scope: contextual}
  - {id: RUNTIME-STATUS, purpose: Inspect external-runtime reachability and compatibility., concept_refs: [EXTERNAL-RUNTIME], scope: secondary}

relationships:
  - {source: APP-SHELL, target: LEARNING-TARGETS, relation: mode-entry}
  - {source: APP-SHELL, target: CURATION-WORKSPACE, relation: mode-entry}
  - {source: LEARNING-TARGETS, target: TARGET-WORKSPACE, relation: select-target}
  - {source: TARGET-WORKSPACE, target: TARGET-OVERVIEW, relation: contains}
  - {source: TARGET-WORKSPACE, target: TARGET-KNOWLEDGE, relation: contains}
  - {source: TARGET-WORKSPACE, target: TARGET-STUDY, relation: contains}
  - {source: TARGET-WORKSPACE, target: TARGET-STATISTICS, relation: contains}
  - {source: CURATION-WORKSPACE, target: CURATION-TARGETS, relation: contains}
  - {source: CURATION-WORKSPACE, target: CURATION-KNOWLEDGE, relation: contains}
  - {source: CURATION-WORKSPACE, target: CURATION-CAPABILITIES, relation: contains}
  - {source: CURATION-WORKSPACE, target: CURATION-STUDY-MATERIAL, relation: contains}
  - {source: LEARNING-TARGETS, target: TARGET-OVERVIEW, relation: enter-target}
  - {source: TARGET-OVERVIEW, target: TARGET-KNOWLEDGE, relation: target-section}
  - {source: TARGET-OVERVIEW, target: TARGET-STUDY, relation: target-section}
  - {source: TARGET-OVERVIEW, target: TARGET-STATISTICS, relation: target-section}
  - {source: CURATION-TARGETS, target: CURATION-CAPABILITIES, relation: composes-from}
  - {source: CURATION-CAPABILITIES, target: CURATION-KNOWLEDGE, relation: focuses-on}
  - {source: CURATION-STUDY-MATERIAL, target: CURATION-KNOWLEDGE, relation: maps-to-when-applicable}

findability_assumptions:
  - Target selection requires search/browse over prepared LearningTargets.
  - Knowledge exploration requires search and semantic filtering independently of spatial presentation.
  - Curation collections must expose stable identity and validation/diagnostic state without mirroring backend storage structure.
  - Question-compatible terminology may appear inside the current study-material workflow but must not replace the broader STUDY-MATERIAL concept globally.

unresolved_questions: []
