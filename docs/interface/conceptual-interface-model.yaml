version: 1
kind: conceptual-interface-model
id: PREP-CONCEPTUAL-INTERFACE-MODEL

principles:
  - id: CIM-P-USER-LANGUAGE
    statement: Internal domain types are translated into the minimum user-facing concepts needed to understand preparation; domain entities are not copied mechanically into the interface vocabulary.
  - id: CIM-P-SEPARATE-MEANINGS
    statement: Target requirements, reusable Capability, Subject Knowledge, learner evidence/state, and preparation activity remain visibly distinguishable.
  - id: CIM-P-EVIDENCE-EXPLAINABLE
    statement: A visible capability state is paired with an inspectable evidence basis and limitations; unknown never means failed by default.
  - id: CIM-P-CONTEXT-PRESERVED
    statement: Target, current focus, and relevant evidence context remain understandable across journeys without exposing transport or persistence mechanics.
  - id: CIM-P-PRESENTATION-FREE
    statement: Knowledge overview/scope/depth are conceptual semantics; graph, list, 2D and 3D remain downstream presentation choices.

concepts:
  - id: C-TARGET
    label: Target
    meaning: The concrete purpose/context the learner is preparing for now, including known scope and explicit uncertainty.
    upstream_refs: [AD-ESTABLISH-TARGET, UJ-TARGET-SETUP]
    user_must_distinguish_from: [C-REQUIRED-CAPABILITY, C-CURRENT-STATE]

  - id: C-TARGET-REQUIREMENT
    label: Target requirement
    meaning: A target-specific requirement saying which capability performance, conditions and acceptable quality matter for this target; requirement composition may preserve alternatives or conjunctions.
    upstream_refs: [AD-UNDERSTAND-REQUIREMENTS, UJ-TARGET-SETUP]
    user_must_distinguish_from: [C-REQUIRED-CAPABILITY, C-KNOWLEDGE]

  - id: C-REQUIRED-CAPABILITY
    label: Required capability
    meaning: What the learner must be able to do, under material conditions and to an acceptable standard, independent of whether the learner has demonstrated it yet.
    upstream_refs: [LD-CAPABILITY, LD-CAPABILITY-SPECIFICATION, LD-CAPABILITY-STANDARD, AD-UNDERSTAND-REQUIREMENTS]
    user_must_distinguish_from: [C-KNOWLEDGE, C-CURRENT-STATE]

  - id: C-KNOWLEDGE
    label: Knowledge
    meaning: Reusable subject meaning and meaningful relationships that can support understanding/performance but are not themselves learner capability or learner state.
    upstream_refs: [KM-KNOWLEDGE-FAMILY, KM-KNOWLEDGE-OBJECT-IDENTITY, KM-KNOWLEDGE-PROPOSITION, AD-EXPLORE-KNOWLEDGE]
    user_must_distinguish_from: [C-REQUIRED-CAPABILITY, C-EVIDENCE]

  - id: C-KNOWLEDGE-SCOPE
    label: Knowledge scope
    meaning: The currently considered projection of relevant Subject Knowledge, optionally anchored by a selected Required Capability's direct Knowledge focus, with overview-to-detail movement and meaningful relationship context.
    upstream_refs: [KM-SCOPE-OVERVIEW-DEPTH, KM-RELATIONAL-PROPOSITION, KM-GRAPH-IS-PROJECTION, UJ-KNOWLEDGE]
    user_must_distinguish_from: [C-TARGET, C-NEXT-FOCUS]

  - id: C-CURRENT-STATE
    label: Current state
    meaning: The current target-relative evidence-backed view of required capabilities as demonstrated, challenged or unknown; it is a projection, not a mutable mastery score.
    upstream_refs: [LM-STATE-PROJECTION, LM-TARGET-RELATIVE-PROJECTION, AD-REVIEW-CURRENT-STATE, UJ-DIRECTION]
    user_must_distinguish_from: [C-REQUIRED-CAPABILITY, C-EVIDENCE]

  - id: C-EVIDENCE
    label: Evidence
    meaning: Attributable observed performance facts with relevant conditions, time and provenance; evidence is not itself a capability conclusion.
    upstream_refs: [LM-PERFORMANCE, LM-OBSERVATION, AD-CAPTURE-PERFORMANCE, UJ-ACTIVITY-EVIDENCE]
    user_must_distinguish_from: [C-CURRENT-STATE, C-ACTIVITY]

  - id: C-EVIDENCE-BASIS
    label: Why this state
    meaning: The inspectable reasoning showing why observations support or challenge a learner capability claim, including applicability, condition, time, coverage, transfer, dependence and attribution limitations.
    upstream_refs: [LM-EVIDENCE-ARGUMENT, LM-TEMPORAL-TRANSFER, LM-INDIVIDUAL-ATTRIBUTION, AD-EVALUATE-EVIDENCE]
    user_must_distinguish_from: [C-EVIDENCE]

  - id: C-GAP
    label: Gap or uncertainty
    meaning: A target-relative preparation difference or unresolved requirement derived from target requirements and current evidence-backed state; it is not an intrinsic property of Knowledge or Capability.
    upstream_refs: [LD-GAP-PRIORITY, AD-REVIEW-GAPS, UJ-DIRECTION]
    user_must_distinguish_from: [C-CURRENT-STATE, C-NEXT-FOCUS]

  - id: C-NEXT-FOCUS
    label: Next focus
    meaning: The explicit current preparation intent selected from target relevance, gaps/uncertainty and material external constraints, with a visible rationale.
    upstream_refs: [LD-PREPARATION-INTENT, AD-CHOOSE-NEXT-FOCUS, UJ-DIRECTION]
    user_must_distinguish_from: [C-GAP, C-KNOWLEDGE-SCOPE]

  - id: C-SUPPORT
    label: Preparation support
    meaning: Learning material or a practice/diagnostic opportunity intended to support the current capability/focus; availability or completion does not establish learner capability.
    upstream_refs: [LD-LEARNING-MATERIAL, LD-SUPPORT-REQUIREMENT, LD-TASK-SPECIFICATION, LD-OBSERVATION-SPECIFICATION, AD-SELECT-SUPPORT]
    user_must_distinguish_from: [C-EVIDENCE, C-ACTIVITY]

  - id: C-ACTIVITY
    label: Activity
    meaning: A concrete learning, practice or diagnostic attempt performed locally or in a supported external runtime; activity is the opportunity/attempt, not the evidence conclusion.
    upstream_refs: [AD-PERFORM-ACTIVITY, UJ-ACTIVITY-EVIDENCE]
    user_must_distinguish_from: [C-SUPPORT, C-EVIDENCE]

  - id: C-CHANGE
    label: What changed
    meaning: The explainable difference between previous and current preparation projections after new evidence or target information, preserving no-change and increased-uncertainty outcomes.
    upstream_refs: [AD-REVIEW-CHANGE, UJ-ACTIVITY-EVIDENCE]
    user_must_distinguish_from: [C-CURRENT-STATE]

  - id: C-PREPARATION-REQUEST
    label: Preparation request
    meaning: A request to turn fragmented source material into usable missing target, Knowledge, learning/practice or diagnostic support while preserving the motivating target/focus and source context.
    upstream_refs: [AD-REQUEST-PREPARATION-SUPPORT, AD-PREPARE-SUPPORT, UJ-PREPARE-SUPPORT]
    user_must_distinguish_from: [C-SUPPORT]

shared_state_vocabulary:
  - id: STATE-CAPABILITY
    concept_ref: C-CURRENT-STATE
    values:
      - id: demonstrated
        meaning: Applicable accepted evidence supports the capability claim for the visible scope/time; it does not automatically imply broader transfer or durability.
      - id: challenged
        meaning: Applicable accepted evidence challenges the capability claim for the visible scope/time.
      - id: unknown
        meaning: Current accepted evidence is insufficient to establish demonstrated or challenged for the visible scope/time; unknown is not failure.

  - id: STATE-EVIDENCE-BEARING
    concept_ref: C-EVIDENCE-BASIS
    values:
      - id: supports
        meaning: The evidence argument bears positively on the capability claim within its stated applicability and limitations.
      - id: challenges
        meaning: The evidence argument bears negatively on the capability claim within its stated applicability and limitations.

  - id: STATE-ACTIVITY-PURPOSE
    concept_ref: C-NEXT-FOCUS
    values:
      - {id: acquisition, meaning: Build capability or understanding not yet established.}
      - {id: practice, meaning: Exercise intended performance without treating completion as proof.}
      - {id: diagnosis, meaning: Reduce material uncertainty through evidence-producing activity.}
      - {id: transfer, meaning: Test or support performance under materially different target-relevant conditions.}
      - {id: retention, meaning: Test or support continued availability over the relevant time horizon.}

  - id: STATE-APPLICATION-OUTCOME
    concept_ref: C-CHANGE
    values:
      - {id: success, meaning: The requested application outcome was established.}
      - {id: unresolved, meaning: Accepted semantics or evidence are insufficient to establish the requested result.}
      - {id: rejected, meaning: An owning semantic contract rejected the requested mutation or inference.}
      - {id: dependency-unavailable, meaning: Required external/system support cannot currently complete the operation.}
      - {id: updated-context, meaning: Material target/evidence/focus inputs changed since the dependent work was reviewed and the current projection must be refreshed.}

conceptual_relationships:
  - {from: C-TARGET, relation: contains, to: C-TARGET-REQUIREMENT, meaning: A target is explained through target-specific requirements.}
  - {from: C-TARGET-REQUIREMENT, relation: requires, to: C-REQUIRED-CAPABILITY, meaning: A target requirement references reusable capability performance with target-relevant scope/standard.}
  - {from: C-REQUIRED-CAPABILITY, relation: may-focus-on, to: C-KNOWLEDGE, meaning: Required performance may directly concern reusable Subject Knowledge without making Knowledge equal capability; selecting the Required Capability may use those direct focus references as anchors for a reversible bounded Knowledge scope.}
  - {from: C-CURRENT-STATE, relation: evaluates-relative-to, to: C-REQUIRED-CAPABILITY, meaning: Learner state is interpreted against required capability scope rather than against topic exposure.}
  - {from: C-EVIDENCE, relation: interpreted-by, to: C-EVIDENCE-BASIS, meaning: Observed facts require an inspectable evidence argument before supporting/challenging a capability conclusion.}
  - {from: C-EVIDENCE-BASIS, relation: explains, to: C-CURRENT-STATE, meaning: The learner can inspect why a visible capability state is justified and where it is limited.}
  - {from: C-GAP, relation: derives-from, to: C-TARGET-REQUIREMENT, meaning: A gap/uncertainty exists only relative to target requirements.}
  - {from: C-GAP, relation: informed-by, to: C-CURRENT-STATE, meaning: Current evidence-backed state determines which target requirements are satisfied, challenged or unresolved.}
  - {from: C-NEXT-FOCUS, relation: addresses, to: C-GAP, meaning: The current PreparationIntent selects target-relative gaps/uncertainty to address with explicit rationale.}
  - {from: C-KNOWLEDGE-SCOPE, relation: projects, to: C-KNOWLEDGE, meaning: Scope/overview/depth are contextual projections over stable reusable Knowledge.}
  - {from: C-SUPPORT, relation: intended-for, to: C-NEXT-FOCUS, meaning: Support is selected for the current preparation intent/capability context.}
  - {from: C-ACTIVITY, relation: uses, to: C-SUPPORT, meaning: An activity instantiates or uses selected support.}
  - {from: C-ACTIVITY, relation: may-produce, to: C-EVIDENCE, meaning: Actual attributable performance may yield observations, but activity completion alone is not evidence of capability.}
  - {from: C-CHANGE, relation: compares, to: C-CURRENT-STATE, meaning: Change explains the transition between previous and current target-relative projections without rewriting history.}
  - {from: C-PREPARATION-REQUEST, relation: seeks, to: C-SUPPORT, meaning: Missing reusable preparation support can be requested from fragmented sources without learner-owned corpus engineering.}

modes:
  status: NOT_REQUIRED
  rationale: The accepted work changes context through target, focus, knowledge scope and activity purpose; no global user mode with separate product semantics is required. Downstream IA/Interaction may organize contexts without turning them into canonical modes or authorization roles.

deliberately_unconstrained:
  - screen and page inventory
  - routes and navigation placement
  - layout and region composition
  - graph versus non-graph presentation
  - 2D versus 3D
  - concrete wording beyond the stable concept labels/meanings above
  - component hierarchy and frontend technology

unresolved_questions: []
