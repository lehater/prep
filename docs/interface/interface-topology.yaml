version: 2
kind: interface-topology-design
id: PREP-INTERFACE-TOPOLOGY

views:
  - id: F-00-APPLICATION-SHELL
    responsibility: Preserve global Target Work/Curation context, active target identity and runtime-status access.
    location_ref: APP-SHELL
    interaction_context_refs: []
    structural: true
    parent: ROOT
    exits: [L-01-TARGETS, C-10-CURATION-HOME, S-01-RUNTIME-STATUS]

  - id: F-LT-TARGET-WORKSPACE
    responsibility: Preserve the active target while switching among assessment, gaps, learning, diagnostics, knowledge and progress views.
    location_ref: TARGET-WORKSPACE
    interaction_context_refs: []
    structural: true
    parent: F-00-APPLICATION-SHELL
    exits: [L-02-TARGET-OVERVIEW, L-03-TARGET-STATE, L-04-TARGET-GAPS, L-05-TARGET-LEARNING, L-06-TARGET-DIAGNOSTICS, L-07-TARGET-KNOWLEDGE, L-08-TARGET-PROGRESS]

  - id: F-C-CURATION-WORKSPACE
    responsibility: Preserve curation context while switching among corpus-authoring areas.
    location_ref: CURATION-WORKSPACE
    interaction_context_refs: []
    structural: true
    parent: F-00-APPLICATION-SHELL
    exits: [C-11-TARGET-COLLECTION, C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE, C-41-LEARNING-SUPPORT-COLLECTION, C-51-ASSESSMENT-COLLECTION, C-61-IMPORT, C-71-QUALITY]

  - id: L-01-TARGETS
    responsibility: Find a suitable target or begin target preparation when one is missing.
    location_ref: TARGETS
    interaction_context_refs: [I-L-ESTABLISH-TARGET]
    parent: F-00-APPLICATION-SHELL
    exits: [L-02-TARGET-OVERVIEW, C-12-TARGET-EDITOR]

  - id: L-02-TARGET-OVERVIEW
    responsibility: Understand the active target context and required capabilities.
    location_ref: TARGET-OVERVIEW
    interaction_context_refs: [I-L-UNDERSTAND-TARGET]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-03-TARGET-STATE, L-07-TARGET-KNOWLEDGE, C-12-TARGET-EDITOR]

  - id: L-03-TARGET-STATE
    responsibility: Inspect current evidence-backed state, uncertainty and available diagnostic opportunities against the target.
    location_ref: TARGET-STATE
    interaction_context_refs: [I-L-CURRENT-STATE]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-04-TARGET-GAPS, L-06-TARGET-DIAGNOSTICS, L-07-TARGET-KNOWLEDGE]

  - id: L-04-TARGET-GAPS
    responsibility: Inspect target-relative gaps and choose the next learning or diagnostic focus.
    location_ref: TARGET-GAPS
    interaction_context_refs: [I-L-GAPS]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-05-TARGET-LEARNING, L-06-TARGET-DIAGNOSTICS, L-07-TARGET-KNOWLEDGE, L-08-TARGET-PROGRESS, C-41-LEARNING-SUPPORT-COLLECTION]

  - id: L-05-TARGET-LEARNING
    responsibility: Work on the current learning focus using available material or practice support.
    location_ref: TARGET-LEARNING
    interaction_context_refs: [I-L-LEARNING]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-07-TARGET-KNOWLEDGE, L-06-TARGET-DIAGNOSTICS, L-08-TARGET-PROGRESS, S-01-RUNTIME-STATUS, C-41-LEARNING-SUPPORT-COLLECTION]

  - id: L-06-TARGET-DIAGNOSTICS
    responsibility: Perform or synchronize supported diagnostic/evidence activity for unresolved or focused capability areas.
    location_ref: TARGET-DIAGNOSTICS
    interaction_context_refs: [I-L-DIAGNOSTICS]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-03-TARGET-STATE, L-04-TARGET-GAPS, L-08-TARGET-PROGRESS, S-01-RUNTIME-STATUS, C-51-ASSESSMENT-COLLECTION]

  - id: L-07-TARGET-KNOWLEDGE
    responsibility: Explore target- or focus-relevant Knowledge without losing active target/focus context.
    location_ref: TARGET-KNOWLEDGE
    interaction_context_refs: [I-L-KNOWLEDGE]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-02-TARGET-OVERVIEW, L-03-TARGET-STATE, L-04-TARGET-GAPS, L-05-TARGET-LEARNING, L-06-TARGET-DIAGNOSTICS]

  - id: L-08-TARGET-PROGRESS
    responsibility: Compare target-relative state over time and decide how to adapt the next focus.
    location_ref: TARGET-PROGRESS
    interaction_context_refs: [I-L-PROGRESS]
    parent: F-LT-TARGET-WORKSPACE
    exits: [L-03-TARGET-STATE, L-04-TARGET-GAPS, L-05-TARGET-LEARNING, L-06-TARGET-DIAGNOSTICS]

  - id: C-11-TARGET-COLLECTION
    responsibility: Find/create prepared targets.
    location_ref: CURATION-TARGETS
    interaction_context_refs: [I-C-TARGETS]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-12-TARGET-EDITOR, C-21-CAPABILITY-COLLECTION, C-61-IMPORT]

  - id: C-12-TARGET-EDITOR
    responsibility: Edit one target and its RequirementExpression<CapabilitySpecification>.
    location_ref: CURATION-TARGETS
    interaction_context_refs: [I-C-TARGETS]
    parent: C-11-TARGET-COLLECTION
    exits: [C-11-TARGET-COLLECTION, C-21-CAPABILITY-COLLECTION, L-02-TARGET-OVERVIEW]

  - id: C-21-CAPABILITY-COLLECTION
    responsibility: Find/create reusable capability definitions.
    location_ref: CURATION-CAPABILITIES
    interaction_context_refs: [I-C-CAPABILITIES]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-22-CAPABILITY-EDITOR, C-31-KNOWLEDGE-WORKSPACE, C-61-IMPORT]

  - id: C-22-CAPABILITY-EDITOR
    responsibility: Edit one reusable Capability and its performance/condition/criterion semantics.
    location_ref: CURATION-CAPABILITIES
    interaction_context_refs: [I-C-CAPABILITIES]
    parent: C-21-CAPABILITY-COLLECTION
    exits: [C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE]

  - id: C-31-KNOWLEDGE-WORKSPACE
    responsibility: Find/explore reusable Knowledge and enter semantic editing.
    location_ref: CURATION-KNOWLEDGE
    interaction_context_refs: [I-C-KNOWLEDGE]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-32-KNOWLEDGE-EDITOR, C-21-CAPABILITY-COLLECTION, C-41-LEARNING-SUPPORT-COLLECTION, C-61-IMPORT]

  - id: C-32-KNOWLEDGE-EDITOR
    responsibility: Edit one KnowledgeObject or KnowledgeProposition.
    location_ref: CURATION-KNOWLEDGE
    interaction_context_refs: [I-C-KNOWLEDGE]
    parent: C-31-KNOWLEDGE-WORKSPACE
    exits: [C-31-KNOWLEDGE-WORKSPACE]

  - id: C-41-LEARNING-SUPPORT-COLLECTION
    responsibility: Find/create learning material and practice/task support.
    location_ref: CURATION-LEARNING-SUPPORT
    interaction_context_refs: [I-C-LEARNING-SUPPORT]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-42-LEARNING-SUPPORT-EDITOR, C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE, C-61-IMPORT]

  - id: C-42-LEARNING-SUPPORT-EDITOR
    responsibility: Edit one learning/practice support artifact and its capability/knowledge relationships.
    location_ref: CURATION-LEARNING-SUPPORT
    interaction_context_refs: [I-C-LEARNING-SUPPORT]
    parent: C-41-LEARNING-SUPPORT-COLLECTION
    exits: [C-41-LEARNING-SUPPORT-COLLECTION, C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE]

  - id: C-51-ASSESSMENT-COLLECTION
    responsibility: Find/create reusable assessment and evidence-design definitions.
    location_ref: CURATION-ASSESSMENT
    interaction_context_refs: [I-C-ASSESSMENT]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-52-ASSESSMENT-EDITOR, C-21-CAPABILITY-COLLECTION, C-61-IMPORT]

  - id: C-52-ASSESSMENT-EDITOR
    responsibility: Edit one assessment/evidence design and its task/observation/warrant semantics.
    location_ref: CURATION-ASSESSMENT
    interaction_context_refs: [I-C-ASSESSMENT]
    parent: C-51-ASSESSMENT-COLLECTION
    exits: [C-51-ASSESSMENT-COLLECTION, C-21-CAPABILITY-COLLECTION]

  - id: C-61-IMPORT
    responsibility: Obtain the import contract, validate prepared data and apply accepted bulk records.
    location_ref: CURATION-IMPORT
    interaction_context_refs: [I-C-IMPORT]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-11-TARGET-COLLECTION, C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE, C-41-LEARNING-SUPPORT-COLLECTION, C-51-ASSESSMENT-COLLECTION, C-71-QUALITY]

  - id: C-71-QUALITY
    responsibility: Inspect known corpus-quality/preparation diagnostics and route correction work.
    location_ref: CURATION-QUALITY
    interaction_context_refs: [I-C-QUALITY]
    parent: F-C-CURATION-WORKSPACE
    exits: [C-11-TARGET-COLLECTION, C-21-CAPABILITY-COLLECTION, C-31-KNOWLEDGE-WORKSPACE, C-41-LEARNING-SUPPORT-COLLECTION, C-51-ASSESSMENT-COLLECTION]

  - id: S-01-RUNTIME-STATUS
    responsibility: Inspect external-runtime reachability/compatibility.
    location_ref: RUNTIME-STATUS
    interaction_context_refs: [I-RUNTIME-STATUS]
    parent: F-00-APPLICATION-SHELL
    exits: [L-05-TARGET-LEARNING, L-06-TARGET-DIAGNOSTICS]

non_view_contexts:
  - id: N-L-ACTIVE-TARGET
    responsibility: Preserve active target identity across all target-work views.
  - id: N-L-ACTIVE-FOCUS
    responsibility: Preserve current LearningPriority/LearningIntent context across gaps, learning, diagnostics, knowledge and progress.
