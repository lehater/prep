version: 1
kind: interface-topology-design
id: PREP-INTERFACE-TOPOLOGY

views:
  - {id: F-00-APPLICATION-SHELL, responsibility: Preserve explicit Learning/Curation mode context and global runtime-status access., location_ref: APP-SHELL, interaction_context_refs: [], structural: true, parent: ROOT, exits: [L-01-TARGET-SELECTION, C-11-TARGET-COLLECTION, S-01-RUNTIME-STATUS]}
  - {id: F-LT-TARGET-WORKSPACE, responsibility: Preserve the active LearningTarget while switching among learner task views., location_ref: TARGET-WORKSPACE, interaction_context_refs: [], structural: true, parent: F-00-APPLICATION-SHELL, exits: [L-02-TARGET-OVERVIEW, L-03-TARGET-KNOWLEDGE, L-04-TARGET-STUDY, L-05-TARGET-STATISTICS]}
  - {id: F-C-CURATION-WORKSPACE, responsibility: Preserve Curation mode while switching among authoring areas., location_ref: CURATION-WORKSPACE, interaction_context_refs: [], structural: true, parent: F-00-APPLICATION-SHELL, exits: [C-11-TARGET-COLLECTION, C-21-KNOWLEDGE-WORKSPACE, C-31-CAPABILITY-COLLECTION, C-41-STUDY-MATERIAL-COLLECTION]}
  - {id: L-01-TARGET-SELECTION, responsibility: Choose a prepared LearningTarget., location_ref: LEARNING-TARGETS, interaction_context_refs: [I-L-SELECT-TARGET], parent: F-00-APPLICATION-SHELL, exits: [L-02-TARGET-OVERVIEW, S-01-RUNTIME-STATUS]}
  - {id: L-02-TARGET-OVERVIEW, responsibility: Understand active target requirements, support diagnostics and evidence context., location_ref: TARGET-OVERVIEW, interaction_context_refs: [I-L-OVERVIEW], parent: F-LT-TARGET-WORKSPACE, exits: [L-03-TARGET-KNOWLEDGE, L-04-TARGET-STUDY, L-05-TARGET-STATISTICS, C-12-TARGET-EDITOR]}
  - {id: L-03-TARGET-KNOWLEDGE, responsibility: Explore target-relevant reusable Knowledge and relational propositions., location_ref: TARGET-KNOWLEDGE, interaction_context_refs: [I-L-KNOWLEDGE], parent: F-LT-TARGET-WORKSPACE, exits: [L-02-TARGET-OVERVIEW, L-04-TARGET-STUDY, L-05-TARGET-STATISTICS]}
  - {id: L-04-TARGET-STUDY, responsibility: Inspect the exact Study Set subset/diagnostics and delegate the inspected preview to the external runtime., location_ref: TARGET-STUDY, interaction_context_refs: [I-L-STUDY], parent: F-LT-TARGET-WORKSPACE, exits: [L-02-TARGET-OVERVIEW, L-03-TARGET-KNOWLEDGE, L-05-TARGET-STATISTICS, S-01-RUNTIME-STATUS]}
  - {id: L-05-TARGET-STATISTICS, responsibility: Inspect factual learning evidence and its relevant context., location_ref: TARGET-STATISTICS, interaction_context_refs: [I-L-STATISTICS], parent: F-LT-TARGET-WORKSPACE, exits: [L-02-TARGET-OVERVIEW, L-03-TARGET-KNOWLEDGE, L-04-TARGET-STUDY]}
  - {id: C-11-TARGET-COLLECTION, responsibility: Find/create curated LearningTargets., location_ref: CURATION-TARGETS, interaction_context_refs: [I-C-TARGETS], parent: F-C-CURATION-WORKSPACE, exits: [C-12-TARGET-EDITOR, C-21-KNOWLEDGE-WORKSPACE, C-31-CAPABILITY-COLLECTION, C-41-STUDY-MATERIAL-COLLECTION]}
  - {id: C-12-TARGET-EDITOR, responsibility: Edit one target definition and its RequirementExpression<CapabilitySpecification>., location_ref: CURATION-TARGETS, interaction_context_refs: [I-C-TARGETS], parent: C-11-TARGET-COLLECTION, exits: [C-11-TARGET-COLLECTION, C-31-CAPABILITY-COLLECTION, L-02-TARGET-OVERVIEW]}
  - {id: C-21-KNOWLEDGE-WORKSPACE, responsibility: Find/explore reusable Knowledge and enter semantic editing., location_ref: CURATION-KNOWLEDGE, interaction_context_refs: [I-C-KNOWLEDGE], parent: F-C-CURATION-WORKSPACE, exits: [C-22-KNOWLEDGE-EDITOR, C-11-TARGET-COLLECTION, C-31-CAPABILITY-COLLECTION, C-41-STUDY-MATERIAL-COLLECTION, S-02-IMPORT-FLOW]}
  - {id: C-22-KNOWLEDGE-EDITOR, responsibility: Edit one KnowledgeObject or KnowledgeProposition and its semantic fields., location_ref: CURATION-KNOWLEDGE, interaction_context_refs: [I-C-KNOWLEDGE], parent: C-21-KNOWLEDGE-WORKSPACE, exits: [C-21-KNOWLEDGE-WORKSPACE]}
  - {id: C-31-CAPABILITY-COLLECTION, responsibility: Find/create reusable Capability definitions., location_ref: CURATION-CAPABILITIES, interaction_context_refs: [I-C-CAPABILITIES], parent: F-C-CURATION-WORKSPACE, exits: [C-32-CAPABILITY-EDITOR, C-11-TARGET-COLLECTION, C-21-KNOWLEDGE-WORKSPACE, S-02-IMPORT-FLOW]}
  - {id: C-32-CAPABILITY-EDITOR, responsibility: Edit one reusable Capability and its accepted Knowledge focus/criteria semantics., location_ref: CURATION-CAPABILITIES, interaction_context_refs: [I-C-CAPABILITIES], parent: C-31-CAPABILITY-COLLECTION, exits: [C-31-CAPABILITY-COLLECTION, C-21-KNOWLEDGE-WORKSPACE]}
  - {id: C-41-STUDY-MATERIAL-COLLECTION, responsibility: Find/create material for supported study profiles, including current Question-compatible material., location_ref: CURATION-STUDY-MATERIAL, interaction_context_refs: [I-C-STUDY-MATERIAL], parent: F-C-CURATION-WORKSPACE, exits: [C-42-STUDY-MATERIAL-EDITOR, C-21-KNOWLEDGE-WORKSPACE, S-02-IMPORT-FLOW]}
  - {id: C-42-STUDY-MATERIAL-EDITOR, responsibility: Edit one Question-compatible material item and supported Knowledge mappings., location_ref: CURATION-STUDY-MATERIAL, interaction_context_refs: [I-C-STUDY-MATERIAL], parent: C-41-STUDY-MATERIAL-COLLECTION, exits: [C-41-STUDY-MATERIAL-COLLECTION, C-21-KNOWLEDGE-WORKSPACE]}
  - {id: S-01-RUNTIME-STATUS, responsibility: Inspect external-runtime reachability/compatibility., location_ref: RUNTIME-STATUS, interaction_context_refs: [I-RUNTIME-STATUS], parent: F-00-APPLICATION-SHELL, exits: [L-01-TARGET-SELECTION]}
  - {id: S-02-IMPORT-FLOW, responsibility: Apply prepared data and inspect import outcomes., location_ref: CURATION-IMPORT, interaction_context_refs: [I-C-IMPORT], parent: F-C-CURATION-WORKSPACE, exits: [C-11-TARGET-COLLECTION, C-21-KNOWLEDGE-WORKSPACE, C-31-CAPABILITY-COLLECTION, C-41-STUDY-MATERIAL-COLLECTION]}

