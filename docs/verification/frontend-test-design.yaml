version: 1
kind: harness-knowledge-artifact
artifact: FRONTEND-TEST-DESIGN
schema: test-design/v1
title: Frontend Test Design

content:
  purpose: >-
    Define executable observable test contracts that refine accepted frontend
    verification obligations without choosing test-framework mechanics or
    treating implementation internals as semantic truth.

  tests:
    - id: FTD-MODE-WORKSPACE-NAVIGATION
      verification_refs: [FV-02]
      precondition: The frontend is loaded with representative Learning and Curation data and no modal/error state is active.
      operation: Switch between Learning and Curation, select a prepared LearningTarget, and navigate through Overview, Knowledge, Study and Statistics.
      oracle: The visible mode and target workspace follow accepted navigation responsibilities; switching modes does not invent or expose disallowed learner editing behavior.

    - id: FTD-TARGET-CONTEXT-PRESERVATION
      verification_refs: [FV-02, FV-08]
      precondition: A LearningTarget is selected and the learner has applied a Knowledge search/filter and selected one Knowledge item.
      operation: Open readable Knowledge detail and then close/return to the target Knowledge view.
      oracle: The same LearningTarget scope and accepted search/filter/focus intent remain active; renderer-only camera/layout state may change only within its presentation ownership.

    - id: FTD-QUESTION-TO-KNOWLEDGE
      verification_refs: [FV-02, FV-08]
      precondition: A Study Question has one or more canonical aligned Knowledge ids within the current LearningTarget.
      operation: Invoke Show in Knowledge Map from the Question.
      oracle: The current target scope is preserved and all aligned canonical Knowledge items become the intended focus/highlight set without creating new Knowledge identity or relation semantics.

    - id: FTD-RECOVERABLE-FAILURE-PRESERVES-CONTEXT
      verification_refs: [FV-02, FV-03, FV-08]
      precondition: The user is in an accepted task context with editable or retryable state and the backing adapter returns an accepted recoverable failure outcome.
      operation: Trigger the operation and then retry or correct the input through the accepted recovery path.
      oracle: The frontend exposes the corresponding recoverable failure state, preserves task/input context required for recovery, and does not report success until the accepted success outcome occurs.

    - id: FTD-MACHINE-OUTCOME-MAPPING
      verification_refs: [FV-03]
      precondition: Representative accepted Machine Interface success, validation-rejected, conflict, unavailable and recoverable-failure outcomes are available as adapter fixtures.
      operation: Pass each outcome through the production frontend adapter boundary.
      oracle: Each outcome maps to the corresponding frontend-owned state while canonical identities and accepted semantic distinctions are preserved and raw transport/provider exceptions do not cross into feature contracts.

    - id: FTD-FORBIDDEN-DEPENDENCY-EDGES
      verification_refs: [FV-04]
      precondition: The production frontend source tree and declared module boundaries exist.
      operation: Build or inspect the frontend import/dependency graph.
      oracle: Learning and Curation internals do not depend on one another; feature modules do not import concrete HTTP/mock adapters or the concrete graph-renderer package; shared presentation modules do not import feature-owned state.

    - id: FTD-DTO-MAPPING-IDENTITY
      verification_refs: [FV-05]
      precondition: A representative Machine Interface DTO graph/list/detail response contains known canonical Prep ids, semantic kinds, relation source/target/type values, an exact collection total_count and an opaque next_cursor.
      operation: Map the DTO through the HTTP adapter into frontend semantic/read models and frontend-owned collection results.
      oracle: Canonical ids, accepted semantic distinctions and exact total_count are preserved exactly; opaque cursor/status/serialization representation does not enter semantic entities or feature-owned task state.

    - id: FTD-RENDERER-CLICK-VS-DRAG
      verification_refs: [FV-06]
      precondition: GraphRenderer is given a renderer-neutral GraphScene containing a known Knowledge node.
      operation: Perform one click-without-drag gesture and separately a drag gesture on the same node.
      oracle: Click-without-drag emits exactly one canonical node-activation event; drag changes presentation state only and emits no semantic Knowledge mutation/activation completion.

    - id: FTD-RENDERER-SEMANTIC-ISOLATION
      verification_refs: [FV-06]
      precondition: A GraphScene is rendered and the concrete renderer has assigned coordinates, camera state and internal library objects.
      operation: Read all values exposed back through the public GraphRenderer/KnowledgeExplorer boundary after layout and interaction.
      oracle: Only renderer-neutral events/opaque viewport state cross the boundary; coordinates, force-engine objects and concrete renderer/Three.js objects never enter canonical frontend Knowledge models.

    - id: FTD-MOCK-HTTP-SUBSTITUTABILITY
      verification_refs: [FV-07]
      precondition: Equivalent accepted Knowledge/Target/Question/runtime-status data is available through both mock and HTTP adapter implementations.
      operation: Execute the same consumer-owned query contract cases against each adapter.
      oracle: Both adapters return equivalent frontend semantic/read-model outcomes for equivalent accepted data and failure categories, regardless of their provider-specific transport/fixture internals.

    - id: FTD-KEYBOARD-KNOWLEDGE-ACCESS
      verification_refs: [FV-02, FV-09]
      precondition: Knowledge list/search/detail and graph representations are available for the same representative Knowledge scope.
      operation: Using keyboard interaction only, locate a Knowledge item through the non-graph path, open detail, close it and continue navigation.
      oracle: The core Knowledge task is completable without graph manipulation, focus remains visible and usable, and returning from detail restores an accepted continuation point.

    - id: FTD-GRAPH-FALLBACK-EQUIVALENCE
      verification_refs: [FV-02, FV-09]
      precondition: The same representative KnowledgeGraphModel is available to graph and list/search/detail projections.
      operation: Identify a selected Knowledge item and its accepted relation context using each representation.
      oracle: Both representations resolve the same canonical Knowledge identities and accepted relation source/target/type semantics; geometric position is never required to recover semantic truth.

    - id: FTD-COMMON-VIEW-STATES
      verification_refs: [FV-02, FV-09]
      precondition: A representative server-backed view can be driven into loading, empty, loaded, validation-rejected, recoverable-failure and unavailable/degraded states where those states are accepted.
      operation: Present each applicable state through the same view responsibility.
      oracle: Each state remains distinguishable with consistent presentation semantics and does not expose actions invalid for that state.

  implementation_freedoms:
    - exact test runner and browser/component-test framework
    - fixture/helper/mocking syntax
    - DOM selectors and test-file layout
    - internal component decomposition
    - concrete adapter fake implementation
    - visual snapshot tooling unless a separately accepted visual invariant requires it

  forbidden_oracles:
    - exact force-layout coordinates
    - concrete renderer-library object identity
    - private React component state shape
    - CSS class names or provider component tree
    - pixel-perfect snapshots without an accepted visual invariant
