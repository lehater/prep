version: 1
kind: harness-knowledge-artifact
artifact: FRONTEND-TEST-DESIGN
schema: test-design/v1
title: Frontend Test Design

content:
  purpose: >-
    Define executable frontend test contracts for the rebuilt Prep verification
    obligations while keeping test framework, fixture mechanics, mocks and
    private component structure outside semantic ownership.

  tests:
    - id: FTD-01-PROVIDER-BOUNDARY
      verification_refs: [FV-02]
      precondition: >-
        The production frontend source graph is available with declared feature,
        backend-adapter and 3D-renderer-adapter boundaries.
      operation: >-
        Analyze source dependencies crossing feature/provider boundaries.
      oracle: >-
        Raw transport representations do not cross into feature public contracts;
        3D renderer provider types do not cross into Learning/Curation or
        Knowledge semantic public contracts; browser code has no direct external
        study-runtime client.

    - id: FTD-02-KNOWLEDGE-WITHOUT-RENDERER
      verification_refs: [FV-03, FV-08]
      precondition: >-
        Canonical Knowledge fixtures include searchable items and typed directed
        relationships, while the 3D provider is disabled or unavailable.
      operation: >-
        Enter Knowledge, choose global or target-relevant scope, search, focus an
        item, inspect its relationships and follow one connected identity.
      oracle: >-
        Textual search, focus, readable relation type/direction, detail and
        relationship traversal remain usable; renderer unavailability is
        contained and does not change scope or canonical identity.

    - id: FTD-03-SPATIAL-TEXTUAL-FOCUS-PARITY
      verification_refs: [FV-03]
      precondition: >-
        The 3D projection and textual Knowledge projection receive the same
        renderer-neutral fixture with a known focused item and relationship.
      operation: >-
        Establish focus from the textual results, then establish focus/follow a
        relationship through the 3D projection.
      oracle: >-
        Both paths resolve to the same canonical Knowledge identities and
        relationship semantics; renderer geometry/provider objects are not the
        semantic identity observed by the feature.

    - id: FTD-04-CURATION-REJECTION-CONFLICT
      verification_refs: [FV-04]
      precondition: >-
        A Curation surface has confirmed canonical data and an editable local
        draft; backend fixtures can return validation_rejected and conflict.
      operation: >-
        Submit one invalid mutation and one stale/conflicting mutation.
      oracle: >-
        Rejection preserves proposed input for correction without presenting it
        as canonical; conflict exposes current canonical state/reconciliation
        behavior and does not silently overwrite it.

    - id: FTD-05-STUDY-MATERIALIZATION-FIDELITY
      verification_refs: [FV-05]
      precondition: >-
        An active target can build a Study Set preview; fixtures can change the
        target/question resolution after inspection.
      operation: >-
        Build and inspect a preview, change the resolvable material, then attempt
        export with the inspected materialization token.
      oracle: >-
        Export reports stale/conflict and requires rebuild/reinspection rather
        than exporting a different set; the inspected preview remains
        understandable during recovery.

    - id: FTD-06-EVIDENCE-FACTS-NOT-MASTERY
      verification_refs: [FV-05]
      precondition: >-
        One target has recorded ReviewObservations and another Question has no
        observations; sync can return success, external-runtime-unavailable and
        partial failure.
      operation: >-
        Inspect target evidence, Question history and explicit review sync across
        the fixture outcomes.
      oracle: >-
        Recorded facts and absence of facts are shown distinctly; no state is
        labeled as mastery/readiness/retention; external/partial failures preserve
        already recorded local evidence and item-level distinctions.

    - id: FTD-07-CURATION-RESPONSIVE-CONTINUITY
      verification_refs: [FV-06]
      precondition: >-
        A Targets, Requirements or Questions collection has query state and a
        focused item; the view can be exercised in wide and narrow composition.
      operation: >-
        Move from wide collection-plus-focused work to narrow focused substate,
        trigger a validation error, then return to the collection.
      oracle: >-
        Semantic view identity is unchanged, entered input is preserved,
        actionable error focus is reachable, and returning restores meaningful
        collection/query/focus context.

    - id: FTD-08-KNOWLEDGE-NARROW-COMPOSITION
      verification_refs: [FV-06]
      precondition: >-
        Knowledge has textual results, focused detail and an available 3D
        projection in a narrow viewport.
      operation: >-
        Search and focus using keyboard, enter the explicit 3D mode, leave it and
        continue relation traversal through the textual path.
      oracle: >-
        Textual search/detail is the primary narrow access path, 3D is explicit
        rather than permanently competing for space, semantic focus/scope
        survives mode changes where possible, and keyboard focus is not trapped.

    - id: FTD-09-MACHINE-OUTCOME-MAPPING
      verification_refs: [FV-07]
      precondition: >-
        Backend adapter fixtures can return success, not_found,
        validation_rejected, conflict, external_runtime_unavailable,
        partial_external_failure and operational_failure for applicable
        operations.
      operation: >-
        Invoke representative Learning, Knowledge and Curation feature contracts
        through the backend adapter for each applicable outcome.
      oracle: >-
        Feature-visible states preserve the accepted semantic distinctions;
        collection query controls use backend query semantics and no raw
        transport code invents an alternative product outcome.

    - id: FTD-10-RENDERER-FAILURE-ISOLATION
      verification_refs: [FV-08]
      precondition: >-
        Knowledge textual state is loaded and the 3D provider can fail during
        initialization and during active rendering.
      operation: >-
        Trigger both renderer failure modes while retaining current Knowledge
        scope/focus.
      oracle: >-
        Failure is contained to the spatial projection, textual Knowledge
        remains usable, and unrelated application/feature work does not become a
        global error solely because the renderer failed.

    - id: FTD-11-QUALITY-NON-GATE
      verification_refs: [FV-09]
      precondition: >-
        Frontend acceptance/test configuration and any retained 3D diagnostic
        benchmarks are available.
      operation: >-
        Evaluate the release/correctness gate configuration against current
        Quality Design.
      oracle: >-
        No correctness/release gate requires an unaccepted FPS, node/edge count,
        draw-call, triangle or layout-settle threshold; diagnostics may record
        those values without converting them into semantic pass/fail criteria.

    - id: FTD-12-KEYBOARD-RELATION-TRAVERSAL
      verification_refs: [FV-03, FV-06]
      precondition: >-
        Knowledge contains a search result with at least one typed directed
        relationship and the user interacts without pointer-only spatial gestures.
      operation: >-
        Keyboard-focus search, choose the result, inspect relationship semantics
        and move focus through the connected identity.
      oracle: >-
        The full semantic traversal completes with visible focus and readable
        relation type/direction independently of camera/direct-manipulation
        gestures.
