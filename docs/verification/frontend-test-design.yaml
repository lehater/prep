version: 1
kind: harness-knowledge-artifact
artifact: FRONTEND-TEST-DESIGN
schema: test-design/v1
title: Frontend Test Design

content:
  purpose: >-
    Define executable observable contracts for the mock-first Prep frontend while
    keeping transport/provider internals, renderer geometry and private component
    structure outside semantic test oracles.

  tests:
    - id: FTD-TARGET-DIRECTION
      verification_refs: [FV-01, FV-02, FV-13]
      precondition: >-
        Deterministic mocks contain at least two plausible Targets with distinct and
        shared requirements projected over the same learner evidence basis.
      operation: >-
        Select the candidate Targets, compare them, inspect shared/target-specific
        requirements and per-target state/gaps, then continue with one candidate.
      oracle: >-
        The same learner evidence basis is used for both projections; Target-specific
        requirements and uncertainty remain distinct; no scalar fit/readiness score is
        invented; comparison does not activate a Target until the explicit continuation.

    - id: FTD-TARGET-SETUP-AND-REQUIREMENTS
      verification_refs: [FV-02, FV-08, FV-14]
      precondition: >-
        A chosen Target candidate exists with purpose/source context and at least one
        unresolved or explicit requirement.
      operation: Establish/refine the Target, then inspect accepted requirements and direct Knowledge focus.
      oracle: >-
        Target input is preserved across unresolved/rejected/stale outcomes; after
        acceptance the requirement surface becomes dominant; required Capability
        performance remains distinct from supporting Knowledge.

    - id: FTD-CURRENT-POSITION-NOT-SCORE
      verification_refs: [FV-02, FV-09, FV-14]
      precondition: >-
        The active Target has demonstrated, challenged and unknown projections plus
        gaps/uncertainty and evidence-basis references.
      operation: Open Current position and inspect state, gaps and one evidence basis.
      oracle: >-
        Demonstrated/challenged/unknown remain distinct; unknown is not failure; gaps
        retain requirement/basis context; evidence is inspectable without an invented
        universal proficiency/mastery score.

    - id: FTD-GAP-TO-FOCUS
      verification_refs: [FV-02, FV-08, FV-09]
      precondition: >-
        Current position exposes multiple gap/uncertainty candidates plus accepted
        focus-decision context.
      operation: Select one gap/capability and set a Next focus with purpose/rationale.
      oracle: >-
        The accepted Focus preserves Target relevance, selected gap/capability and
        rationale; stale/rejected mutation preserves inspected context for reconsideration.

    - id: FTD-KNOWLEDGE-NONSPATIAL
      verification_refs: [FV-02, FV-07, FV-08]
      precondition: >-
        Knowledge is available in active Target/focus scope with meaningful relations
        and an optional Required-Capability scope.
      operation: >-
        Query Knowledge, apply and clear a Required-Capability scope, select a result,
        inspect detail and follow a meaningful relation without using a spatial renderer.
      oracle: >-
        The task is complete through query/result/detail; Knowledge identity and relation
        meaning remain stable; scope changes are reversible and do not change Target/focus.

    - id: FTD-SPATIAL-KNOWLEDGE-OPTIONAL
      verification_refs: [FV-07, FV-11]
      precondition: >-
        The implementation under test has an enabled spatial Knowledge provider and the
        same semantic Knowledge projection is available non-spatially.
      operation: >-
        Inspect/select Knowledge through the spatial projection, change its presentation
        state, then disable or make the renderer unavailable.
      oracle: >-
        Canonical Knowledge identity, relation meaning and semantic scope are unchanged;
        geometry/camera/layout never become semantic truth; non-spatial completion remains
        available after renderer loss.

    - id: FTD-SUPPORT-SELECTION-TO-ACTIVITY
      verification_refs: [FV-02, FV-08, FV-14]
      precondition: >-
        An active Target and Next focus exist with at least one suitable support option
        carrying fit basis and limitations.
      operation: Inspect support fit, choose support and start one activity attempt.
      oracle: >-
        Support selection is dominant before start; after an ActivityAttempt is accepted,
        the attempt becomes dominant while support/context remain noncompeting supporting
        information; Target/focus and semantic basis are preserved.

    - id: FTD-ACTIVITY-COMPLETION-NOT-EVIDENCE
      verification_refs: [FV-02, FV-09]
      precondition: An accepted ActivityAttempt is active.
      operation: Submit/complete the attempt with attributable result/provenance.
      oracle: >-
        Completion enters an explicit evidence-processing/result state; activity
        completion alone does not mark Capability demonstrated, close a gap or fabricate
        learner change; duplicate completion is not silently submitted while pending.

    - id: FTD-CURRENT-STATE-EVIDENCE-DETAIL
      verification_refs: [FV-10, FV-14]
      precondition: A selected current-state conclusion has an evidence-basis reference.
      operation: In Current position, inspect the selected conclusion's why-this-state evidence detail.
      oracle: >-
        Evidence detail is the dominant region; Performance/Observation, argument/claim
        basis, provenance and limitations remain distinguishable; no post-activity change
        summary is fabricated.

    - id: FTD-POST-ACTIVITY-CHANGE-REVIEW
      verification_refs: [FV-02, FV-09, FV-10, FV-14]
      precondition: >-
        A completed activity/evidence cycle exposes a reviewable changed, no-change,
        challenged or increased-uncertainty result.
      operation: Open Evidence & changes from Activity and choose a valid continuation.
      oracle: >-
        Change summary is primary; evidence remains directly inspectable; no-change and
        increased uncertainty are valid outcomes; Target-information refinement is
        separate from learner-evidence change; continuation can return to Current,
        refine Target, inspect Knowledge or continue as topology allows.

    - id: FTD-PREPARATION-SUPPORT-REQUEST
      verification_refs: [FV-02, FV-03, FV-08, FV-14]
      precondition: >-
        Current Target/focus work identifies missing usable support and preserves a
        motivating context.
      operation: >-
        Enter Prepare Support, provide source/provenance context and request preparation.
      oracle: >-
        The motivating context is preserved; request/source input remains recoverable;
        no corpus/import/schema or item-repair UI is required.

    - id: FTD-PREPARATION-SUPPORT-PARTIAL-RECOVERY
      verification_refs: [FV-03, FV-04, FV-14]
      precondition: >-
        A PreparationRequest has independently accepted support plus unresolved/rejected
        remainder, or becomes dependency-unavailable/stale.
      operation: >-
        Inspect accepted results and remainder, resume/reconsider when allowed, then
        return to the originating preparation view.
      oracle: >-
        Accepted support is not rolled back by unresolved peers; explicit remainder and
        reason remain visible; context survives recovery; return restores the originating
        task rather than routing to an unrelated maintenance workspace.

    - id: FTD-RESPONSIVE-PREPARATION
      verification_refs: [FV-02, FV-11, FV-14]
      precondition: Representative wide, compact and narrow viewport classes.
      operation: >-
        Traverse Targets, Target, Current position, Knowledge and Activity, enter contextual
        Evidence & changes from Activity, and exercise Prepare Support using representative states/variants.
      oracle: >-
        The same semantic responsibilities and Target/focus context are preserved;
        dominant task regions remain first/clear; supporting detail reflows or discloses
        without requiring a separate mobile product mode or hidden critical context.

    - id: FTD-COMPOSITION-VARIANTS
      verification_refs: [FV-11, FV-14]
      precondition: >-
        Mocks can drive every declared state-dependent composition variant in VIEW-TARGETS,
        VIEW-TARGET, VIEW-ACTIVITY and VIEW-PREPARE-SUPPORT.
      operation: Trigger each variant using its accepted interaction/machine precondition.
      oracle: >-
        Exactly the declared region is dominant for the variant; variant changes do not
        create a new route/domain mode; recoverable user input and required context survive
        according to the Screen/View contract.

    - id: FTD-RECOVERABLE-FAILURE-PRESERVES-CONTEXT
      verification_refs: [FV-03, FV-04, FV-08]
      precondition: >-
        A task feature has current Target/focus and task-local input/selection while its
        adapter can return REJECTED, DEPENDENCY_UNAVAILABLE, STALE_BASIS or
        OPERATIONAL_FAILURE as applicable.
      operation: Trigger each applicable recoverable outcome and retry/correct/reconsider.
      oracle: >-
        Semantic outcomes remain distinct; provider exceptions do not leak; accepted
        context/input is retained where safe and the next valid action is explicit.

    - id: FTD-FORBIDDEN-DEPENDENCY-EDGES
      verification_refs: [FV-05, FV-08]
      precondition: Frontend source/module roots and public feature boundaries exist.
      operation: Analyze source dependency/import edges.
      oracle: >-
        No task-feature-to-concrete-adapter, task-feature-to-renderer-package,
        task-feature-to-other-feature-private-state, shared-presentation-to-task-state or
        legacy Curation/Import/Progress/Diagnostics public dependency edge exists.

    - id: FTD-ADAPTER-CONTRACT
      verification_refs: [FV-04, FV-06]
      precondition: Deterministic mock adapter implements the current consumer-owned ports.
      operation: Execute shared consumer-port contract tests over representative success and failure outcomes.
      oracle: >-
        Features receive frontend-owned semantic models/outcomes only; accepted identities,
        basis refs and outcome distinctions survive mapping; the same contracts remain
        implementable by a future transport adapter.

    - id: FTD-TARGET-PURPOSE-ISOLATION
      verification_refs: [FV-13]
      precondition: >-
        Two related Targets share a CapabilitySpecification but one has an additional
        Target-specific performance requirement.
      operation: Compare the Targets, establish either one and inspect requirements/current state.
      oracle: >-
        Shared Capability identity does not copy Target-specific requirements or learner
        state between Targets; provenance and purpose remain attributable to the correct
        Target.

    - id: FTD-HARNESS-CURRENTNESS
      verification_refs: [FV-12]
      precondition: Canonical frontend prerequisite lifecycle evidence is available.
      operation: Evaluate strict Harness semantic/currentness closure after a prerequisite acceptance changes.
      oracle: >-
        A stale or lifecycle-unknown downstream frontend capability is not reported
        current merely because its file exists or executable tests pass.

  forbidden_oracles:
    - exact spatial force coordinates
    - camera orientation as semantic meaning
    - presence of a 3D renderer
    - provider component tree shape
    - CSS class names
    - private React state shape
    - mock-only fields absent from consumer contracts
    - backend endpoint/resource structure
    - pixel-perfect screenshots except explicit measurable layout invariants
