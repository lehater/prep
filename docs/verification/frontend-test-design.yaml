version: 2
kind: harness-knowledge-artifact
artifact: FRONTEND-TEST-DESIGN
schema: test-design/v1
title: Frontend Test Design

content:
  purpose: >-
    Define executable observable contracts for the mock-first user-centered frontend
    while keeping backend transport, provider internals and renderer geometry outside
    semantic test oracles.

  tests:
    - id: FTD-END-TO-END-TARGET-LOOP
      precondition: Representative target mock contains requirements, learner state, gaps, support, diagnostics and evidence updates.
      operation: Select target, inspect State, inspect Gaps, choose focus, perform learning/diagnostic path, record new evidence, open Progress.
      oracle: Active target/focus persist; updated evidence changes only justified target-relative state/gaps; the user can continue the adaptation loop.

    - id: FTD-EMPTY-CORPUS-BOOTSTRAP
      precondition: No suitable prepared target/corpus data exists.
      operation: Attempt target work.
      oracle: User is routed to explicit target/corpus preparation rather than encountering an unexplained dead end.

    - id: FTD-CURRENT-STATE-NOT-SCORE
      precondition: Target contains satisfied, unresolved and challenged fragments with mixed evidence.
      operation: Open State.
      oracle: Three semantic states and their basis are visible; unresolved is not rendered as failure; no invented universal proficiency score appears.

    - id: FTD-GAP-TO-FOCUS
      precondition: Target has multiple gaps/uncertainty areas.
      operation: Select one gap and choose learning or diagnostic focus.
      oracle: Focus is explicitly tied to selected target-relative gap/uncertainty with preserved rationale.

    - id: FTD-MISSING-SUPPORT
      precondition: Selected high-priority gap has no usable learning support.
      operation: Open Learning.
      oracle: Missing support is explicit; gap/focus remain intact; user can route to Curation without fabricated material.

    - id: FTD-DIAGNOSTIC-EVIDENCE
      precondition: An unresolved requirement has a supported diagnostic opportunity.
      operation: Perform/simulate diagnostic activity and accept resulting evidence.
      oracle: Performance/Observation facts are distinct from derived claims; target state changes only via accepted evidence semantics.

    - id: FTD-PROGRESS-NO-CHANGE-VALID
      precondition: New evidence does not change target satisfaction.
      operation: Open Progress after evidence update.
      oracle: No-change is represented as valid outcome rather than hidden or forced into positive progress.

    - id: FTD-IMPORT-CONTRACT-VALIDATE-APPLY
      precondition: Import mock exposes versioned contract/examples and a document with valid and rejected items.
      operation: Inspect contract, validate document, inspect outcomes, explicitly apply.
      oracle: Validation never applies data; rejected items remain identifiable; apply reports terminal per-item outcomes.

    - id: FTD-KNOWLEDGE-SEMANTIC-PROJECTION
      precondition: Mock Knowledge contains objects and relational propositions in target/focus scope.
      operation: Search/select/focus in non-spatial and 3D paths.
      oracle: Both preserve canonical identities and proposition meaning; selection does not implicitly narrow scope.

    - id: FTD-RENDERER-UNAVAILABLE-FALLBACK
      precondition: Knowledge loads but renderer is unavailable.
      operation: Complete Knowledge exploration task.
      oracle: Search/list/detail and relation inspection remain task-complete without camera manipulation.

    - id: FTD-RESPONSIVE-TARGET-WORK
      precondition: Representative wide, compact and narrow viewport classes.
      operation: Traverse State, Gaps, Learning, Diagnostics, Knowledge and Progress.
      oracle: Active target/focus, required actions and semantic read/focus order remain usable without required horizontal overflow.

    - id: FTD-CURATION-SEMANTIC-AREAS
      precondition: Mock Curation supports Targets, Capabilities, Knowledge, Learning Support, Assessment, Import and Quality.
      operation: Open each area and one representative editor.
      oracle: Semantic responsibilities remain distinct and no legacy backend/resource organization dictates the UI.

    - id: FTD-RECOVERABLE-FAILURE-PRESERVES-CONTEXT
      precondition: Feature has active target/focus or editor draft and adapter returns validation/conflict/operational failure.
      operation: Trigger failure and retry/correct.
      oracle: User/task context is preserved until explicit success/cancel.

    - id: FTD-FORBIDDEN-DEPENDENCY-EDGES
      precondition: Frontend source/module roots exist.
      operation: Analyze import/dependency graph.
      oracle: No feature-to-concrete-adapter, feature-to-renderer, target-work-to-curation-internal or shared-UI-to-feature-state edge exists.

    - id: FTD-ADAPTER-CONTRACT
      precondition: Mock adapter implements current consumer ports.
      operation: Execute shared port contract tests.
      oracle: Feature contracts expose frontend-owned models/outcomes only and remain reusable for a future transport adapter.

    - id: FTD-GRAPH-PERFORMANCE-PROFILE-SEMANTICS
      precondition: Same semantic GraphScene under allowed renderer profiles.
      operation: Change performance/degradation preferences.
      oracle: Canonical Knowledge refs, target/focus scope, selection/focus and non-spatial access remain unchanged.

    - id: FTD-HARNESS-TRACE
      precondition: Canonical frontend prerequisite revisions are known.
      operation: Evaluate strict Harness semantic/currentness closure.
      oracle: Changed accepted prerequisite requires downstream revalidation rather than remaining silently current.

  forbidden_oracles:
    - exact graph force coordinates
    - camera orientation as semantic meaning
    - provider component tree shape
    - CSS class names
    - private React state
    - mock-only fields absent from frontend contracts
    - pixel-perfect screenshots except explicit measurable layout invariants
