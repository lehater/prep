version: 1
kind: harness-knowledge-artifact
artifact: FRONTEND-TEST-DESIGN
schema: test-design/v1
title: Frontend Test Design

content:
  purpose: >-
    Define executable observable frontend contracts for the mock-first implementation
    while keeping backend transport, provider internals and renderer geometry outside
    semantic test oracles.

  tests:
    - id: FTD-MODE-WORKSPACE-NAVIGATION
      verification_refs: [FV-02]
      precondition: Mock ports expose prepared targets and representative Learning/Curation data.
      operation: Switch modes, select a target, and navigate Overview, Knowledge, Study and Statistics.
      oracle: Mode and active-target context follow accepted Screen/View responsibilities; Learning exposes no target-authoring action.

    - id: FTD-TARGET-OVERVIEW-SEMANTICS
      verification_refs: [FV-02, FV-03]
      precondition: A target exposes a RequirementExpression, support diagnostics and factual evidence summary.
      operation: Open Target Overview.
      oracle: Capability requirements are read-only, support diagnostics remain distinct from learner-state conclusions, and unavailable evidence is not presented as negative evidence.

    - id: FTD-KNOWLEDGE-SEMANTIC-PROJECTION
      verification_refs: [FV-02, FV-06]
      precondition: Mock Knowledge contains KnowledgeObjects and relational KnowledgePropositions.
      operation: Search/select Knowledge and inspect one represented relationship in non-spatial and spatial paths.
      oracle: Both paths preserve the same canonical Knowledge identities and proposition predicate/participant meaning; geometry is not an oracle.

    - id: FTD-KNOWLEDGE-SELECTION-RENDERER-CONTINUITY
      verification_refs: [FV-06, FV-08]
      precondition: A stable Knowledge scope is loaded and the renderer is active.
      operation: Select different Knowledge items without changing semantic scope/filter/focus.
      oracle: Detail selection changes without rebuilding semantic query/renderer lifetime or resetting renderer-owned camera/layout.

    - id: FTD-EXPLICIT-FOCUS
      verification_refs: [FV-02, FV-06, FV-08]
      precondition: Knowledge selection exists with no explicit focus.
      operation: Select an item, then separately invoke Focus and Clear focus.
      oracle: Selection alone does not narrow semantic membership; Focus changes presentation/exploration scope only when explicitly invoked and Clear focus restores prior scope.

    - id: FTD-STUDY-PREVIEW-DIAGNOSTICS
      verification_refs: [FV-02, FV-03]
      precondition: Mock target has a mix of representable, missing and diagnostically inadequate support.
      operation: Build Study Set preview.
      oracle: Exact representable subset and diagnostics are shown together; valid empty is supported; material count is not labeled adequacy.

    - id: FTD-STUDY-STALE-CONFLICT
      verification_refs: [FV-02, FV-03]
      precondition: An inspected Study Set preview exists and mock current-state identity changes.
      operation: Export the stale materialization token.
      oracle: Export reports recoverable conflict and requires rebuild/reinspection rather than silently exporting changed material.

    - id: FTD-EVIDENCE-FACTS-NOT-CLAIMS
      verification_refs: [FV-02, FV-03]
      precondition: Mock evidence contains Observation facts and runtime ratings with provenance.
      operation: Open Statistics/Evidence.
      oracle: Factual history/aggregates are visible and no raw rating is presented as mastery, retention, Gap, LearningPriority or LearnerCapabilityClaim.

    - id: FTD-CURATION-CURRENT-MODELS
      verification_refs: [FV-02, FV-03]
      precondition: Mock curation ports support Targets, Capabilities, Knowledge and Question-compatible Study Material.
      operation: Open each collection/editor and perform one accepted create/update path.
      oracle: Target editing uses RequirementExpression<CapabilitySpecification>; Knowledge editing distinguishes KnowledgeObject/KnowledgeProposition; no legacy RequirementSet or KnowledgeRelation entity is required.

    - id: FTD-RECOVERABLE-FAILURE-PRESERVES-CONTEXT
      verification_refs: [FV-02, FV-03, FV-08]
      precondition: An editor or retryable operation has user/task context and mock adapter returns validation/conflict/operational failure.
      operation: Trigger failure and retry/correct.
      oracle: Accepted failure state is visible and recoverable input/context is preserved until explicit success/cancel.

    - id: FTD-FORBIDDEN-DEPENDENCY-EDGES
      verification_refs: [FV-04]
      precondition: Frontend source/module roots exist.
      operation: Analyze the import/dependency graph.
      oracle: No forbidden feature-to-adapter, feature-to-renderer, Learning-to-Curation-internal or shared-UI-to-feature-state dependency exists.

    - id: FTD-ADAPTER-MODEL-ISOLATION
      verification_refs: [FV-05, FV-07]
      precondition: Representative MockFrontendAdapter fixtures exist.
      operation: Execute shared consumer-port contract tests against the mock adapter.
      oracle: Returned values use frontend-owned models/outcomes only and feature contracts contain no fixture/provider-specific types; the same suite is reusable for a future transport adapter.

    - id: FTD-RENDERER-BOUNDARY
      verification_refs: [FV-06]
      precondition: A renderer-neutral GraphScene contains visual references to current Knowledge models.
      operation: Render, activate, drag, fit/reset and apply quality/degradation preferences.
      oracle: Only semantic activation/opaque viewport/failure crosses the renderer port; coordinates/Three.js/force state stay private and semantic refs remain unchanged.

    - id: FTD-RENDERER-UNAVAILABLE-FALLBACK
      verification_refs: [FV-06, FV-09]
      precondition: Knowledge data loads but GraphRenderer reports unavailable.
      operation: Attempt the Knowledge exploration task.
      oracle: Search/list/detail and relation inspection remain task-complete without spatial manipulation.

    - id: FTD-RESPONSIVE-KNOWLEDGE-WORKSPACE
      verification_refs: [FV-02, FV-09]
      precondition: Representative wide, compact and narrow viewport cases exist.
      operation: Render Target and Curation Knowledge workspaces at each class.
      oracle: Primary Knowledge surface and required controls remain usable, supporting regions reflow without required horizontal overflow, and focus/read order remains meaningful.

    - id: FTD-GRAPH-PERFORMANCE-PROFILE-SEMANTICS
      verification_refs: [FV-06, FV-09]
      precondition: The same GraphScene is rendered under Auto, Quality and Performance profiles.
      operation: Change profiles and allowed visual degradation settings.
      oracle: Canonical Knowledge/proposition references, semantic scope, selection/focus and non-spatial access remain unchanged.

    - id: FTD-HARNESS-TRACE
      verification_refs: [FV-10]
      precondition: Canonical frontend prerequisite revisions are known.
      operation: Evaluate strict Harness semantic/currentness closure.
      oracle: A changed accepted prerequisite makes dependent frontend knowledge require revalidation rather than remaining silently current.

  forbidden_oracles:
    - exact force coordinates
    - camera orientation as semantic meaning
    - provider component tree shape
    - CSS class names
    - private React state
    - mock fixture fields not present in frontend-owned contracts
    - pixel-perfect screenshots except where an explicit visual invariant requires a measurable range
