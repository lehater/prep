version: 1
kind: problem-evidence
id: PREP-PROBLEM-EVIDENCE

problem: >-
  A person preparing for one or more goals works with goals, capabilities,
  knowledge, practice material, and recorded activity. These kinds of
  information are related. Knowledge can differ in kind, and relationships
  can have different meanings. As the information accumulates, it becomes
  difficult to understand its structure, examine it from different
  perspectives, isolate the part to work with, and understand recorded
  activity in relation to the rest of the preparation.

actors:
  - person-preparing

context: >-
  The person works with preparation information they choose to use.
  The information may already exist before it is used in Prep and may
  change over time.

desired_outcome: >-
  The person can understand preparation information and its relationships,
  examine it from different perspectives, isolate the part to work with,
  and understand recorded activity in that context.

problem_space_terms:
  - goal
  - capability
  - knowledge
  - practice_material
  - recorded_activity

distinctions:
  capability: >-
    Something a person needs to be able to do to achieve a goal.

  practice_material: >-
    Material used for practice.

  recorded_activity: >-
    A fact that preparation activity took place, including a recorded result
    when one exists.

  practice_material_vs_recorded_activity: >-
    Practice material is something that can be used for preparation.
    Recorded activity describes preparation recorded as having taken place.

observations:
  - id: PE-01
    name: structure-opacity
    problem: >-
      Goals, capabilities, knowledge, practice material, and recorded activity
      accumulate while their relationships are difficult to understand.
      Knowledge can differ in kind, and relationships can have different
      meanings. These distinctions matter when understanding the structure
      of preparation information.

  - id: PE-02
    name: perspective-opacity
    problem: >-
      The same preparation information can matter from different perspectives.
      As the amount of information grows, it becomes difficult to examine it
      in relation to a particular goal, capability, knowledge, practice material,
      or recorded activity and isolate the part to work with.

  - id: PE-03
    name: activity-opacity
    problem: >-
      As recorded activity accumulates, it becomes difficult to reconstruct
      what preparation activity took place, what results were recorded, and
      how that activity relates to the rest of the preparation information.

evidence:
  - id: EV-01
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-01]
    statement: >-
      Preparation contains different kinds of knowledge and relationships
      with different meanings, and these distinctions matter when working
      with preparation information.

  - id: EV-02
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-02]
    statement: >-
      The same preparation information may matter in relation to different
      goals, capabilities, knowledge, practice material, and recorded activity.

  - id: EV-03
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-03]
    statement: >-
      Recorded preparation activity and results need to remain understandable
      in relation to the preparation information they concern.

scope_boundaries:
  - >-
    Goal, capability, knowledge, practice material, and recorded activity are
    problem-space distinctions, not a domain model.

  - >-
    Knowledge may differ in kind and relationships may differ in meaning.
    This artifact does not define their taxonomy.

  - >-
    Relationships may cross different kinds of preparation information.
    This artifact does not define a required relationship topology.

  - >-
    Prep works with information the user chooses to use. Prep does not
    determine whether that information is correct or reliable.

  - >-
    Recorded activity and recorded results describe what was recorded.
    They do not establish what the person knows or can do.

non_goals:
  - source management, provenance, citation, or traceability
  - verification of preparation information
  - assessment of a person's knowledge or capability
  - mastery, readiness, or competence estimation

unresolved_downstream_decisions:
  - how preparation information is entered, imported, changed, or removed
  - which kinds of knowledge are distinguished
  - which relationship meanings are distinguished
  - how relationships are created or represented
  - how different perspectives or subsets are produced
  - how preparation material is transferred for study
  - how recorded activity and results are returned
  - whether statistics or other derived values are calculated
  - domain model and semantics
  - user interface and technical realization
