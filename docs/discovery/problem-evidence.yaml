version: 1
kind: problem-evidence
id: PREP-PROBLEM-EVIDENCE

problem: >-
  A person works with knowledge, goals, capabilities, practice material,
  recorded activity, and relationships among them. These kinds of information
  may differ in meaning, and the same information may be relevant from
  different perspectives. As the amount of information grows, it becomes
  difficult to understand and explore it, select a part for use outside Prep,
  and understand recorded activity and results in relation to the information
  they concern.

actors:
  - person-preparing

context: >-
  The person works with information they choose to use. The information may
  already exist before it is used in Prep, may come from different places,
  and may change over time.

desired_outcome: >-
  The person can understand and explore knowledge, goals, capabilities,
  practice material, recorded activity, and their relationships; select a part
  of the available information and material for use outside Prep; and understand
  recorded activity and results over time in relation to the information they
  concern.

problem_space_terms:
  - goal
  - capability
  - knowledge
  - practice_material
  - recorded_activity
  - relationship

distinctions:
  capability: >-
    Something a person needs to be able to do to achieve a goal.

  knowledge: >-
    Information about a subject. Its presence does not state what the person
    knows.

  practice_material: >-
    Material that can be used for study, practice, review, testing, or other
    preparation activity.

  recorded_activity: >-
    A fact that activity took place, including a recorded result when one exists.

  practice_material_vs_recorded_activity: >-
    Practice material is something that can be used in activity.
    Recorded activity describes what was recorded as having taken place.

observations:
  - id: PE-01
    name: information-and-relationship-opacity
    problem: >-
      Knowledge, goals, capabilities, practice material, recorded activity, and
      relationships among them accumulate while becoming difficult to understand
      and explore. Knowledge can differ in kind, relationships can have different
      meanings, and the same information can be considered from different
      perspectives.

  - id: PE-02
    name: external-use-selection
    problem: >-
      A person may need to work outside Prep with only part of the available
      information or material. As the amount and connectedness of information
      grow, it becomes difficult to identify and select the part to use for
      study, practice, review, testing, or other preparation activity.

  - id: PE-03
    name: recorded-activity-opacity
    problem: >-
      As recorded activity and results accumulate, it becomes difficult to
      understand what took place over time and how those facts relate to the
      knowledge, goals, capabilities, practice material, and other information
      they concern.

evidence:
  - id: EV-01
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-01]
    statement: >-
      The value of Prep includes seeing knowledge and relationships among
      knowledge, goals, capabilities, practice material, and recorded activity
      from different perspectives. Different kinds of knowledge and different
      meanings of relationships matter.

  - id: EV-02
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-02]
    statement: >-
      A central use of Prep is to select part of the available information and
      material and use it outside Prep for study, practice, testing, or another
      preparation activity.

  - id: EV-03
    kind: stakeholder-statement
    source: project-owner
    supports: [PE-03]
    interpretation_boundary: >-
      This is the stakeholder's proposed product behavior, preserved as evidence
      of PE-03. Discovery admission accepts the recorded-activity problem and
      desired understanding outcome only. Storage, relationship behavior, and
      product acceptance criteria require a separate Product Requirements decision.
    statement: >-
      Prep should store and relate recorded activity and results so that the
      person can see them over time and interpret those facts as needed.

scope_boundaries:
  - >-
    Goal, capability, knowledge, practice material, recorded activity, and
    relationship are problem-space distinctions, not a domain model.

  - >-
    Knowledge may differ in kind and relationships may differ in meaning.
    This artifact does not define their taxonomy or relationship model.

  - >-
    Relationships may cross different kinds of information.
    This artifact does not define a required relationship topology.

  - >-
    Prep works with information the user chooses to use. Prep does not determine
    its origin, authorship, correctness, reliability, or authority.

  - >-
    Recorded activity and recorded results describe recorded facts.
    They do not establish what the person knows or can do.

non_goals:
  - source management, provenance, citation, or traceability
  - verification of information
  - assessment of a person's knowledge or capability
  - mastery, readiness, or competence estimation

unresolved_downstream_decisions:
  - how information is added, imported, edited, or removed
  - which kinds of knowledge are distinguished
  - which relationship meanings are distinguished
  - how relationships are created or represented
  - how information is explored from different perspectives
  - how a selected part is represented or transferred for external use
  - how recorded activity and results are returned
  - which statistics or other derived representations are provided
  - domain model and semantics
  - user interface and technical realization
