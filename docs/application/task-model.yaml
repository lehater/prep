version: 1
kind: prep-task-model

purpose: >-
  Define the intended human work Prep must support from accepted Product
  Capabilities and Application Design, before journeys, interface concepts,
  navigation, layout, visualization form or frontend technology are selected.

goals:
  - id: GOAL-LEARN
    outcome: >-
      Learn against an existing curated LearningTarget, prepare the currently
      resolvable study material, use the supported external study runtime and
      inspect factual review evidence afterward.
    product_capability_refs: [PC-01, PC-04, PC-06, PC-07, PC-08]
    tasks:
      - id: TM-LEARN-SELECT-TARGET
        responsibility: USER
        required_information:
          - available curated LearningTargets
          - each target's intended outcome and reusable prepared scope summary
        decision_or_input:
          - select one existing curated LearningTarget
        expected_outcome:
          - one existing target becomes the active learning context
        required_system_support:
          - list and search curated LearningTargets
          - retrieve the selected target and its read-only Requirement/RequirementSet scope
        alternate_or_recovery:
          - if no suitable target exists, report that learning cannot start from an uncurated target and allow separate curation work; do not edit target scope inside learning work
        product_capability_refs: [PC-01, PC-06]

      - id: TM-LEARN-PREPARE-STUDY
        responsibility: USER
        required_information:
          - active LearningTarget
          - whether currently resolvable Questions exist
          - explicit preparation diagnostics for missing alignments or absent Question material when available
        decision_or_input:
          - request preparation of study material for the active target
        expected_outcome:
          - a current Study Set preview containing the resolvable Question subset, including an explicit empty result when nothing resolves
        required_system_support:
          - resolve target scope through Requirements/RequirementSets and Knowledge alignments
          - select currently resolvable Questions
          - expose missing-preparation diagnostics without converting them into a learner-facing completeness gate
        alternate_or_recovery:
          - an empty or incomplete resolvable subset remains inspectable; repairing reusable material belongs to curation work
        product_capability_refs: [PC-04, PC-06]

      - id: TM-LEARN-EXPORT-STUDY
        responsibility: USER
        required_information:
          - current Study Set preview
          - destination external study runtime supported by the application
          - whether target/question resolution has changed since the preview
        decision_or_input:
          - send the prepared material to the supported external runtime
        expected_outcome:
          - the same reviewed Study Set material is materialized and exported, or drift is reported before export
        required_system_support:
          - detect preview-to-export drift
          - materialize runtime-specific derived representation
          - export through the supported external-study integration
        alternate_or_recovery:
          - when drift is detected, require a refreshed preview before sending materially changed study material
          - surface export failure without inventing learning completion
        product_capability_refs: [PC-06, PC-08]

      - id: TM-LEARN-STUDY-EXTERNALLY
        responsibility: USER
        required_information:
          - the exported study material as presented by the external runtime
        decision_or_input:
          - perform the supported external learning/retrieval activity
        expected_outcome:
          - external study produces review results attributable to exported Questions
        required_system_support:
          - preserve Question identity through the external-study mapping needed for later result attribution
        alternate_or_recovery:
          - external-runtime failure or interruption does not alter canonical Prep learning evidence until accepted results are received
        product_capability_refs: [PC-06, PC-08]

      - id: TM-SYSTEM-RECORD-REVIEW-RESULTS
        responsibility: SYSTEM
        required_information:
          - accepted external review results
          - mapping back to canonical Questions
        expected_outcome:
          - factual Question-level ReviewObservations are recorded
        required_system_support:
          - receive results from the external runtime
          - resolve external items back to canonical Questions
          - record accepted ReviewObservations without inferring mastery, readiness or retention
        product_capability_refs: [PC-07]

      - id: TM-LEARN-INSPECT-EVIDENCE
        responsibility: USER
        required_information:
          - Question-level review history and statistics in target or Question context
          - explicit distinction between factual review evidence and any deferred learner-state interpretation
        decision_or_input:
          - choose the target or Question evidence to inspect
        expected_outcome:
          - the learner can understand recorded review facts without the product claiming unsupported mastery, readiness or priority
        required_system_support:
          - retrieve Question-level ReviewObservations/statistics
        alternate_or_recovery:
          - absence of observations is shown as absence of evidence rather than a negative mastery claim
        product_capability_refs: [PC-07, PC-09]

  - id: GOAL-EXPLORE-KNOWLEDGE
    outcome: >-
      Find and understand reusable knowledge identities and accepted
      relationships in a global or target-relevant scope without prescribing a
      visualization form.
    product_capability_refs: [PC-03]
    tasks:
      - id: TM-EXPLORE-FIND-KNOWLEDGE
        responsibility: USER
        required_information:
          - searchable human-readable KnowledgeNode content
          - whether the current scope is global or target-relevant
        decision_or_input:
          - enter or refine search/filter criteria
          - choose a KnowledgeNode to inspect
        expected_outcome:
          - a relevant KnowledgeNode can be found and inspected in the intended scope
        required_system_support:
          - list/search KnowledgeNodes
          - project KnowledgeNodes relevant to an active LearningTarget when target-scoped exploration is requested
        alternate_or_recovery:
          - no-match state preserves the current scope and permits query refinement
        product_capability_refs: [PC-03]

      - id: TM-EXPLORE-RELATIONSHIPS
        responsibility: USER
        required_information:
          - the selected KnowledgeNode
          - accepted typed relationships connecting nodes in the current scope
          - enough neighboring identity/context to understand what each relation connects
        decision_or_input:
          - follow or inspect a relevant KnowledgeRelation
          - change focus to a connected KnowledgeNode when useful
        expected_outcome:
          - meaningful accepted relationships can be understood and navigated
        required_system_support:
          - project accepted KnowledgeRelations among the selected global or target-relevant node set
          - preserve node and relation identity while focus changes
        alternate_or_recovery:
          - dense or large scopes must remain explorable through bounded selection/filtering rather than requiring all corpus elements to be simultaneously visible
        product_capability_refs: [PC-03]

  - id: GOAL-CURATE
    outcome: >-
      Maintain the reusable corpus and prepared learning profiles independently
      of the learner workflow.
    product_capability_refs: [PC-01, PC-02, PC-03, PC-04, PC-10]
    tasks:
      - id: TM-CURATE-TARGET
        responsibility: USER
        required_information:
          - existing LearningTarget identity and intended outcome
          - reusable Requirements and RequirementSets available for assignment
          - current target scope
        decision_or_input:
          - create or edit a LearningTarget
          - assign or remove reusable Requirements/RequirementSets
        expected_outcome:
          - a reusable curated LearningTarget has an explicit prepared scope
        required_system_support:
          - create/edit LearningTargets
          - list/search Requirements and RequirementSets
          - assign/remove target scope members
        alternate_or_recovery:
          - invalid target composition is rejected without mutating accepted target scope
        product_capability_refs: [PC-01, PC-02]

      - id: TM-CURATE-KNOWLEDGE
        responsibility: USER
        required_information:
          - existing KnowledgeNodes and their human-readable content
          - validation outcomes for proposed changes
        decision_or_input:
          - create or edit a KnowledgeNode
        expected_outcome:
          - accepted reusable knowledge identity/content is maintained
        required_system_support:
          - list/search/retrieve KnowledgeNodes
          - create/edit KnowledgeNodes through application use cases
        alternate_or_recovery:
          - rejected changes leave accepted canonical data unchanged and expose the validation outcome
        product_capability_refs: [PC-02, PC-03]

      - id: TM-CURATE-KNOWLEDGE-RELATIONS
        responsibility: USER
        required_information:
          - source and target KnowledgeNodes
          - accepted relation types applicable to the proposed relationship
          - existing relation state
        decision_or_input:
          - create or remove a typed KnowledgeRelation
        expected_outcome:
          - accepted relationships between reusable KnowledgeNodes are maintained
        required_system_support:
          - inspect KnowledgeNodes and existing relations
          - create/remove typed relations through application use cases
        alternate_or_recovery:
          - unsupported or invalid relation changes are rejected without inventing another relation type
        product_capability_refs: [PC-02, PC-03]

      - id: TM-CURATE-REQUIREMENTS
        responsibility: USER
        required_information:
          - existing Requirements and RequirementSets
          - RequirementSet membership/composition
          - composition validity including acyclicity
        decision_or_input:
          - create or edit a Requirement
          - create or edit a RequirementSet
          - add or remove Requirements/RequirementSets from a set
        expected_outcome:
          - reusable learning requirements and valid RequirementSet composition are maintained
        required_system_support:
          - list/search/retrieve Requirements and RequirementSets
          - enforce accepted composition invariants
        alternate_or_recovery:
          - invalid composition is rejected without partially applying a prohibited cycle
        product_capability_refs: [PC-01, PC-02]

      - id: TM-CURATE-REQUIREMENT-ALIGNMENT
        responsibility: USER
        required_information:
          - selected Requirement
          - candidate KnowledgeNodes
          - existing Requirement-to-Knowledge alignments
        decision_or_input:
          - align or unalign a Requirement with KnowledgeNodes
        expected_outcome:
          - target requirements can resolve to the intended reusable knowledge
        required_system_support:
          - search/inspect Requirements and KnowledgeNodes
          - create/remove Requirement-to-Knowledge alignments
        alternate_or_recovery:
          - lack of an accepted alignment remains an explicit preparation gap rather than an invented match
        product_capability_refs: [PC-01, PC-03, PC-04]

      - id: TM-CURATE-QUESTIONS
        responsibility: USER
        required_information:
          - existing Questions and direct answers
          - validation outcomes for proposed changes
        decision_or_input:
          - create or edit a Question and its direct answer
        expected_outcome:
          - reusable Question material is maintained
        required_system_support:
          - list/search/retrieve Questions
          - create/edit Questions through application use cases
        alternate_or_recovery:
          - a Question may exist before Knowledge alignment is known; missing alignment is not treated as invalid Question identity
        product_capability_refs: [PC-02, PC-04]

      - id: TM-CURATE-QUESTION-ALIGNMENT
        responsibility: USER
        required_information:
          - selected Question
          - candidate KnowledgeNodes
          - existing Question-to-Knowledge alignments
        decision_or_input:
          - align or unalign a Question with one or more KnowledgeNodes
        expected_outcome:
          - Question material can be resolved through relevant knowledge for study preparation
        required_system_support:
          - search/inspect Questions and KnowledgeNodes
          - create/remove Question-to-Knowledge alignments
        alternate_or_recovery:
          - uncertain alignment remains unresolved instead of being guessed
        product_capability_refs: [PC-03, PC-04, PC-10]

      - id: TM-CURATE-BULK-LOAD
        responsibility: USER
        required_information:
          - prepared input selected for loading
          - decoded validation/rejection outcomes
          - which supported canonical object kinds the input contains
        decision_or_input:
          - submit prepared Knowledge, Requirement/RequirementSet, Question or optional target data for loading
        expected_outcome:
          - accepted prepared data is applied through application use cases with explicit validation/rejection results
        required_system_support:
          - supported bulk-input decoding downstream of the human task
          - application-level bulk load operations for the accepted object kinds
        alternate_or_recovery:
          - invalid input produces explicit rejection/diagnostics; automatic source extraction or semantic repair is not invented
        product_capability_refs: [PC-02, PC-04]

      - id: TM-CURATE-DIAGNOSTICS
        responsibility: USER
        required_information:
          - supported structural diagnostics such as unaligned Questions or KnowledgeNodes with no aligned Questions
          - the canonical objects implicated by each diagnostic
        decision_or_input:
          - choose a diagnostic result to investigate
          - decide whether to repair the implicated reusable data
        expected_outcome:
          - supported preparation/quality gaps can be found and routed into the appropriate curation task
        required_system_support:
          - query supported structural alignment diagnostics
          - preserve distinction between structural facts and deferred semantic coverage judgments
        alternate_or_recovery:
          - absence of a semantic coverage model is represented as deferred capability, not as a fabricated quality score
        product_capability_refs: [PC-10]

sufficiency_review:
  status: COMPLETE
  checks:
    - id: current-slice-product-coverage
      result: >-
        PC-01, PC-02, PC-03, PC-04, PC-06 and PC-07 have explicit USER/SYSTEM
        task coverage; PC-08 is supported through external study delegation.
    - id: deferred-capability-discipline
      result: >-
        PC-05 automatic prioritization, Prep-owned PC-08 retention-state
        interpretation and PC-09 adaptive replanning are not promoted into
        current USER tasks. Evidence inspection is limited to accepted factual
        review observations.
    - id: learning-curation-separation
      result: >-
        Learning consumes existing curated target scope; target composition and
        reusable-corpus repair remain separate curation work.
    - id: interface-neutrality
      result: >-
        No task requires a screen, route, pane, graph, 3D projection, layout,
        component or frontend provider.

unresolved_questions: []
