version: 1
kind: task-model
id: PREP-TASK-MODEL
goals:
  - id: GOAL-LEARN-TARGET
    tasks:
      - {id: TASK-L-SELECT-TARGET, responsibility: USER, outcome: A prepared LearningTarget is active.}
      - {id: TASK-L-UNDERSTAND-TARGET, responsibility: USER, outcome: Learner understands target purpose and curated scope.}
      - {id: TASK-L-EXPLORE-KNOWLEDGE, responsibility: USER, outcome: Learner can read and explore target-relevant Knowledge and relations.}
      - {id: TASK-L-STUDY-QUESTIONS, responsibility: USER, outcome: Learner can inspect currently available Questions and Study Set material.}
      - {id: TASK-L-EXPORT-STUDY, responsibility: USER, outcome: Learner exports the inspected Study Set to the external runtime.}
      - {id: TASK-L-REVIEW-FACTS, responsibility: USER, outcome: Learner inspects factual ReviewObservations/statistics.}
  - id: GOAL-CURATE-LEARNING-SYSTEM
    tasks:
      - {id: TASK-C-MAINTAIN-TARGETS, responsibility: USER, outcome: Curator maintains LearningTargets and their Requirement scope.}
      - {id: TASK-C-MAINTAIN-KNOWLEDGE, responsibility: USER, outcome: Curator maintains KnowledgeNodes and KnowledgeRelations.}
      - {id: TASK-C-MAINTAIN-REQUIREMENTS, responsibility: USER, outcome: Curator maintains Requirements/RequirementSets and Knowledge alignments.}
      - {id: TASK-C-MAINTAIN-QUESTIONS, responsibility: USER, outcome: Curator maintains Questions and Knowledge alignments.}
      - {id: TASK-C-IMPORT-DATA, responsibility: USER, outcome: Curator imports supported prepared canonical data and sees outcomes.}
  - id: GOAL-OPERATE-STUDY-INTEGRATION
    tasks:
      - {id: TASK-I-CHECK-RUNTIME, responsibility: USER, outcome: User can inspect external-runtime reachability/compatibility.}
sufficiency_review:
  status: ACCEPTED
  rationale: Current Learning, Curation and runtime-status user work is enumerated; deferred coverage-quality and learner-state inference work is outside the current slice.
