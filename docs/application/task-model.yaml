version: 3
kind: task-model
id: PREP-TASK-MODEL

purpose: "Define the intended human/system work required to prepare for a target from accepted product and domain semantics, without selecting screens, navigation, transport, persistence, or frontend technology."

boundaries:
  - "Application USER/SYSTEM tasks are not Learning Design TaskSpecification. TaskSpecification is a reusable performer-facing performance opportunity; this artifact owns concrete application work."
  - "Knowledge is not Capability; Capability is not learner state; activity is not evidence; Observation is not a capability conclusion."
  - "Learner-facing bootstrap does not imply learner-owned reusable corpus curation."
  - "No graph, 2D/3D representation, route, page, modal, component, or layout is required by the Task Model."

goals:
  - id: GOAL-PREPARE-FOR-TARGET
    description: "Reach and maintain an evidence-backed target-relative preparation direction by understanding required performance, current evidence, gaps, next focus, relevant knowledge, suitable support, and the effect of new evidence."
  - id: GOAL-CHOOSE-TARGET-DIRECTION
    description: "Choose which plausible preparation target to pursue by comparing target-relative requirements, current evidence-backed capability, gaps and uncertainty over one reusable learner evidence base."
  - id: GOAL-OBTAIN-USABLE-PREPARATION-SUPPORT
    description: "Turn fragmented or incomplete source material into usable preparation support without requiring the learner to maintain Prep's reusable semantic corpus."

tasks:
  - id: TASK-U-COMPARE-TARGETS
    goal_ref: GOAL-CHOOSE-TARGET-DIRECTION
    responsibility: USER
    description: "Compare two or more plausible preparation targets against the same evidence-backed learner capability basis before committing to one direction."
    upstream_refs: [REQ-CAP-TARGET-DIRECTION, REQ-CAP-TARGET-PURPOSE, REQ-CAP-STATE, LD-PREPARATION-TARGET, LD-REQUIREMENT-EXPRESSION, LM-TARGET-RELATIVE-PROJECTION]
    required_information: "Candidate PreparationTargets and their RequirementExpressions/CapabilitySpecifications, shared versus target-specific requirements, target-relative demonstrated/challenged/unknown projections from the same learner claims/evidence, gaps/uncertainty, provenance and target uncertainty."
    decision_or_input: "Select candidate targets to compare, inspect material differences and decide which target to continue with, or keep the direction decision unresolved."
    expected_outcome: "The learner can explain which capabilities overlap, which requirements are target-specific, where current evidence fits or remains uncertain for each target, and can choose a direction without changing the underlying learner state."
    required_system_support: "Project the same evidence-backed learner capability basis against multiple target requirement sets, expose comparable demonstrated/challenged/unknown and gap/uncertainty semantics, preserve evidence limitations, and avoid inventing a universal scalar fit/readiness/preparation-distance score."
    recovery: "Incomplete target requirements or insufficient/stale evidence remain explicit per target; the comparison may remain unresolved or route missing target/support information to preparation without forcing a choice."

  - id: TASK-U-ESTABLISH-TARGET
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Establish or refine the active preparation target and its purpose while keeping unresolved target information explicit."
    upstream_refs: [REQ-CAP-TARGET, REQ-CAP-TARGET-PURPOSE, LD-PREPARATION-TARGET, LD-REQUIREMENT-EXPRESSION]
    required_information: "Known target purpose/context, available target information or source material, known requirement scope, provenance, and unresolved target uncertainty."
    decision_or_input: "Select an existing target or provide/refine target information sufficiently to establish the active preparation purpose and context."
    expected_outcome: "An active PreparationTarget is available with explicit purpose/context and unresolved target information preserved."
    required_system_support: "Expose existing target context, preserve purpose and uncertainty, keep related targets distinct, and route missing preparation support without forcing corpus/schema work."
    recovery: "If target/support data is insufficient, preserve the motivating context and route to TASK-U-REQUEST-PREPARATION-SUPPORT rather than inventing requirements."

  - id: TASK-U-UNDERSTAND-REQUIREMENTS
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Understand what the active target requires as human performance, including material conditions and acceptable quality, separately from subject coverage."
    depends_on: [TASK-U-ESTABLISH-TARGET]
    upstream_refs: [REQ-CAP-TARGET-PURPOSE, REQ-CAP-PERFORMANCE-REQUIREMENT, LD-CAPABILITY, LD-CAPABILITY-SPECIFICATION, LD-CAPABILITY-STANDARD, LD-KNOWLEDGE-FOCUS, LD-PREPARATION-TARGET, LD-REQUIREMENT-EXPRESSION]
    required_information: "PreparationTarget purpose/context, RequirementExpression structure, CapabilitySpecifications, PerformanceExpectations, condition scope, CapabilityStandards, and direct Knowledge focus where applicable."
    decision_or_input: "Determine whether the currently known required performance is understood well enough to prepare against and identify unresolved target requirements."
    expected_outcome: "The learner can distinguish required capabilities/performance from supporting Subject Knowledge and knows which target expectations remain unresolved."
    required_system_support: "Present requirement structure without flattening all_of/any_of meaning, explain capability/performance semantics in learner-facing terms, and expose uncertainty without fabricating completeness."
    recovery: "Unclear or incomplete requirements remain unresolved target information and may trigger target refinement or preparation support."

  - id: TASK-U-REVIEW-CURRENT-STATE
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Review current target-relative learner state and inspect why each relevant capability is demonstrated, challenged, or unknown."
    depends_on: [TASK-U-UNDERSTAND-REQUIREMENTS]
    upstream_refs: [REQ-CAP-EVIDENCE-CONTEXT, REQ-CAP-STATE, REQ-CAP-EVIDENCE-JUSTIFICATION, REQ-CAP-DURABLE-TRANSFER, LM-CAPABILITY-CLAIM, LM-EVIDENCE-ARGUMENT, LM-STATE-PROJECTION, LM-TEMPORAL-TRANSFER, LM-TARGET-RELATIVE-PROJECTION]
    required_information: "Applicable LearnerCapabilityClaims, CapabilityEvidenceArguments, supporting/challenging Observations, claim and evidence time scopes, condition coverage, transfer limitations, provenance, and target-relative demonstrated/challenged/unknown projection."
    decision_or_input: "Decide which current-state conclusions are sufficiently applicable for planning and which uncertainties require further diagnosis or newer/broader evidence."
    expected_outcome: "A usable evidence-backed view of current state exists without converting missing evidence into failure or into a mastery score."
    required_system_support: "Project claims and evidence arguments against target requirements, expose evidence reasoning and limitations, and keep stale/narrow/conflicting evidence visible."
    recovery: "Insufficient, stale, dependent, conflicting, or out-of-scope evidence remains unknown or challenged as justified and can route to diagnosis."

  - id: TASK-U-REVIEW-GAPS
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Review target-relative gaps and unresolved uncertainty while preserving the evidence basis and target requirement structure."
    depends_on: [TASK-U-REVIEW-CURRENT-STATE]
    upstream_refs: [REQ-CAP-STATE, REQ-CAP-EVIDENCE-JUSTIFICATION, REQ-CAP-FOCUS, LD-GAP-PRIORITY, LM-STATE-PROJECTION, LM-TARGET-RELATIVE-PROJECTION]
    required_information: "Target RequirementExpression, demonstrated/challenged/unknown state, derived Gap semantics, evidence limitations, and requirement-fragment rationale."
    decision_or_input: "Identify which target-relevant differences or uncertainties matter for preparation and inspect the basis of each gap."
    expected_outcome: "The learner can explain current target-relative gaps and unresolved uncertainty without a fabricated scalar proficiency score."
    required_system_support: "Derive Gap semantics from accepted target requirements and learner-state projection while preserving all_of/any_of structure and evidence limitations."
    recovery: "When evidence or target semantics do not justify a gap conclusion, keep the affected requirement unresolved rather than forcing a binary result."

  - id: TASK-U-CHOOSE-NEXT-FOCUS
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Choose or confirm the next preparation focus from target relevance, current gaps or uncertainty, available time, and available support."
    depends_on: [TASK-U-REVIEW-GAPS]
    upstream_refs: [REQ-CAP-FOCUS, REQ-CAP-SUPPORT-FIT, REQ-CAP-ADAPT, LD-GAP-PRIORITY, LD-PREPARATION-INTENT]
    required_information: "Current gaps/uncertainty, target relevance, PreparationPriority rationale, available time or attention constraints, and currently available learning/practice/diagnostic support."
    decision_or_input: "Choose or confirm one or more current PreparationIntents, including whether the immediate purpose is acquisition, practice, diagnosis, transfer, or retention support."
    expected_outcome: "The current preparation focus is explicit and traceable to target-relative need or uncertainty plus material external constraints."
    required_system_support: "Expose prioritization rationale and support availability without deriving priority from graph position, content popularity, or artifact count."
    recovery: "If a relevant focus lacks suitable support, preserve the priority and route to TASK-U-REQUEST-PREPARATION-SUPPORT."

  - id: TASK-U-EXPLORE-KNOWLEDGE
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Orient within Subject Knowledge relevant to the active target, a selected required capability, or current focus; inspect meaningful relationships and move between scope and depth without confusing knowledge with capability."
    depends_on: [TASK-U-UNDERSTAND-REQUIREMENTS]
    upstream_refs: [REQ-CAP-KNOWLEDGE-OVERVIEW, REQ-CAP-KNOWLEDGE-RELATIONSHIPS, REQ-CAP-KNOWLEDGE-SCOPE, REQ-CAP-KNOWLEDGE-DEPTH, KM-KNOWLEDGE-FAMILY, KM-KNOWLEDGE-OBJECT-IDENTITY, KM-KNOWLEDGE-PROPOSITION, KM-RELATIONAL-PROPOSITION, KM-SCOPE-OVERVIEW-DEPTH, KM-GRAPH-IS-PROJECTION, LD-KNOWLEDGE-FOCUS]
    required_information: "Relevant KnowledgeObjects, KnowledgePropositions, relation predicate meaning/direction, current semantic scope, surrounding context, target/focus relevance, and direct Knowledge focus of a selected Required Capability where applicable."
    decision_or_input: "Narrow or expand scope by meaningful criteria including a selected Required Capability, move between overview and detail, select Knowledge, and inspect meaningful relationships needed for orientation or learning."
    expected_outcome: "The learner gains coherent subject orientation and can isolate Knowledge relevant to a selected Required Capability while Knowledge identity remains independent of learner state, target, capability, and presentation."
    required_system_support: "Provide inspectable overview/detail and relationship semantics over stable Knowledge; allow Required Capability to act as a reversible Knowledge-scope criterion anchored by its direct Knowledge focus, with bounded semantic expansion, without mutating Knowledge or Capability meaning."
    recovery: "If a richer visualization is unavailable or unusable, retain task-complete semantic access through another representation without changing Knowledge meaning."

  - id: TASK-U-SELECT-SUPPORT
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Select learning, practice, or diagnostic support appropriate to the current PreparationIntent and required capability conditions."
    depends_on: [TASK-U-CHOOSE-NEXT-FOCUS]
    upstream_refs: [REQ-CAP-PRACTICE, REQ-CAP-DURABLE-TRANSFER, REQ-CAP-SUPPORT-FIT, LD-PREPARATION-INTENT, LD-LEARNING-MATERIAL, LD-SUPPORT-REQUIREMENT, LD-TASK-SPECIFICATION, LD-OBSERVATION-SPECIFICATION, LD-APPLICATION-BOUNDARY, LD-QUESTION-NONFUNDAMENTAL]
    required_information: "PreparationIntent and purpose, CapabilitySpecification, accepted learner evidence/state relevant to support fit, available LearningMaterial, LearningSupportRequirements, TaskSpecifications, ObservationSpecifications, expected conditions/variation, available guidance or feedback, material time/attention constraints where known, and support limitations."
    decision_or_input: "Choose a suitable learning/practice/diagnostic/retention/transfer opportunity for the current intent and learner basis, or decide that available support is inadequate."
    expected_outcome: "A support opportunity is selected with its intended capability purpose, fit basis and limitations understood; completion, feedback or repetition is not treated as evidence of capability."
    required_system_support: "Resolve contextual support fit from intent, intended capability, accepted learner basis, conditions and material support properties; keep LearningMaterial/TaskSpecification/ObservationSpecification roles distinct; preserve assistance/condition limitations; and treat question/card forms as optional projections."
    recovery: "Missing or inadequate support remains explicit and routes to preparation support without closing a gap or asserting capability."

  - id: TASK-U-PERFORM-ACTIVITY
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Perform the selected learning, practice, or diagnostic activity under its actual conditions, whether executed in Prep or a supported external runtime."
    depends_on: [TASK-U-SELECT-SUPPORT]
    upstream_refs: [REQ-CAP-PRACTICE, LD-TASK-SPECIFICATION, LD-EVIDENCE-DESIGN-BOUNDARY, LD-APPLICATION-BOUNDARY, LM-PERFORMANCE]
    required_information: "Selected support, TaskSpecification or LearningMaterial, intended capability, prescribed conditions/affordances, and any supported external-runtime handoff context."
    decision_or_input: "Carry out the activity and provide the responses, work product, actions, or reasoning that the activity calls for."
    expected_outcome: "A concrete activity attempt occurs; when performance is observable it can become a historical Performance, but activity completion alone proves no capability change."
    required_system_support: "Present or delegate the opportunity while preserving its semantic intent and correlation context; do not convert completion or a raw runtime score directly into learner state."
    recovery: "Unavailable/partial external execution or abandoned activity remains distinguishable from completed Performance and does not fabricate evidence."

  - id: TASK-S-CAPTURE-PERFORMANCE
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: SYSTEM
    description: "Capture attributable historical Performance and provenance-bearing Observations from supported activity or translatable external records."
    depends_on: [TASK-U-PERFORM-ACTIVITY]
    upstream_refs: [REQ-CAP-EVIDENCE-CONTEXT, REQ-CAP-PRACTICE, LD-OBSERVATION-SPECIFICATION, LD-EVIDENCE-DESIGN-BOUNDARY, LM-PERFORMANCE, LM-OBSERVATION, LM-INDIVIDUAL-ATTRIBUTION, LM-INTEGRATION-BOUNDARY]
    required_information: "Actual actions/traces/work products or expressed reasoning, actual known conditions, participant attribution, time, provenance, relevant ObservationSpecifications, and supported external records."
    decision_or_input: "Determine which actual facts can be represented faithfully as Performance/Observation and leave unknown conditions or semantically incomplete external records unresolved."
    expected_outcome: "Historical Performance and Observation tokens exist with attributable context, time, and provenance sufficient for later evidence reasoning."
    required_system_support: "Persist/correlate facts without turning an Observation into a capability conclusion and preserve integration-boundary records when faithful translation is unavailable."
    recovery: "Incomplete, ambiguous, unattributable, or semantically lossy records remain integration-boundary data and do not enter learner-state inference as if complete."

  - id: TASK-S-EVALUATE-EVIDENCE
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: SYSTEM
    description: "Evaluate whether captured Observations support or challenge learner-specific Capability claims and derive the target-relative demonstrated/challenged/unknown projection."
    depends_on: [TASK-S-CAPTURE-PERFORMANCE]
    upstream_refs: [REQ-CAP-STATE, REQ-CAP-EVIDENCE-JUSTIFICATION, REQ-CAP-DURABLE-TRANSFER, REQ-CAP-ADAPT, LM-CAPABILITY-CLAIM, LM-EVIDENCE-ARGUMENT, LM-NO-FUNDAMENTAL-WARRANT, LM-STATE-PROJECTION, LM-TEMPORAL-TRANSFER, LM-TARGET-RELATIVE-PROJECTION, LM-INDIVIDUAL-ATTRIBUTION, LM-KNOWLEDGE-BOUNDARY]
    required_information: "Observations and provenance, reusable Capability scope, proposed claim/time scope, observed versus claim conditions, temporal applicability, coverage/transfer limitations, dependence, individual attribution, and target relevance."
    decision_or_input: "Form inspectable CapabilityEvidenceArguments with supports/challenges bearing and admit LearnerCapabilityClaims only when the accepted evidence argument justifies them."
    expected_outcome: "Applicable learner capability claims and evidence arguments are available and target-relative state can be recomputed without mutable CapabilityState or mastery score."
    required_system_support: "Preserve direct evidence reasoning on CapabilityEvidenceArgument, time/condition/transfer limitations, target-relative projection, and the absence of a fundamental EvidentialWarrant."
    recovery: "When evidence is conflicting, dependent, too narrow, stale, unattributable, or otherwise insufficient, preserve limitations and unknown/challenged outcomes rather than overclaiming."

  - id: TASK-U-REVIEW-CHANGE
    goal_ref: GOAL-PREPARE-FOR-TARGET
    responsibility: USER
    description: "Review what changed after new evidence or target information and choose whether to continue, refocus, diagnose further, or refine the target."
    depends_on: [TASK-S-EVALUATE-EVIDENCE]
    upstream_refs: [REQ-CAP-STATE, REQ-CAP-EVIDENCE-JUSTIFICATION, REQ-CAP-FOCUS, REQ-CAP-DURABLE-TRANSFER, REQ-CAP-ADAPT, LD-GAP-PRIORITY, LD-PREPARATION-INTENT, LM-STATE-PROJECTION, LM-TEMPORAL-TRANSFER, LM-TARGET-RELATIVE-PROJECTION]
    required_information: "Previous and current target-relative state, new LearnerCapabilityClaims/CapabilityEvidenceArguments, changed gaps/priorities, evidence limitations, and separately identified new target information."
    decision_or_input: "Distinguish learner-state change from target-understanding change and choose the next continuation: keep focus, choose another focus, gather more evidence, or refine the target."
    expected_outcome: "The preparation loop continues from an inspectable current projection; no-change and increased-uncertainty outcomes remain valid."
    required_system_support: "Show material changes and their reasons, preserve history, recompute gaps/priorities from accepted semantics, and route target information separately from learner evidence."
    recovery: "Conflicting/no-change/increased-uncertainty results remain visible; the system does not rewrite history or manufacture progress."

  - id: TASK-U-REQUEST-PREPARATION-SUPPORT
    goal_ref: GOAL-OBTAIN-USABLE-PREPARATION-SUPPORT
    responsibility: USER
    description: "Request low-overhead preparation support when target, knowledge, learning/practice, or diagnostic support is missing or incomplete."
    upstream_refs: [REQ-CAP-TARGET, REQ-CAP-BOOTSTRAP, REQ-CAP-SUPPORT-FIT, LD-APPLICATION-BOUNDARY]
    required_information: "Motivating target/focus, available fragmented source material, visible missing or uncertain preparation prerequisites, and any already accepted reusable support."
    decision_or_input: "Provide/select relevant source material and request preparation while preserving the original preparation purpose; explicit self-curation is optional, not assumed."
    expected_outcome: "A preparation request exists with motivating context and sources without requiring the learner to understand Prep's internal corpus schema."
    required_system_support: "Explain missing support in learner language, accept fragmented inputs, preserve purpose/context, and delegate semantic preparation to system/agent/operator mechanisms."
    recovery: "Partial/failed preparation preserves sources and motivating context so it can be retried or supplemented without destructive reset."

  - id: TASK-S-PREPARE-SUPPORT
    goal_ref: GOAL-OBTAIN-USABLE-PREPARATION-SUPPORT
    responsibility: SYSTEM
    description: "Transform fragmented source material into reviewable candidate preparation support and route accepted meaning to the existing semantic owners without inventing a new assessment/evidence domain."
    depends_on: [TASK-U-REQUEST-PREPARATION-SUPPORT]
    upstream_refs: [REQ-CAP-BOOTSTRAP, KM-BOOTSTRAP-CORRECTION, KM-CROSS-CONTEXT-BOUNDARY, LD-LEARNING-MATERIAL, LD-SUPPORT-REQUIREMENT, LD-TASK-SPECIFICATION, LD-OBSERVATION-SPECIFICATION, LD-EVIDENCE-DESIGN-BOUNDARY, LM-NO-FUNDAMENTAL-WARRANT, LM-KNOWLEDGE-BOUNDARY]
    required_information: "Source material and provenance, motivating target/focus, accepted target/capability/knowledge/learning/observation semantics, existing reusable corpus, and unresolved extraction uncertainty."
    decision_or_input: "Derive/propose only target, capability, Subject Knowledge, LearningMaterial/TaskSpecification/ObservationSpecification or other already accepted semantics that source evidence supports; retain unsupported meaning as unresolved."
    expected_outcome: "Usable prepared/refined support is available where evidence permits, with provenance and unresolved uncertainty preserved; accepted reusable truth remains owned by its canonical model context."
    required_system_support: "Validate candidate references against semantic owners, preserve Knowledge identity/cross-context boundaries, and do not synthesize EvidencePattern/EvidentialWarrant/AssessmentDesign as fundamental semantics."
    recovery: "Rejected, conflicting, partial, or unsupported candidate meaning remains explicit and does not mutate accepted reusable truth; the learner is not forced into item-level schema repair."

plans:
  - id: PLAN-TARGET-DIRECTION
    tasks: [TASK-U-COMPARE-TARGETS, TASK-U-ESTABLISH-TARGET]
    note: "Comparison is optional: a learner with an already chosen Target may enter TASK-U-ESTABLISH-TARGET directly. Choosing a direction does not itself change learner evidence or Capability."
  - id: PLAN-TARGET-PREPARATION-LOOP
    tasks: [TASK-U-ESTABLISH-TARGET, TASK-U-UNDERSTAND-REQUIREMENTS, TASK-U-REVIEW-CURRENT-STATE, TASK-U-REVIEW-GAPS, TASK-U-CHOOSE-NEXT-FOCUS, TASK-U-SELECT-SUPPORT, TASK-U-PERFORM-ACTIVITY, TASK-S-CAPTURE-PERFORMANCE, TASK-S-EVALUATE-EVIDENCE, TASK-U-REVIEW-CHANGE]
    note: "TASK-U-EXPLORE-KNOWLEDGE may be entered whenever subject orientation is needed; TASK-U-REQUEST-PREPARATION-SUPPORT/TASK-S-PREPARE-SUPPORT may be entered whenever required preparation support is missing. This is an application work plan, not a pedagogical curriculum or durable multi-step PreparationPlan; adaptive learning progression remains governed by Learning Design semantics and downstream sequencing policy."

sufficiency_review:
  status: ACCEPTED
  notes:
    - "All seventeen accepted Product Capability requirements have task/support coverage in the derivation evidence."
    - "Every leaf task has exactly one responsibility owner and explicit information, decision/input, outcome, system support, and recovery semantics."
    - "No curator/operator application surface is assumed. System/external preparation may exist downstream, while the learner's concrete job is requesting/using preparation support."
    - "User Journeys can be derived from these tasks without choosing screens or navigation."

unresolved_questions: []
