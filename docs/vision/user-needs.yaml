version: 1
kind: user-needs
id: PREP-USER-NEEDS

context_of_use:
  users:
    - id: primary-learner
      description: Person preparing toward an external or self-defined capability/performance target.
  environment:
    - Preparation happens under incomplete and evolving target information, partial self-knowledge, fragmented sources, limited time/attention, potentially unfamiliar subject structure, and evidence whose relevance depends on performance context and time.

goals:
  - id: GOAL-TARGET
    outcome: Establish and refine a usable preparation target as expectations become clearer.
    evidence_refs: [OBS-P01, OBS-P08, OBS-P06]
  - id: GOAL-TARGET-PURPOSE
    outcome: Distinguish related target purposes and understand which required performances belong to each.
    evidence_refs: [OBS-P14, PE-TARGET-PURPOSE-OUTCOME]
  - id: GOAL-TARGET-DIRECTION
    outcome: Compare several plausible preparation targets against the same evidence-backed current capability and choose which direction is worth pursuing without treating the comparison as a change in learner state.
    evidence_refs: [OBS-P18]
  - id: GOAL-CAPABILITY-PERFORMANCE
    outcome: Understand what the target actually requires the learner to be able to do, under relevant conditions and quality expectations.
    evidence_refs: [OBS-P04, OBS-P15, PE-CAPABILITY-PERFORMANCE-OUTCOME]
  - id: GOAL-STATE
    outcome: Understand current capability, gaps, and uncertainty from evidence rather than familiarity alone.
    evidence_refs: [OBS-P02, OBS-P04, OBS-P07, OBS-P16]
  - id: GOAL-EVIDENCE-JUSTIFICATION
    outcome: Understand why available observations support, challenge, or fail to establish a conclusion about current capability.
    evidence_refs: [OBS-P02, OBS-P16, PE-EVIDENCE-JUSTIFICATION-OUTCOME]
  - id: GOAL-PRIORITY
    outcome: Decide what deserves attention next under limited time and changing conditions.
    evidence_refs: [OBS-P05, OBS-P06, OBS-P01]
  - id: GOAL-PROGRESS
    outcome: Improve toward the target using learning or practice that produces credible evidence of capability.
    evidence_refs: [OBS-P04, OBS-P07, OBS-P16, PE-DESIRED-OUTCOME]
  - id: GOAL-DURABLE-TRANSFER
    outcome: Preserve and demonstrate relevant capability when it is needed later and in the target-relevant context.
    evidence_refs: [OBS-P07, OBS-P15, PE-DESIRED-OUTCOME]
  - id: GOAL-SUPPORT-FIT
    outcome: Use learning, practice, or diagnostic support appropriate to the required outcome rather than relying on generic activity.
    evidence_refs: [OBS-P17, OBS-P15]
  - id: GOAL-ADAPT
    outcome: Adapt preparation when new evidence changes priorities or understanding of the target.
    evidence_refs: [OBS-P06, OBS-P08, OBS-P16, PE-DESIRED-OUTCOME]
  - id: GOAL-BOOTSTRAP
    outcome: Get to a usable preparation scope when starting from fragmented or incomplete sources.
    evidence_refs: [OBS-P03, OBS-P09, OBS-P13]
  - id: GOAL-KNOWLEDGE-ORIENTATION
    outcome: Form a coherent initial mental model of the relevant subject when the area is unfamiliar.
    evidence_refs: [OBS-P10, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
  - id: GOAL-RELATIONAL-UNDERSTANDING
    outcome: Understand how relevant concepts meaningfully relate rather than learning isolated descriptions only.
    evidence_refs: [OBS-P11, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
  - id: GOAL-KNOWLEDGE-SCOPE
    outcome: Keep the considered knowledge scope cognitively manageable while retaining what is relevant to the learning purpose.
    evidence_refs: [OBS-P10, OBS-P12]
  - id: GOAL-KNOWLEDGE-DEPTH
    outcome: Move between overview and deeper detail as understanding develops.
    evidence_refs: [OBS-P12, PE-KNOWLEDGE-ORIENTATION-OUTCOME]

observed_current_work:
  - People assemble role/company/interview expectations from multiple sources and revise them as new information appears.
  - Experienced developers can be strong at professional work yet still prepare separately for selection/interview-specific performance demands.
  - People commonly use activity counts or topic coverage as weak proxies until mocks or real interviews expose capability gaps or context-specific performance limits.
  - People switch priorities across coding, system design, stack knowledge, practical work, and behavioral preparation under time pressure.
  - People usually assemble external guides, notes, question sets, and company-specific material rather than maintain a reusable semantic corpus.
  - Stakeholder input reports that isolated material makes unfamiliar subject structure and concept relationships difficult to grasp; representative-user confirmation remains open.

user_needs:
  - id: NEED-TARGET
    user_ref: primary-learner
    goal_ref: GOAL-TARGET
    statement: The learner needs a coherent but refinable understanding of what the selected target expects, including uncertainty and later target refinement.
    evidence_refs: [OBS-P01, OBS-P08, OBS-P06]
  - id: NEED-TARGET-PURPOSE
    user_ref: primary-learner
    goal_ref: GOAL-TARGET-PURPOSE
    statement: The learner needs related target purposes to remain distinguishable so requirements for one purpose are not silently treated as requirements for another.
    evidence_refs: [OBS-P14, PE-TARGET-PURPOSE-OUTCOME]
  - id: NEED-TARGET-DIRECTION
    user_ref: primary-learner
    goal_ref: GOAL-TARGET-DIRECTION
    statement: The learner needs to compare multiple plausible targets using the same evidence-backed capability base, seeing shared and target-specific requirements, demonstrated/challenged/unknown coverage, gaps and uncertainty, so they can choose a direction without an invented universal fit score.
    evidence_refs: [OBS-P18]
  - id: NEED-CAPABILITY-PERFORMANCE
    user_ref: primary-learner
    goal_ref: GOAL-CAPABILITY-PERFORMANCE
    statement: The learner needs to understand the required capability in terms of what must be performed, under relevant conditions or constraints, and at what acceptable quality rather than as topic exposure alone.
    evidence_refs: [OBS-P04, OBS-P15, PE-CAPABILITY-PERFORMANCE-OUTCOME]
  - id: NEED-STATE
    user_ref: primary-learner
    goal_ref: GOAL-STATE
    statement: The learner needs an evidence-based view of what is demonstrated, challenged, or still unknown about current capability, including limits caused by performance context or stale evidence.
    evidence_refs: [OBS-P02, OBS-P04, OBS-P07, OBS-P16]
  - id: NEED-EVIDENCE-JUSTIFICATION
    user_ref: primary-learner
    goal_ref: GOAL-EVIDENCE-JUSTIFICATION
    statement: The learner needs to understand why observations are relevant to a capability conclusion, including the observed performance, conditions, provenance, target relevance, and temporal applicability.
    evidence_refs: [OBS-P02, OBS-P16, PE-EVIDENCE-JUSTIFICATION-OUTCOME]
  - id: NEED-PRIORITY
    user_ref: primary-learner
    goal_ref: GOAL-PRIORITY
    statement: The learner needs to identify the highest-value next preparation focus using target relevance, uncertainty, evidence, and available time.
    evidence_refs: [OBS-P05, OBS-P06, OBS-P01]
  - id: NEED-PROGRESS
    user_ref: primary-learner
    goal_ref: GOAL-PROGRESS
    statement: The learner needs preparation activities and feedback that generate evidence relevant to the capability and performance the target actually requires.
    evidence_refs: [OBS-P04, OBS-P07, OBS-P16, PE-DESIRED-OUTCOME]
  - id: NEED-DURABLE-TRANSFER
    user_ref: primary-learner
    goal_ref: GOAL-DURABLE-TRANSFER
    statement: The learner needs evidence that relevant capability remains available over the required time horizon and transfers to target-relevant conditions rather than being inferred from immediate or narrow success alone.
    evidence_refs: [OBS-P07, OBS-P15, OBS-P16]
  - id: NEED-SUPPORT-FIT
    user_ref: primary-learner
    goal_ref: GOAL-SUPPORT-FIT
    statement: The learner needs learning, practice, and diagnostic support whose form is appropriate to the required outcome, without treating completion or exposure as proof that the capability was developed.
    evidence_refs: [OBS-P17, OBS-P04, OBS-P15]
  - id: NEED-ADAPT
    user_ref: primary-learner
    goal_ref: GOAL-ADAPT
    statement: The learner needs new evidence to update preparation priorities and learner-state conclusions and, when warranted, new external information to refine target understanding.
    evidence_refs: [OBS-P06, OBS-P08, OBS-P16, PE-DESIRED-OUTCOME]
  - id: NEED-BOOTSTRAP
    user_ref: primary-learner
    goal_ref: GOAL-BOOTSTRAP
    statement: The learner needs a low-overhead path from fragmented source material to usable preparation support while supporting target, capability, knowledge, and evidence-design data can be added or corrected without requiring learner ownership of internal corpus maintenance.
    evidence_refs: [OBS-P03, OBS-P09, OBS-P13]
  - id: NEED-KNOWLEDGE-ORIENTATION
    user_ref: primary-learner
    goal_ref: GOAL-KNOWLEDGE-ORIENTATION
    statement: The learner needs an intelligible overview of the important concepts in the relevant subject scope and how they fit together.
    evidence_refs: [OBS-P10, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
  - id: NEED-RELATIONSHIPS
    user_ref: primary-learner
    goal_ref: GOAL-RELATIONAL-UNDERSTANDING
    statement: The learner needs the meaning of relationships among relevant concepts to remain inspectable so connected concepts can be understood in context.
    evidence_refs: [OBS-P11, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
  - id: NEED-KNOWLEDGE-SCOPE
    user_ref: primary-learner
    goal_ref: GOAL-KNOWLEDGE-SCOPE
    statement: The learner needs to narrow and expand the considered subject scope using meaningful criteria relevant to the learning purpose.
    evidence_refs: [OBS-P10, OBS-P12]
  - id: NEED-KNOWLEDGE-DEPTH
    user_ref: primary-learner
    goal_ref: GOAL-KNOWLEDGE-DEPTH
    statement: The learner needs to move between high-level orientation and deeper detail without losing the surrounding conceptual context.
    evidence_refs: [OBS-P12, PE-KNOWLEDGE-ORIENTATION-OUTCOME]

scope:
  assumptions:
    - Historical domain artifacts are donor evidence only and do not establish User Needs by themselves.
    - Target-purpose, capability-performance, evidence-justification, durability/transfer, and support-fit needs are grounded in accepted Problem Evidence v3.
    - Knowledge-orientation needs remain stakeholder-supported and require independent target-user triangulation.
    - No Capability entity, evidence-warrant model, assessment model, learning-support model, graph, 3D representation, graph database, or mandatory curator role is implied.
  research_questions:
    - How do representative users distinguish professional-role, interview/selection, certification, and other related target purposes in practice?
    - Which performance conditions and quality expectations must be explicit for users to judge readiness usefully?
    - What evidence explanation is useful enough to support trust without imposing unacceptable cognitive overhead?
    - Which retention/transfer failures materially change preparation decisions?
    - Which learning/practice forms need to differ by required outcome, and which differences are unnecessary complexity?
    - Do representative users experience the proposed structural-orientation and relationship-understanding needs in the motivating preparation context?
    - Who or what should maintain reusable supporting data without shifting internal corpus work onto the learner?

sufficiency_review:
  status: ACCEPTED
  rationale: Every accepted goal has a solution-independent user need with explicit Problem Evidence provenance; historical model details remain downstream hypotheses rather than Discovery truth.
