version: 1
kind: prep-engineering-coverage-overlay
project: PREP
subject_inventory:
  state: NOT_APPLICABLE
  rationale: The selected frontend implementation scope is already explicitly partitioned by canonical view/module/capability contracts; no independent subject inventory is required to prove per-subject engineering coverage.
decisions:
  - concern: governance.external-obligations
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: The current accepted frontend implementation scope has no independently applicable law, regulation, contract, organizational policy or external/public distribution obligation. Third-party runtime licensing is already bounded by the explicit OBLIGATION-ANALYSIS assessment and lockfile/license checks. Reopen when external distribution or a normative obligation becomes accepted scope.
    evidence: [SYSTEM-ARCHITECTURE, FRONTEND-IMPLEMENTATION-DESIGN]
  - concern: governance.privacy
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: The accepted v1 topology is single-user and local inside one trusted user/data boundary. Learner evidence persistence has data semantics but no separately accepted privacy-control, disclosure, retention, deletion or identity obligation for this implementation consumer. Reopen for remote/untrusted deployment, multiple users, sensitive-data handling rules or an explicit privacy requirement.
    evidence: [SYSTEM-ARCHITECTURE, DATA-DESIGN]
  - concern: specialized.safety
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: Prep's accepted product scope is learning and preparation support; it has no accepted safety-critical control function or requirement whose failure can materially control people, property, mission or environment. Reopen if safety-critical control or hazard obligations enter product scope.
    evidence: [PRODUCT-CAPABILITIES, SYSTEM-ARCHITECTURE]
  - concern: specialized.ai
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: Current accepted product/application/frontend contracts do not require AI, ML or agentic behavior; the prototype realization is deterministic and provider-neutral. Reopen if an accepted implementation introduces AI/ML/agentic behavior whose uncertainty or autonomy changes risk.
    evidence: [PRODUCT-CAPABILITIES, APPLICATION-DESIGN, FRONTEND-IMPLEMENTATION-DESIGN]
  - concern: specialized.regulated
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: No sector-specific regulatory regime is accepted as an engineering input for the current learning/preparation frontend scope. Reopen if product scope or deployment enters a regulated sector with mandatory controls.
    evidence: [PRODUCT-CAPABILITIES, SYSTEM-ARCHITECTURE]
  - concern: interface.human.responsiveness
    state: COVERED
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: Screen/View and Presentation contracts now define wide, compact and narrow semantic transformations, spatial priority and focus/read-order consequences while leaving exact CSS breakpoint numbers downstream.
    evidence: [PRESENTATION-SYSTEM, SCREEN-VIEW-DESIGN]
  - concern: quality.performance.latency
    state: COVERED
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: The accepted graph quality contract defines an ordinary interactive envelope and approximately 30 FPS interaction target with representative hardware-accelerated benchmark obligations.
    evidence: [FRONTEND-PERFORMANCE-CAPACITY]
  - concern: quality.performance.resource-efficiency
    state: COVERED
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: The graph quality contract requires demand-driven idle rendering and permits semantic-preserving reduction of labels, effects, pixel ratio, geometry detail and live physics under load.
    evidence: [FRONTEND-PERFORMANCE-CAPACITY]
  - concern: quality.performance.capacity
    state: COVERED
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: Visible-graph validation envelopes are approximately 2k nodes/10k edges ordinary and 5k nodes/25k edges stress, with larger corpora requiring bounded exploration instead of unbounded live rendering.
    evidence: [FRONTEND-PERFORMANCE-CAPACITY]
  - concern: quality.performance.throughput
    state: NOT_APPLICABLE
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: The current frontend graph quality contract has no independent throughput objective. Its material behavior is interactive latency/frame behavior, renderer resource efficiency and visible-graph capacity; inventing a nodes-per-second target would not represent a user or architecture requirement.
    evidence: [FRONTEND-PERFORMANCE-CAPACITY]
  - concern: interface.human.i18n
    state: DEFERRED
    consumers: [FRONTEND-IMPLEMENTATION]
    scopes: [frontend]
    rationale: No multi-locale or localization requirement is accepted for the current single-user v1. Internationalization remains future scope and must be reopened if product requirements introduce locale/language obligations.
    evidence: [PRODUCT-VISION, PRESENTATION-SYSTEM]
