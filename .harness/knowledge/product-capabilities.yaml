version: 1
kind: harness-knowledge-artifact
artifact: PRODUCT-CAPABILITIES
schema: product-requirements/v1
title: Prep Product Capabilities

content:
  purpose: >-
    Define the minimum observable product behaviors required to realize
    the accepted Prep product intent.

  requirements:
    - id: REQ-CAP-INTRODUCE-INFORMATION
      statement: >-
        The product shall allow information and relationships to be introduced
        for use in Prep.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-LIFECYCLE]

    - id: REQ-CAP-RETAIN-INFORMATION
      statement: >-
        The product shall retain information and relationships so they remain
        available until changed or removed.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-LIFECYCLE]

    - id: REQ-CAP-CHANGE-INFORMATION
      statement: >-
        The product shall allow information and relationships available in Prep
        to be changed.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-LIFECYCLE]

    - id: REQ-CAP-REMOVE-INFORMATION
      statement: >-
        The product shall allow information and relationships to be removed
        from Prep.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-LIFECYCLE]

    - id: REQ-CAP-KNOWLEDGE-KINDS
      statement: >-
        The product shall support distinguishable kinds of knowledge.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-EXPLORATION]

    - id: REQ-CAP-RELATIONSHIP-MEANINGS
      statement: >-
        The product shall preserve distinguishable meanings of relationships.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-EXPLORATION]

    - id: REQ-CAP-CROSS-INFORMATION-RELATIONSHIPS
      statement: >-
        The product shall allow relationships to connect different kinds of
        information.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-EXPLORATION]

    - id: REQ-CAP-EXPLORE-PERSPECTIVES
      statement: >-
        The product shall let the user examine available information and
        relationships from different perspectives.
      status: ACCEPTED
      source_refs: [REQ-INFORMATION-EXPLORATION]

    - id: REQ-CAP-SELECT-PART
      statement: >-
        The product shall let the user select part of the available information
        and material for external use.
      status: ACCEPTED
      source_refs: [REQ-EXTERNAL-USE]

    - id: REQ-CAP-TRANSFER-SELECTION
      statement: >-
        The product shall make the selected information and material available
        outside Prep in a form usable for preparation activity.
      status: ACCEPTED
      source_refs: [REQ-EXTERNAL-USE]

    - id: REQ-CAP-RECORD-ACTIVITY
      statement: >-
        The product shall accept recorded activity, including a recorded result
        when one exists.
      status: ACCEPTED
      source_refs: [REQ-RECORDED-HISTORY]

    - id: REQ-CAP-RELATE-ACTIVITY
      statement: >-
        The product shall keep recorded activity and results associated with
        the information they concern.
      status: ACCEPTED
      source_refs: [REQ-RECORDED-HISTORY]

    - id: REQ-CAP-PRESERVE-TIME
      statement: >-
        The product shall retain enough temporal context for recorded activity
        and results to distinguish when they took place.
      status: ACCEPTED
      source_refs: [REQ-RECORDED-HISTORY]

    - id: REQ-CAP-PRESERVE-HISTORY-CONTEXT
      statement: >-
        The product shall preserve enough context for recorded activity and
        results to remain understandable in relation to the information they
        concerned when that information is later changed or removed.
      status: ACCEPTED
      source_refs: [REQ-RECORDED-HISTORY, REQ-INFORMATION-LIFECYCLE]

    - id: REQ-CAP-EXPLORE-HISTORY
      statement: >-
        The product shall let the user examine recorded activity and results
        over time and in relation to the information they concern.
      status: ACCEPTED
      source_refs: [REQ-RECORDED-HISTORY, REQ-INFORMATION-EXPLORATION]

  non_goals:
    - Infer or maintain learner state.
    - Estimate mastery, readiness, or competence.
    - Define a fixed taxonomy of knowledge kinds or relationship meanings.
    - Define a required relationship topology.
    - Require a particular visualization, import or export format, API, integration, persistence model, or implementation technology.
    - Require particular statistics or derived assessments from recorded facts.
