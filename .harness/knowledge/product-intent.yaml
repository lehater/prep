version: 1
kind: harness-knowledge-artifact
artifact: PRODUCT-VISION
schema: product-requirements/v1
title: Prep Product Intent

content:
  purpose: >-
    Define the minimum product commitments that let a person work with
    preparation-related information, use selected parts outside Prep, and
    understand recorded activity and results in relation to that information.

  requirements:
    - id: REQ-INFORMATION-EXPLORATION
      statement: >-
        The product shall enable the user to understand and explore knowledge,
        goals, capabilities, practice material, recorded activity, and the
        relationships among them from different perspectives.
      status: ACCEPTED
      source_refs: [UN-01]

    - id: REQ-EXTERNAL-USE
      statement: >-
        The product shall enable the user to select part of the available
        information and material and make it available for use outside Prep
        in preparation activity.
      status: ACCEPTED
      source_refs: [UN-02]

    - id: REQ-RECORDED-HISTORY
      statement: >-
        The product shall enable recorded activity and results to be brought
        into Prep and understood over time and in relation to the information
        they concern.
      status: ACCEPTED
      source_refs: [UN-03]

    - id: REQ-INFORMATION-LIFECYCLE
      statement: >-
        The product shall support the lifecycle of the information and
        relationships needed for these product behaviors so they can be
        introduced, retained, changed, and removed.
      status: ACCEPTED
      source_refs: [CTX-01, UN-01, UN-03]

  non_goals:
    - Assess what the user knows or can do.
    - Estimate mastery, readiness, or competence.
    - Verify the truth, quality, authorship, reliability, or authority of information.
    - Require source management, provenance, citations, source versioning, or traceability.
    - Define a fixed taxonomy of knowledge kinds or relationship meanings.
    - Define a required relationship topology or representation technique.
    - Define a particular import, export, integration, interface, persistence, or implementation mechanism.
