version: 1
kind: harness-project-authority-assessments
assessments:
  - authority_id: DISCOVERY
    applicability: REQUIRED
    evidence: [core:authority:DISCOVERY]
    rationale: Accepted current problem-space evidence is canonical project knowledge.
    depends_on_evidence: [docs/vision/problem-space.md]
    reopening_conditions: [accepted problem-space evidence changes]

  - authority_id: PRODUCT-REQUIREMENTS
    applicability: REQUIRED
    evidence: [core:authority:PRODUCT-REQUIREMENTS]
    rationale: Accepted current product vision and product capabilities are canonical project knowledge.
    depends_on_evidence: [docs/vision/vision.md, docs/vision/product-capabilities.md]
    reopening_conditions: [accepted product intent or capabilities change]

  - authority_id: DOMAIN-STRATEGY
    applicability: REQUIRED
    evidence: [docs/architecture/context-map.md]
    rationale: The accepted context map contains material strategic decomposition of Prep domain responsibilities.
    depends_on_evidence: [docs/vision/product-capabilities.md, docs/architecture/context-map.md]
    reopening_conditions: [product capability scope or strategic domain decomposition changes]

  - authority_id: MODEL-CONTEXT-STRATEGY
    applicability: REQUIRED
    evidence: [docs/architecture/model-context-map.md]
    rationale: Knowledge Model, Learning Design and Learner Model have independently modeled languages and explicit semantic information-flow boundaries.
    depends_on_evidence: [docs/architecture/context-map.md, docs/architecture/model-context-map.md]
    reopening_conditions: [model-context boundaries or translation relationships cease to be independently material]

  - authority_id: DOMAIN-USE-CASE-DESIGN
    applicability: NOT_APPLICABLE
    evidence: [docs/vision/product-capabilities.md, docs/architecture/model-context-map.md, docs/application/application-design.md]
    rationale: Current observable behavior does not require an independently versioned domain-use-case contract between Product Requirements and Tactical Domain Design; product capabilities, model semantics and application orchestration provide the accepted boundaries without a missing intermediate owner.
    depends_on_evidence: [docs/vision/product-capabilities.md, docs/architecture/model-context-map.md, docs/application/application-design.md]
    reopening_conditions: [a domain-focused behavioral contract must remain stable while tactical modeling or application orchestration changes independently]

  - authority_id: TACTICAL-DOMAIN-DESIGN
    applicability: REQUIRED
    evidence: [docs/domain/relation-classification-catalog.yaml, docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md]
    rationale: Accepted project knowledge contains material domain concepts, ownership boundaries and invariants requiring tactical semantic ownership.
    depends_on_evidence: [docs/architecture/model-context-map.md, docs/domain/relation-classification-catalog.yaml, docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md]
    reopening_conditions: [accepted context boundaries or tactical domain semantics change]

  - authority_id: APPLICATION-DESIGN
    applicability: REQUIRED
    evidence: [docs/application/application-design.md, docs/application/user-journeys.md]
    rationale: Current canonical knowledge defines application orchestration, Study Set materialization and task-oriented user journeys.
    depends_on_evidence: [docs/vision/product-capabilities.md, docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md]
    reopening_conditions: [application orchestration or accepted journeys change materially]

  - authority_id: SYSTEM-ARCHITECTURE
    applicability: REQUIRED
    evidence: [docs/architecture/system-architecture.md, docs/architecture/frontend-system-architecture.md]
    rationale: Current canonical knowledge contains material runtime boundaries, deployment topology and frontend module/dependency/state-ownership decisions.
    depends_on_evidence: [docs/application/application-design.md, docs/interface/interface-topology.yaml, docs/interface/presentation-system.md, docs/interface/screen-view-design.md, docs/interface/machine-interface.md, docs/architecture/import-consistency.md]
    reopening_conditions: [runtime boundaries, frontend module/dependency topology, deployment constraints or technical topology change materially]

  - authority_id: CONCURRENCY-CONSISTENCY-DESIGN
    applicability: REQUIRED
    evidence: [docs/architecture/import-consistency.md]
    rationale: Bulk import and external-runtime interaction require explicit atomicity, partial-result and retry/consistency semantics.
    depends_on_evidence: [docs/application/application-design.md, docs/interface/machine-interface.md]
    reopening_conditions: [import atomicity, concurrency, retry or external synchronization semantics change]

  - authority_id: SECURITY-ARCHITECTURE
    applicability: NOT_APPLICABLE
    evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md]
    rationale: The current single-user local trust boundary has no independently owned identity, session, authorization or security-enforcement architecture; its accepted trust and external-runtime constraints remain part of System Architecture and Machine Interface Design.
    depends_on_evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md]
    reopening_conditions: [multi-user identity or authorization is accepted, deployment exposes a materially new trust boundary, credentials/session protection gain independent lifecycle, or security enforcement needs separate consumers]

  - authority_id: MACHINE-INTERFACE-DESIGN
    applicability: REQUIRED
    evidence: [docs/interface/machine-interface.md]
    rationale: Prep exposes independently owned browser/backend and external-study-runtime machine interaction contracts.
    depends_on_evidence: [docs/application/application-design.md, docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md]
    reopening_conditions: [supported machine interactions or external runtime contracts change materially]

  - authority_id: HUMAN-INTERFACE-DESIGN
    applicability: REQUIRED
    evidence: [docs/interface/conceptual-interface-model.yaml, docs/interface/information-architecture.yaml, docs/interface/interaction-design.yaml, docs/interface/interface-topology.yaml, docs/interface/presentation-system.md, docs/interface/screen-view-design.md]
    rationale: Prep requires independently owned human interaction, information architecture and presentation/view composition. Presentation and screen/view contracts remain subject to the current revalidation.
    depends_on_evidence: [docs/application/user-journeys.md, docs/application/application-design.md, docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md]
    reopening_conditions: [accepted journeys, interaction model, information architecture or presentation/view contracts change materially]

  - authority_id: DATA-DESIGN
    applicability: REQUIRED
    evidence: [docs/architecture/data-design.md]
    rationale: Current canonical knowledge contains independent durable-storage representation and persistence constraints.
    depends_on_evidence: [docs/domain/knowledge-model.md, docs/domain/learning-design.md, docs/domain/learner-model.md, docs/architecture/import-consistency.md, docs/architecture/system-architecture.md]
    reopening_conditions: [persistence ownership, schema constraints or durable representation change materially]

  - authority_id: QUALITY-DESIGN
    applicability: REQUIRED
    evidence: [docs/architecture/performance-capacity.md]
    rationale: The interactive Knowledge graph has architecture-significant measurable scale, frame-rate, idle-resource and graceful-degradation constraints that are independently consumed by interface, architecture, component and verification work.
    depends_on_evidence: [docs/vision/product-capabilities.md, docs/domain/knowledge-model.md, docs/architecture/performance-capacity.md]
    reopening_conditions: [visible graph scale, responsiveness targets, degradation semantics or renderer workload assumptions change materially]

  - authority_id: SECURITY-ANALYSIS
    applicability: NOT_APPLICABLE
    evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md, docs/architecture/data-design.md]
    rationale: The accepted v1 scope is a single-user local deployment inside one trusted user/data boundary. Canonical design already keeps credentials/deployment secrets out of browser product state, keeps Anki behind the backend adapter boundary, and explicitly treats broader network exposure, multi-user identity/authorization and stronger trust boundaries as reopening conditions. No independent threat/control coverage contract is required for the current implementation consumer.
    depends_on_evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md, docs/architecture/data-design.md]
    reopening_conditions: [remote or untrusted deployment becomes accepted scope, multiple users or authorization are introduced, credential/session lifecycle becomes product-owned, sensitive-data protection or disclosure rules become material, or a security review/control framework becomes a required release input]

  - authority_id: OBLIGATION-ANALYSIS
    applicability: NOT_APPLICABLE
    evidence: [docs/architecture/system-architecture.md, docs/implementation/frontend-implementation-design.md, web/package-lock.json, web/Dockerfile]
    rationale: No law, regulation, contract, organizational policy or platform mandate is currently accepted as an engineering input. The frontend lockfile contains third-party license metadata, but all non-dev npm packages are currently MIT, ISC or BSD-3-Clause while MPL-2.0 packages are build-only; the Docker build copies only static dist output into the nginx runtime. External/public distribution and its required notice/license bundle are not an accepted current product/release obligation, so no independent obligation-coverage contract is required for the current consumer.
    depends_on_evidence: [docs/architecture/system-architecture.md, docs/implementation/frontend-implementation-design.md, web/package-lock.json, web/Dockerfile]
    reopening_conditions: [Prep or its Docker artifacts are distributed externally, a third-party license introduces material copyleft/notice/source obligations into shipped artifacts, a legal/regulatory/privacy/contractual requirement becomes applicable, or an organization/platform policy must be traced into engineering decisions]

  - authority_id: CHANGE-TRANSITION-DESIGN
    applicability: NOT_APPLICABLE
    evidence: [docs/implementation/frontend-implementation-design.md]
    rationale: Current frontend release/rollback is whole-artifact replacement with no accepted data migration, coexistence window, irreversible intermediate state or independent transition semantics.
    depends_on_evidence: [docs/implementation/frontend-implementation-design.md]
    reopening_conditions: [a release requires mixed-version coexistence, data/schema migration, staged irreversible rollout, compatibility window or transition-specific recovery]

  - authority_id: OPERABILITY-DESIGN
    applicability: NOT_APPLICABLE
    evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md, docs/verification/frontend-verification.md]
    rationale: Current runtime reachability/error visibility is fully owned by Machine Interface, System Architecture and Verification; no independently valuable diagnosability/telemetry contract is required for the selected frontend scope.
    depends_on_evidence: [docs/architecture/system-architecture.md, docs/interface/machine-interface.md, docs/verification/frontend-verification.md]
    reopening_conditions: [runtime diagnosis, correlation, health or operational evidence becomes a separately consumed pre-code contract]

  - authority_id: ENGINEERING-POLICY
    applicability: REQUIRED
    evidence: [docs/engineering/frontend-engineering-policy.md]
    rationale: Frontend realization must apply consistent cross-cutting rules for provider isolation, dependency direction, reuse, composition, state ownership and representation boundaries across multiple feature/implementation slices.
    depends_on_evidence: [docs/architecture/frontend-system-architecture.md, docs/interface/presentation-system.md, docs/engineering/frontend-engineering-policy.md]
    reopening_conditions: [frontend architecture, provider strategy or project-wide engineering discipline changes materially]

  - authority_id: COMPONENT-DESIGN
    applicability: REQUIRED
    evidence: [docs/implementation/frontend-component-design.md]
    rationale: The selected frontend prototype and production consumers require explicit code-facing module/component, renderer, mapping, adapter and dependency boundaries so implementation does not promote experimental structure into architecture by accident.
    depends_on_evidence: [docs/interface/screen-view-design.md, docs/interface/machine-interface.md, docs/architecture/frontend-system-architecture.md, docs/implementation/frontend-component-design.md]
    reopening_conditions: [frontend architecture, screen/view responsibilities or machine-interface contracts change materially]

  - authority_id: TEST-DESIGN
    applicability: REQUIRED
    evidence: [docs/verification/frontend-verification.md, docs/verification/frontend-test-design.yaml]
    rationale: The production frontend consumer requires executable observable contracts refining accepted frontend Verification Design before concrete production test code is treated as evidence.
    depends_on_evidence: [docs/verification/frontend-verification.md, docs/interface/interaction-design.yaml, docs/interface/screen-view-design.md]
    reopening_conditions: [frontend verification obligations or production frontend scope change materially]

  - authority_id: IMPLEMENTATION-DESIGN
    applicability: REQUIRED
    evidence: [docs/implementation/frontend-implementation-design.md]
    rationale: The production frontend consumer requires bounded implementation slices, concrete repository realization, tool/provider placement, legacy-code reuse dispositions and reproducible completion/release criteria derived from accepted frontend design.
    depends_on_evidence: [docs/implementation/frontend-component-design.md, docs/verification/frontend-verification.md, docs/verification/frontend-test-design.yaml, docs/engineering/frontend-engineering-policy.md]
    reopening_conditions: [selected production frontend scope or accepted implementation-facing boundaries change materially]

  - authority_id: VERIFICATION-DESIGN
    applicability: REQUIRED
    evidence: [docs/verification/interface-verification.md, docs/verification/presentation-verification.md, docs/verification/frontend-verification.md]
    rationale: Current canonical frontend knowledge has independent interface, presentation and production architecture/machine-contract verification obligations before test design.
    depends_on_evidence: [docs/vision/product-capabilities.md, docs/interface/machine-interface.md, docs/interface/interface-topology.yaml, docs/interface/presentation-system.md, docs/interface/screen-view-design.md, docs/architecture/frontend-system-architecture.md]
    reopening_conditions: [accepted frontend interaction, topology, presentation, screen/view or architecture knowledge changes materially]

