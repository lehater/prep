version: 1
kind: prep-strict-semantic-baseline
baseline_id: prep-strict-semantic-baseline-v1
purpose: >-
  Record explicit capability-level semantic revalidation decisions for the
  current accepted Prep Core. The revision number is human-controlled semantic
  acceptance identity, not a file timestamp or content hash. Bump only the
  affected capability when its accepted semantics are revalidated or replaced.

reviews:
  - capability: prep.problem-evidence
    revision: 24
    basis: "Evidence-language cleanup aligns the entire Discovery artifact with the four-class taxonomy: concrete public developer behavior is NATURALISTIC-PUBLIC-USER evidence rather than generic secondary evidence, Gate A behavioral UMC statuses may change from it, while elicited representative status remains separately UNTESTED for Prep-specific comprehension/usability."

  - capability: prep.product-intent
    revision: 5
    basis: "Product intent now distinguishes professional-role capability from selection/interview performance as related target purposes, preventing interview-specific mechanics from being presented as intrinsic role requirements while preserving target-relative learning/evidence semantics."

  - capability: prep.product-capabilities
    revision: 5
    basis: "Target capability now supports purpose-explicit related/refinable targets, especially role capability versus selection/interview performance; curation actor scope is explicit, prioritization accepts timing/cost constraints and progress separates learner-state change from target refinement."

  - capability: prep.domain-strategy
    revision: 3
    basis: "Revalidated against the expanded user-centered product loop: existing Knowledge, Learning Design and Learner Model strategic responsibilities remain sufficient and no new strategic domain boundary is required."

  - capability: prep.model-context-strategy
    revision: 3
    basis: "Revalidated against target/gap/corpus capabilities: existing model-context applicability and information-flow boundaries remain sufficient without adding a UI- or import-specific semantic context."

  - capability: prep.knowledge-relation-classification
    revision: 4
    basis: "Revalidated for target/focus-scoped exploration and bulk corpus preparation; predicate vocabulary remains reusable subject semantics and does not acquire target, gap or learner-state meaning."

  - capability: prep.knowledge-model
    revision: 5
    basis: "Revalidated for the user-centered flow: reusable KnowledgeObject/KnowledgeProposition semantics remain independent from target requirements, learner gaps, priorities and presentation projections."

  - capability: prep.frontend-performance-capacity
    revision: 3
    basis: "Revalidated for the expanded target-work and curation surfaces; existing bounded spatial-workload and semantic-preserving degradation constraints remain sufficient."

  - capability: prep.learning-design
    revision: 5
    basis: "LearningTarget now carries explicit target_purpose and optional related_targets so role-capability and selection/interview targets can coexist without requirement inheritance, satisfaction transfer or semantic conflation."

  - capability: prep.learner-model
    revision: 4
    basis: "Revalidated for current-state, diagnostics and progress views: evidence-backed claims and supporting/challenging arguments remain the only accepted basis for learner-state conclusions; missing evidence remains uncertainty."

  - capability: prep.application-design
    revision: 9
    basis: "Learner-facing missing-preparation recovery is now separated from Curation mechanics: learners request/accept prepared support or explicitly self-curate, while bulk/incremental/import decisions remain curator/operator responsibilities by default."

  - capability: prep.task-model
    revision: 13
    basis: "UMC-05 traceability now matches the naturalistic scope change: TASK-L-OBTAIN-PREPARATION-SUPPORT models the learner job, while GOAL-BOOTSTRAP-AND-CURATE-CORPUS is explicitly curator/operator context and schema/import/repair work is opt-in for self-curating learners."

  - capability: prep.user-journeys
    revision: 10
    basis: "Empty-system recovery now follows the learner task TASK-L-OBTAIN-PREPARATION-SUPPORT and keeps corpus/import repair inside curator/operator Curation unless self-curation is explicitly selected, eliminating the remaining learner-corpus-ownership contradiction."

  - capability: prep.conceptual-interface-model
    revision: 5
    basis: "Conceptual interface now exposes target purpose, related-target context without requirement inheritance, learner-facing PREPARATION-NEED and a progress distinction between learner-state change and target refinement."

  - capability: prep.information-architecture
    revision: 8
    basis: "Revalidated Capability→Knowledge placement: Target owns forward inspection of direct Knowledge focus, Knowledge remains independently findable, and inverse Knowledge→Capability browsing is not required by the current Task Model."

  - capability: prep.machine-interfaces
    revision: 6
    basis: "Machine contract now exposes direct Knowledge focus in target requirements, complete pre-focus decision context through gaps.get, and inspectable CapabilitySpecification/condition support-fit basis without adding a circular support query."

  - capability: prep.interaction-design
    revision: 9
    basis: "Interaction now makes required Knowledge focus inspectable from Target requirements, exposes explicit pre-focus decision context and support-fit inspection, while keeping inverse Knowledge→Capability browsing out of scope."

  - capability: prep.interface-topology
    revision: 9
    basis: "Preparation-path selection now has a dedicated non-structural C-01-PREPARATION-PATH view under the structural Curation frame, satisfying task/view closure without putting task interaction semantics on a structural container."

  - capability: prep.presentation-system
    revision: 12
    basis: "Presentation rules now preserve direct Capability→Knowledge focus in Target requirement inspection, focus-decision context in state/basis presentation and support-fit basis before activity selection."

  - capability: prep.screen-view-design
    revision: 12
    basis: "Screen contracts now materialize direct Knowledge focus in Target, pre-focus rationale/constraints/support availability in Current, support-fit basis in Activity and learner-evidence versus target-information change in Evidence."

  - capability: prep.import-consistency
    revision: 3
    basis: "Revalidated for the explicit contract/validate/apply import workflow and modern corpus data kinds; item-level atomicity, partial peer success, identity and conflict semantics remain unchanged."

  - capability: prep.interface-verification
    revision: 7
    basis: "Interface Verification now checks learner-vs-curator bootstrap separation, target-purpose/non-inheritance integrity and separation of target refinement from learner progress in addition to shared interaction contracts."

  - capability: prep.presentation-verification
    revision: 8
    basis: "Presentation Verification now tests learner-facing empty bootstrap separately from curator import recovery, requires role-vs-interview target-purpose comprehension, and keeps target refinement distinct from learner progress before production authority."

  - capability: prep.system-architecture
    revision: 3
    basis: "Revalidated after the frontend/application contract expansion: the separate browser/frontend/backend runtime topology and canonical-state ownership remain sufficient; new frontend flow does not require a backend topology change."

  - capability: prep.data-design
    revision: 3
    basis: "Data Design was re-reviewed in the full Harness pass; durable identity, references, append-oriented review facts, import identity/atomicity, external mapping, implementation freedoms and reopening conditions remain complete for the current scope."

  - capability: prep.frontend-system-architecture
    revision: 6
    basis: "Frontend System Architecture is revalidated as the production contract for browser-side structural decomposition and dependency/ownership boundaries; the Harness registry now publishes the architecture.structure and architecture.boundaries claims already defined by the canonical artifact."

  - capability: prep.frontend-engineering-policy
    revision: 6
    basis: "Engineering policy now makes the CI split explicit and bounded: fast checks are independently runnable with time limits, while heavy browser/performance/container/full-Harness evidence is manual-only at final large-branch checkpoints."

  - capability: prep.frontend-component-design
    revision: 7
    basis: "Component Design now distinguishes diagnostic activity from evidence acceptance, preserves Observation/provenance separately from evidence arguments and claim projections, and carries explicit supports/challenges evidential bearing without treating challenges as negative claims."

  - capability: prep.frontend-verification
    revision: 8
    basis: "Frontend Verification now covers purpose-explicit related targets, learner preparation-support boundary, curator-owned corpus paths, target-refinement/progress separation and target requirement isolation."

  - capability: prep.frontend-test-design
    revision: 10
    basis: "Frontend tests now split learner empty-bootstrap from curator import recovery, exercise multi-driver focus, verify role/interview target isolation and ensure target refinement cannot masquerade as learner progress."

  - capability: prep.frontend-implementation-design
    revision: 10
    basis: "Implementation Design now separates prototype completion/READY FOR USABILITY VALIDATION from the production implementation gate, which requires representative-user, accessibility, content and 3D-default validation evidence."
