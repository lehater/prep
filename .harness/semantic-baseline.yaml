version: 1
kind: prep-strict-semantic-baseline
baseline_id: prep-strict-semantic-baseline-v1
purpose: >-
  Record explicit capability-level semantic revalidation decisions for the
  current accepted Prep Core. The revision number is human-controlled semantic
  acceptance identity, not a file timestamp or content hash. Bump only the
  affected capability when its accepted semantics are revalidated or replaced.

reviews:
  - capability: prep.problem-evidence
    revision: 1
    basis: Problem observations, desired outcomes and evidence were revalidated as problem truth without importing product or solution choices.

  - capability: prep.product-intent
    revision: 1
    basis: Product intent was revalidated at observable scope/outcome level without promoting downstream domain, interface or architecture decisions.

  - capability: prep.product-capabilities
    revision: 1
    basis: Product capabilities remain externally meaningful product behavior and do not prescribe technical realization.

  - capability: prep.domain-strategy
    revision: 1
    basis: Strategic domain responsibilities remain investment/responsibility boundaries rather than tactical model or context-internal design.

  - capability: prep.model-context-strategy
    revision: 1
    basis: Model-context applicability and relationships remain separate from strategic investment classification and tactical semantics.

  - capability: prep.knowledge-model
    revision: 1
    basis: Knowledge identity, kinds and relations remain canonical domain semantics independent of persistence, renderer and user-interface realization.

  - capability: prep.learning-design
    revision: 1
    basis: LearningTarget, Requirement and Question semantics remain target-relative learning-design truth without importing learner-state inference or UI mechanics.

  - capability: prep.learner-model
    revision: 1
    basis: Learner evidence remains factual Question-level ReviewObservation/statistics semantics and does not invent mastery, readiness or retention inference.

  - capability: prep.application-design
    revision: 1
    basis: Application knowledge coordinates accepted product/domain behavior and failure outcomes without re-owning domain semantics or selecting transports.

  - capability: prep.task-model
    revision: 1
    basis: The task model expresses user goals/tasks and dependencies rather than screens, routes or component structure.

  - capability: prep.user-journeys
    revision: 1
    basis: Journeys express task progression and context transitions without turning current screen decomposition into product semantics.

  - capability: prep.conceptual-interface-model
    revision: 1
    basis: User-facing concepts were revalidated against tasks and domain/application sources without becoming a duplicate domain model.

  - capability: prep.information-architecture
    revision: 1
    basis: Information organization and findability were revalidated independently of concrete screen layout or UI provider.

  - capability: prep.machine-interfaces
    revision: 2
    basis: Browser collection contracts now explicitly expose exact total_count for the current scope/query while opaque cursors remain transport mechanics; all other browser/backend and external-runtime semantics were revalidated unchanged.

  - capability: prep.interaction-design
    revision: 2
    basis: Revalidated against Machine Interface revision 2; accepted browse/search interactions remain unchanged and the previously required material counts now have an explicit machine-contract source.

  - capability: prep.interface-topology
    revision: 2
    basis: Revalidated after interaction revision 2; exact collection count availability changes no material view/frame or navigation topology.

  - capability: prep.presentation-system
    revision: 2
    basis: Revalidated against current interaction/topology prerequisites; collection count availability introduces no new presentation role or accessibility semantics.

  - capability: prep.screen-view-design
    revision: 2
    basis: Revalidated against Machine Interface revision 2; existing Overview Knowledge/Question count responsibilities are now explicitly supported without changing view ownership or learner behavior.

  - capability: prep.import-consistency
    revision: 2
    basis: Revalidated against Machine Interface revision 2; collection total_count does not alter import/external-operation atomicity, partial-result, retry or idempotency semantics.

  - capability: prep.interface-verification
    revision: 2
    basis: Revalidated against the current interaction/topology prerequisite baseline; existing task and navigation evidence obligations remain sufficient.

  - capability: prep.presentation-verification
    revision: 2
    basis: Revalidated against current interface/presentation/screen prerequisites; existing presentation evidence obligations remain sufficient.

  - capability: prep.system-architecture
    revision: 2
    basis: Revalidated against Machine Interface revision 2; collection count metadata does not change runtime, trust, deployment or external-integration topology.

  - capability: prep.data-design
    revision: 2
    basis: Revalidated after Machine Interface revision 2 through current consistency/system-architecture prerequisites; exact query result counts add no new durable representation or storage semantics.

  - capability: prep.frontend-system-architecture
    revision: 2
    basis: Revalidated against Machine Interface revision 2; exact accepted collection metadata may cross the data-access boundary while cursor/status/serialization details remain adapter-private, with module and state ownership unchanged.

  - capability: prep.frontend-engineering-policy
    revision: 2
    basis: Revalidated against frontend architecture revision 2; collection metadata refinement preserves the existing DTO-boundary, ownership and replaceability policy.

  - capability: prep.frontend-component-design
    revision: 2
    basis: Frontend query ports were revalidated and refined so accepted collection results preserve exact total_count while cursor representation remains adapter-private; component, provider and ownership boundaries remain unchanged.

  - capability: prep.frontend-verification
    revision: 2
    basis: Frontend verification was revalidated against Machine Interface revision 2 and now explicitly proves preservation of accepted collection metadata while transport cursor representation remains isolated.

  - capability: prep.frontend-test-design
    revision: 2
    basis: Frontend Test Design was revalidated and DTO mapping coverage now distinguishes accepted exact total_count from opaque cursor/status/serialization representation.

  - capability: prep.frontend-implementation-design
    revision: 2
    basis: Frontend Implementation Design was revalidated against current component/verification/test contracts; FI-06 now explicitly preserves exact total_count while keeping cursor mechanics adapter/query-cache private.
