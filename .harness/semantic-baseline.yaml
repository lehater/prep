version: 1
kind: prep-strict-semantic-baseline
baseline_id: prep-strict-semantic-baseline-v1
purpose: >-
  Record explicit capability-level semantic revalidation decisions for the
  current accepted Prep Core. The revision number is human-controlled semantic
  acceptance identity, not a file timestamp or content hash. Bump only the
  affected capability when its accepted semantics are revalidated or replaced.

reviews:
  - capability: prep.problem-evidence
    revision: 2
    basis: Problem observations now carry an explicit durable stakeholder-evidence inventory and provenance class; the revalidation confirms they remain problem truth without importing product or solution choices.

  - capability: prep.product-intent
    revision: 1
    basis: Product intent was revalidated at observable scope/outcome level without promoting downstream domain, interface or architecture decisions.

  - capability: prep.product-capabilities
    revision: 2
    basis: Product capabilities were revalidated into stable PC trace anchors with observable acceptance semantics and explicit current-slice/deferred dispositions; learning material is preparation/availability in the current slice, not automatic derivation.

  - capability: prep.domain-strategy
    revision: 1
    basis: Strategic domain responsibilities remain investment/responsibility boundaries rather than tactical model or context-internal design.

  - capability: prep.model-context-strategy
    revision: 1
    basis: Model-context applicability and relationships remain separate from strategic investment classification and tactical semantics.

  - capability: prep.knowledge-relation-classification
    revision: 2
    basis: "The machine-readable classifier now distinguishes preferred canonical leaves, candidate proposal vocabulary and legacy-only runtime compatibility; matched can persist only a preferred leaf, candidate vocabulary routes through candidate_needed, and unsupported assertions create no edge."

  - capability: prep.knowledge-model
    revision: 3
    basis: Knowledge identity, forms and relationship semantics were revalidated against the canonical classifier; the model now separates stored/runtime compatibility relation types from the preferred leaves admissible for new classification.

  - capability: prep.frontend-performance-capacity
    revision: 1
    basis: Measurable visible-graph scale, approximately-30-FPS ordinary interaction, demand-driven idle behavior and semantic-preserving degradation are accepted as Quality Design derived from existing project/experimental evidence rather than invented renderer semantics.

  - capability: prep.learning-design
    revision: 1
    basis: LearningTarget, Requirement and Question semantics remain target-relative learning-design truth without importing learner-state inference or UI mechanics.

  - capability: prep.learner-model
    revision: 1
    basis: Learner evidence remains factual Question-level ReviewObservation/statistics semantics and does not invent mastery, readiness or retention inference.

  - capability: prep.application-design
    revision: 1
    basis: Application knowledge coordinates accepted product/domain behavior and failure outcomes without re-owning domain semantics or selecting transports.

  - capability: prep.task-model
    revision: 3
    basis: The task model was revalidated against Product Capability revision 2 and the pinned task-model skill; every current USER task now also traces to stable PC capability anchors while preserving information, decision, system-support, outcome and recovery semantics.

  - capability: prep.user-journeys
    revision: 2
    basis: User Journeys were revalidated against the pinned journey skill and current Task Model; every current USER task now has an explicit journey with actor/context, trigger, preconditions, completion and material alternate/recovery behavior without choosing screens.

  - capability: prep.conceptual-interface-model
    revision: 1
    basis: User-facing concepts were revalidated against tasks and domain/application sources without becoming a duplicate domain model.

  - capability: prep.information-architecture
    revision: 1
    basis: Information organization and findability were revalidated independently of concrete screen layout or UI provider.

  - capability: prep.machine-interfaces
    revision: 2
    basis: Browser collection contracts now explicitly expose exact total_count for the current scope/query while opaque cursors remain transport mechanics; all other browser/backend and external-runtime semantics were revalidated unchanged.

  - capability: prep.interaction-design
    revision: 3
    basis: Interaction Design was revalidated against the pinned interaction-design skill; contexts now bind accepted actions/inputs to visible responses, material states, recovery and machine-operation IDs while preserving the existing product behavior.

  - capability: prep.interface-topology
    revision: 2
    basis: Revalidated after interaction revision 2; exact collection count availability changes no material view/frame or navigation topology.

  - capability: prep.presentation-system
    revision: 4
    basis: "Presentation System now canonically specifies the accepted visual language: compact typography/control density, light-shell/dark-graph surface roles, persistent desktop left rail, Knowledge pane ranges, toolbar composition and wide/compact/narrow breakpoint classes."

  - capability: prep.screen-view-design
    revision: 4
    basis: "Screen/View Design now consumes the accepted visual specification with explicit shell rail, workspace chrome budget, supporting-pane ranges, graph-fill behavior and selection-without-implicit-focus interaction."

  - capability: prep.import-consistency
    revision: 2
    basis: Revalidated against Machine Interface revision 2; collection total_count does not alter import/external-operation atomicity, partial-result, retry or idempotency semantics.

  - capability: prep.interface-verification
    revision: 3
    basis: Interface Verification now exposes stable IV checks with verifies scope, method and concrete evidence requirements for task, interaction, IA, topology, Screen/View and recovery closure.

  - capability: prep.presentation-verification
    revision: 4
    basis: "Presentation Verification now includes visual-system fidelity evidence for the accepted density, shell, pane hierarchy and graph-surface roles in addition to responsive/performance closure."

  - capability: prep.system-architecture
    revision: 2
    basis: Revalidated against Machine Interface revision 2; collection count metadata does not change runtime, trust, deployment or external-integration topology.

  - capability: prep.data-design
    revision: 3
    basis: Data Design was re-reviewed in the full Harness pass; durable identity, references, append-oriented review facts, import identity/atomicity, external mapping, implementation freedoms and reopening conditions remain complete for the current scope.

  - capability: prep.frontend-system-architecture
    revision: 3
    basis: Frontend architecture was revalidated against the graph performance/capacity prerequisite; Knowledge Exploration owns user presentation intent while the renderer adapter owns private optimization strategy and semantic-preserving degradation.

  - capability: prep.frontend-engineering-policy
    revision: 3
    basis: Engineering policy now requires bounded graph work, demand-driven idle rendering, semantic-preserving degradation and hardware performance evidence while keeping renderer optimization internals isolated.

  - capability: prep.frontend-component-design
    revision: 3
    basis: Graph component contracts now separate user-visible performance profiles/preferences from renderer-private instancing, batching, pixel-ratio, physics and diagnostics strategies.

  - capability: prep.frontend-verification
    revision: 5
    basis: "Frontend verification now distinguishes selection from explicit focus and requires idle optimization to preserve interaction readiness; ordinary selection cannot narrow graph membership implicitly."

  - capability: prep.frontend-test-design
    revision: 6
    basis: "Frontend Test Design now adds executable visual-system fidelity ranges for shell navigation, compact density, graph dominance and responsive pane roles while avoiding pixel-perfect provider-specific oracles."

  - capability: prep.frontend-implementation-design
    revision: 7
    basis: "Implementation Design is revalidated against the canonical visual specification; exact implementation values must stay within accepted typography/control/pane/shell ranges instead of treating them as arbitrary local CSS choices."
