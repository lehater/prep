version: 1
kind: prep-strict-semantic-baseline
baseline_id: prep-strict-semantic-baseline-v1
purpose: >-
  Record explicit capability-level semantic revalidation decisions for the
  current accepted Prep Core. The revision number is human-controlled semantic
  acceptance identity, not a file timestamp or content hash. Bump only the
  affected capability when its accepted semantics are revalidated or replaced.

reviews:
  - capability: prep.problem-evidence
    revision: 29
    basis: "Discovery now preserves three broad MVP problem axes without prematurely assigning purpose to knowledge or constraining downstream mechanisms: understand and explore information and relationships from different perspectives; select part of the information or material for external study, practice, review, testing, or other preparation activity; and understand recorded activity and results over time in relation to the information they concern."

  - capability: prep.user-needs
    revision: 1
    basis: "User Needs preserve the three accepted MVP outcomes without prescribing implementation: understand and explore the information and relationships from different perspectives; select part of the available information and material for external preparation activity; and understand recorded activity and results over time in relation to the information they concern. Data maintenance remains downstream product behavior rather than a separate user need."

  - capability: prep.product-intent
    revision: 7
    basis: "Product intent is rebuilt for the MVP around four commitments: explore preparation information and relationships from different perspectives; select and make part of it available for external preparation activity; bring recorded activity/results back for temporal and relational understanding; and support the information lifecycle needed by those behaviors without learner-state assessment."

  - capability: prep.product-capabilities
    revision: 7
    basis: "Product capabilities are rebuilt as the minimum end-to-end MVP behavior: introduce, retain, change and remove information/relationships; preserve knowledge-kind and relationship-meaning distinctions; explore perspectives; select and transfer part outside Prep; accept, relate and temporally preserve recorded activity/results; preserve enough historical context across later information changes; and explore recorded history without inferring learner state."

  - capability: prep.domain-strategy
    revision: 6
    basis: "Domain Strategy keeps two CORE responsibilities while removing an unjustified scope restriction: Preparation Information owns current knowledge, goals, capabilities, practice material and their relationships; Recorded Activity History owns activity/result facts, temporal and historical context, and their relationships to other information. Lifecycle and selection/external-use behaviors may operate across either responsibility and remain without independent strategic subdomain ownership."

  - capability: prep.model-context-strategy
    revision: 5
    basis: "Model Context Strategy is rebuilt for the MVP around two independently modeled semantic languages: Preparation Information for current goals, capabilities, knowledge, practice material and their relationships; and Recorded Activity History for activity/result facts, temporal context and historical relationships. Lifecycle, exploration, selection, transfer and external preparation execution remain behaviors over these contexts rather than independent model languages."
