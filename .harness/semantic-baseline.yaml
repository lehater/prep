version: 1
kind: prep-strict-semantic-baseline
baseline_id: prep-strict-semantic-baseline-v1
purpose: >-
  Record explicit capability-level semantic revalidation decisions for the
  current accepted Prep Core. The revision number is human-controlled semantic
  acceptance identity, not a file timestamp or content hash. Bump only the
  affected capability when its accepted semantics are revalidated or replaced.

reviews:
  - capability: prep.problem-evidence
    revision: 2
    basis: Problem observations now carry an explicit durable stakeholder-evidence inventory and provenance class; the revalidation confirms they remain problem truth without importing product or solution choices.

  - capability: prep.product-intent
    revision: 1
    basis: Product intent was revalidated at observable scope/outcome level without promoting downstream domain, interface or architecture decisions.

  - capability: prep.product-capabilities
    revision: 2
    basis: Product capabilities were revalidated into stable PC trace anchors with observable acceptance semantics and explicit current-slice/deferred dispositions; learning material is preparation/availability in the current slice, not automatic derivation.

  - capability: prep.domain-strategy
    revision: 1
    basis: Strategic domain responsibilities remain investment/responsibility boundaries rather than tactical model or context-internal design.

  - capability: prep.model-context-strategy
    revision: 1
    basis: Model-context applicability and relationships remain separate from strategic investment classification and tactical semantics.

  - capability: prep.knowledge-relation-classification
    revision: 2
    basis: "The machine-readable classifier now distinguishes preferred canonical leaves, candidate proposal vocabulary and legacy-only runtime compatibility; matched can persist only a preferred leaf, candidate vocabulary routes through candidate_needed, and unsupported assertions create no edge."

  - capability: prep.knowledge-model
    revision: 3
    basis: Knowledge identity, forms and relationship semantics were revalidated against the canonical classifier; the model now separates stored/runtime compatibility relation types from the preferred leaves admissible for new classification.

  - capability: prep.frontend-performance-capacity
    revision: 2
    basis: Quality Design now keeps only representation-neutral semantic-preserving degradation/capacity applicability, explicitly leaves current MVP numeric FPS/node/edge/resource targets unaccepted, and makes representation-specific quality conditional on downstream Human Interface selection.

  - capability: prep.learning-design
    revision: 1
    basis: LearningTarget, Requirement and Question semantics remain target-relative learning-design truth without importing learner-state inference or UI mechanics.

  - capability: prep.learner-model
    revision: 1
    basis: Learner evidence remains factual Question-level ReviewObservation/statistics semantics and does not invent mastery, readiness or retention inference.

  - capability: prep.application-design
    revision: 1
    basis: Application knowledge coordinates accepted product/domain behavior and failure outcomes without re-owning domain semantics or selecting transports.

  - capability: prep.task-model
    revision: 4
    basis: Task Model was rebuilt from accepted Product/Application semantics so user work is representation-neutral; Knowledge requires find/focus/typed-relation traversal rather than graph access, and external study is separated from Prep UI work.

  - capability: prep.user-journeys
    revision: 3
    basis: User Journeys were rebuilt from the revised Task Model with complete USER-task coverage while preserving Learning/Curation separation, explicit external-study delegation, failure recovery and representation-neutral Knowledge exploration.

  - capability: prep.conceptual-interface-model
    revision: 2
    basis: Conceptual Interface Model now distinguishes Learning/Curation work contexts, shared canonical Knowledge, explicit global/target exploration scope and focus as interaction state without selecting navigation, layout or visualization form.

  - capability: prep.information-architecture
    revision: 2
    basis: Information Architecture now provides one shared Knowledge information space with explicit scope/context and removes graph terminology and duplicated Learning/Curation Knowledge locations from canonical organization.

  - capability: prep.machine-interfaces
    revision: 2
    basis: Browser collection contracts now explicitly expose exact total_count for the current scope/query while opaque cursors remain transport mechanics; all other browser/backend and external-runtime semantics were revalidated unchanged.

  - capability: prep.interaction-design
    revision: 4
    basis: Interaction Design now defines representation-neutral Knowledge search/focus/relation traversal, explicit scope preservation and keyboard semantics, plus rebuilt Learning/Curation recovery behavior without choosing graph, 2D or 3D presentation.

  - capability: prep.interface-topology
    revision: 3
    basis: Interface Topology now consolidates work into Learning, shared Knowledge and Curation task views, removes duplicated collection/editor and runtime-status destinations, and keeps Curation structural entry separate from concrete screen composition.

  - capability: prep.presentation-system
    revision: 5
    basis: Presentation System was reselected through governed option review: textual/search/detail access is the semantic backbone and a local 3D relational projection is selected for Knowledge without becoming universal UI; numeric graph gates and fixed shell/style choices are removed.

  - capability: prep.screen-view-design
    revision: 5
    basis: Screen/View Design now composes the rebuilt V-* topology with task-primary regions, same-view context-preserving Curation work, wide/narrow semantic transformations and local 3D Knowledge priority without fixed pixel geometry or graph performance targets.

  - capability: prep.import-consistency
    revision: 2
    basis: Revalidated against Machine Interface revision 2; collection total_count does not alter import/external-operation atomicity, partial-result, retry or idempotency semantics.

  - capability: prep.interface-verification
    revision: 4
    basis: Interface Verification now verifies rebuilt task/context/topology closure, Learning/Curation separation, representation-neutral Knowledge traversal and factual failure semantics against the new interface chain.

  - capability: prep.presentation-verification
    revision: 5
    basis: Presentation Verification now verifies the shared Knowledge dual-access contract, local 3D projection, rebuilt wide/narrow composition, context-preserving Curation and non-spatial accessibility without reinstating historical numeric graph gates.

  - capability: prep.system-architecture
    revision: 3
    basis: System Architecture was rebuilt through full decision review into one Prep backend/server deployable plus browser code, foreground request/response interactions, backend canonical authority and explicit adapter boundaries without mandatory separate frontend deployment, workers or duplex channels.

  - capability: prep.data-design
    revision: 4
    basis: Data Design was rebuilt against the new System Architecture with backend-only canonical write ownership, stable semantic identities/relations, explicit transactional/import concurrency rules, append-oriented review evidence and no graph-layout or learner-state persistence.

  - capability: prep.frontend-system-architecture
    revision: 4
    basis: Frontend architecture now follows Learning/shared Knowledge/Curation task ownership, keeps textual Knowledge independent of the 3D renderer, isolates renderer and transport adapters, and does not require extra browser runtimes/workers absent accepted quality evidence.

  - capability: prep.frontend-engineering-policy
    revision: 4
    basis: Frontend Engineering Policy was rebuilt around task ownership, provider isolation, canonical-state boundaries and semantic verification discipline; historical graph performance profiles/numeric benchmark gates are no longer product correctness requirements.

  - capability: prep.frontend-component-design
    revision: 4
    basis: Component Design now owns task/feature boundaries for Learning, Knowledge and Curation, narrow backend/3D provider seams and minimal state ownership; the existing 3D experiment is donor code behind KnowledgeProjectionPort rather than frontend architecture.

  - capability: prep.frontend-verification
    revision: 6
    basis: Frontend Verification now proves rebuilt topology, provider isolation, textual/3D focus parity, Curation recovery, responsive/keyboard continuity and failure isolation while treating graph performance measurements as diagnostic unless later accepted by Quality Design.

  - capability: prep.frontend-test-design
    revision: 7
    basis: Frontend Test Design now supplies executable contracts for renderer-independent Knowledge, textual/3D parity, Curation conflict recovery, Study materialization fidelity, responsive continuity and machine-outcome mapping without historical FPS/node-count or pixel-layout oracles.

  - capability: prep.frontend-implementation-design
    revision: 8
    basis: Implementation Design now uses feature/task ownership and bounded vertical slices, builds the Knowledge semantic backbone before adapting the existing 3D donor, retains the repository toolchain as implementation context, makes CI authoritative and records migration-transition semantics as not independently applicable.
