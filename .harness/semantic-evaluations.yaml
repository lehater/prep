version: 1
kind: prep-semantic-evaluation-bundle
mode: migration-revalidation
strict_admission: false
note: >-
  Generated project evidence for canonical frontend capabilities that have been
  semantically revalidated during the current Harness migration. These entries
  satisfy Engineering Coverage semantic-claim evidence only. They intentionally
  do not contain strict admission metadata or lifecycle baselines and therefore
  cannot satisfy strict semantic/currentness closure.

