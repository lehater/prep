version: 1
kind: harness-artifact-admission-candidate
id: PROBLEM-SPACE
capability: prep.problem-evidence
path: docs/vision/problem-space.md
changed_paths:
  - docs/vision/problem-space.md
canonical_references: []

semantic_assertions:
  - id: PE-ACTOR
    kind: problem-actor
    subject: primary-learner
    semantic_value: A person preparing toward an external or self-defined learning target.
    decision_authority: DISCOVERY

  - id: PE-PROBLEM
    kind: problem-observation
    subject: learning-transition
    semantic_value: The learner lacks a sufficiently reliable way to manage the transition from current capability to the desired target state.
    decision_authority: DISCOVERY

  - id: OBS-P01
    kind: problem-observation
    subject: target-uncertainty
    semantic_value: A real learning goal can require uncertain scope and different depths of capability.
    decision_authority: DISCOVERY

  - id: OBS-P02
    kind: problem-observation
    subject: partial-observability
    semantic_value: The learner's current state is not directly known and must be approached through imperfect evidence.
    decision_authority: DISCOVERY

  - id: OBS-P03
    kind: problem-observation
    subject: fragmented-knowledge
    semantic_value: Relevant material may be incomplete, inconsistent, redundant, or expressed with different terminology.
    decision_authority: DISCOVERY

  - id: OBS-P04
    kind: problem-observation
    subject: exposure-vs-capability
    semantic_value: Encountering information does not establish later recall, explanation, reasoning, or application.
    decision_authority: DISCOVERY

  - id: OBS-P05
    kind: problem-observation
    subject: limited-resources
    semantic_value: Time and attention force choices about what deserves attention next.
    decision_authority: DISCOVERY

  - id: OBS-P06
    kind: problem-observation
    subject: changing-state
    semantic_value: New learning or evidence can change what should be learned or checked next.
    decision_authority: DISCOVERY

  - id: OBS-P07
    kind: problem-observation
    subject: retention-transfer-risk
    semantic_value: Immediate success does not guarantee later availability or transfer to another context.
    decision_authority: DISCOVERY

  - id: OBS-P08
    kind: problem-observation
    subject: external-target-translation
    semantic_value: External role or opportunity descriptions may need to be translated into a coherent, reviewable, refinable target capability profile.
    decision_authority: DISCOVERY

  - id: OBS-P09
    kind: problem-observation
    subject: preparation-bootstrap
    semantic_value: Useful preparation may start without ready target, knowledge, task-material, or evidence-design data and must be bootstrapped from sources or prepared structure.
    decision_authority: DISCOVERY

  - id: OBS-P10
    kind: problem-observation
    subject: structural-orientation
    semantic_value: In an unfamiliar subject, fragmented linear material may not provide a coherent high-level map of important concepts, their relative scope, or how they fit together.
    decision_authority: DISCOVERY

  - id: OBS-P11
    kind: problem-observation
    subject: relational-understanding
    semantic_value: Understanding a subject may require seeing meaningful relationships between concepts because isolated concept descriptions do not explain how concepts interact or constrain one another.
    decision_authority: DISCOVERY

  - id: OBS-P12
    kind: problem-observation
    subject: abstraction-granularity
    semantic_value: Useful understanding may require movement between overview and deeper levels of detail because one fixed granularity can hide structure or create overload.
    decision_authority: DISCOVERY

  - id: OBS-P13
    kind: problem-observation
    subject: corpus-maintenance-responsibility
    semantic_value: Supporting target, capability, knowledge, and relation data may require incremental addition and correction over time; that maintenance must exist somewhere in the supporting system without assuming learner ownership.
    decision_authority: DISCOVERY

  - id: PE-DESIRED-OUTCOME
    kind: desired-outcome
    subject: reliable-progress
    semantic_value: The learner can reliably decide what matters next, act on it, obtain evidence of change, and adapt preparation as target understanding or learner state changes.
    decision_authority: DISCOVERY

  - id: PE-KNOWLEDGE-ORIENTATION-OUTCOME
    kind: desired-outcome
    subject: knowledge-orientation
    semantic_value: The learner can form an orienting mental model of relevant subject concepts, meaningful relationships, and useful levels of detail without requiring a specific visualization technique.
    decision_authority: DISCOVERY

  - id: PE-NON-SOLUTION
    kind: scope-boundary
    subject: solution-neutrality
    semantic_value: The problem evidence does not choose a 2D or 3D graph, spatial layout, cards, scheduling mechanism, external study system, import format, or implementation architecture.
    decision_authority: DISCOVERY

semantic_review:
  status: ACCEPTED
  checks:
    - source-discipline
    - authority-boundary
    - no-invention
    - evidence-not-solution
