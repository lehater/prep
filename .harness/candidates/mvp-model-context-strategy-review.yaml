comparison:
  one_language:
    feasibility: Not ruled out by accepted evidence
    basis: One model can distinguish preparation-information descriptions from activity/result
      records, retain temporal context and refer to the preparation subject. All accepted
      CRUD/bulk, exploration, selection and outside-use obligations remain satisfiable.
      No aggregate, schema or tactical implementation is selected.
  two_languages:
    evidence: Distinct responsibilities, information meanings and consumer tasks
    missing: Independent language applicability/evolution or conflicting interpretation
      evidence establishing material value beyond distinguishing concepts in the shared
      language. The candidate itself conditions the choice on evidence not supplied.
    cost: Additional independent semantic governance and cross-language contract without
      demonstrated necessity.
  verdict: The two-context choice is unproven. Do not silently select either alternative
    as accepted; route the model-language decision to its owning Authority.
TR-01_review: Occurrence/result versus subject distinction, no proficiency inference,
  temporal understanding and joint exploration are supported. They also apply within
  one language. No actual cross-language reinterpretation or required translation
  is demonstrated; TR-01 is conditional on the unresolved split.
boundary_review: The candidate appropriately defers context-to-service mapping, tactical
  identities/invariants, snapshots and historical repair. Four RETIRED proposals remain
  unaccepted; full CRUD/bulk scope is preserved. These positive boundaries do not
  prove a need for two languages.
question:
  id: Q-PREP-MODEL-CONTEXT-INDEPENDENT-LANGUAGES
  authority: MODEL-CONTEXT-STRATEGY
  text: Establish whether MC-01 and MC-02 require independently governed model languages
    rather than distinguishable concepts in one coherent language. Accepted Product
    Capabilities and Domain Strategy justify preparation-information versus activity/result
    meanings, but do not evidence incompatible interpretations of a shared concept,
    independent language evolution or a consumer translation that cannot be satisfied
    within a shared model. Compare an explicit coherent one-language alternative with
    concrete independent semantic evidence and consumer consequences; substantiate
    a cross-language interpretation mapping for TR-01 if two contexts are selected.
    Separate CORE responsibilities, temporal facts and different consumer tasks alone
    are insufficient. Preserve full CRUD and bulk loading across every in-scope kind;
    do not revive retired product proposals, introduce historical invariants or choose
    tactical/technical realization.
  blocks_capabilities:
  - prep.model-context-strategy
