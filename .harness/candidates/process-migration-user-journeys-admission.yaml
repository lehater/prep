    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-CLEAR-CAPABILITY-SCOPE
    kind: user-journey
    subject: J-KNOWLEDGE-ORIENTATION/clear-capability-scope
    semantic_value: "The learner can clear the active Required Capability Knowledge-scope criterion."
