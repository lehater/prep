    subject: J-KNOWLEDGE-ORIENTATION/narrow-expand-scope
    semantic_value: "The learner can independently narrow or expand semantic Knowledge scope."
    derived_from: [TM-TASK-EXPLORE-KNOWLEDGE, AD-EXPLORE-KNOWLEDGE]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-DEPTH
    kind: user-journey
    subject: J-KNOWLEDGE-ORIENTATION/overview-detail
    semantic_value: "The learner can move between subject overview and deeper semantic detail."
    derived_from: [TM-TASK-EXPLORE-KNOWLEDGE, AD-EXPLORE-KNOWLEDGE]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-SELECT
    kind: user-journey
    subject: J-KNOWLEDGE-ORIENTATION/select-knowledge
    semantic_value: "The learner can select relevant Subject Knowledge for inspection."
    derived_from: [TM-TASK-EXPLORE-KNOWLEDGE, AD-EXPLORE-KNOWLEDGE]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-RELATIONS
    kind: user-journey
    subject: J-KNOWLEDGE-ORIENTATION/follow-relations
    semantic_value: "The learner can follow meaningful relationships between Knowledge objects or propositions."
    derived_from: [TM-TASK-EXPLORE-KNOWLEDGE, AD-EXPLORE-KNOWLEDGE]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-PROJECTION
    kind: user-journey
    subject: J-KNOWLEDGE-ORIENTATION/bounded-projection
    semantic_value: "When Capability scope is active, the system bounds Knowledge results and relationship projection to that Capability-derived scope plus accepted semantic expansion while preserving Knowledge identity and relation meaning."
    derived_from: [TM-TASK-EXPLORE-KNOWLEDGE, AD-EXPLORE-KNOWLEDGE]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-MISSING
    kind: journey-alternate
    subject: J-KNOWLEDGE-ORIENTATION/missing-knowledge
    semantic_value: "Sparse or missing useful Knowledge remains an explicit preparation limitation and may route to preparation support."
    derived_from: [TM-RECOVERY-EXPLORE-KNOWLEDGE, AD-WRITE-OWNERSHIP]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-NO-MUTATION
    kind: journey-invariant
    subject: J-KNOWLEDGE-ORIENTATION/no-knowledge-mutation
    semantic_value: "Changing scope or depth, or applying or clearing Required Capability scope, does not mutate or clone reusable Knowledge or Capability."
    derived_from: [TM-RECOVERY-EXPLORE-KNOWLEDGE, AD-WRITE-OWNERSHIP]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-KNOWLEDGE-REPRESENTATION-FREEDOM
    kind: journey-invariant
    subject: J-KNOWLEDGE-ORIENTATION/representation-freedom
    semantic_value: "Knowledge orientation semantics do not require a graph, list, 2D, 3D or other specific presentation form."
    derived_from: [TM-RECOVERY-EXPLORE-KNOWLEDGE, AD-WRITE-OWNERSHIP]
    decision_authority: APPLICATION-DESIGN

  - id: UJ-ACTIVITY-SUPPORT-FIT
    kind: user-journey
