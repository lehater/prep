version: 1
kind: harness-artifact-admission-candidate
id: FRONTEND-IMPLEMENTATION-DESIGN
capability: prep.frontend-implementation-design
path: docs/implementation/frontend-implementation-design.md
changed_paths: [docs/implementation/frontend-implementation-design.md]
canonical_references:
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/implementation/frontend-component-design.md}
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/verification/frontend-verification.md}
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/verification/frontend-test-design.yaml}
decision_review:
  axes:
    - axis: slice-boundaries
      decisions:
        - id: implementation-slice-shape
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: feature-capability-slices, state: VIABLE}
            - {id: micro-operation-slices, state: VIABLE}
            - {id: one-big-rewrite, state: REJECTED, rationale: "Hides ownership and verification boundaries and increases integration risk."}
          disposition: DELEGATED
          selected: feature-capability-slices
        - id: initial-ordering
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: bootstrap-foundation-then-features, state: VIABLE}
            - {id: feature-first-with-ad-hoc-tooling, state: REJECTED, rationale: "Makes repository/tooling choices implicit and creates temporary semantic coupling."}
          disposition: DETERMINED
          selected: bootstrap-foundation-then-features
    - axis: repository-realization
      decisions:
        - id: source-module-topology
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: single-root-task-features, state: VIABLE}
            - {id: package-per-feature, state: VIABLE}
            - {id: flat-view-root, state: REJECTED, rationale: "Removes accepted public feature ownership."}
          disposition: DELEGATED
          selected: single-root-task-features
        - id: contract-realization
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: handwritten-consumer-contracts, state: VIABLE}
            - {id: generated-contract-layer, state: REJECTED, rationale: "No accepted generator/source contract justifies a generation layer."}
          disposition: DETERMINED
          selected: handwritten-consumer-contracts
    - axis: dependency-tooling
      decisions:
        - id: base-toolchain
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: fresh-minimal-versioned-toolchain, state: VIABLE}
            - {id: recreate-deleted-toolchain-wholesale, state: REJECTED, rationale: "Deleted dependency presence is historical evidence, not a current requirement."}
          disposition: DELEGATED
          selected: fresh-minimal-versioned-toolchain
          rationale: "Select and lock concrete tools at FI-00 from current architecture/verification needs; no package or version is inherited merely because it existed before the clean baseline."
        - id: optional-spatial-dependency
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: no-production-spatial-dependency-at-bootstrap, state: VIABLE}
            - {id: add-spatial-provider-at-bootstrap, state: REJECTED, rationale: "Knowledge is task-complete without spatial rendering and no accepted evidence requires a production spatial dependency for the first implementation."}
          disposition: DETERMINED
          selected: no-production-spatial-dependency-at-bootstrap
        - id: boundary-enforcement
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: establish-versioned-boundary-check, state: VIABLE}
            - {id: convention-only, state: REJECTED, rationale: "Architecturally significant ownership boundaries require deterministic enforcement."}
          disposition: DETERMINED
          selected: establish-versioned-boundary-check
    - axis: verification-enforcement
      decisions:
        - id: verification-layering
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: layered-fast-plus-e2e, state: VIABLE}
            - {id: browser-only, state: REJECTED, rationale: "Defers structural/contract failures to a slower less precise layer."}
          disposition: DETERMINED
          selected: layered-fast-plus-e2e
        - id: deterministic-fast-enforcement
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: establish-automated-fast-deterministic, state: VIABLE}
            - {id: manual-deterministic, state: REJECTED, rationale: "Does not provide reproducible architectural/contract enforcement."}
          disposition: DETERMINED
          selected: establish-automated-fast-deterministic
    - axis: delivery-gates
      decisions:
        - id: frontend-delivery-gate
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: versioned-fast-automatic-heavy-explicit, state: VIABLE}
            - {id: always-heavy, state: REJECTED, rationale: "Adds expensive feedback to every ordinary change without accepted need."}
            - {id: unversioned-local-gate, state: REJECTED, rationale: "Not reproducible or authoritative."}
          disposition: DETERMINED
          selected: versioned-fast-automatic-heavy-explicit
semantic_assertions:
  - {id: FI-BOUNDARY, kind: implementation-boundary, subject: frontend-realization-scope, semantic_value: "Implementation starts from an intentionally empty production frontend baseline and realizes the accepted Preparation Shell/task features, consumer semantic ports and deterministic mock scenario without recovering deleted implementation as authority or redefining upstream semantics.", derived_from: [CD-FEATURES, CD-PORTS, FV-TRACEABILITY, FV-WORKFLOW], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-TOOLCHAIN, kind: implementation-tooling, subject: frontend-base-toolchain, semantic_value: "No frontend package or version is inherited from deleted implementation. FI-00 selects the smallest current browser tool/build/test environment that satisfies accepted architecture and verification needs, pins it in versioned inputs and establishes reproducible fast/heavy gates before substantial product source.", derived_from: [CD-DEPENDENCY], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-REPOSITORY, kind: implementation-repository, subject: task-feature-source-roots, semantic_value: "A fresh production source root maps accepted ownership to app preparation-shell/context/composition plus target-direction, target, current-position, knowledge-explorer, activity, evidence-change and preparation-support features; the physical root name and internal file split remain implementation freedoms.", derived_from: [CD-FEATURES, CD-SPATIAL], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-SLICES, kind: implementation-slices, subject: feature-capability-slices, semantic_value: "Implementation is partitioned into FI-00 reproducible bootstrap, semantic foundation/mock scenario, shell/context/Target direction, Target, Current, Knowledge, Activity, Evidence/change, Preparation Support and final prototype verification closure.", derived_from: [CD-FEATURES, FTD-WORKFLOW], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-ORDER, kind: implementation-dependency-order, subject: realization-ordering, semantic_value: "The clean baseline precedes FI-00; tool/dependency/boundary enforcement is explicit before product source; semantic models/ports and deterministic mocks precede dependent features; shell/context precede features requiring cross-view continuity.", derived_from: [CD-COMPOSITION, CD-PORTS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-SPATIAL, kind: implementation-provider-boundary, subject: optional-spatial-realization, semantic_value: "The clean baseline has no production spatial dependency. Knowledge remains task-complete without one; any future spatial provider must be added explicitly behind the accepted provider seam and cannot become semantic state.", derived_from: [CD-SPATIAL, FTD-SPATIAL], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-VERIFICATION, kind: implementation-verification, subject: fast-heavy-enforcement, semantic_value: "FI-00 establishes versioned deterministic fast checks including architectural boundaries/local contracts; the explicit heavy prototype checkpoint adds build/browser E2E/applicable accessibility/full Harness and conditional provider evidence.", derived_from: [FTD-BOUNDARIES, FTD-ADAPTER, FTD-CURRENTNESS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-GATE, kind: implementation-completion, subject: prototype-production-gate, semantic_value: "Prototype completion means READY FOR REPRESENTATIVE-USABILITY VALIDATION; production authority additionally requires representative-user/accessibility evidence, routed findings and strict Harness currentness.", derived_from: [FV-PRESENTATION, FV-HARNESS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-ROLLBACK, kind: implementation-release, subject: frontend-rollback, semantic_value: "The clean baseline has no deployable frontend or frontend-specific migration/coexistence state. The first deployable frontend is a whole replaceable artifact; mixed-version/persistent migration semantics require reopening Change/Transition Design.", derived_from: [CD-DEPENDENCY], decision_authority: IMPLEMENTATION-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, implementation-not-upstream-owner, implementation-slices-explicit, repository-realization-derived-from-accepted-boundaries]
