version: 1
kind: harness-artifact-admission-candidate
id: FRONTEND-IMPLEMENTATION-DESIGN
capability: prep.frontend-implementation-design
path: docs/implementation/frontend-implementation-design.md
changed_paths: [docs/implementation/frontend-implementation-design.md]
canonical_references:
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/implementation/frontend-component-design.md}
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/verification/frontend-verification.md}
  - {artifact: FRONTEND-IMPLEMENTATION-DESIGN, referenced_path: docs/verification/frontend-test-design.yaml}
decision_review:
  axes:
    - axis: slice-boundaries
      decisions:
        - id: implementation-slice-shape
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: feature-capability-slices, state: VIABLE}
            - {id: micro-operation-slices, state: VIABLE}
            - {id: one-big-rewrite, state: REJECTED, rationale: "Hides ownership and verification boundaries and increases integration risk."}
          disposition: DELEGATED
          selected: feature-capability-slices
        - id: initial-ordering
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: foundation-then-feature-slices, state: VIABLE}
            - {id: feature-first-with-temporary-contracts, state: REJECTED, rationale: "Creates temporary DTO/semantic coupling requiring later reconciliation."}
          disposition: DETERMINED
          selected: foundation-then-feature-slices
    - axis: repository-realization
      decisions:
        - id: source-module-topology
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: task-feature-roots, state: VIABLE}
            - {id: legacy-roots-with-facades, state: VIABLE}
            - {id: flat-view-root, state: REJECTED, rationale: "Removes public feature ownership."}
          disposition: DELEGATED
          selected: task-feature-roots
        - id: contract-realization
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: handwritten-consumer-contracts, state: VIABLE}
            - {id: generated-contract-layer, state: REJECTED, rationale: "No accepted generator/source contract justifies a generation layer."}
          disposition: DETERMINED
          selected: handwritten-consumer-contracts
    - axis: dependency-tooling
      decisions:
        - id: base-toolchain
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: retain-current-base-toolchain, state: VIABLE}
            - {id: replace-ui-or-state-toolchain, state: REJECTED, rationale: "No accepted driver justifies framework/provider replacement during semantic correction."}
          disposition: DETERMINED
          selected: retain-current-base-toolchain
        - id: optional-spatial-dependency
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: retain-base-tools-and-isolate-optional-renderer, state: VIABLE}
            - {id: eager-renderer-removal, state: REJECTED, rationale: "The current repository still contains a retained graph-rfg3d prototype/provider path; forcing renderer removal before feature migration would broaden this semantic correction into an unrelated provider rewrite and violate the selected foundation-then-feature sequencing."}
          disposition: DETERMINED
          selected: retain-base-tools-and-isolate-optional-renderer
          rationale: "Retain the currently referenced optional provider path through feature migration; remove renderer dependencies only after the adapter is unreferenced."
        - id: boundary-enforcement
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: retain-versioned-boundary-check, state: VIABLE}
            - {id: convention-only, state: REJECTED, rationale: "Weakens existing deterministic architecture enforcement."}
          disposition: DETERMINED
          selected: retain-versioned-boundary-check
    - axis: verification-enforcement
      decisions:
        - id: verification-layering
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: layered-fast-plus-e2e, state: VIABLE}
            - {id: browser-only, state: REJECTED, rationale: "Defers structural/contract failures to a slower less precise layer."}
          disposition: DETERMINED
          selected: layered-fast-plus-e2e
        - id: deterministic-fast-enforcement
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: automated-fast-deterministic, state: VIABLE}
            - {id: manual-deterministic, state: REJECTED, rationale: "Contradicts accepted automated fast-validation policy."}
          disposition: DETERMINED
          selected: automated-fast-deterministic
    - axis: delivery-gates
      decisions:
        - id: frontend-delivery-gate
          owner_authority: IMPLEMENTATION-DESIGN
          alternatives:
            - {id: fast-automatic-heavy-explicit, state: VIABLE}
            - {id: always-heavy, state: REJECTED, rationale: "Contradicts accepted bounded fast/heavy validation split."}
            - {id: unversioned-local-gate, state: REJECTED, rationale: "Not reproducible or authoritative."}
            - {id: environment-dependent-gate, state: REJECTED, rationale: "Not reproducible from versioned project inputs."}
          disposition: DETERMINED
          selected: fast-automatic-heavy-explicit
semantic_assertions:
  - {id: FI-BOUNDARY, kind: implementation-boundary, subject: frontend-realization-scope, semantic_value: "Implementation realizes the accepted Preparation Shell/task features, consumer semantic ports and deterministic mock scenario without redefining Product/Domain/Application/Interface semantics.", derived_from: [CD-FEATURES, CD-PORTS, FV-WORKFLOW], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-TOOLCHAIN, kind: implementation-tooling, subject: frontend-base-toolchain, semantic_value: "Retain the current React/TypeScript/Vite/Router/MUI/React Query/Vitest/Playwright base toolchain; no framework/state/event-bus/codegen replacement is introduced for this semantic correction.", derived_from: [CD-DEPENDENCY], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-REPOSITORY, kind: implementation-repository, subject: task-feature-source-roots, semantic_value: "Target source ownership uses app preparation-shell/context/composition plus target-direction, target, current-position, knowledge-explorer, activity, evidence-change and preparation-support feature roots with mock/http/spatial adapters.", derived_from: [CD-FEATURES, CD-SPATIAL], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-SLICES, kind: implementation-slices, subject: feature-capability-slices, semantic_value: "Implementation is partitioned into semantic foundation/mock scenario, shell/context/Target direction, Target, Current, Knowledge, Activity, Evidence/change, Preparation Support, then legacy-boundary cleanup/verification closure.", derived_from: [CD-FEATURES, FTD-WORKFLOW], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-ORDER, kind: implementation-dependency-order, subject: realization-ordering, semantic_value: "Semantic models/ports and deterministic mocks precede dependent feature slices; shell/context precede features that require cross-view continuity; cleanup follows replacement paths.", derived_from: [CD-COMPOSITION, CD-PORTS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-SPATIAL, kind: implementation-provider-boundary, subject: optional-spatial-realization, semantic_value: "Existing 3D dependencies may remain only behind an optional spatial adapter while referenced; Knowledge remains complete without them and unused renderer dependencies are ordinary cleanup.", derived_from: [CD-SPATIAL, FTD-SPATIAL], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-VERIFICATION, kind: implementation-verification, subject: fast-heavy-enforcement, semantic_value: "Fast type/lint/boundary/unit/contract checks remain automated; the explicit final heavy checkpoint adds build/browser E2E/current accessibility/full Harness and conditional renderer evidence.", derived_from: [FTD-BOUNDARIES, FTD-ADAPTER, FTD-CURRENTNESS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-GATE, kind: implementation-completion, subject: prototype-production-gate, semantic_value: "Prototype completion means READY FOR REPRESENTATIVE-USABILITY VALIDATION; production authority additionally requires representative-user/accessibility evidence, routed findings and strict Harness currentness.", derived_from: [FV-PRESENTATION, FV-HARNESS], decision_authority: IMPLEMENTATION-DESIGN}
  - {id: FI-ROLLBACK, kind: implementation-release, subject: frontend-rollback, semantic_value: "Current release uses whole-frontend artifact replacement with no frontend-specific data migration/coexistence; rollback restores the previous compatible frontend artifact and reopening is required if mixed-version/persistent migration semantics appear.", derived_from: [CD-DEPENDENCY], decision_authority: IMPLEMENTATION-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, implementation-not-upstream-owner, implementation-slices-explicit, repository-realization-derived-from-accepted-boundaries]
