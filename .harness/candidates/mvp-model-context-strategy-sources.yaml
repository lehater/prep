- id: PC-SCOPE
  kind: product-capability-scope
  subject: mvp-scope
  semantic_value:
    purpose: Specify externally observable MVP product capabilities that realize the
      accepted Product Intent. These requirements do not decide Domain, Application,
      Interface, Data, or implementation designs.
    scope_boundaries:
    - The accepted MVP model determines which entity and relationship kinds exist.
      All those kinds, including recorded activity/results, must have bulk-loading
      and complete CRUD support; no kind can be silently excluded.
    - The product shall not require a particular information import/export format,
      UI design, API, storage model, 2D/3D representation or technology.
    - Product-level editing and removal of recorded activity/results are mandatory.
      The meaning of historical continuity following changes and deletions is a downstream
      modeling issue, not permission to restrict those product operations.
    - The retired proposal IDs were not previously admitted as CURRENT requirements.
      Retirement here removes unsupported or duplicate candidate commitments, not
      accepted upstream behavior.
    intent_coverage:
    - intent: REQ-INFORMATION-EXPLORATION
      capabilities:
      - REQ-CAP-EXPLORE-INFORMATION
      - REQ-CAP-EXPLORE-RELATIONSHIPS
    - intent: REQ-INFORMATION-PERSPECTIVES
      capabilities:
      - REQ-CAP-EXPLORE-PERSPECTIVES
    - intent: REQ-EXTERNAL-USE
      capabilities:
      - REQ-CAP-SELECT-PART
    - intent: REQ-EXTERNAL-USE-AVAILABILITY
      capabilities:
      - REQ-CAP-TRANSFER-SELECTION
    - intent: REQ-RECORDED-HISTORY
      capabilities:
      - REQ-CAP-PRESERVE-TIME
      - REQ-CAP-EXPLORE-HISTORY
    - intent: REQ-RECORDED-HISTORY-CONTEXT
      capabilities:
      - REQ-CAP-RELATE-ACTIVITY
    - intent: REQ-RECORDED-ACTIVITY-INTAKE
      capabilities:
      - REQ-CAP-RECORD-ACTIVITY
    - intent: REQ-INFORMATION-BULK-LOAD
      capabilities:
      - REQ-CAP-BULK-LOAD-INFORMATION
    - intent: REQ-INFORMATION-CREATE
      capabilities:
      - REQ-CAP-INTRODUCE-INFORMATION
    - intent: REQ-INFORMATION-READ
      capabilities:
      - REQ-CAP-READ-INFORMATION
      - REQ-CAP-RETAIN-INFORMATION
    - intent: REQ-INFORMATION-UPDATE
      capabilities:
      - REQ-CAP-CHANGE-INFORMATION
    - intent: REQ-INFORMATION-DELETE
      capabilities:
      - REQ-CAP-REMOVE-INFORMATION
    non_goals:
    - Assess what the user knows or can do, or estimate mastery, readiness, or competence.
    - Verify the truth, quality, authorship, reliability, or authority of information.
    - Require source management, provenance, citations, source versioning, or traceability.
    - Define a fixed taxonomy of knowledge kinds or relationship meanings.
    - Define required cross-kind relationship topology or connection cardinalities.
    - Require immutable activity history or prescribe a deletion or versioning strategy.
    - Require a particular visualization, import/export format, API, integration,
      persistence model, or implementation technology.
    - Require particular statistics or derived assessments from recorded facts.
    retired_requirements:
    - id: REQ-CAP-KNOWLEDGE-KINDS
      statement: The product shall support distinguishable kinds of knowledge.
      status: RETIRED
      source_refs:
      - REQ-INFORMATION-EXPLORATION
      rationale: Previous unadmitted proposal requires a distinct product choice about
        differentiating kinds within knowledge. Accepted Product Intent lists information
        categories but does not commit to a knowledge-kind taxonomy or its user-visible
        management. No such obligation is inferred.
    - id: REQ-CAP-RELATIONSHIP-MEANINGS
      statement: The product shall preserve distinguishable meanings of relationships.
      status: RETIRED
      source_refs:
      - REQ-INFORMATION-EXPLORATION
      rationale: Previous unadmitted proposal makes an additional commitment about
        relationship meanings. Accepted Product Intent requires relationship exploration,
        but leaves taxonomy and relationship semantics to future explicit decisions
        and their owning Authorities.
    - id: REQ-CAP-CROSS-INFORMATION-RELATIONSHIPS
      statement: The product shall allow relationships to connect different kinds
        of information.
      status: RETIRED
      source_refs:
      - REQ-INFORMATION-EXPLORATION
      rationale: Previous unadmitted proposal could prescribe cross-kind relationship
        topology. The accepted requirement is to explore in-scope relationships; which
        links are valid belongs to downstream modeling, without silently assuming
        arbitrary cross-kind connections.
    - id: REQ-CAP-PRESERVE-HISTORY-CONTEXT
      statement: The product shall preserve enough context for recorded activity and
        results to remain understandable in relation to the information they concerned
        when that information is later changed or removed.
      status: RETIRED
      source_refs:
      - REQ-RECORDED-HISTORY-CONTEXT
      - REQ-INFORMATION-UPDATE
      - REQ-INFORMATION-DELETE
      rationale: Previous unadmitted proposal imposes a historical-preservation invariant
        not settled by accepted Product Intent. Recorded activity and results remain
        editable and removable under the owner's CRUD decision; the domain/history
        consistency consequence must be decided downstream, not silently imposed by
        Product Capabilities.
  derived_from:
  - PI-SCOPE
  decision_authority: PRODUCT-REQUIREMENTS
  canonical_location: .harness/knowledge/product-capabilities.yaml#content
  source_artifact: PRODUCT-CAPABILITIES
- id: DS-EVIDENCE
  kind: strategic-evidence-boundary
  subject: DS-EVIDENCE
  semantic_value:
    heading: '## Purpose and evidence boundary'
    text: '

      Identify the MVP''s strategic domain responsibilities and the areas where their

      different meanings justify separate strategic attention. This is a strategic

      classification, not a bounded-context map, tactical domain model, service

      topology, persistence design, or user-interface design.


      **Accepted source:** `prep.product-capabilities`,

      `PREP-MVP-PRODUCT-CAPABILITIES-1`. Its 15 active capabilities are the direct

      product-behavior input. The prior four `RETIRED` capability proposals are not

      accepted requirements and are not admissible justification for this strategy.


      The distinction between preparation information and recorded activity/results

      is consistent with accepted Problem Evidence: an item used for preparation is

      not the same thing as a recorded fact that an activity occurred. That

      distinction does not imply uneditable or undeletable history.


      '
  derived_from:
  - PC-SCOPE
  decision_authority: DOMAIN-STRATEGY
  canonical_location: docs/architecture/context-map.md#DS-EVIDENCE
  source_artifact: CONTEXT-MAP
