id: DATA-DESIGN
capability: prep.data-design
path: docs/architecture/data-design.md
changed_paths:
  - docs/architecture/data-design.md
canonical_references:
  - {artifact: DATA-DESIGN, referenced_path: docs/domain/knowledge-model.md}
  - {artifact: DATA-DESIGN, referenced_path: docs/domain/learning-design.md}
  - {artifact: DATA-DESIGN, referenced_path: docs/domain/learner-model.md}
