dispositions:
  - source: UJ-KNOWLEDGE-APPLY-CAPABILITY-SCOPE
    status: NOT_APPLICABLE
    rationale: "Applying a Required Capability scope is an Interaction Design invocation. Conceptual Interface already owns the underlying reversible Capability-derived Knowledge scope through CIM-KNOWLEDGE-SCOPE and CIM-REL-CAPABILITY-KNOWLEDGE, so no additional action concept is introduced here."
  - source: UJ-KNOWLEDGE-CLEAR-CAPABILITY-SCOPE
    status: NOT_APPLICABLE
    rationale: "Clearing a Required Capability scope is an Interaction Design invocation. Conceptual Interface already owns reversibility of the Capability-derived Knowledge scope through CIM-KNOWLEDGE-SCOPE, CIM-REL-CAPABILITY-KNOWLEDGE and the no-mutation boundary, so no additional action concept is introduced here."
