dispositions:
  - source: UJ-TARGET-SETUP-CONFIRM
    status: NOT_APPLICABLE
    rationale: "Confirming sufficiency or submitting refinement is Interaction/Application behavior. IA already groups the required active-Target information under IA-LOC-TARGET without defining confirmation mechanics."
  - source: UJ-DIRECTION-RECORD-FOCUS
    status: NOT_APPLICABLE
    rationale: "Recording PreparationIntent through its semantic owner is persistence/application behavior; IA owns where Next focus is organized and scoped, not the write operation."
  - source: UJ-KNOWLEDGE-SELECT
    status: NOT_APPLICABLE
    rationale: "Selecting Subject Knowledge for inspection is interaction behavior. IA already provides independently findable Knowledge organization and local scope without defining selection mechanics."
  - source: UJ-ACTIVITY-CAPTURE
    status: NOT_APPLICABLE
    rationale: "Capturing historical Performance/Observation records is application/learner-model behavior; IA organizes reviewable activity and evidence information, not capture processing."
  - source: UJ-ACTIVITY-EVALUATE
    status: NOT_APPLICABLE
    rationale: "Evidence evaluation is application/learner-model behavior; IA only organizes the inspectable resulting evidence/current-state information."
  - source: UJ-ACTIVITY-REPROJECT
    status: NOT_APPLICABLE
    rationale: "Recomputing a Target-relative projection is application/learner-model behavior; IA organizes the resulting Current position and contextual Evidence/change review."
  - source: UJ-PREPARE-SUPPORT-DERIVE
    status: NOT_APPLICABLE
    rationale: "Deriving and routing owner-scoped candidate semantics is preparation/application behavior; IA owns the contextual recovery location and return/findability structure, not derivation processing."
