version: 1
kind: harness-artifact-admission-candidate
id: INFORMATION-ARCHITECTURE
capability: prep.information-architecture
path: docs/interface/information-architecture.yaml
changed_paths:
  - docs/interface/information-architecture.yaml
canonical_references:
  - {artifact: INFORMATION-ARCHITECTURE, referenced_path: docs/interface/conceptual-interface-model.yaml}
  - {artifact: INFORMATION-ARCHITECTURE, referenced_path: docs/application/task-model.yaml}
  - {artifact: INFORMATION-ARCHITECTURE, referenced_path: docs/application/user-journeys.md}

semantic_assertions:
  - id: IA-ROOT
    kind: information-location
    subject: active-preparation
    semantic_value: "Preparation is the root conceptual location that keeps Target work, active Target/current preparation direction, Current position, Knowledge and Activities coherent; Target comparison and active-Target understanding share one Target information area, while evaluated activity Evidence & changes review remains contextual rather than a peer global destination."
    derived_from: [CIM-TARGET-COMPARISON, CIM-TARGET, CIM-CURRENT-STATE, CIM-NEXT-FOCUS, UJ-TARGET-DIRECTION, UJ-TARGET-SETUP, UJ-DIRECTION]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-TARGETS
    kind: information-location
    subject: target-work-location
    semantic_value: "Targets is one cohesive Target information area containing distinct candidate-comparison and active-Target sublocations; the grouping follows the shared Target concept and compare -> choose -> establish/refine -> reconsider continuity rather than Journey/task/frontend responsibility decomposition."
    derived_from: [CIM-TARGET-COMPARISON, CIM-TARGET, CIM-TARGET-REQUIREMENT, CIM-REQUIRED-CAPABILITY, TM-TASK-COMPARE-TARGETS, TM-TASK-ESTABLISH-TARGET, TM-TASK-UNDERSTAND-REQUIREMENTS, UJ-TARGET-DIRECTION, UJ-TARGET-SETUP]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-TARGET-COMPARISON
    kind: information-location
    subject: target-comparison-location
    semantic_value: "Candidate comparison is a sublocation of Targets for comparing two or more candidate Targets against the same evidence-backed learner capability basis, exposing shared/target-specific requirements, per-target demonstrated/challenged/unknown state and gaps/uncertainty before one Target is chosen."
    derived_from: [CIM-TARGET-COMPARISON, CIM-REL-COMPARISON-TARGET, CIM-REL-COMPARISON-STATE, TM-TASK-COMPARE-TARGETS, UJ-TARGET-DIRECTION]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-TARGET
    kind: information-location
    subject: active-target-location
    semantic_value: "Active Target is a sublocation of Targets for Target establishment/refinement and requirement understanding around Target, Target requirement, Required capability and direct Knowledge focus, keeping candidate comparison, Subject Knowledge predicates and learner state conceptually distinct."
    derived_from: [CIM-TARGET, CIM-TARGET-REQUIREMENT, CIM-REQUIRED-CAPABILITY, CIM-KNOWLEDGE, CIM-REL-CAPABILITY-KNOWLEDGE, TM-TASK-ESTABLISH-TARGET, TM-TASK-UNDERSTAND-REQUIREMENTS, UJ-TARGET-SETUP]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-CURRENT
    kind: information-location
    subject: current-position-location
    semantic_value: "Current position groups evidence-backed current state, why-this-state, gaps/uncertainty and next focus so the learner can understand position and decide direction without a scalar mastery view."
    derived_from: [CIM-CURRENT-STATE, CIM-EVIDENCE-BASIS, CIM-GAP, CIM-NEXT-FOCUS, UJ-DIRECTION]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-KNOWLEDGE
    kind: information-location
    subject: knowledge-location
    semantic_value: "Knowledge is an independently findable conceptual location for Subject Knowledge orientation, relationship meaning and overview-to-detail scope under target/focus context, optionally bounded by a selected Required Capability."
    derived_from: [CIM-KNOWLEDGE, CIM-KNOWLEDGE-SCOPE, CIM-REL-CAPABILITY-KNOWLEDGE, UJ-KNOWLEDGE]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-ACTIVITIES
    kind: information-location
    subject: activities-location
    semantic_value: "Activities groups contextual support-fit inspection/selection and concrete learning/practice/diagnostic/retention/transfer activity under the current focus and learner basis while preserving target context and the activity-versus-evidence distinction."
    derived_from: [CIM-NEXT-FOCUS, CIM-SUPPORT, CIM-ACTIVITY, UJ-ACTIVITY-EVIDENCE]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-EVIDENCE
    kind: information-location
    subject: evidence-changes-location
    semantic_value: "Evidence & changes is a contextual review location for one evaluated activity result, exposing evidence, changed/no-change/challenged/unresolved meaning and continuation while Current position retains ownership of ordinary why-this-state inspection."
    derived_from: [CIM-EVIDENCE, CIM-EVIDENCE-BASIS, CIM-CURRENT-STATE, CIM-CHANGE, CIM-REL-EVIDENCE-STATE, UJ-ACTIVITY-EVIDENCE]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-LOC-PREP-SUPPORT
    kind: information-location
    subject: prepare-support-location
    semantic_value: "Prepare missing support is a contextual recovery location entered from the work that found a missing preparation need and returns to that originating work with accepted support and remaining gaps."
    derived_from: [CIM-PREPARATION-REQUEST, CIM-SUPPORT, CIM-REL-PREPARATION-SUPPORT, UJ-PREPARE-SUPPORT]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-SCOPE-TARGET
    kind: information-scope
    subject: active-target-context
    semantic_value: "Active Target is shared contextual scope across preparation information when present; the Targets area makes that context recoverable, and changing it changes target-relative state/gap/focus interpretation without mutating reusable Capability/Knowledge or historical evidence."
    derived_from: [CIM-TARGET, CIM-REL-TARGET-CAPABILITY, UJ-SHARED-OWNERSHIP, UJ-TARGET-SETUP]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-SCOPE-FOCUS
    kind: information-scope
    subject: active-focus-context
    semantic_value: "Next focus scopes Knowledge/Activities/Evidence work when present but its absence does not block Target or Current position inspection."
    derived_from: [CIM-NEXT-FOCUS, CIM-REL-GAP-FOCUS]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-SCOPE-KNOWLEDGE
    kind: information-scope
    subject: knowledge-exploration-scope
    semantic_value: "Knowledge scope/depth is local exploration state under Knowledge; a selected Required Capability may anchor that scope through its direct Knowledge focus, and applying/clearing the criterion never becomes global truth or Knowledge/Capability identity."
    derived_from: [CIM-KNOWLEDGE-SCOPE, CIM-REL-SCOPE-KNOWLEDGE, CIM-REL-CAPABILITY-KNOWLEDGE]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-STRUCTURE
    kind: information-structure
    subject: preparation-information-hierarchy
    semantic_value: "The information hierarchy is user-facing concept/task cohesive: Preparation root contains one Targets parent plus Current position, Knowledge and Activities; Targets contains distinct Candidate comparison and Active Target sublocations, while Evidence & changes and Prepare missing support remain contextual branches. The hierarchy does not infer one Journey/task/frontend responsibility = one location."
    derived_from: [TM-GOAL-TARGET-DIRECTION, TM-GOAL-PREPARE, TM-GOAL-SUPPORT, UJ-TARGET-DIRECTION, UJ-TARGET-SETUP, UJ-DIRECTION, UJ-KNOWLEDGE, UJ-ACTIVITY-EVIDENCE, UJ-PREPARE-SUPPORT]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-CROSSLINKS
    kind: information-crosslink
    subject: preparation-cross-links
    semantic_value: "Cross-links preserve preparation continuity: Candidate comparison↔Active Target inside one Targets parent for choose/establish/reconsider; Active Target→Current position/Knowledge; Current position→Knowledge/Activities; Knowledge→Activities; Activities→contextual Evidence/change review; Evidence/change→Current position/continuation; missing support→Prepare missing support→origin."
    derived_from: [CIM-REL-COMPARISON-TARGET, CIM-REL-COMPARISON-STATE, CIM-REL-ACTIVITY-EVIDENCE, CIM-REL-PREPARATION-SUPPORT, UJ-TARGET-DIRECTION, UJ-TARGET-SETUP, UJ-DIRECTION, UJ-KNOWLEDGE, UJ-ACTIVITY-EVIDENCE, UJ-PREPARE-SUPPORT]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-TAXONOMY
    kind: information-taxonomy
    subject: learner-facing-terminology
    semantic_value: "Stable information labels use learner-facing Target, Current state/position, Gap or uncertainty, Next focus, Knowledge, Preparation support and Evidence; internal model-context/entity jargon and graph dimensionality are not primary information categories."
    derived_from: [CIM-SEMANTIC-BOUNDARIES, CIM-PRESENTATION-FREEDOM]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-FINDABILITY
    kind: information-findability-assumption
    subject: findability-assumptions
    semantic_value: "One Target information area with distinct candidate-comparison and active-Target sublocations, active Target context recovery, the Current position label, same-context why-this-state evidence access, contextual post-activity Evidence/change review, contextual missing-support recovery and independent Knowledge findability are explicit UX assumptions to validate downstream rather than hidden topology facts."
    derived_from: [UJ-TARGET-DIRECTION, UJ-TARGET-SETUP, UJ-DIRECTION, UJ-KNOWLEDGE, UJ-PREPARE-SUPPORT]
    decision_authority: HUMAN-INTERFACE-DESIGN

  - id: IA-NO-SCREEN
    kind: information-invariant
    subject: ia-screen-boundary
    semantic_value: "Information locations/hierarchy/cross-links do not decide URL routes, pages/views, menus/tabs, screen regions, responsive layout, graph representation or components."
    derived_from: [CIM-PRESENTATION-FREEDOM]
    decision_authority: HUMAN-INTERFACE-DESIGN

semantic_review:
  status: ACCEPTED
  checks:
    - source-discipline
    - authority-boundary
    - no-invention
    - information-structure-not-screen-layout
