  retirement_review:
  - requirement: REQ-CAP-KNOWLEDGE-KINDS
    status: RETIRED
    basis: Current intent requires exploration of in-scope information; it does not
      commit to differentiating kinds within knowledge or a user-visible taxonomy.
      Retirement adds no prohibition; all modeled kinds retain mandatory CRUD and
      bulk load.
  - requirement: REQ-CAP-RELATIONSHIP-MEANINGS
    status: RETIRED
    basis: Relationship exploration remains active; an additional user-visible meaning-differentiation
      obligation is not accepted in intent. No new taxonomy or prohibition is decided.
  - requirement: REQ-CAP-CROSS-INFORMATION-RELATIONSHIPS
    status: RETIRED
    basis: Every accepted in-scope relationship remains explorable and manageable.
      Arbitrary cross-kind connectivity is not required by intent; valid link semantics
      remain downstream.
  - requirement: REQ-CAP-PRESERVE-HISTORY-CONTEXT
    status: RETIRED
    basis: Temporal understanding and identifying related in-scope information remain
      active. A guarantee after related data changes/removal is not accepted in intent,
      which explicitly leaves historical consistency downstream while preserving owner
      CRUD. Retirement is not permission to violate current understanding requirements
      or to forbid historical support.
  coverage_review: Every active intent requirement is mapped to active capability
    requirements; all source_refs resolve to accepted intent assertions. No additional
    product-owner choice is needed to admit this bounded surface.
