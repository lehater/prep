research_sources: []
axes:
- axis: application-surface
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: document-vs-bounded-workspace
    challenge: Compare page-owned document flow with an application-owned bounded workspace while preserving the same accepted preparation tasks and context continuity.
    alternatives:
    - document-page-flow
    - bounded-desktop-workbench
    - step-task-flow
  - strategy: workspace-vs-step-flow
    challenge: Compare a persistent task workspace with a step-dominant progression and test whether users can revisit Target, Current, Knowledge and Activity context without inventing a new stage model.
    alternatives:
    - bounded-desktop-workbench
    - step-task-flow
    - document-page-flow
  - strategy: page-scroll-vs-region-overflow
    challenge: Move overflow ownership between the page and bounded task regions and test whether wide multi-region inspection keeps stable application context.
    alternatives:
    - document-page-flow
    - bounded-desktop-workbench
  - strategy: persistent-vs-contextual-navigation
    challenge: Remove persistent preparation navigation on capable wide surfaces and test the blast radius across cross-view task continuity.
    alternatives:
    - document-page-flow
    - bounded-desktop-workbench
    - step-task-flow
  decision_points:
  - id: shared-application-surface
    alternatives:
    - id: document-page-flow
      difference: The document/page owns vertical flow and primary overflow; navigation is page/contextual rather than a persistent application region.
      material_effects:
        surface-archetype: document-flow
        viewport-ownership: page-document
        navigation-persistence: contextual-or-page
        overflow-ownership: document-page
    - id: bounded-desktop-workbench
      difference: The application shell owns the viewport, keeps preparation navigation persistent on capable wide surfaces and delegates bounded overflow to task regions.
      material_effects:
        surface-archetype: bounded-workbench
        viewport-ownership: application-shell
        navigation-persistence: persistent-on-capable-wide
        overflow-ownership: task-regions
    - id: step-task-flow
      difference: A step surface owns the active viewport and progression replaces simultaneous/revisitable workspace context.
      material_effects:
        surface-archetype: step-task-flow
        viewport-ownership: step-surface
        navigation-persistence: progression-primary
        overflow-ownership: step-content
- axis: knowledge-representation
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: graph-vs-nongraph
    challenge: Compare task-complete semantic query/result/detail without graph against
      mixed relationship visualization and graph-primary variants.
    alternatives:
    - nonspatial-only
    - mixed-2d-plus-nonspatial
    - three-d-primary-plus-nonspatial
    - dual-2d-3d-plus-nonspatial
  - strategy: 2d-vs-3d
    challenge: Perturb spatial dimensionality while preserving identical Knowledge
      identity, relationship meaning and nonspatial task completion.
    alternatives:
    - mixed-2d-plus-nonspatial
    - three-d-primary-plus-nonspatial
    - dual-2d-3d-plus-nonspatial
  - strategy: single-vs-mixed
    challenge: Compare one canonical representation with linked/parallel semantic
      plus spatial representations.
    alternatives:
    - nonspatial-only
    - mixed-2d-plus-nonspatial
    - three-d-primary-plus-nonspatial
    - dual-2d-3d-plus-nonspatial
  decision_points:
  - id: shared-knowledge-representation
    alternatives:
    - id: nonspatial-only
      difference: Knowledge uses query/list/detail and explicit relation traversal
        only.
      material_effects:
        representation-form: semantic-query-detail
        spatial-dimensionality: none
        relation-encoding: textual-structured
    - id: mixed-2d-plus-nonspatial
      difference: Task-complete nonspatial path is combined with optional 2D node-link
        relationship overview.
      material_effects:
        representation-form: mixed
        spatial-dimensionality: 2d
        relation-encoding: node-link-plus-explicit-semantic-detail
    - id: three-d-primary-plus-nonspatial
      difference: 3D graph is the primary orientation surface with a nonspatial fallback/equivalent
        path.
      material_effects:
        representation-form: graph-primary-mixed
        spatial-dimensionality: 3d
        relation-encoding: 3d-node-link-plus-semantic-detail
    - id: dual-2d-3d-plus-nonspatial
      difference: 2D and 3D graph modes are both first-class alongside nonspatial
        access.
      material_effects:
        representation-form: multi-spatial-mixed
        spatial-dimensionality: 2d-and-3d
        relation-encoding: multiple-linked-metaphors
- axis: information-density
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: dense-vs-progressive
    challenge: Compare persistent simultaneous context/basis/details with progressive
      focus+context and sparse sequencing.
    alternatives:
    - dense-simultaneous-workspace
    - progressive-focus-context
    - sparse-stepper
  - strategy: focus-context-shift
    challenge: Move secondary evidence/detail from always-visible to disclosed while
      preserving direct inspectability.
    alternatives:
    - dense-simultaneous-workspace
    - progressive-focus-context
    - sparse-stepper
  - strategy: always-visible-vs-on-demand
    challenge: Test whether provenance, evidence basis and detail must remain visible
      continuously for accepted tasks.
    alternatives:
    - dense-simultaneous-workspace
    - progressive-focus-context
    - sparse-stepper
  decision_points:
  - id: shared-density-model
    alternatives:
    - id: dense-simultaneous-workspace
      difference: Primary task, basis, provenance and controls remain concurrently
        visible.
      material_effects:
        simultaneous-context: high
        detail-disclosure: always-visible
        label-density: high
    - id: progressive-focus-context
      difference: Primary task dominates while essential context remains recoverable
        and secondary detail is disclosed.
      material_effects:
        simultaneous-context: moderate
        detail-disclosure: progressive
        label-density: adaptive
    - id: sparse-stepper
      difference: Most context is hidden behind sequential task steps.
      material_effects:
        simultaneous-context: low
        detail-disclosure: sequential
        label-density: low
- axis: control-surface
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: inline-vs-dedicated-controls
    challenge: Compare global/persistent toolbars with controls near the task information
      they affect.
    alternatives:
    - persistent-global-toolbars
    - contextual-controls-keyboard-equivalent
    - direct-manipulation-dominant
  - strategy: direct-manipulation-vs-command
    challenge: Compare named/queryable actions with graph/spatial direct manipulation
      as the dominant control model.
    alternatives:
    - persistent-global-toolbars
    - contextual-controls-keyboard-equivalent
    - direct-manipulation-dominant
  - strategy: pointer-vs-keyboard
    challenge: Perturb pointer availability and require equivalent task completion
      from keyboard/nonspatial controls.
    alternatives:
    - persistent-global-toolbars
    - contextual-controls-keyboard-equivalent
    - direct-manipulation-dominant
  decision_points:
  - id: shared-control-surface
    alternatives:
    - id: persistent-global-toolbars
      difference: Many task controls persist globally across views.
      material_effects:
        control-persistence: high-global
        direct-manipulation: optional
        keyboard-equivalence: mixed
    - id: contextual-controls-keyboard-equivalent
      difference: Only context/navigation persists; task controls stay local and have
        keyboard/named equivalents.
      material_effects:
        control-persistence: context-only
        direct-manipulation: supplemental
        keyboard-equivalence: required
    - id: direct-manipulation-dominant
      difference: Spatial/pointer manipulation is the main interaction surface with
        secondary named controls.
      material_effects:
        control-persistence: spatial-surface
        direct-manipulation: dominant
        keyboard-equivalence: secondary
decision_space_review:
