  decision_points:
  - id: target-comparison-active-target-boundary
    subjects:
    - BOUNDARY-TARGET-COMPARISON-ACTIVE-TARGET
    alternatives:
    - id: one-target-view
      difference: One Target view keeps comparison and active-Target roles behaviorally
        distinct without navigation.
      material_effects:
        goal-continuity: continuous Target decision
        information-dependency: shared Target/evidence context
        working-state-continuity: candidate state carries into establishment
        commit-recovery-boundary: activation stays semantic, not navigational
        mode-authority-boundary: role transition stays explicit
        independent-addressability: contexts remain addressable within one view
    - id: two-target-views
      difference: Separate comparison and active-Target views.
      material_effects:
        goal-continuity: splits continuous Target decision
        information-dependency: shared context crosses navigation
        working-state-continuity: candidate state must survive navigation
        commit-recovery-boundary: adds navigation around establishment/reconsideration
        mode-authority-boundary: role transition risks coupling to destination change
        independent-addressability: adds independent destinations
    - id: contextual-target-topology
      difference: Make one Target concern primary and the other contextual.
      material_effects:
        goal-continuity: creates unsupported asymmetry
        information-dependency: shared context becomes subordinate
        working-state-continuity: persistent state remains possible
        commit-recovery-boundary: adds enter/return semantics
        mode-authority-boundary: implies primary role
        independent-addressability: limits contextual revisit
  - id: target-current-boundary
    subjects:
    - BOUNDARY-TARGETS-CURRENT
    alternatives:
    - id: separate-target-current
      difference: Keep Target and Current as separate views.
      material_effects:
        goal-continuity: intentional goal switch
        information-dependency: different information dependencies
        working-state-continuity: independent working states
        commit-recovery-boundary: clear recovery ownership
        mode-authority-boundary: Target-definition vs preparation-direction contexts
        independent-addressability: both independently revisitable
    - id: merge-target-current
      difference: Merge Target and Current.
      material_effects:
        goal-continuity: mixes distinct goals
        information-dependency: increases simultaneous burden
        working-state-continuity: couples working states
        commit-recovery-boundary: blurs recovery
        mode-authority-boundary: collapses contexts
        independent-addressability: weakens resume/deep-link
  - id: target-knowledge-boundary
    subjects:
    - BOUNDARY-TARGETS-KNOWLEDGE
    alternatives:
    - id: separate-target-knowledge
      difference: Separate Target and Knowledge with context-preserving entry.
      material_effects:
        goal-continuity: explicit goal switch
        information-dependency: Knowledge has independent dependencies
        working-state-continuity: local scope independent
        commit-recovery-boundary: no Target mutation
        mode-authority-boundary: distinct context
        independent-addressability: Knowledge independently revisitable
    - id: merge-target-knowledge
      difference: Merge Knowledge into Target.
      material_effects:
        goal-continuity: mixes requirement and orientation goals
        information-dependency: broadens Target dependencies
        working-state-continuity: couples Knowledge scope
        commit-recovery-boundary: blurs recovery
        mode-authority-boundary: collapses contexts
        independent-addressability: removes independent Knowledge destination
  - id: current-knowledge-boundary
    subjects:
    - BOUNDARY-CURRENT-KNOWLEDGE
    alternatives:
    - id: separate-current-knowledge
      difference: Separate direction decisions and Knowledge orientation.
      material_effects:
        goal-continuity: intentional goal switch
        information-dependency: different inputs
        working-state-continuity: independent local states
        commit-recovery-boundary: clear return
        mode-authority-boundary: distinct contexts
        independent-addressability: both addressable
    - id: merge-current-knowledge
      difference: Merge Knowledge into Current.
      material_effects:
        goal-continuity: mixes decision/orientation
        information-dependency: co-locates excess information
        working-state-continuity: couples scope/focus
        commit-recovery-boundary: blurs return
        mode-authority-boundary: collapses contexts
        independent-addressability: reduces Knowledge findability
  - id: current-activity-boundary
    subjects:
    - BOUNDARY-CURRENT-ACTIVITY
    alternatives:
    - id: separate-current-activity
      difference: Separate focus choice from activity attempt.
      material_effects:
        goal-continuity: planning→doing transition
        information-dependency: attempt-specific dependencies
        working-state-continuity: attempt state independent
        commit-recovery-boundary: begin/submit/recovery boundary
        mode-authority-boundary: decision→performance mode
        independent-addressability: activity resumable
    - id: merge-current-activity
      difference: Run activity inside Current.
      material_effects:
        goal-continuity: mixes planning/execution
        information-dependency: co-locates attempt data
        working-state-continuity: couples focus/attempt
        commit-recovery-boundary: blurs recovery
        mode-authority-boundary: collapses modes
        independent-addressability: weakens resume
  - id: knowledge-activity-boundary
    subjects:
    - BOUNDARY-KNOWLEDGE-ACTIVITY
    alternatives:
    - id: separate-knowledge-activity
      difference: Separate orientation from activity attempt.
      material_effects:
        goal-continuity: understanding→performing transition
        information-dependency: different dependencies
        working-state-continuity: scope/attempt state independent
        commit-recovery-boundary: attempt boundary explicit
        mode-authority-boundary: orientation→performance
        independent-addressability: both revisitable
    - id: merge-knowledge-activity
      difference: Perform activity inside Knowledge.
      material_effects:
        goal-continuity: mixes goals
        information-dependency: forces attempt data into Knowledge
        working-state-continuity: couples states
        commit-recovery-boundary: blurs recovery
        mode-authority-boundary: collapses contexts
        independent-addressability: weakens activity resume
  - id: activity-evidence-boundary
    subjects:
    - BOUNDARY-ACTIVITY-EVIDENCE-CHANGE
    alternatives:
    - id: contextual-evidence-view
      difference: Separate contextual post-activity review.
      material_effects:
        goal-continuity: activity→review continuation
        information-dependency: reviewed-result dependency
        working-state-continuity: attempt hands off to review
        commit-recovery-boundary: evaluation/review boundary explicit
        mode-authority-boundary: performance→interpretation
        independent-addressability: contextual direct entry
    - id: merge-evidence-into-activity
      difference: Review inside Activity.
      material_effects:
        goal-continuity: single activity surface
        information-dependency: co-locates attempt/result
        working-state-continuity: couples states
        commit-recovery-boundary: weakens post-evaluation boundary
        mode-authority-boundary: reduces switch
        independent-addressability: no contextual review addressability
    - id: global-evidence-destination
      difference: Make Evidence a global destination.
      material_effects:
        goal-continuity: turns continuation into browsing
        information-dependency: requires unsupported discovery
        working-state-continuity: detaches origin
        commit-recovery-boundary: weakens origin recovery
        mode-authority-boundary: contextual→global mode
        independent-addressability: adds unsupported global addressability
  - id: prepare-support-origin-boundary
    subjects:
    - BOUNDARY-PREPARE-SUPPORT-ORIGIN
    alternatives:
    - id: contextual-support-view
      difference: Separate contextual recovery preserving origin.
      material_effects:
        goal-continuity: temporarily suspends origin goal
        information-dependency: request/remainder dependency
        working-state-continuity: recovery state persists
        commit-recovery-boundary: request/resume/return boundary
        mode-authority-boundary: recovery mode
        independent-addressability: contextual resume
    - id: merge-support-inline
      difference: Resolve support inline in every origin.
      material_effects:
        goal-continuity: duplicates recovery
        information-dependency: duplicates dependencies
        working-state-continuity: couples recovery to origins
        commit-recovery-boundary: obscures boundary
        mode-authority-boundary: no recovery context
        independent-addressability: no independent contextual resume
    - id: global-support-destination
      difference: Make support global.
      material_effects:
        goal-continuity: detaches motivating work
        information-dependency: requires unsupported browsing
        working-state-continuity: loses origin risk
        commit-recovery-boundary: weakens return
        mode-authority-boundary: recovery→global mode
        independent-addressability: adds unsupported global addressability
