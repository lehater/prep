version: 1
kind: harness-artifact-admission-candidate
id: SCREEN-VIEW-DESIGN
capability: prep.screen-view-design
path: docs/interface/screen-view-design.md
changed_paths: [docs/interface/screen-view-design.md]
canonical_references:
  - {artifact: SCREEN-VIEW-DESIGN, referenced_path: docs/interface/interface-topology.yaml}
  - {artifact: SCREEN-VIEW-DESIGN, referenced_path: docs/interface/interaction-design.yaml}
  - {artifact: SCREEN-VIEW-DESIGN, referenced_path: docs/interface/presentation-system.md}
  - {artifact: SCREEN-VIEW-DESIGN, referenced_path: docs/interface/machine-interface.md}
  - {artifact: SCREEN-VIEW-DESIGN, referenced_path: docs/architecture/performance-capacity.md}
decision_review:
  axes:
    - axis: view-composition
      decisions:
        - id: shared-view-composition
          owner_authority: HUMAN-INTERFACE-DESIGN
          alternatives:
            - {id: task-primary-with-contextual-secondary, state: VIABLE}
            - {id: peer-panel-workspace, state: REJECTED, rationale: "Would give supporting provenance/detail equal visual priority to the task surface and increase simultaneous cognitive load."}
            - {id: single-stream-only, state: REJECTED, rationale: "Would prevent useful simultaneous context/detail on wide screens and overconstrain all views to one linear presentation."}
          disposition: DETERMINED
          selected: task-primary-with-contextual-secondary
    - axis: detail-edit-placement
      decisions:
        - id: shared-detail-placement
          owner_authority: HUMAN-INTERFACE-DESIGN
          alternatives:
            - {id: same-view-contextual-detail, state: VIABLE}
            - {id: overlay-detail, state: REJECTED, rationale: "No accepted task needs modal/overlay semantics as a shared rule and overlays risk context/focus discontinuity."}
            - {id: dedicated-detail-view, state: REJECTED, rationale: "Topology does not define separate detail views and task completion does not require them."}
          disposition: DETERMINED
          selected: same-view-contextual-detail
        - id: editing-capability
          owner_authority: HUMAN-INTERFACE-DESIGN
          alternatives:
            - {id: no-edit-surface, state: VIABLE}
            - {id: inline-edit, state: REJECTED, rationale: "No accepted frontend task/machine command authorizes reusable semantic editing."}
            - {id: dedicated-editor-view, state: REJECTED, rationale: "No accepted topology/task/machine command provides an editor capability."}
          disposition: DETERMINED
          selected: no-edit-surface
    - axis: responsive-composition
      decisions:
        - id: shared-responsive-model
          owner_authority: HUMAN-INTERFACE-DESIGN
          alternatives:
            - {id: priority-preserving-reflow-disclosure, state: VIABLE}
            - {id: fixed-wide-composition, state: REJECTED, rationale: "Would fail narrow surfaces and leave focus/read order undefined."}
            - {id: separate-mobile-view-set, state: REJECTED, rationale: "Would introduce a second product topology without an accepted task/product reason."}
          disposition: DETERMINED
          selected: priority-preserving-reflow-disclosure
semantic_assertions:
  - {id: SV-FRAME, kind: screen-composition, subject: FRAME-PREPARATION, semantic_value: "Structural frame presents preparation navigation including Targets comparison, recoverable active Target/focus context when established and one active child task surface; it excludes curation/editor/runtime workspaces.", derived_from: [TOP-ROOT, IX-TARGET-DIRECTION, IX-CONTEXT-CONTINUITY, PS-PATTERN-CONTEXT], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-TARGETS, kind: screen-composition, subject: VIEW-TARGETS, semantic_value: "Targets view uses candidate-selection when fewer than two usable candidates exist and comparison-ready when two or more current candidate projections exist; exactly one of candidate selection or aligned comparison is dominant, with no scalar fit score, target activation side effect or duplicated learner profile.", derived_from: [TOP-VIEW-TARGETS, IX-TARGET-DIRECTION, PS-PATTERN-TARGET-COMPARISON, MI-REP-TARGET-COMPARISON, MI-OP-TARGETS-COMPARE], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-TARGET, kind: screen-composition, subject: VIEW-TARGET, semantic_value: "Target view uses target-setup while accepted Target meaning is absent or materially unresolved, then target-established with requirements as the dominant work surface once usable Target meaning exists; provenance and direct Knowledge focus remain supporting context.", derived_from: [TOP-VIEW-TARGET, IX-TARGET, PS-TASK-HIERARCHY, MI-REP-REQUIREMENT, MI-OP-TARGET-ESTABLISH, MI-OP-REQUIREMENTS-GET, MI-OP-PREP-REQUEST], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-CURRENT, kind: screen-composition, subject: VIEW-CURRENT, semantic_value: "Current view prioritizes evidence-backed state, gaps/uncertainty and Next-focus decision with priority/external-constraint/support-availability context while keeping why-this-state detail inspectable but secondary.", derived_from: [TOP-VIEW-CURRENT, IX-DIRECTION, PS-PATTERN-STATE-BASIS, MI-REP-GAP, MI-OP-STATE-GET, MI-OP-GAPS-GET, MI-OP-FOCUS-SET], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-KNOWLEDGE, kind: screen-composition, subject: VIEW-KNOWLEDGE, semantic_value: "Knowledge view composes query/scope with an explicit optional Required Capability filter and visible scope basis, task-complete nonspatial results/detail and optional 2D relationship overview bounded to the active scope; clearing the filter restores broader target/focus scope and narrow/degraded states preserve nonspatial completion.", derived_from: [TOP-VIEW-KNOWLEDGE, IX-KNOWLEDGE, PS-KNOWLEDGE-REPRESENTATION, PS-PATTERN-QUERY-DETAIL, PS-DEGRADATION, MI-OP-KNOWLEDGE-QUERY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-ACTIVITY, kind: screen-composition, subject: VIEW-ACTIVITY, semantic_value: "Activity view progresses within one view from support-selection to attempt-active to evidence-processing, with exactly one dominant work region per variant; duplicate completion is unavailable while pending and activity completion is never styled as capability completion.", derived_from: [TOP-VIEW-ACTIVITY, IX-ACTIVITY, PS-PATTERN-ACTIVITY, MI-REP-SUPPORT, MI-OP-SUPPORT-LIST, MI-OP-ACTIVITY-START, MI-OP-ACTIVITY-COMPLETE], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-EVIDENCE, kind: screen-composition, subject: VIEW-EVIDENCE-CHANGE, semantic_value: "Evidence/change view has current-state-evidence and post-activity-change variants: evidence detail is dominant for a Current-state explanation, while change summary is dominant after Activity; learner-evidence change stays distinct from Target-information refinement and continuation actions are explicit.", derived_from: [TOP-VIEW-EVIDENCE, IX-ACTIVITY, PS-PATTERN-STATE-BASIS, PS-OUTCOMES, MI-REP-CHANGE, MI-OP-CHANGE-GET, MI-OP-EVIDENCE-GET], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-PREP-SUPPORT, kind: screen-composition, subject: VIEW-PREPARE-SUPPORT, semantic_value: "Prepare-support view progresses from request-input to result-review or continuation-recovery, making source input, accepted support/remainder, or return/recovery dominant as appropriate without corpus/import/editor semantics.", derived_from: [TOP-VIEW-PREP-SUPPORT, IX-PREP-SUPPORT, PS-PATTERN-PREP-SUPPORT, MI-OP-PREP-REQUEST, MI-OP-PREP-GET], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-COMPOSITION-VARIANTS, kind: screen-rule, subject: state-dependent-composition, semantic_value: "A composition variant is a presentation state of the same accepted view, selected only from accepted interaction/machine outcomes; every concrete variant has exactly one dominant task/work region and preserves required Target/focus/input context without creating a hidden route, mode or domain state.", derived_from: [PS-TASK-HIERARCHY, PS-DENSITY, TOP-NO-COMPOSITION, IX-CURRENTNESS, MI-BASIS], decision_authority: HUMAN-INTERFACE-DESIGN}\n  - {id: SV-DETAIL, kind: screen-rule, subject: contextual-detail-placement, semantic_value: "Supporting detail remains same-view contextual detail/disclosure by default; no view exposes inline or dedicated editing because no accepted task/machine command authorizes it.", derived_from: [PS-DENSITY, PS-FREEDOMS, TOP-NO-COMPOSITION], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-RESPONSIVE, kind: screen-rule, subject: responsive-reflow, semantic_value: "All views use priority-preserving reflow/disclosure with explicit semantic/focus order; no separate mobile product topology is introduced.", derived_from: [PS-RESPONSIVE, PS-ACCESSIBILITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-PERFORMANCE, kind: screen-rule, subject: knowledge-performance-degradation, semantic_value: "Knowledge visualization traces accepted capacity/semantic-preservation constraints and degrades by reducing/omitting spatial richness while retaining task-complete semantic access.", derived_from: [PS-DEGRADATION, QD-SEMANTIC-PRESERVATION, QD-ACTIVE-WORKING-SET-FREEDOM, QD-GRAPH-CONDITIONAL], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: SV-NO-IMPLEMENTATION, kind: screen-invariant, subject: screen-implementation-boundary, semantic_value: "Screen contracts decide regions/priority/state/outcome bindings and responsive semantic transformations but not routes, CSS/DOM/framework/component decomposition or renderer internals.", derived_from: [PS-FREEDOMS, TOP-NO-COMPOSITION], decision_authority: HUMAN-INTERFACE-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, screen-not-product-semantics]
