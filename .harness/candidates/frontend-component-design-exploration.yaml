version: 1
kind: harness-decision-exploration
capability: prep.frontend-component-design
knowledge_kind: component-design
explorer_request_id: sha256:7acedec9604b2c5b94c476f33d6dfea190a37d2500fac64473f1fa0b0250c990
research_sources: []
axes:
- axis: responsibility-boundaries
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: split-vs-merge
    challenge: Compare public feature boundaries aligned to accepted task/view responsibilities
      with finer state/gap/support/diagnostic/progress feature splits.
    alternatives:
    - view-responsibility-features
    - fine-grained-domainish-features
    - monolithic-preparation-feature
  - strategy: feature-vs-technical
    challenge: Compare task-oriented public components with modules grouped around
      data/resource types or generic technical concerns.
    alternatives:
    - view-responsibility-features
    - resource-oriented-features
    - monolithic-preparation-feature
  - strategy: local-vs-shared
    challenge: Promote cross-feature details into shared components and test whether
      ownership becomes ambiguous.
    alternatives:
    - view-responsibility-features
    - shared-semantic-services
    - monolithic-preparation-feature
  decision_points:
  - id: public-feature-boundaries
    alternatives:
    - id: view-responsibility-features
      difference: Public feature components align to current interaction/view responsibilities;
        finer visual decomposition remains private.
      material_effects:
        boundary-granularity: task-view
        ownership-basis: interaction-responsibility
        cross-feature-sharing: minimal
    - id: fine-grained-domainish-features
      difference: Current Position splits into learner-state/gaps/focus and Activity
        splits into learning/diagnostic/evidence/progress feature modules.
      material_effects:
        boundary-granularity: fine
        ownership-basis: data-or-operation-category
        cross-feature-sharing: high
    - id: resource-oriented-features
      difference: Feature modules follow backend/domain resource nouns and CRUD-style
        surfaces.
      material_effects:
        boundary-granularity: resource
        ownership-basis: provider-shape
        cross-feature-sharing: medium
    - id: monolithic-preparation-feature
      difference: One preparation feature owns all task views and local state.
      material_effects:
        boundary-granularity: coarse
        ownership-basis: application-area
        cross-feature-sharing: internal-only
- axis: provider-seams
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: direct-vs-port
    challenge: Compare narrow consumer-owned ports with direct use of concrete mock/transport
      providers.
    alternatives:
    - narrow-consumer-ports
    - aggregated-prep-port
    - direct-provider-use
  - strategy: wrapper-scope-perturbation
    challenge: Collapse all accepted machine operations behind one generalized frontend
      client and compare change coupling.
    alternatives:
    - narrow-consumer-ports
    - aggregated-prep-port
    - direct-provider-use
  - strategy: provider-substitution
    challenge: Replace mock with future transport and spatial renderer independently.
    alternatives:
    - narrow-consumer-ports
    - aggregated-prep-port
  - strategy: provider-substitution
    challenge: Replace or remove the spatial renderer provider and test whether Knowledge
      task semantics remain intact.
    alternatives:
    - optional-renderer-port
    - renderer-inside-feature
  decision_points:
  - id: machine-provider-seams
    alternatives:
    - id: narrow-consumer-ports
      difference: Each task feature consumes the smallest operation set it needs;
        one adapter object may implement multiple ports.
      material_effects:
        seam-location: feature-boundary
        provider-leakage: none
        substitution-scope: per-capability
    - id: aggregated-prep-port
      difference: All task features depend on one broad frontend Prep client contract.
      material_effects:
        seam-location: shared-client
        provider-leakage: low
        substitution-scope: whole-client
    - id: direct-provider-use
      difference: Features use mock/HTTP/provider APIs and DTOs directly.
      material_effects:
        seam-location: none
        provider-leakage: high
        substitution-scope: provider-coupled
  - id: spatial-renderer-seam
    alternatives:
    - id: optional-renderer-port
      difference: Knowledge feature depends on a renderer-neutral optional projection/semantic
        event seam.
      material_effects:
        seam-location: knowledge-renderer
        provider-leakage: none
        substitution-scope: renderer-only
    - id: renderer-inside-feature
      difference: Concrete spatial library objects are part of Knowledge feature contracts.
      material_effects:
        seam-location: inside-feature
        provider-leakage: high
        substitution-scope: feature-wide
- axis: state-ownership
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: local-vs-global
    challenge: Compare local task state plus narrow Preparation Context with one general
      application store.
    alternatives:
    - local-plus-preparation-context
    - general-global-store
  - strategy: server-vs-client-owner
    challenge: Promote fetched learner/target projections from cache to frontend canonical
      state.
    alternatives:
    - local-plus-preparation-context
    - client-canonical-projections
  - strategy: lifecycle-perturbation
    challenge: Keep activity attempt, preparation request and evidence review state
      after leaving their task boundary and test stale/ownership risk.
    alternatives:
    - local-plus-preparation-context
    - cross-feature-workflow-store
  decision_points:
  - id: frontend-state-ownership
    alternatives:
    - id: local-plus-preparation-context
      difference: Active Target/focus continuity is shared narrowly; query/selection/attempt/request/review
        state stays in owning feature/provider cache.
      material_effects:
        state-owner: feature-plus-small-context
        sharing-scope: target-focus-only
        lifecycle: task-bounded
    - id: general-global-store
      difference: Navigation, projections, activity, requests and feature UI state
        live in one general frontend store.
      material_effects:
        state-owner: application-store
        sharing-scope: broad
        lifecycle: application
    - id: client-canonical-projections
      difference: Fetched target/learner/Knowledge projections become canonical browser
        state.
      material_effects:
        state-owner: browser
        sharing-scope: broad
        lifecycle: canonical-client
    - id: cross-feature-workflow-store
      difference: Attempt/request/review transient state is centralized to coordinate
        flows.
      material_effects:
        state-owner: workflow-store
        sharing-scope: workflow-wide
        lifecycle: cross-view
