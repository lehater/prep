      actor: USER
      context: CTX-01
      outcome: Understand preparation information and its relationships, select information
        or material for external preparation activity, and understand the related
        recorded activity and results over time.
      evidence:
      - PROBLEM-EVIDENCE/desired_outcome
      - PE-01
      - PE-02
      - PE-03
    sufficiency_review: &id004
      goal: UG-01
      status: covered
      needs:
      - UN-01
      - UN-02
      - UN-03
      rationale: UN-01 covers understanding information and relationships (PE-01/EV-01),
        UN-02 covers selecting information for external activity (PE-02/EV-02), and
        UN-03 covers understanding recorded activity and results (PE-03/EV-03). These
        needs cover the stated MVP goal only; they do not establish all prerequisites
        for preparation success. EV-03 supports the understanding need without accepting
        storage or relationship behavior as a requirement.
