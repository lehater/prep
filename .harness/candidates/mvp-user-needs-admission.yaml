semantic_review:
  status: ACCEPTED
  checks:
  - source-discipline
  - authority-boundary
  - no-invention
  - need-not-normative-solution
  basis:
    source-discipline: Only the current published PROBLEM-EVIDENCE and this User Needs
      artifact were reviewed. Source assertions match accepted upstream atom fingerprints.
      No legacy or downstream evidence is consumed.
    authority-boundary: Needs describe intended human outcomes independently of UI,
      APIs, storage, imports, statistics or task orchestration. EV-03 is consumed
      under its accepted interpretation boundary.
    no-invention: The formerly unbounded preparation goal is narrowed to the three
      accepted MVP outcomes. No observed tasks, preparation-success claim or learner-state
      inference is invented.
    need-not-normative-solution: UN-01/02/03 express understanding, selection and
      historical understanding; product behavior remains a separate Product Requirements
      decision.
  sufficiency_review:
  - *id004
  need_derivations:
  - need: UN-01
    sources: *id001
    rationale: PE-01 establishes information/relationship opacity and EV-01 supports
      the desired perspectives; UN-01 states the human understanding outcome without
      choosing a representation.
  - need: UN-02
    sources: *id002
    rationale: PE-02 and EV-02 establish the need to select part for external preparation;
      UN-02 chooses no transfer format, runtime or workflow.
  - need: UN-03
    sources: *id003
    rationale: PE-03 establishes opacity of recorded activity and EV-03 supports temporal
      interpretation; UN-03 preserves the accepted evidence boundary and accepts no
      storage requirement.
