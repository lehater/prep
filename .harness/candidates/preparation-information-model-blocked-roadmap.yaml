      material_dimensions:
      - valid-state-space
      - enforcement-owner
      - exception-policy
      challenge_strategies:
      - relax-invariant
      - strengthen-invariant
      - move-enforcement-owner
      minimum_probes: 2
    - axis: lifecycle
      exploration: EXPLORE
      material_dimensions:
      - state-set
      - transition-ownership
      - terminality
      challenge_strategies:
      - state-split
      - state-merge
      - transition-perturbation
      minimum_probes: 2
    - axis: relationships
      exploration: EXPLORE
      material_dimensions:
      - relation-vs-entity
      - directionality
      - cardinality
      challenge_strategies:
      - entity-vs-relation
      - reverse-direction
      - cardinality-perturbation
      minimum_probes: 2
    - axis: responsibility-boundaries
      exploration: EXPLORE
      material_dimensions:
      - semantic-owner
      - boundary-placement
      - downstream-freedom
      challenge_strategies:
      - move-owner-upstream
      - move-owner-downstream
      - split-responsibility
      minimum_probes: 2
    forbidden_inputs:
