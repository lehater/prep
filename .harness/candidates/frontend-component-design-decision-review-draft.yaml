version: 1
kind: prep-noncanonical-decision-review
noncanonical: true
capability: prep.frontend-component-design
knowledge_kind: component-design
exploration_ref: .harness/candidates/frontend-component-design-exploration-draft.yaml
admission_status: NOT_REQUEST_BOUND
admission_blocker: >-
  Legacy lifecycle is incomplete and the upstream frontend-system-architecture revision
  is a non-admitted draft. These dispositions guide a draft component candidate only.

decisions:
  - id: public-feature-boundaries
    disposition: DETERMINED
    selected: view-responsibility-features
    alternatives:
      - {id: view-responsibility-features, status: VIABLE, reason: Directly realizes accepted Interaction/Screen View responsibilities while leaving private component split free.}
      - {id: fine-grained-domainish-features, status: REJECTED, reason: Reintroduces Learning/Diagnostics/Progress splits not present in the accepted UI responsibility model.}
      - {id: resource-oriented-features, status: REJECTED, reason: Shapes code-facing UI modules around resource/domain nouns rather than task responsibilities.}
      - {id: monolithic-preparation-feature, status: REJECTED, reason: Loses independently changing task-feature responsibilities and provider seams.}

  - id: machine-provider-seams
    disposition: DELEGATED
    selected: narrow-consumer-ports
    alternatives:
      - {id: narrow-consumer-ports, status: VIABLE, reason: Lowest coupling and most directly consumer-shaped; one adapter may implement several interfaces.}
      - {id: aggregated-prep-port, status: VIABLE, reason: Could preserve semantics but creates a broader change surface with no current benefit.}
      - {id: direct-provider-use, status: REJECTED, reason: Leaks provider/transport details and prevents independent mock/transport substitution.}
    rationale: CONSERVATIVE project autonomy permits this component-design choice; narrow ports are the smaller current abstraction.

  - id: spatial-renderer-seam
    disposition: DETERMINED
    selected: optional-renderer-port
    alternatives:
      - {id: optional-renderer-port, status: VIABLE, reason: Preserves Presentation System requirement that spatial view is optional and provider-neutral.}
      - {id: renderer-inside-feature, status: REJECTED, reason: Makes concrete spatial mechanics part of task semantics and weakens renderer-failure degradation.}

  - id: frontend-state-ownership
    disposition: DETERMINED
    selected: local-plus-preparation-context
    alternatives:
      - {id: local-plus-preparation-context, status: VIABLE, reason: Matches accepted cross-view Target/focus continuity and task-bounded transient lifecycles.}
      - {id: general-global-store, status: REJECTED, reason: Adds broad mutable coordination with no accepted cross-feature state requirement.}
      - {id: client-canonical-projections, status: REJECTED, reason: Violates backend/application ownership of canonical Target/Knowledge/learner truth.}
      - {id: cross-feature-workflow-store, status: REJECTED, reason: Activity/preparation/evidence transient state does not require a new workflow owner in current contracts.}

candidate_constraints:
  - Public feature components align to accepted task/view responsibilities.
  - Private visual/component split remains implementation freedom inside each public feature.
  - Consumer ports expose only operations required by the consuming feature; one adapter may implement multiple ports.
  - Active Target/focus continuity lives in one small PreparationContext; other mutable UI state stays with its owning task feature or provider cache.
  - Spatial renderer remains optional and provider-neutral.
  - No Curation, Import, Progress, Diagnostics or RuntimeStatus public feature/port is retained without a current accepted task/machine contract.
