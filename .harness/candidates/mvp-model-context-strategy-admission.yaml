- id: MC-EVIDENCE
  kind: model-context-evidence
  subject: MC-EVIDENCE
  semantic_value:
    heading: '## Purpose and accepted evidence'
    text: "\nDecide how the Prep MVP's accepted domain meanings should be modeled\n\
      coherently, where a separately governed semantic language would be justified,\n\
      and whether translation between such languages is required. A model context\n\
      is a **semantic applicability boundary**, not a code package, service,\ndatabase,\
      \ team, API, screen, UI visualization or deployment unit.\n\n**Accepted prerequisites:**\n\
      \n- `prep.product-capabilities` — `PREP-MVP-PRODUCT-CAPABILITIES-1`\n  (15 active\
      \ product capabilities and four explicitly RETIRED proposals).\n- `prep.domain-strategy`\
      \ — `PREP-MVP-DOMAIN-STRATEGY-1`\n  (two strategically distinct CORE responsibilities,\
      \ `DS-01` and `DS-02`).\n\nTwo separate strategic responsibilities do not, by\
      \ themselves, establish\ntwo model languages. This artifact owns language **applicability**,\
      \ not\nstrategic investment classification or tactical entity design.\n\n"
  derived_from:
  - PC-SCOPE
  - DS-EVIDENCE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-EVIDENCE
- id: MC-DECISION
  kind: model-language-decision
  subject: MC-DECISION
  semantic_value:
    heading: '## Decision MC-01 — One coherent preparation and activity language'
    text: "\n**MVP decision:** one coherent model context, `MC-01 Preparation\nand\
      \ Activity`, covers both preparation information (`DS-01`) and recorded\nactivity/results\
      \ (`DS-02`). Within this context these are **distinct\nmeanings**, not interchangeable\
      \ concepts.\n\n**Why this is currently sufficient:**\n\n1. The accepted requirements\
      \ ask the user to understand information,\n   relationships, recorded occurrences,\
      \ reported results and temporal\n   context; none establishes incompatible interpretations\
      \ of a shared\n   concept that would require independent semantic governance.\n\
      2. An activity/result record can refer to the preparation information\n   it\
      \ concerns without changing that information's meaning or requiring\n   translation\
      \ between distinct domain languages.\n3. Temporal context, joint exploration,\
      \ manual CRUD, external bulk\n   loading, selection and outside use can all\
      \ be represented as one\n   coherent language. None by itself warrants a new\
      \ model-language owner.\n4. Accepted `DS-01` and `DS-02` remain valuable strategic\
      \ distinctions\n   because preparation meanings and recorded occurrences require\
      \ separate\n   **attention**, not necessarily different vocabularies or contexts.\n\
      5. No accepted evidence establishes independently evolving consumers,\n   conflicting\
      \ term meanings, or an interpretation boundary that cannot\n   be expressed\
      \ coherently within this single scope.\n\n**Alternative examined:** separate\
      \ `MC-01 Preparation Information` and\n`MC-02 Recorded Activity and Results`\
      \ languages, joined by `TR-01`.\nThat option could become justified by future\
      \ independently evolving\nsemantic rules or incompatible terminology. At present\
      \ it adds separate\nlanguage governance and a translation obligation without\
      \ a demonstrated\nneed. It is **not** admitted merely because there are two\
      \ CORE\nresponsibilities or two different kinds of information.\n\n**Decision\
      \ limit:** the single-context decision is a Model Context\nStrategy judgment\
      \ about *current evidence*, not a claim that future\naccepted tactical modeling\
      \ cannot discover a material boundary. If\nindependent language evidence emerges,\
      \ route reconsideration through\nthis Authority and revalidate dependent Capabilities.\n\
      \n"
