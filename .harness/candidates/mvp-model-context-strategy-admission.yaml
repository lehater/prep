- id: MC-PRODUCT-COVERAGE
  kind: model-behavior-applicability
  subject: MC-PRODUCT-COVERAGE
  semantic_value:
    heading: '## Complete product capability applicability'
    text: '

      All 15 accepted capabilities remain required within this single

      language''s scope; their application orchestration may span different

      meanings without introducing additional model-language owners.


      | Accepted capability | Applicable meaning / consumer consequence |

      | --- | --- |

      | `REQ-CAP-INTRODUCE-INFORMATION` | Manual creation of every in-scope entity
      and relationship kind, including activity/results |

      | `REQ-CAP-RETAIN-INFORMATION` | Existing in-scope information remains inspectable
      while present in the working set |

      | `REQ-CAP-CHANGE-INFORMATION` | Manual edits of every in-scope kind, including
      activity/results and links |

      | `REQ-CAP-REMOVE-INFORMATION` | Removal of every in-scope kind from the working
      set |

      | `REQ-CAP-BULK-LOAD-INFORMATION` | Externally supplied bulk loading for every
      in-scope kind |

      | `REQ-CAP-READ-INFORMATION` | Inspection of every in-scope entity and relationship
      kind |

      | `REQ-CAP-EXPLORE-INFORMATION` | Explore preparation information and recorded
      activity/results |

      | `REQ-CAP-EXPLORE-RELATIONSHIPS` | Examine available in-scope relationships
      without inferring arbitrary cross-kind links |

      | `REQ-CAP-EXPLORE-PERSPECTIVES` | Examine the same information from differing
      perspectives |

      | `REQ-CAP-SELECT-PART` | Select a subset for preparation outside Prep |

      | `REQ-CAP-TRANSFER-SELECTION` | Make the selected subset available for external
      use |

      | `REQ-CAP-RECORD-ACTIVITY` | Bring recorded external preparation activity/results
      into the working set |

      | `REQ-CAP-RELATE-ACTIVITY` | Understand existing record-to-subject relationships
      using IR-01 |

      | `REQ-CAP-PRESERVE-TIME` | Retain enough temporal context for existing records
      |

      | `REQ-CAP-EXPLORE-HISTORY` | Explore existing activity and result records over
      time |


      Manual creation/editing must remain available independently of

      bulk loading. No modeled kind can be silently exempted from read,

      create, update, delete or externally supplied bulk loading.


      '
