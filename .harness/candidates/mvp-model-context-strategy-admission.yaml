- id: MC-NO-TRANSLATION
  kind: model-translation-disposition
  subject: MC-NO-TRANSLATION
  semantic_value:
    heading: '## No separate contexts or translations currently justified'
    text: "\nNo additional model-language boundary is established merely for:\n\n\
      - `DS-01` versus `DS-02` as strategic investment categories;\n- Goal, Capability,\
      \ Knowledge, Practice Material or their in-scope\n  distinctions;\n- recorded\
      \ occurrence versus recorded result within the same\n  preparation and activity\
      \ language;\n- relationship classes, knowledge taxonomies or arbitrary cross-kind\n\
      \  connection patterns;\n- manually creating/editing, deletion, bulk loading,\
      \ retention or reading;\n- selection and external availability of a subset;\n\
      - inferred learner state, assessment, source management or verification;\n-\
      \ particular 2D/3D views, APIs, storage, services or integrations.\n\nThe accepted\
      \ Product Capabilities record four `RETIRED`, never-admitted\nproposals: `REQ-CAP-KNOWLEDGE-KINDS`,\n\
      `REQ-CAP-RELATIONSHIP-MEANINGS`,\n`REQ-CAP-CROSS-INFORMATION-RELATIONSHIPS`,\
      \ and\n`REQ-CAP-PRESERVE-HISTORY-CONTEXT`. They cannot be used to\nmanufacture\
      \ an independent language or a historical-preservation\ninvariant, but their\
      \ retirement does not forbid future justified work.\n\nThere is **no cross-language\
      \ translation contract required by the\ncurrent one-context decision**. The\
      \ internal interpretation of\nexisting subject-of-activity relationships is\
      \ captured by `IR-01`.\nIf future evidence justifies independent model languages,\
      \ define a\nspecific translation obligation then, based on actual consumers\
      \ and\ndifferent semantics, not on the mere existence of multiple concepts.\n\
      \n"
  derived_from:
  - DS-RETIRED
  - DS-RELATION
  - PC-SCOPE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-NO-TRANSLATION
- id: MC-CONSUMERS
  kind: model-consumers
  subject: MC-CONSUMERS
  semantic_value:
    heading: '## Consumers and authority handoff'
    text: "\n- **Tactical Domain Design** decides domain concepts, invariants,\n \
      \ identity, valid relationships and lifecycle/consistency behavior\n  within\
      \ the accepted applicability boundary. This is not an\n  instruction to put\
      \ all concepts in one aggregate or schema.\n- **Application Design** coordinates\
      \ product-level CRUD, bulk intake,\n  examination, subset selection, external\
      \ use and activity recording.\n- **Interface Design** may offer different views\
      \ of the same information\n  without turning screen/view boundaries into model\
      \ contexts.\n- **Data and System Architecture** chooses implementation, persistence\n\
      \  and runtime boundaries independently of this language boundary.\n\nThis decision\
      \ does **not** select entities, value objects, aggregates,\nrepositories, APIs,\
      \ packages, services, datastores, screen layouts or\ndeployment topology.\n\n"
  derived_from:
  - DS-CONSUMERS
  - PC-SCOPE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-CONSUMERS
- id: MC-REOPEN
  kind: model-reopening
  subject: MC-REOPEN
  semantic_value:
    heading: '## Reopening conditions'
    text: "\nReconsider one versus multiple model languages through Harness if\naccepted\
      \ evidence demonstrates:\n\n- a shared domain term has materially different\
      \ meanings for\n  preparation information and recorded activity consumers;\n\
      - the rules and interpretation of the two strategic responsibilities\n  must\
      \ evolve independently, creating conflict within one language;\n- a real consumer\
      \ requires semantic translation between independently\n  governed concepts,\
      \ beyond using a normal in-scope relationship;\n- new accepted product behavior\
      \ introduces independently coherent\n  semantic language requirements; or\n\
      - tactical findings establish a material model-language question that\n  must\
      \ be answered at the proper Authority boundary.\n\nUntil then, preserve the\
      \ simpler coherent single-language boundary,\nthe two distinct strategic responsibilities,\
      \ and all accepted product\noperations.\n"
  derived_from:
  - DS-REOPEN
  - PC-SCOPE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-REOPEN
semantic_review:
  status: ACCEPTED
  checks:
  - source-discipline
  - authority-boundary
  - no-invention
  - model-context-not-domain-investment-or-tactical
  basis:
    source-discipline: Material evidence consists only of current accepted Product
      Capabilities and Domain Strategy assertions with matching published fingerprints.
      The prior two-language candidate/review is historical failure evidence, never
      current semantic authority.
    authority-boundary: One coherent applicability boundary preserves DS-01/DS-02
      investment classifications. IR-01 is an internal interpretation relationship,
      not entity identity, link cardinality, a translation protocol or data duplication.
      Tactical concepts/invariants and technical topology remain downstream.
    no-invention: All fifteen accepted product capabilities are mapped into one language
      without weakening universal CRUD, manual create/edit independence or externally
      supplied bulk loading. Four retired proposals remain nonbinding. No historical
      preservation after changes/removal, immutable records or proficiency inference
      is introduced.
    model-context-not-domain-investment-or-tactical: The shared language keeps preparation
      descriptions distinct from recorded occurrences/results without independent
      terminology or translation. Two-language governance has no evidenced extra consumer
      value today. Consumer handoff and explicit reopening conditions keep later language-splitting
      evidence addressable without prescribing one aggregate, schema or deployment.
  alternative_review:
    selected: one coherent language MC-01
    rejected_for_current_evidence: two independently governed languages and TR-01
    rationale: All required human interpretations can use distinct concepts and an
      internal subject relationship in one language. No accepted conflicting term
      meaning or independent language evolution requires additional governance; strategic
      CORE count and technical organization are insufficient evidence.
    limit: This is an applicability decision for accepted scope, not a guarantee about
      all future tactical discoveries.
  relationship_review:
    id: IR-01
    status: ACCEPTED
    basis: Record-to-subject interpretation and temporal understanding preserve the
      required meanings within MC-01. No cross-language mapping is required.
  question_resolution_basis: The coherent one-language decision answers Q-PREP-MODEL-CONTEXT-INDEPENDENT-LANGUAGES
    without assuming independent languages or inventing translation evidence.
