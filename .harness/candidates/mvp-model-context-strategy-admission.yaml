- id: MC-PREPARATION
  kind: model-semantic-applicability
  subject: MC-PREPARATION
  semantic_value:
    heading: '### Preparation information'
    text: '

      **Meaning:** information the user works with when preparing for goals:

      knowledge, goals, capabilities, practice material and their in-scope

      relationships. The accepted product requires understanding, exploration,

      and multiple perspectives, but not a fixed taxonomy of knowledge

      subkinds, relationship meanings, topology, or cardinality.


      **Accepted evidence:** `DS-01`,

      `REQ-CAP-EXPLORE-INFORMATION`,

      `REQ-CAP-EXPLORE-RELATIONSHIPS`, and

      `REQ-CAP-EXPLORE-PERSPECTIVES`.


      **Interpretation boundary:** describing a capability or knowledge

      item does not assert that the user possesses or has mastered it.

      The specific identity, vocabulary and validity of relationships

      belong to Tactical Domain Design.


      '
  derived_from:
  - DS-01
  - REQ-CAP-EXPLORE-INFORMATION
  - REQ-CAP-EXPLORE-RELATIONSHIPS
  - REQ-CAP-EXPLORE-PERSPECTIVES
  - PC-SCOPE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-PREPARATION
- id: MC-ACTIVITY
  kind: model-semantic-applicability
  subject: MC-ACTIVITY
  semantic_value:
    heading: '### Recorded activity and results'
    text: '

      **Meaning:** information that describes a recorded occurrence of

      preparation activity and, when present, its recorded result, including

      temporal and subject context. A reported result is not an inference

      about the user''s mastery, competence or readiness.


      **Accepted evidence:** `DS-02`,

      `REQ-CAP-RECORD-ACTIVITY`,

      `REQ-CAP-RELATE-ACTIVITY`,

      `REQ-CAP-PRESERVE-TIME`, and

      `REQ-CAP-EXPLORE-HISTORY`.


      **Interpretation boundary:** a recorded occurrence or result is

      not preparation information''s definition, and preparation information

      does not become an activity record merely because an activity involved

      it. Both kinds are represented in the same coherent language without

      conflating their meanings.


      **Change boundary:** recorded activity and results are subject to the

      product owner''s all-kind CRUD and bulk-loading commitments. Nothing

      in this model-context decision implies immutable events, permanent

      audit histories, append-only records, undeletable results or snapshots.


      '
  derived_from:
  - DS-02
  - REQ-CAP-RECORD-ACTIVITY
  - REQ-CAP-RELATE-ACTIVITY
  - REQ-CAP-PRESERVE-TIME
  - REQ-CAP-EXPLORE-HISTORY
  - PC-SCOPE
  decision_authority: MODEL-CONTEXT-STRATEGY
  canonical_location: docs/architecture/model-context-map.md#MC-ACTIVITY
- id: IR-01
  kind: internal-semantic-relationship
  subject: IR-01
  semantic_value:
    heading: '### IR-01 — Internal subject-of-activity interpretation'
    text: "\nAn existing record of activity/result may concern existing in-scope\n\
      preparation information. When a consumer explores this relationship,\nthe model\
      \ must permit understanding of **which** preparation\ninformation the record\
      \ concerns while preserving the distinction\nbetween the occurrence/result and\
      \ its subject.\n\n**Accepted evidence:** `REQ-CAP-RELATE-ACTIVITY`,\n`REQ-CAP-EXPLORE-RELATIONSHIPS`,\
      \ `DS-01`, and `DS-02`.\n\n- Treat the subject as preparation information; interpreting\
      \ an\n  activity/result does not redefine the subject or infer proficiency.\n\
      - Keep enough temporal context to distinguish existing recorded\n  activities/results\
      \ over time.\n- Permit consumers to examine related information and recorded\n\
      \  activity without treating the relation as proof of mastery.\n- Do not prescribe\
      \ a domain entity, link type, identifier scheme,\n  relationship cardinality,\
      \ data duplication, or storage structure.\n\nThis is a **semantic interpretation\
      \ inside MC-01**, not a cross-context\ntranslation contract. The earlier candidate\
      \ `TR-01` is **not required**\nfor the chosen one-language topology. Its useful\
      \ interpretation\nconstraints are captured here without inventing a separate\
      \ language.\n\n**Changes and removal:** accepted CRUD includes editing and removal\
      \ of\npreparation information, recorded activity/results, and relationships.\n\
      Current-product interpretation requirements apply to records and\nrelationships\
      \ still in scope. A guarantee of historical\nintelligibility after their former\
      \ subject is edited or deleted was\nnot admitted by Product Requirements. Tactical\
      \ Domain Design and\nlater owning Authorities must resolve relation consistency\
      \ and\nlifecycle consequences without silently revoking CRUD or inventing\n\
      mandatory historical preservation.\n\n"
  derived_from:
