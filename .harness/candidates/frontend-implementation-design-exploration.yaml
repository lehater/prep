version: 1
kind: harness-decision-exploration
capability: prep.frontend-implementation-design
knowledge_kind: implementation-design
explorer_request_id: pending-rebind
research_sources: []
axes:
- axis: slice-boundaries
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: split-slice
    challenge: Compare task-feature slices with operation-level slices and a monolithic build.
    alternatives: [feature-capability-slices, micro-operation-slices, one-big-rewrite]
  - strategy: dependency-order-perturbation
    challenge: Compare an explicit repository/tool bootstrap plus semantic foundation with starting feature code against ad-hoc tooling.
    alternatives: [bootstrap-foundation-then-features, feature-first-with-ad-hoc-tooling]
  decision_points:
  - id: implementation-slice-shape
    alternatives:
    - id: feature-capability-slices
      difference: Each slice realizes an accepted public task responsibility with bounded contracts/tests.
      material_effects: {slice-granularity: task-feature, dependency-order: explicit, ownership-alignment: high}
    - id: micro-operation-slices
      difference: Separate slices per machine operation or visual region.
      material_effects: {slice-granularity: operation-region, dependency-order: fragmented, ownership-alignment: medium}
    - id: one-big-rewrite
      difference: Build the whole frontend in one integration slice.
      material_effects: {slice-granularity: whole-frontend, dependency-order: hidden, ownership-alignment: mixed}
  - id: initial-ordering
    alternatives:
    - id: bootstrap-foundation-then-features
      difference: Establish versioned tool/boundary/test environment, then semantic contracts/mocks, then features.
      material_effects: {slice-granularity: bootstrap-foundation-features, dependency-order: explicit, legacy-coupling: none}
    - id: feature-first-with-ad-hoc-tooling
      difference: Start feature code before repository/tooling and semantic contracts are fixed.
      material_effects: {slice-granularity: feature-first, dependency-order: reconciliation-later, legacy-coupling: accidental-risk}
- axis: repository-realization
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: boundary-remap
    challenge: Compare one production source root with task-feature ownership to package-per-feature and flat view layouts.
    alternatives: [single-root-task-features, package-per-feature, flat-view-root]
  - strategy: generated-source-perturbation
    challenge: Test whether accepted contracts require generated frontend semantic source.
    alternatives: [handwritten-consumer-contracts, generated-contract-layer]
  decision_points:
  - id: source-module-topology
    alternatives:
    - id: single-root-task-features
      difference: One fresh frontend package/source root contains app composition plus accepted task-feature roots.
      material_effects: {module-boundary: task-feature, composition-root: app, physical-root-name: free}
    - id: package-per-feature
      difference: Each accepted task feature is a separate package/workspace unit.
      material_effects: {module-boundary: package-per-feature, composition-root: app-package, coordination-cost: higher}
    - id: flat-view-root
      difference: Views/components share one presentation directory without feature ownership.
      material_effects: {module-boundary: presentation-only, composition-root: mixed, ownership-alignment: low}
  - id: contract-realization
    alternatives:
    - id: handwritten-consumer-contracts
      difference: Consumer boundary contracts are maintained directly from accepted machine semantics.
      material_effects: {contract-owner: consumer, generator: none, source-of-truth: canonical-semantics}
    - id: generated-contract-layer
      difference: Introduce generated frontend contracts and a generator pipeline.
      material_effects: {contract-owner: generated-layer, generator: required, source-of-truth: generator-input}
- axis: dependency-tooling
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: history-removal
    challenge: Compare choosing a minimal current toolchain from accepted needs with recreating the deleted dependency stack wholesale.
    alternatives: [fresh-minimal-versioned-toolchain, recreate-deleted-toolchain-wholesale]
  - strategy: remove-tool
    challenge: Compare an initial non-spatial production dependency set with adding a spatial provider before user/quality evidence requires it.
    alternatives: [no-production-spatial-dependency-at-bootstrap, add-spatial-provider-at-bootstrap]
  - strategy: enforcement-point-shift
    challenge: Compare versioned mechanical dependency-boundary enforcement with conventions only.
    alternatives: [establish-versioned-boundary-check, convention-only]
  decision_points:
  - id: base-toolchain
    alternatives:
    - id: fresh-minimal-versioned-toolchain
      difference: FI-00 selects and pins only tools justified by current architecture/verification obligations.
      material_effects: {tool-origin: current-requirements, versioning: pinned, historical-dependency-obligation: none}
    - id: recreate-deleted-toolchain-wholesale
      difference: Recreate framework/package/version choices from removed implementation without a new need analysis.
      material_effects: {tool-origin: historical-implementation, versioning: historical, legacy-coupling: high}
  - id: optional-spatial-dependency
    alternatives:
    - id: no-production-spatial-dependency-at-bootstrap
      difference: Initial production bootstrap is non-spatial; Knowledge remains complete through semantic/non-spatial UI.
      material_effects: {spatial-runtime: absent, task-completeness: preserved, later-provider-seam: available}
    - id: add-spatial-provider-at-bootstrap
      difference: Add renderer dependencies before a selected prototype task requires them.
      material_effects: {spatial-runtime: present, task-completeness: unchanged, dependency-cost: higher}
  - id: boundary-enforcement
    alternatives:
    - id: establish-versioned-boundary-check
      difference: FI-00 creates deterministic source-boundary validation from accepted feature ownership.
      material_effects: {enforcement-point: fast-ci, review-dependence: low, runtime-footprint: none}
    - id: convention-only
      difference: Dependency rules rely on review discipline.
      material_effects: {enforcement-point: manual, review-dependence: high, runtime-footprint: none}
- axis: migration-transition
  applicability: NOT_APPLICABLE
  exploration_level: EXPLORE
  applicability_evidence: [FRONTEND-IMPLEMENTATION-DESIGN]
  evidence: The production frontend baseline is empty; no runtime/data coexistence, persistent browser migration or irreversible intermediate transition exists.
  probes: []
  decision_points: []
- axis: verification-enforcement
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: move-verification-layer
    challenge: Compare layered local contract/boundary tests plus browser E2E with browser-only verification.
    alternatives: [layered-fast-plus-e2e, browser-only]
  - strategy: manual-vs-automated
    challenge: Compare establishing automated deterministic fast checks with manual invocation.
    alternatives: [establish-automated-fast-deterministic, manual-deterministic]
  decision_points:
  - id: verification-layering
    alternatives:
    - id: layered-fast-plus-e2e
      difference: Local checks prove contracts/structure and browser E2E proves representative task flow.
      material_effects: {verification-layer: layered, feedback: early-plus-e2e, failure-localization: high}
    - id: browser-only
      difference: Browser tests carry structural and semantic verification alone.
      material_effects: {verification-layer: end-to-end, feedback: late, failure-localization: low}
  - id: deterministic-fast-enforcement
    alternatives:
    - id: establish-automated-fast-deterministic
      difference: FI-00 establishes automated static/boundary/unit/contract checks applicable to the selected tools.
      material_effects: {automation-boundary: automatic, failure-gate: early, reproducibility: high}
    - id: manual-deterministic
      difference: Deterministic checks depend on developer invocation.
      material_effects: {automation-boundary: manual, failure-gate: inconsistent, reproducibility: low}
- axis: delivery-gates
  applicability: APPLICABLE
  exploration_level: EXPLORE
  probes:
  - strategy: local-vs-ci
    challenge: Compare a versioned fast automatic gate plus explicit heavy prototype gate with always-heavy CI.
    alternatives: [versioned-fast-automatic-heavy-explicit, always-heavy]
  - strategy: gate-owner-shift
    challenge: Compare versioned repository gates with unversioned local completion.
    alternatives: [versioned-fast-automatic-heavy-explicit, unversioned-local-gate]
  decision_points:
  - id: frontend-delivery-gate
    alternatives:
    - id: versioned-fast-automatic-heavy-explicit
      difference: FI-00 creates fast CI for ordinary changes and a versioned explicit heavy checkpoint for prototype closure.
      material_effects: {gate-location: versioned-ci, feedback: bounded, reproducibility: high}
    - id: always-heavy
      difference: Every ordinary change runs the complete heavy browser/closure suite.
      material_effects: {gate-location: versioned-ci, feedback: slow, reproducibility: high}
    - id: unversioned-local-gate
      difference: Final validation depends on a local manual process outside versioned repository inputs.
      material_effects: {gate-location: local, authority: individual, reproducibility: low}
decision_space_review:
  status: COMPLETE
  checks: [mixed-decision-split, missing-material-case-search, accepted-constraint-cross-check, authority-boundary-cross-check]
  reviewed_decisions: [implementation-slice-shape, initial-ordering, source-module-topology, contract-realization, base-toolchain, optional-spatial-dependency, boundary-enforcement, verification-layering, deterministic-fast-enforcement, frontend-delivery-gate]
  open_gaps: []
