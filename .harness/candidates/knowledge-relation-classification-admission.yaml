version: 1
kind: harness-artifact-admission-candidate
id: KNOWLEDGE-RELATION-CLASSIFICATION
capability: prep.knowledge-relation-classification
path: docs/domain/relation-classification-catalog.yaml
changed_paths:
  - docs/domain/relation-classification-catalog.yaml
canonical_references:
  - artifact: KNOWLEDGE-RELATION-CLASSIFICATION
    referenced_path: docs/architecture/model-context-map.md
  - artifact: KNOWLEDGE-RELATION-CLASSIFICATION
    referenced_path: .harness/knowledge/product-capabilities.yaml

decision_review:
  axes:
    - axis: semantic-identity
      decisions:
        - id: relation-classifier-identity
          owner_authority: TACTICAL-DOMAIN-DESIGN
          alternatives:
            - {id: generic-relation-edge, state: REJECTED, rationale: "Collapses predicate vocabulary and asserted relationship identity into one carrier."}
            - {id: predicate-vocabulary-entry, state: VIABLE}
            - {id: assertion-identity, state: REJECTED, rationale: "Makes the classifier own concrete relation assertions rather than vocabulary."}
          disposition: DETERMINED
          selected: predicate-vocabulary-entry
    - axis: invariants
      decisions:
        - id: relation-classification-validity
          owner_authority: TACTICAL-DOMAIN-DESIGN
          alternatives:
            - {id: broad-family-fallback, state: REJECTED, rationale: "Would erase leaf-level semantic precision when evidence is insufficient."}
            - {id: evidence-bounded-precise, state: VIABLE}
            - {id: forced-leaf-classification, state: REJECTED, rationale: "Would invent unsupported relation meaning."}
          disposition: DETERMINED
          selected: evidence-bounded-precise
    - axis: lifecycle
      decisions:
        - id: relation-vocabulary-lifecycle
          owner_authority: TACTICAL-DOMAIN-DESIGN
          alternatives:
            - {id: auto-promote-candidates, state: REJECTED, rationale: "Candidate vocabulary cannot become accepted solely through use."}
            - {id: accepted-plus-candidate, state: VIABLE}
            - {id: immutable-catalog, state: REJECTED, rationale: "Would prevent evidence-backed vocabulary evolution."}
          disposition: DETERMINED
          selected: accepted-plus-candidate
    - axis: relationships
      decisions:
        - id: relation-model-shape
          owner_authority: TACTICAL-DOMAIN-DESIGN
          alternatives:
            - {id: first-class-relation-entity, state: REJECTED, rationale: "Adds a generic relation entity that duplicates proposition semantics."}
            - {id: proposition-plus-predicate, state: VIABLE}
            - {id: free-text-relation, state: REJECTED, rationale: "Loses machine-addressable predicate meaning."}
          disposition: DETERMINED
          selected: proposition-plus-predicate
    - axis: responsibility-boundaries
      decisions:
        - id: relation-classification-boundary
          owner_authority: TACTICAL-DOMAIN-DESIGN
          alternatives:
            - {id: absorb-cross-context-links, state: REJECTED, rationale: "Would re-own capability, direction and learner-state relationships."}
            - {id: subject-knowledge-only, state: VIABLE}
            - {id: presentation-owned, state: REJECTED, rationale: "Presentation cannot own reusable subject semantics."}
          disposition: DETERMINED
          selected: subject-knowledge-only

semantic_assertions:
  - id: KRC-SUBJECT-KNOWLEDGE-SCOPE
    kind: domain-invariant
    subject: relation-classification-scope
    semantic_value: The relation-classification catalog applies only to reusable Subject Knowledge relation predicates and does not classify cross-context structural relationships owned by Capability and Performance, Preparation Direction, Learner Evidence and State, practice execution, or bootstrap translations.
    derived_from: [MC-SUBJECT-KNOWLEDGE, TR-KNOWLEDGE-TO-CAPABILITY, TR-CAPABILITY-TO-DIRECTION, TR-PRACTICE-TO-EVIDENCE, TR-EVIDENCE-TO-DIRECTION]
    decision_authority: TACTICAL-DOMAIN-DESIGN

  - id: KRC-PREDICATE-NOT-ASSERTION
    kind: domain-invariant
    subject: predicate-vocabulary
    semantic_value: A registered relation predicate is vocabulary for classifying a relational Knowledge proposition and does not itself assert that a relation exists.
    derived_from: [MC-SUBJECT-KNOWLEDGE, REQ-CAP-KNOWLEDGE-RELATIONSHIPS]
    decision_authority: TACTICAL-DOMAIN-DESIGN

  - id: KRC-PRESERVE-RELATION-MEANING
    kind: domain-invariant
    subject: relation-semantic-precision
    semantic_value: Relation classification preserves predicate-specific meaning, direction, and inference properties; broad families support classification and filtering but do not erase leaf semantics.
    derived_from: [REQ-CAP-KNOWLEDGE-RELATIONSHIPS, MC-SUBJECT-KNOWLEDGE]
    decision_authority: TACTICAL-DOMAIN-DESIGN

  - id: KRC-EVIDENCE-BOUNDED-CLASSIFICATION
    kind: domain-invariant
    subject: relation-classification-evidence
    semantic_value: A relation is classified only when source evidence supports a precise proposition; unsupported relations produce no edge, and supported relations without a fitting accepted leaf remain candidates rather than being forced into a broader predicate.
    derived_from: [REQ-CAP-KNOWLEDGE-RELATIONSHIPS, MC-SUBJECT-KNOWLEDGE]
    decision_authority: TACTICAL-DOMAIN-DESIGN

  - id: KRC-EXISTING-VOCABULARY-CONTINUITY
    kind: domain-model
    subject: relation-vocabulary-continuity
    semantic_value: The existing family-plus-leaf vocabulary, including preferred versus candidate leaf status, remains the current reusable Subject Knowledge classifier; this revision changes ownership scope rather than promoting new leaf predicates.
    derived_from: [MC-SUBJECT-KNOWLEDGE, REQ-CAP-KNOWLEDGE-RELATIONSHIPS]
    decision_authority: TACTICAL-DOMAIN-DESIGN

semantic_review:
  status: ACCEPTED
  checks:
    - source-discipline
    - authority-boundary
    - no-invention
    - domain-model-authority-boundary
