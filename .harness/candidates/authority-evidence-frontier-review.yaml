required_transition:
  entry: project-bootstrap-reconcile
  knowledge_scope_review: 'design-profile: establish whether model applicability knowledge
    is absent or coherently owned in another atomic boundary; select target topology/prerequisites
    through project Authority judgment, not reference names'
  semantic_work: Preserve MC-01/IR-01, Product Capabilities, CRUD, retirement dispositions
    and DS CORE classifications in the target owning CanonicalArtifact. Any changed
    ownership/Capability identities need explicit semantic admission and acceptance
    mapping; no automatic copy/rename of acceptances.
  graph_work: Reconcile target Engineering Graph, Core realization and affected production
    prerequisites together. Correct obsolete cross-context descriptions; decide tactical
    subject coverage without assuming two languages. Do not inventory or bulk-admit
    the 28 legacy documents.
  publication: Prepare a complete graph-compatible CAS-linked transition preserving
    revision history, accepted-evidence history and policy/currentness semantics.
    A graph change needs compatibility handling for reading/validating the previous
    publication; do not merely delete the old provider.
  runtime_limit: project-reconcile stops when provider selection/topology must change
    or Authority judgment is needed; it cannot decide this migration. Use it only
    after its usable-publication/topology prerequisites are met. If target old/new
    publication compatibility is not supported by the pinned boundary, report that
    technical blocker before any durable change.
  closure: Re-evaluate affected consumers and policies; regenerate Authority registry/status
    and frontier. No new downstream acceptances are authorized by this review.
