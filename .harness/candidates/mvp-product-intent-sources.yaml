- id: USER
  kind: user-actor
  subject: USER
  semantic_value:
    id: USER
    description: Person preparing for one or more goals.
    evidence:
    - PROBLEM-EVIDENCE/actors
  derived_from:
  - PE-ACTOR
  decision_authority: DISCOVERY
  canonical_location: docs/discovery/user-needs.yaml#actors/USER
  source_artifact: USER-NEEDS
- id: CTX-01
  kind: context-of-use
  subject: CTX-01
  semantic_value:
    context:
      id: CTX-01
      actor: USER
      description: The person works with knowledge, goals, capabilities, practice
        material, recorded activity, and relationships among them. The information
        may already exist before it is used in Prep, may change over time, and some
        preparation activity may take place outside Prep.
      evidence:
      - PROBLEM-EVIDENCE/context
      - PE-02
      - EV-02
    scope:
    - The information the person works with may be supplied from outside Prep and
      may change over time.
    - Activity outside Prep may include study, practice, review, testing, or other
      forms of preparation.
    - Recorded activity and results are recorded facts available for interpretation.
      They do not establish the person's knowledge, capability, mastery, readiness,
      or competence.
    observed_tasks: []
    observed_task_evidence: The accepted evidence consists of stakeholder statements
      and problem observations, not an observational study of current tasks. No future
      task structure is inferred from this absence.
    unresolved_downstream_decisions:
    - how information is added, imported, edited, or removed
    - which knowledge kinds and relationship meanings are supported
    - how different perspectives are represented
    - how a selected part is represented and transferred outside Prep
    - how recorded activity and results are returned
    - which statistics or other derived representations are provided
    - product behavior, domain semantics, user interface, and technical realization
  derived_from:
  - PE-CONTEXT
  - PE-PROBLEM
  - PE-02
  - EV-02
  - PE-BOUNDARY-5
  - PE-NON-GOALS
  - PE-DOWNSTREAM
  decision_authority: DISCOVERY
  canonical_location: docs/discovery/user-needs.yaml#context_of_use/CTX-01
  source_artifact: USER-NEEDS
- id: UG-01
  kind: user-goal
  subject: UG-01
  semantic_value:
    goal:
      id: UG-01
      actor: USER
      context: CTX-01
      outcome: Understand preparation information and its relationships, select information
        or material for external preparation activity, and understand the related
        recorded activity and results over time.
      evidence:
      - PROBLEM-EVIDENCE/desired_outcome
      - PE-01
      - PE-02
      - PE-03
    sufficiency_review:
      goal: UG-01
      status: covered
      needs:
      - UN-01
      - UN-02
      - UN-03
      rationale: UN-01 covers understanding information and relationships (PE-01/EV-01),
        UN-02 covers selecting information for external activity (PE-02/EV-02), and
        UN-03 covers understanding recorded activity and results (PE-03/EV-03). These
        needs cover the stated MVP goal only; they do not establish all prerequisites
        for preparation success. EV-03 supports the understanding need without accepting
        storage or relationship behavior as a requirement.
  derived_from:
  - PE-OUTCOME
  - PE-01
  - PE-02
  - PE-03
  decision_authority: DISCOVERY
  canonical_location: docs/discovery/user-needs.yaml#goals/UG-01
