version: 1
kind: harness-artifact-admission-candidate
id: FRONTEND-COMPONENT-DESIGN
capability: prep.frontend-component-design
path: docs/implementation/frontend-component-design.md
changed_paths: [docs/implementation/frontend-component-design.md]
canonical_references:
  - {artifact: FRONTEND-COMPONENT-DESIGN, referenced_path: docs/architecture/frontend-system-architecture.md}
  - {artifact: FRONTEND-COMPONENT-DESIGN, referenced_path: docs/engineering/frontend-engineering-policy.md}
  - {artifact: FRONTEND-COMPONENT-DESIGN, referenced_path: docs/interface/screen-view-design.md}
  - {artifact: FRONTEND-COMPONENT-DESIGN, referenced_path: docs/interface/machine-interface.md}
  - {artifact: FRONTEND-COMPONENT-DESIGN, referenced_path: docs/architecture/performance-capacity.md}
decision_review:
  axes:
    - axis: responsibility-boundaries
      decisions:
        - id: public-feature-boundaries
          owner_authority: COMPONENT-DESIGN
          alternatives:
            - {id: view-responsibility-features, state: VIABLE}
            - {id: fine-grained-domainish-features, state: REJECTED, rationale: "Reintroduces Learning/Diagnostics/Progress splits absent from accepted UI responsibilities."}
            - {id: resource-oriented-features, state: REJECTED, rationale: "Shapes UI components around provider/domain resources rather than task responsibilities."}
            - {id: monolithic-preparation-feature, state: REJECTED, rationale: "Loses independently changing task responsibilities and provider seams."}
          disposition: DETERMINED
          selected: view-responsibility-features
    - axis: provider-seams
      decisions:
        - id: machine-provider-seams
          owner_authority: COMPONENT-DESIGN
          alternatives:
            - {id: narrow-consumer-ports, state: VIABLE}
            - {id: aggregated-prep-port, state: VIABLE}
            - {id: direct-provider-use, state: REJECTED, rationale: "Leaks provider/transport details and prevents substitution."}
          disposition: DELEGATED
          selected: narrow-consumer-ports
        - id: spatial-renderer-seam
          owner_authority: COMPONENT-DESIGN
          alternatives:
            - {id: optional-renderer-port, state: VIABLE}
            - {id: renderer-inside-feature, state: REJECTED, rationale: "Makes concrete renderer mechanics part of task-feature contracts."}
          disposition: DETERMINED
          selected: optional-renderer-port
    - axis: state-ownership
      decisions:
        - id: frontend-state-ownership
          owner_authority: COMPONENT-DESIGN
          alternatives:
            - {id: local-plus-preparation-context, state: VIABLE}
            - {id: general-global-store, state: REJECTED, rationale: "Adds broad mutable coordination with no accepted shared-state need."}
            - {id: client-canonical-projections, state: REJECTED, rationale: "Violates external ownership of canonical semantic truth."}
            - {id: cross-feature-workflow-store, state: REJECTED, rationale: "Transient attempt/request/review state has task-bounded lifetimes."}
          disposition: DETERMINED
          selected: local-plus-preparation-context
semantic_assertions:
  - {id: CD-COMPOSITION, kind: component-boundary, subject: frontend-composition-root, semantic_value: "FrontendCompositionRoot selects adapters and composes PreparationShell/PreparationContext plus public task features without owning semantic truth.", derived_from: [FSA-RUNTIME, FSA-TASK-MODULES, EP-OWNERSHIP], decision_authority: COMPONENT-DESIGN}
  - {id: CD-SHELL, kind: component-boundary, subject: preparation-shell, semantic_value: "PreparationShell owns structural navigation/active-child composition only; PreparationContext owns active Target and accepted Next-focus continuity.", derived_from: [FSA-STATE, SV-FRAME], decision_authority: COMPONENT-DESIGN}
  - {id: CD-FEATURES, kind: component-boundary, subject: public-task-features, semantic_value: "Public features are TargetDirectionFeature, TargetFeature, CurrentPositionFeature, KnowledgeExplorerFeature, ActivityFeature, EvidenceChangeFeature and PreparationSupportFeature, aligned to current Screen/View responsibilities.", derived_from: [FSA-TASK-MODULES, SV-NO-IMPLEMENTATION, SV-TARGETS, SV-TARGET, SV-CURRENT, SV-KNOWLEDGE, SV-ACTIVITY, SV-EVIDENCE, SV-PREP-SUPPORT], decision_authority: COMPONENT-DESIGN}
  - {id: CD-PORTS, kind: component-port, subject: consumer-ports, semantic_value: "Task features consume narrow TargetDirection, Target, CurrentPosition, Knowledge, Activity, EvidenceChange and PreparationSupport ports mapped only to accepted machine operations; one adapter may implement several ports.", derived_from: [FSA-PORTS, EP-PORTS, MI-NO-LEAK, MI-OP-TARGETS-COMPARE, MI-OP-TARGET-ESTABLISH, MI-OP-STATE-GET, MI-OP-KNOWLEDGE-QUERY, MI-OP-ACTIVITY-START, MI-OP-PREP-REQUEST], decision_authority: COMPONENT-DESIGN}
  - {id: CD-SPATIAL, kind: component-provider-seam, subject: optional-spatial-renderer, semantic_value: "Knowledge spatial rendering is an optional renderer-neutral provider seam; task-complete non-spatial Knowledge behavior does not depend on it.", derived_from: [FSA-SPATIAL, QD-GRAPH-CONDITIONAL], decision_authority: COMPONENT-DESIGN}
  - {id: CD-STATE, kind: component-state, subject: frontend-state-ownership, semantic_value: "Active Target/focus continuity lives in a small PreparationContext; selections, attempts, requests and review state remain with the owning task feature/provider cache.", derived_from: [FSA-STATE, EP-STATE], decision_authority: COMPONENT-DESIGN}
  - {id: CD-DEPENDENCY, kind: component-dependency, subject: component-dependency-direction, semantic_value: "Public task features do not depend on concrete adapters, renderer packages, provider DTOs or another feature's private state; adapters depend on consumer contracts.", derived_from: [FSA-DEPENDENCY, EP-DEPENDENCY], decision_authority: COMPONENT-DESIGN}
  - {id: CD-NO-LEGACY, kind: component-invariant, subject: obsolete-public-components, semantic_value: "No public Curation, Import, Progress, standalone Diagnostics or RuntimeStatus component/port is retained without a current accepted task/machine responsibility.", derived_from: [FSA-NO-LEGACY], decision_authority: COMPONENT-DESIGN}
  - {id: CD-TRANSITION-BOUNDARY, kind: component-invariant, subject: frontend-transition-applicability, semantic_value: "Current component topology introduces no persistent browser schema migration, mixed-version component protocol, independently deployed frontend subcomponent or irreversible runtime transition state; canonical truth remains external and frontend state is task-local/contextual.", derived_from: [FSA-STATE, FSA-RUNTIME], decision_authority: COMPONENT-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, component-not-upstream-owner, implementation-facing-boundaries-complete-for-scope]
