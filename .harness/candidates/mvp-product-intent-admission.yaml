  basis:
    source-discipline: 'User Needs assertions are bound to the current published PREP-MVP-USER-NEEDS-1
      acceptance. PR #93 at a074ab34bc3e31d1104dd6050b5345e1bf0d47a8 records two
      owner-confirmed product decisions and product scope/non-goals, transcribed by
      the assistant through the owner's connected GitHub account. The PR itself
      does not independently prove owner authorship. The source record describes
      this provenance; no original chat transcript or empirical validation is claimed.'
    authority-boundary: The owner specifies observable operations across every in-scope
      kind, including recorded activity/results. Entity taxonomy, historical consistency,
      format, transport, UI and persistence remain downstream; owner authority is
      not used to promote such design decisions.
    no-invention: CRUD, bulk loading and intake derive from PD records, never from
      Discovery context. Manual create/edit independence is preserved. The old compound
      lifecycle requirement remains RETIRED. No mastery inference or numeric quality
      target is introduced.
    observable-product-level: Twelve active requirements independently identify exploration,
      perspectives, selection, availability, temporal/context understanding, intake
      and bulk/create/read/update/delete. Each has an observable example; all-kind
      scope is universal without choosing the downstream inventory.
    no-downstream-design-promotion: The same-Authority PD records are accepted as
      explicit product decisions within the target artifact, not as upstream prerequisites
      or Domain/API/Data evidence.
