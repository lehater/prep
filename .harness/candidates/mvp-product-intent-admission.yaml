- id: PI-SCOPE
  kind: product-intent
  subject: mvp-scope
  semantic_value:
    purpose: Define the minimum observable product commitments that let a person understand
      and explore preparation information and relationships, use selected material
      outside Prep, manage the information in the MVP model, and work with recorded
      activity and results.
    scope_boundaries:
    - The bulk-load and CRUD commitments apply to all entity and relationship kinds
      included in the accepted MVP model; downstream design cannot silently exclude
      recorded activity or results from these operations.
    - Product Requirements do not predefine entity identity, relationship taxonomy,
      historical invariants, deletion strategy, transfer format, interface or storage
      technology.
    - Product CRUD includes editing and removing recorded activity/results. Consequences
      for historical meaning and related information must be resolved by the owning
      downstream Authority without silently revoking the user's product-level operations.
    non_goals:
    - Assess what the user knows or can do.
    - Estimate mastery, readiness, or competence.
    - Verify the truth, quality, authorship, reliability, or authority of information.
    - Require source management, provenance, citations, source versioning, or traceability.
    - Define a fixed taxonomy of knowledge kinds or relationship meanings.
    - Define a required relationship topology or representation technique.
    - Define a particular bulk-load format, import/export transport, interface, persistence,
      or implementation mechanism.
    retired_requirements:
    - id: REQ-INFORMATION-LIFECYCLE
      statement: The product shall support the lifecycle of the information and relationships
        needed for these product behaviors so they can be introduced, retained, changed,
        and removed.
      status: RETIRED
      source_refs: &id008
      - CTX-01
      - UN-01
      - UN-03
      rationale: Previous compound proposal, never separately admitted by Harness.
        Replaced with independently testable bulk-load and CRUD obligations grounded
        in the explicit product-owner decision.
  decision_authority: PRODUCT-REQUIREMENTS
  canonical_location: .harness/knowledge/product-intent.yaml#content
  derived_from:
  - UG-01
  - CTX-01
semantic_review:
  status: ACCEPTED
  checks:
  - source-discipline
