- id: PD-MVP-RECORDED-ACTIVITY-INTAKE-2026-10-10
  kind: product-decision
  subject: PD-MVP-RECORDED-ACTIVITY-INTAKE-2026-10-10
  semantic_value:
    id: PD-MVP-RECORDED-ACTIVITY-INTAKE-2026-10-10
    authority: PRODUCT-REQUIREMENTS
    source: project-owner
    decision_status: OWNER_CONFIRMED
    statement: The MVP must allow recorded activity and results, including preparation
      activity performed outside Prep, to be brought into Prep for later understanding
      and analysis.
    boundary: The means of transfer and representation are downstream decisions. Recorded
      results do not establish learner mastery or readiness.
    source_record:
      url: https://github.com/lehater/prep/pull/93
