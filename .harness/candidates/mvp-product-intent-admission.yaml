- id: PD-MVP-DATA-MANAGEMENT-2026-10-10
  kind: product-decision
  subject: PD-MVP-DATA-MANAGEMENT-2026-10-10
  semantic_value:
    id: PD-MVP-DATA-MANAGEMENT-2026-10-10
    authority: PRODUCT-REQUIREMENTS
    source: project-owner
    decision_status: OWNER_CONFIRMED
    statement: The MVP must support bulk loading and full user CRUD (create, read,
      update, delete) across every entity and relationship kind included in the planned
      MVP model, including recorded activity and results. Manual addition and editing
      must be possible independently of bulk loading.
    boundary: The product decision establishes user-observable scope and rights, not
      the entity taxonomy, format, transport, UI, storage method, deletion implementation,
      or historical consistency rules.
    source_record:
      url: https://github.com/lehater/prep/pull/93
      author: lehater
      revision: a074ab34bc3e31d1104dd6050b5345e1bf0d47a8
