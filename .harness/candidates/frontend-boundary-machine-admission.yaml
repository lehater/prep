semantic_assertions:
  - {id: MI-OUTCOME-MODEL, kind: machine-outcome, subject: machine-outcome-envelope, semantic_value: "The contract preserves SUCCESS, UNRESOLVED, REJECTED, DEPENDENCY_UNAVAILABLE and STALE_BASIS where applicable; OPERATIONAL_FAILURE is nonsemantic and never implies accepted mutation.", derived_from: [AD-OUTCOME-MODEL], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-BASIS, kind: machine-compatibility, subject: semantic-currentness-basis, semantic_value: "Reads that drive dependent mutations expose an opaque semantic_basis_ref; materially changed target/evidence/focus meaning produces STALE_BASIS rather than silent application.", derived_from: [AD-CURRENTNESS-BASIS], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-TARGET, kind: machine-representation, subject: target-representation, semantic_value: "TargetRepresentation exposes active target identity/context, purpose, uncertainty and provenance while keeping Target distinct from Capability.", derived_from: [AD-ESTABLISH-TARGET, LD-PREPARATION-TARGET], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-REQUIREMENT, kind: machine-representation, subject: target-requirement-representation, semantic_value: "TargetRequirementRepresentation preserves RequirementExpression structure and required Capability performance/conditions/quality while referencing supporting Knowledge separately.", derived_from: [AD-UNDERSTAND-REQUIREMENTS, LD-REQUIREMENT-EXPRESSION, LD-CAPABILITY-SPECIFICATION, LD-CAPABILITY-STANDARD], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-CURRENT, kind: machine-representation, subject: current-state-representation, semantic_value: "CurrentStateRepresentation exposes demonstrated/challenged/unknown target-relative projections with evidence-basis refs and applicability limits, never a universal mastery score.", derived_from: [AD-REVIEW-CURRENT-STATE, LM-STATE-PROJECTION, LM-TARGET-RELATIVE-PROJECTION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-EVIDENCE, kind: machine-representation, subject: evidence-representation, semantic_value: "EvidenceRepresentation preserves attributable Performance/Observation facts, provenance and inspectable evidence arguments/claims with supports/challenges and applicability limits.", derived_from: [AD-CAPTURE-PERFORMANCE, AD-EVALUATE-EVIDENCE, LM-PERFORMANCE, LM-OBSERVATION, LM-EVIDENCE-ARGUMENT, LM-CAPABILITY-CLAIM], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-GAP, kind: machine-representation, subject: gap-representation, semantic_value: "GapRepresentation exposes target-relative satisfied/challenged/unresolved requirement fragments and basis without intrinsic capability or Knowledge deficiency scores.", derived_from: [AD-REVIEW-GAPS, LD-GAP-PRIORITY], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-FOCUS, kind: machine-representation, subject: focus-representation, semantic_value: "FocusRepresentation exposes PreparationIntent purpose, relevant gap/capability refs and rationale.", derived_from: [AD-CHOOSE-NEXT-FOCUS, LD-PREPARATION-INTENT], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-KNOWLEDGE, kind: machine-representation, subject: knowledge-projection, semantic_value: "KnowledgeProjection preserves KnowledgeObject/KnowledgeProposition identity, predicate meaning and overview/detail scope without presentation coordinates.", derived_from: [AD-EXPLORE-KNOWLEDGE, KM-KNOWLEDGE-FAMILY, KM-KNOWLEDGE-PROPOSITION, KM-SCOPE-OVERVIEW-DEPTH, KM-GRAPH-IS-PROJECTION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-SUPPORT, kind: machine-representation, subject: support-representation, semantic_value: "SupportRepresentation exposes applicable learning/practice/diagnostic support and explicit limitations; availability or completion never establishes capability.", derived_from: [AD-SELECT-SUPPORT, LD-LEARNING-MATERIAL, LD-SUPPORT-REQUIREMENT, LD-TASK-SPECIFICATION, LD-OBSERVATION-SPECIFICATION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-ACTIVITY, kind: machine-representation, subject: activity-attempt-representation, semantic_value: "ActivityAttemptRepresentation uses semantic attempt identity plus selected support, target/focus context and basis; runtime job identity is not process identity.", derived_from: [AD-PERFORM-ACTIVITY, PROC-ACT-BOUNDARY, PROC-ACT-CONTINUATION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-CHANGE, kind: machine-representation, subject: change-representation, semantic_value: "ChangeRepresentation compares previous/current preparation projections and distinguishes learner-evidence change from target-information change including no-change and increased uncertainty.", derived_from: [AD-REVIEW-CHANGE], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-REP-PREP-REQUEST, kind: machine-representation, subject: preparation-request-representation, semantic_value: "PreparationRequestRepresentation preserves motivating context/source provenance, accepted owner-scoped support and explicit unresolved/rejected remainder without corpus/import mechanics.", derived_from: [AD-REQUEST-PREPARATION-SUPPORT, AD-PARTIAL-PREPARATION, PROC-SUP-BOUNDARY], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-TARGET-ESTABLISH, kind: machine-operation, subject: prep.target.establish, semantic_value: "Establish/refine active target from target/source context and return TargetRepresentation or explicit semantic outcome.", derived_from: [AD-ESTABLISH-TARGET], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-REQUIREMENTS-GET, kind: machine-operation, subject: prep.target.requirements.get, semantic_value: "Read target requirements with semantic basis.", derived_from: [AD-UNDERSTAND-REQUIREMENTS], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-STATE-GET, kind: machine-operation, subject: prep.current_state.get, semantic_value: "Read evidence-backed target-relative current state with semantic basis.", derived_from: [AD-REVIEW-CURRENT-STATE], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-EVIDENCE-GET, kind: machine-operation, subject: prep.evidence.get, semantic_value: "Read attributable evidence and inspectable evidence argument/claim projections.", derived_from: [AD-EVALUATE-EVIDENCE], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-GAPS-GET, kind: machine-operation, subject: prep.gaps.get, semantic_value: "Read target-relative gaps/uncertainty and their basis.", derived_from: [AD-REVIEW-GAPS], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-FOCUS-SET, kind: machine-operation, subject: prep.focus.set, semantic_value: "Choose/revise PreparationIntent against an explicit semantic basis and return accepted focus or stale/rejected outcome.", derived_from: [AD-CHOOSE-NEXT-FOCUS, AD-CURRENTNESS-BASIS], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-KNOWLEDGE-QUERY, kind: machine-operation, subject: prep.knowledge.query, semantic_value: "Query/navigate semantic Knowledge under target/focus and scope without prescribing visual representation.", derived_from: [AD-EXPLORE-KNOWLEDGE], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-SUPPORT-LIST, kind: machine-operation, subject: prep.support.list, semantic_value: "Read applicable preparation support plus explicit inadequacy/limitations for the current focus.", derived_from: [AD-SELECT-SUPPORT], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-ACTIVITY-START, kind: machine-operation, subject: prep.activity.start, semantic_value: "Start one semantic activity attempt for selected support under a current target/focus basis.", derived_from: [AD-PERFORM-ACTIVITY, PROC-ACT-BOUNDARY], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-ACTIVITY-COMPLETE, kind: machine-operation, subject: prep.activity.complete, semantic_value: "Submit attributable activity facts for the same attempt and request accepted capture→evaluate→review process completion without consumer-supplied capability conclusions.", derived_from: [AD-CAPTURE-PERFORMANCE, AD-EVALUATE-EVIDENCE, PROC-ACT-COMPOSITION, PROC-ACT-COMPLETION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-CHANGE-GET, kind: machine-operation, subject: prep.change.get, semantic_value: "Read explainable state/target-understanding change for an activity attempt or prior basis.", derived_from: [AD-REVIEW-CHANGE], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-PREP-REQUEST, kind: machine-operation, subject: prep.support.prepare.request, semantic_value: "Create/preserve a contextual PreparationRequest for missing support.", derived_from: [AD-REQUEST-PREPARATION-SUPPORT, PROC-SUP-BOUNDARY], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-OP-PREP-GET, kind: machine-operation, subject: prep.support.prepare.get, semantic_value: "Read/continue the same PreparationRequest and return accepted owner-scoped results plus explicit remainder and completion/recovery outcome.", derived_from: [AD-PREPARE-SUPPORT, PROC-SUP-COMPOSITION, PROC-SUP-COMPLETION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-PROC-ACTIVITY, kind: machine-process-projection, subject: activity-evidence-process, semantic_value: "Machine operations preserve the accepted activity/evidence occurrence boundary, semantic ordering, continuation/recovery and completion without exposing workflow-engine state.", derived_from: [PROC-ACT-BOUNDARY, PROC-ACT-WORK, PROC-ACT-COMPOSITION, PROC-ACT-CONTINUATION, PROC-ACT-RECOVERY, PROC-ACT-COMPLETION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-PROC-PREP, kind: machine-process-projection, subject: prepare-support-process, semantic_value: "Machine operations preserve contextual preparation request identity, owner-scoped partial results, continuation/recovery and return-to-origin completion without global transactions.", derived_from: [PROC-SUP-BOUNDARY, PROC-SUP-WORK, PROC-SUP-COMPOSITION, PROC-SUP-CONTINUATION, PROC-SUP-RECOVERY, PROC-SUP-COMPLETION], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-COMPATIBILITY, kind: machine-compatibility, subject: prep-machine-v1, semantic_value: "Additive ignorable fields are compatible; changing semantic identity/basis/outcome meaning or required operation semantics requires an explicit incompatible contract revision.", derived_from: [AD-RUNTIME-TIMING-FREEDOM], decision_authority: MACHINE-INTERFACE-DESIGN}
  - {id: MI-NO-LEAK, kind: machine-invariant, subject: machine-boundary-ownership, semantic_value: "The contract preserves owner-defined identities/time/provenance and does not expose peer-private domain structure, persistence fields, graph coordinates, workflow-engine ids, corpus/import mechanics or superseded evidential concepts as public meaning.", derived_from: [AD-WRITE-OWNERSHIP, KM-CROSS-CONTEXT-BOUNDARY, LD-APPLICATION-BOUNDARY, LD-EVIDENCE-DESIGN-BOUNDARY, LM-KNOWLEDGE-BOUNDARY], decision_authority: MACHINE-INTERFACE-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, preserve-upstream-semantics]
