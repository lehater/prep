semantic_assertions:
  - {id: IV-TRACEABILITY, kind: verification-obligation, subject: interface-traceability, semantic_value: "Verify every task-view responsibility and transition traces to accepted Task Model, IA, Interaction and Topology meaning without inventing hidden application behavior.", derived_from: [TOP-ROOT, TOP-CROSSLINKS], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-LEARNER-LOOP, kind: verification-obligation, subject: complete-learner-loop, semantic_value: "Verify the traversable learner loop compare targets when needed -> establish/refine target -> requirements -> current state/gaps -> focus -> Knowledge/support/activity -> evidence/change -> reassessment or target refinement.", derived_from: [TM-TASK-COMPARE-TARGETS, TOP-VIEW-TARGETS, TOP-VIEW-TARGET, TOP-VIEW-CURRENT, TOP-VIEW-KNOWLEDGE, TOP-VIEW-ACTIVITY, TOP-VIEW-EVIDENCE], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-PREP-SUPPORT, kind: verification-obligation, subject: preparation-support-boundary, semantic_value: "Verify missing preparation is a contextual request/review/recovery/return flow that preserves motivating context and does not expose corpus/import/schema maintenance as ordinary learner work.", derived_from: [TOP-VIEW-PREP-SUPPORT], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-LOCATION, kind: verification-obligation, subject: information-location-coverage, semantic_value: "Verify accepted information and actions have reachable task locations and shared evidence/change detail is reachable from both Current and Activity contexts.", derived_from: [IA-CROSSLINKS, TOP-VIEW-EVIDENCE, TOP-CROSSLINKS], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-CONTEXT, kind: verification-obligation, subject: context-continuity, semantic_value: "Verify active Target and required focus continuity survive accepted navigation and missing context routes to the owning preparation view rather than being silently created.", derived_from: [TOP-CONTEXT, TOP-DIRECT-LINK], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-MODE-BOUNDARY, kind: verification-obligation, subject: ownership-integrity, semantic_value: "Verify learner-facing views do not silently mutate reusable Target/Capability/Knowledge/support semantics outside accepted commands and do not acquire corpus/import maintenance responsibility.", derived_from: [TOP-NO-COMPOSITION, TOP-VIEW-PREP-SUPPORT], decision_authority: VERIFICATION-DESIGN}
  - {id: IV-TARGET-PURPOSE, kind: verification-obligation, subject: target-purpose-isolation, semantic_value: "Verify related Targets preserve distinct purpose and target-specific requirements without inheriting learner state or requirements merely because capabilities overlap.", derived_from: [TOP-VIEW-TARGETS, TOP-VIEW-TARGET], decision_authority: VERIFICATION-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, verification-not-semantic-owner]
