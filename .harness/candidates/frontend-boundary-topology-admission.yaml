version: 1
kind: harness-artifact-admission-candidate
id: INTERFACE-TOPOLOGY
capability: prep.interface-topology
path: docs/interface/interface-topology.yaml
changed_paths: [docs/interface/interface-topology.yaml]
canonical_references:
  - {artifact: INTERFACE-TOPOLOGY, referenced_path: docs/interface/information-architecture.yaml}
  - {artifact: INTERFACE-TOPOLOGY, referenced_path: docs/interface/interaction-design.yaml}
semantic_assertions:
  - {id: TOP-ROOT, kind: topology-structural-frame, subject: preparation-frame, semantic_value: "FRAME-PREPARATION is the single structural frame supporting candidate Target comparison before commitment and preserving active Target/optional Next focus context across primary preparation destinations when present; contextual Evidence/change review is entered from reviewed activity context rather than exposed as a frame destination.", derived_from: [IA-ROOT, IX-TARGET-DIRECTION, IX-CONTEXT-CONTINUITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-TARGETS, kind: topology-task-view, subject: targets-view, semantic_value: "VIEW-TARGETS has one responsibility: compare plausible Targets against the same learner evidence basis and choose which candidate to continue with; it realizes LOC-TARGETS and IX-TARGET-DIRECTION without activating a Target.", derived_from: [IA-LOC-TARGETS, IX-TARGET-DIRECTION], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-TARGET, kind: topology-task-view, subject: target-view, semantic_value: "VIEW-TARGET has one responsibility: establish/refine Target and understand requirements; it realizes LOC-TARGET and IX-TARGET.", derived_from: [IA-LOC-TARGET, IX-TARGET], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-CURRENT, kind: topology-task-view, subject: current-position-view, semantic_value: "VIEW-CURRENT has one responsibility: understand current position/gaps and choose Next focus; it realizes LOC-CURRENT-POSITION and IX-DIRECTION.", derived_from: [IA-LOC-CURRENT, IX-DIRECTION], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-KNOWLEDGE, kind: topology-task-view, subject: knowledge-view, semantic_value: "VIEW-KNOWLEDGE has one responsibility: Subject Knowledge orientation under target/focus context, optionally bounded by a selected Required Capability; it realizes LOC-KNOWLEDGE and IX-KNOWLEDGE without selecting a presentation form.", derived_from: [IA-LOC-KNOWLEDGE, IX-KNOWLEDGE], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-ACTIVITY, kind: topology-task-view, subject: activity-view, semantic_value: "VIEW-ACTIVITY has one responsibility: select support and carry out one activity attempt under an explicit focus; it realizes the action phase of LOC-ACTIVITIES/IX-ACTIVITY.", derived_from: [IA-LOC-ACTIVITIES, IX-ACTIVITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-EVIDENCE, kind: topology-task-view, subject: evidence-change-view, semantic_value: "VIEW-EVIDENCE-CHANGE has one responsibility: review evaluated evidence/change for one completed or reviewable activity result and choose continuation; it realizes contextual LOC-EVIDENCE-CHANGES and the review phase of IX-ACTIVITY while ordinary why-this-state inspection remains in VIEW-CURRENT.", derived_from: [IA-LOC-EVIDENCE, IX-ACTIVITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-VIEW-PREP-SUPPORT, kind: topology-task-view, subject: prepare-support-view, semantic_value: "VIEW-PREPARE-SUPPORT is a contextual recovery view for missing support that preserves and returns to the originating preparation context.", derived_from: [IA-LOC-PREP-SUPPORT, IX-PREP-SUPPORT], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-CONTEXT, kind: topology-navigation, subject: active-context-reachability, semantic_value: "Current/Knowledge/Activity/Evidence views preserve active Target; Activity additionally requires explicit Next focus. Missing target/focus routes to the owning preparation view instead of inventing context.", derived_from: [IA-SCOPE-TARGET, IA-SCOPE-FOCUS, IX-CONTEXT-CONTINUITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-CROSSLINKS, kind: topology-navigation, subject: preparation-crosslinks, semantic_value: "Navigation preserves Targets↔Target comparison/choice plus accepted primary relationships among Target, Current position, Knowledge and Activity; Activity may enter contextual Evidence/change review, which continues to Current/Activity/Knowledge. Target-to-Knowledge entry may carry a selected Required Capability as local Knowledge scope, with contextual missing-support entry and return-to-origin.", derived_from: [IA-CROSSLINKS, IX-TARGET-DIRECTION, IX-TARGET, IX-DIRECTION, IX-KNOWLEDGE, IX-ACTIVITY, IX-PREP-SUPPORT], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-EVIDENCE-REVIEW, kind: topology-navigation, subject: evidence-review-reachability, semantic_value: "Evidence/change is a contextual post-activity result review rather than a primary/global destination; current-state why-this-state stays in VIEW-CURRENT and evidence direct links require reviewed activity/evidence context.", derived_from: [IA-LOC-EVIDENCE, IA-CROSSLINKS, IX-DIRECTION, IX-ACTIVITY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-DIRECT-LINK, kind: topology-navigation, subject: direct-link-semantics, semantic_value: "Direct links preserve valid referenced semantic context; Evidence/change direct links require resolvable reviewed activity/evidence context, absent required Target routes to VIEW-TARGET and absent required Activity focus routes to VIEW-CURRENT rather than silently creating state.", derived_from: [IA-FINDABILITY, IX-CURRENTNESS], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-LABELS, kind: topology-navigation, subject: learner-facing-view-labels, semantic_value: "Task-view identity follows learner-facing Targets, Target, Current position, Knowledge, Activity, Evidence/change and Prepare missing support semantics rather than backend/domain class names.", derived_from: [IA-TAXONOMY], decision_authority: HUMAN-INTERFACE-DESIGN}
  - {id: TOP-NO-COMPOSITION, kind: topology-invariant, subject: topology-screen-boundary, semantic_value: "Topology decides view identity/responsibility/reachability only; regions/layout/components/styling/responsive composition and graph/list/2D/3D presentation remain downstream.", derived_from: [IA-NO-SCREEN, IX-NO-LAYOUT], decision_authority: HUMAN-INTERFACE-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, topology-not-screen-composition]
