version: 1
kind: harness-artifact-admission-candidate
id: USER-NEEDS
capability: prep.user-needs
path: docs/vision/user-needs.yaml
changed_paths:
  - docs/vision/user-needs.yaml
canonical_references:
  - artifact: USER-NEEDS
    referenced_path: docs/vision/problem-space.md

semantic_assertions:
  - id: ACTOR-PRIMARY-LEARNER
    kind: user-actor
    subject: primary-learner
    semantic_value: Person preparing toward an external or self-defined capability or performance target.
    derived_from: [PE-ACTOR]
    decision_authority: DISCOVERY

  - id: CONTEXT-PREPARATION
    kind: context-of-use
    subject: primary-preparation-context
    semantic_value: Preparation occurs under incomplete and evolving target information, partial self-knowledge, fragmented sources, limited time or attention, potentially unfamiliar subject structure, and evidence whose relevance depends on performance context and time.
    derived_from: [OBS-P01, OBS-P02, OBS-P03, OBS-P05, OBS-P10, OBS-P16]
    decision_authority: DISCOVERY

  - id: GOAL-TARGET
    kind: user-goal
    subject: target-understanding
    semantic_value: Establish and refine a usable preparation target as expectations become clearer.
    derived_from: [OBS-P01, OBS-P08, OBS-P06]
    decision_authority: DISCOVERY
  - id: GOAL-TARGET-PURPOSE
    kind: user-goal
    subject: target-purpose
    semantic_value: Distinguish related target purposes and understand which required performances belong to each.
    derived_from: [OBS-P14, PE-TARGET-PURPOSE-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-TARGET-DIRECTION
    kind: user-goal
    subject: target-direction
    semantic_value: Compare several plausible preparation targets against the same evidence-backed current capability and choose which direction is worth pursuing without treating the comparison as a change in learner state.
    derived_from: [OBS-P18]
    decision_authority: DISCOVERY
  - id: GOAL-CAPABILITY-PERFORMANCE
    kind: user-goal
    subject: capability-performance
    semantic_value: Understand what the target actually requires the learner to be able to do under relevant conditions and quality expectations.
    derived_from: [OBS-P04, OBS-P15, PE-CAPABILITY-PERFORMANCE-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-STATE
    kind: user-goal
    subject: current-state-understanding
    semantic_value: Understand current capability, gaps, and uncertainty from evidence rather than familiarity alone.
    derived_from: [OBS-P02, OBS-P04, OBS-P07, OBS-P16]
    decision_authority: DISCOVERY
  - id: GOAL-EVIDENCE-JUSTIFICATION
    kind: user-goal
    subject: evidence-justification
    semantic_value: Understand why available observations support, challenge, or fail to establish a conclusion about current capability.
    derived_from: [OBS-P02, OBS-P16, PE-EVIDENCE-JUSTIFICATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-PRIORITY
    kind: user-goal
    subject: next-focus
    semantic_value: Decide what deserves attention next under limited time and changing conditions.
    derived_from: [OBS-P05, OBS-P06, OBS-P01]
    decision_authority: DISCOVERY
  - id: GOAL-PROGRESS
    kind: user-goal
    subject: credible-progress
    semantic_value: Improve toward the target using learning or practice that produces credible evidence of capability.
    derived_from: [OBS-P04, OBS-P07, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-DURABLE-TRANSFER
    kind: user-goal
    subject: durable-transfer
    semantic_value: Preserve and demonstrate relevant capability when it is needed later and in the target-relevant context.
    derived_from: [OBS-P07, OBS-P15, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-SUPPORT-FIT
    kind: user-goal
    subject: learning-support-fit
    semantic_value: Use learning, practice, or diagnostic support appropriate to the required outcome rather than relying on generic activity.
    derived_from: [OBS-P17, OBS-P15]
    decision_authority: DISCOVERY
  - id: GOAL-ADAPT
    kind: user-goal
    subject: preparation-adaptation
    semantic_value: Adapt preparation when new evidence changes priorities or understanding of the target.
    derived_from: [OBS-P06, OBS-P08, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-BOOTSTRAP
    kind: user-goal
    subject: preparation-bootstrap
    semantic_value: Get to a usable preparation scope when starting from fragmented or incomplete sources.
    derived_from: [OBS-P03, OBS-P09, OBS-P13]
    decision_authority: DISCOVERY
  - id: GOAL-KNOWLEDGE-ORIENTATION
    kind: user-goal
    subject: knowledge-orientation
    semantic_value: Form a coherent initial mental model of the relevant subject when the area is unfamiliar.
    derived_from: [OBS-P10, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-RELATIONAL-UNDERSTANDING
    kind: user-goal
    subject: relational-understanding
    semantic_value: Understand how relevant concepts meaningfully relate rather than learning isolated descriptions only.
    derived_from: [OBS-P11, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: GOAL-KNOWLEDGE-SCOPE
    kind: user-goal
    subject: knowledge-scope
    semantic_value: Keep the considered knowledge scope cognitively manageable while retaining what is relevant to the learning purpose.
    derived_from: [OBS-P10, OBS-P12]
    decision_authority: DISCOVERY
  - id: GOAL-KNOWLEDGE-DEPTH
    kind: user-goal
    subject: knowledge-depth
    semantic_value: Move between overview and deeper detail as understanding develops.
    derived_from: [OBS-P12, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY

  - id: NEED-TARGET
    kind: user-need
    subject: GOAL-TARGET
    semantic_value: The learner needs a coherent but refinable understanding of what the selected target expects, including uncertainty and later target refinement.
    derived_from: [OBS-P01, OBS-P08, OBS-P06]
    decision_authority: DISCOVERY
  - id: NEED-TARGET-PURPOSE
    kind: user-need
    subject: GOAL-TARGET-PURPOSE
    semantic_value: The learner needs related target purposes to remain distinguishable so requirements for one purpose are not silently treated as requirements for another.
    derived_from: [OBS-P14, PE-TARGET-PURPOSE-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-TARGET-DIRECTION
    kind: user-need
    subject: GOAL-TARGET-DIRECTION
    semantic_value: The learner needs to compare multiple plausible targets using the same evidence-backed capability base, seeing shared and target-specific requirements, demonstrated/challenged/unknown coverage, gaps and uncertainty, so they can choose a direction without an invented universal fit score.
    derived_from: [OBS-P18]
    decision_authority: DISCOVERY
  - id: NEED-CAPABILITY-PERFORMANCE
    kind: user-need
    subject: GOAL-CAPABILITY-PERFORMANCE
    semantic_value: The learner needs to understand required capability in terms of what must be performed, under relevant conditions or constraints, and at what acceptable quality rather than as topic exposure alone.
    derived_from: [OBS-P04, OBS-P15, PE-CAPABILITY-PERFORMANCE-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-STATE
    kind: user-need
    subject: GOAL-STATE
    semantic_value: The learner needs an evidence-based view of demonstrated, challenged, and unknown current capability, including limits caused by performance context or stale evidence.
    derived_from: [OBS-P02, OBS-P04, OBS-P07, OBS-P16]
    decision_authority: DISCOVERY
  - id: NEED-EVIDENCE-JUSTIFICATION
    kind: user-need
    subject: GOAL-EVIDENCE-JUSTIFICATION
    semantic_value: The learner needs to understand why observations are relevant to a capability conclusion, including observed performance, conditions, provenance, target relevance, and temporal applicability.
    derived_from: [OBS-P02, OBS-P16, PE-EVIDENCE-JUSTIFICATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-PRIORITY
    kind: user-need
    subject: GOAL-PRIORITY
    semantic_value: The learner needs to identify the highest-value next preparation focus using target relevance, uncertainty, evidence, and available time.
    derived_from: [OBS-P05, OBS-P06, OBS-P01]
    decision_authority: DISCOVERY
  - id: NEED-PROGRESS
    kind: user-need
    subject: GOAL-PROGRESS
    semantic_value: The learner needs preparation activities and feedback that generate evidence relevant to the capability and performance the target actually requires.
    derived_from: [OBS-P04, OBS-P07, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-DURABLE-TRANSFER
    kind: user-need
    subject: GOAL-DURABLE-TRANSFER
    semantic_value: The learner needs evidence that relevant capability remains available over the required time horizon and transfers to target-relevant conditions rather than being inferred from immediate or narrow success alone.
    derived_from: [OBS-P07, OBS-P15, OBS-P16]
    decision_authority: DISCOVERY
  - id: NEED-SUPPORT-FIT
    kind: user-need
    subject: GOAL-SUPPORT-FIT
    semantic_value: The learner needs learning, practice, and diagnostic support whose form is appropriate to the required outcome without treating completion or exposure as proof that capability was developed.
    derived_from: [OBS-P17, OBS-P04, OBS-P15]
    decision_authority: DISCOVERY
  - id: NEED-ADAPT
    kind: user-need
    subject: GOAL-ADAPT
    semantic_value: The learner needs new evidence to update preparation priorities and learner-state conclusions and, when warranted, new external information to refine target understanding.
    derived_from: [OBS-P06, OBS-P08, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-BOOTSTRAP
    kind: user-need
    subject: GOAL-BOOTSTRAP
    semantic_value: The learner needs a low-overhead path from fragmented source material to usable preparation support while supporting target, capability, knowledge, and evidence-design data can be added or corrected without requiring learner ownership of internal corpus maintenance.
    derived_from: [OBS-P03, OBS-P09, OBS-P13]
    decision_authority: DISCOVERY
  - id: NEED-KNOWLEDGE-ORIENTATION
    kind: user-need
    subject: GOAL-KNOWLEDGE-ORIENTATION
    semantic_value: The learner needs an intelligible overview of important concepts in the relevant subject scope and how they fit together.
    derived_from: [OBS-P10, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-RELATIONSHIPS
    kind: user-need
    subject: GOAL-RELATIONAL-UNDERSTANDING
    semantic_value: The learner needs relationship meaning among relevant concepts to remain inspectable so connected concepts can be understood in context.
    derived_from: [OBS-P11, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: NEED-KNOWLEDGE-SCOPE
    kind: user-need
    subject: GOAL-KNOWLEDGE-SCOPE
    semantic_value: The learner needs to narrow and expand the considered subject scope using meaningful criteria relevant to the learning purpose.
    derived_from: [OBS-P10, OBS-P12]
    decision_authority: DISCOVERY
  - id: NEED-KNOWLEDGE-DEPTH
    kind: user-need
    subject: GOAL-KNOWLEDGE-DEPTH
    semantic_value: The learner needs to move between high-level orientation and deeper detail without losing surrounding conceptual context.
    derived_from: [OBS-P12, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY

  - id: EVIDENCE-NEED-TARGET
    kind: need-evidence
    subject: NEED-TARGET
    semantic_value: Supported by target uncertainty, external-target translation, and changing-state evidence.
    derived_from: [OBS-P01, OBS-P08, OBS-P06]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-TARGET-PURPOSE
    kind: need-evidence
    subject: NEED-TARGET-PURPOSE
    semantic_value: Supported by accepted target-purpose-divergence evidence and its desired outcome.
    derived_from: [OBS-P14, PE-TARGET-PURPOSE-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-TARGET-DIRECTION
    kind: need-evidence
    subject: NEED-TARGET-DIRECTION
    semantic_value: Supported by the accepted multi-target direction-choice observation; prevalence and preferred comparison presentation remain unvalidated.
    derived_from: [OBS-P18]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-CAPABILITY-PERFORMANCE
    kind: need-evidence
    subject: NEED-CAPABILITY-PERFORMANCE
    semantic_value: Supported by exposure-versus-capability and performance-shaped-capability evidence.
    derived_from: [OBS-P04, OBS-P15, PE-CAPABILITY-PERFORMANCE-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-STATE
    kind: need-evidence
    subject: NEED-STATE
    semantic_value: Supported by partial observability, exposure-versus-capability, retention-transfer, and evidence-context evidence.
    derived_from: [OBS-P02, OBS-P04, OBS-P07, OBS-P16]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-EVIDENCE-JUSTIFICATION
    kind: need-evidence
    subject: NEED-EVIDENCE-JUSTIFICATION
    semantic_value: Supported by partial-observability and evidence-adequacy/context evidence.
    derived_from: [OBS-P02, OBS-P16, PE-EVIDENCE-JUSTIFICATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-PRIORITY
    kind: need-evidence
    subject: NEED-PRIORITY
    semantic_value: Supported by limited resources, changing state, and target uncertainty.
    derived_from: [OBS-P05, OBS-P06, OBS-P01]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-PROGRESS
    kind: need-evidence
    subject: NEED-PROGRESS
    semantic_value: Supported by exposure-versus-capability, retention-transfer, evidence-context, and desired-outcome evidence.
    derived_from: [OBS-P04, OBS-P07, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-DURABLE-TRANSFER
    kind: need-evidence
    subject: NEED-DURABLE-TRANSFER
    semantic_value: Supported by retention-transfer, performance-shaped-capability, and evidence-context evidence.
    derived_from: [OBS-P07, OBS-P15, OBS-P16]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-SUPPORT-FIT
    kind: need-evidence
    subject: NEED-SUPPORT-FIT
    semantic_value: Supported by learning-support-fit, exposure-versus-capability, and performance-shaped-capability evidence.
    derived_from: [OBS-P17, OBS-P04, OBS-P15]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-ADAPT
    kind: need-evidence
    subject: NEED-ADAPT
    semantic_value: Supported by changing-state, external-target-translation, evidence-context, and desired-outcome evidence.
    derived_from: [OBS-P06, OBS-P08, OBS-P16, PE-DESIRED-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-BOOTSTRAP
    kind: need-evidence
    subject: NEED-BOOTSTRAP
    semantic_value: Supported by fragmented knowledge, preparation bootstrap, and corpus-maintenance responsibility evidence.
    derived_from: [OBS-P03, OBS-P09, OBS-P13]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-KNOWLEDGE-ORIENTATION
    kind: need-evidence
    subject: NEED-KNOWLEDGE-ORIENTATION
    semantic_value: Supported by structural-orientation evidence and the accepted knowledge-orientation desired outcome.
    derived_from: [OBS-P10, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-RELATIONSHIPS
    kind: need-evidence
    subject: NEED-RELATIONSHIPS
    semantic_value: Supported by relational-understanding evidence and the accepted knowledge-orientation desired outcome.
    derived_from: [OBS-P11, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-KNOWLEDGE-SCOPE
    kind: need-evidence
    subject: NEED-KNOWLEDGE-SCOPE
    semantic_value: Supported by structural-orientation and abstraction/granularity evidence.
    derived_from: [OBS-P10, OBS-P12]
    decision_authority: DISCOVERY
  - id: EVIDENCE-NEED-KNOWLEDGE-DEPTH
    kind: need-evidence
    subject: NEED-KNOWLEDGE-DEPTH
    semantic_value: Supported by abstraction/granularity evidence and the accepted knowledge-orientation desired outcome.
    derived_from: [OBS-P12, PE-KNOWLEDGE-ORIENTATION-OUTCOME]
    decision_authority: DISCOVERY

