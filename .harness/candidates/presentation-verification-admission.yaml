semantic_assertions:
  - {id: PV-COVERAGE, kind: verification-obligation, subject: presentation-screen-coverage, semantic_value: "Verify every accepted task view has a presentation-complete screen composition and no presentation surface invents a new task or semantic owner.", derived_from: [IV-TRACEABILITY, PS-TASK-HIERARCHY, SV-FRAME, SV-NO-IMPLEMENTATION], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-FLOW, kind: verification-obligation, subject: representative-preparation-flow, semantic_value: "Demonstrate candidate-target comparison when needed through Target, Current, Knowledge/support/activity, evidence/change and continuation without losing active Target/focus.", derived_from: [IV-LEARNER-LOOP, SV-TARGETS, SV-EVIDENCE], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-KNOWLEDGE, kind: verification-obligation, subject: knowledge-task-completion, semantic_value: "Verify Knowledge remains task-complete through non-spatial query/result/detail interaction; spatial rendering is optional enhancement and its absence/failure preserves semantic completion.", derived_from: [PS-KNOWLEDGE-REPRESENTATION, PS-DEGRADATION, SV-KNOWLEDGE, QD-GRAPH-CONDITIONAL, QD-SEMANTIC-PRESERVATION], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-EVIDENCE, kind: verification-obligation, subject: evidence-change-semantics, semantic_value: "Verify evidence/change review distinguishes current-state evidence, post-activity changed/no-change/challenged/increased-uncertainty outcomes and Target-information refinement without inventing a generic progress score.", derived_from: [SV-EVIDENCE, PS-OUTCOMES], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-PREP-SUPPORT, kind: verification-obligation, subject: preparation-support-usability, semantic_value: "Verify the learner can request/review partial preparation support, understand explicit remainder, recover from stale/dependency-unavailable outcomes and return to originating work without corpus/import/schema UI.", derived_from: [IV-PREP-SUPPORT, SV-PREP-SUPPORT], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-COMPOSITION, kind: verification-obligation, subject: dominant-task-composition, semantic_value: "Verify concrete composition variants preserve exactly one dominant task/work region while contextual/supporting information remains available without competing hierarchy.", derived_from: [SV-COMPOSITION-VARIANTS, PS-DENSITY], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-RESPONSIVE, kind: verification-obligation, subject: responsive-semantic-preservation, semantic_value: "Verify responsive reflow/disclosure changes physical topology before semantic topology and preserves task order, context and reachable actions.", derived_from: [SV-RESPONSIVE, PS-RESPONSIVE], decision_authority: VERIFICATION-DESIGN}
  - {id: PV-ACCESSIBILITY, kind: verification-obligation, subject: accessibility, semantic_value: "Verify keyboard/non-spatial/reduced-motion and semantic state communication remain task-complete according to Presentation System accessibility obligations.", derived_from: [PS-ACCESSIBILITY], decision_authority: VERIFICATION-DESIGN}
semantic_review:
  status: ACCEPTED
  checks: [source-discipline, authority-boundary, no-invention, verification-not-semantic-owner]
