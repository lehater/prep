name: FI-03 browser checkpoint

on:
  push:
    branches:
      - implementation/fi03-target-requirements-2026-10-06
    paths:
      - "frontend/**"
      - ".github/workflows/tmp-fi03-browser.yml"

permissions:
  contents: read

jobs:
  browser-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run FI-03 browser scenarios
        working-directory: frontend
        run: npm run test:e2e
