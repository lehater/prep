name: FI-06 checkpoint

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/fi06-checkpoint.yml"

permissions:
  contents: read

jobs:
  repository-full:
    name: Repository full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - run: python tools/validate_docs.py
      - run: python tools/validate_architecture.py
      - run: python tools/validate_questions.py
      - run: python -m unittest discover -s tests -v

  frontend-full:
    name: Frontend full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag prep-web-fi06 .
