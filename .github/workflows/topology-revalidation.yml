name: STAGE-P1-TOP revalidation

on:
  push:
    branches:
      - stage/p1-top-revalidation
    paths:
      - "docs/interface/interface-topology.yaml"
      - ".harness/candidates/frontend-boundary-topology*.yaml"
      - ".harness/candidates/frontend-boundary-topology-request.json"
      - ".harness/candidates/process-migration-topology-*.yaml"
      - "tools/revalidate_topology_publication.py"
      - "tools/check_harness_integration.py"
      - ".github/workflows/topology-revalidation.yml"

permissions:
  contents: write

concurrency:
  group: stage-p1-top-revalidation
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Prep branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify pinned Harness baseline
        run: test "$(cat .harness-version)" = "ed04058ff35ffbbaf735d0ecbd7c1f592e3abf71"
      - name: Check out pinned Harness
        uses: actions/checkout@v7
        with:
          repository: lehater/harness
          ref: ed04058ff35ffbbaf735d0ecbd7c1f592e3abf71
          path: .harness-tool
      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Revalidate only Interface Topology
        env:
          HARNESS_ROOT: .harness-tool
        shell: bash
        run: |
          if grep -q "acceptance_id: PREP-INTERFACE-TOPOLOGY-STRICT-8" .harness/project-publication.yaml; then
            echo "Topology STRICT-8 already published on this branch; validating snapshot."
            cp .harness/project-publication.yaml .harness/project-publication.next.yaml
          else
            python tools/revalidate_topology_publication.py
          fi
      - name: Publish Topology inputs and snapshot
        shell: bash
        run: |
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/interface/interface-topology.yaml \
                  .harness/candidates/frontend-boundary-topology.yaml \
                  .harness/candidates/frontend-boundary-topology-admission.yaml \
                  .harness/candidates/frontend-boundary-topology-exploration.yaml \
                  .harness/candidates/frontend-boundary-topology-request.json \
                  .harness/candidates/process-migration-topology-information-architecture-evidence.yaml \
                  .harness/candidates/process-migration-topology-interaction-evidence.yaml \
                  .harness/project-publication.yaml
          if git diff --cached --quiet; then
            echo "Topology publication already current"
          else
            git commit -m "Publish Topology revalidation"
            git push origin HEAD:stage/p1-top-revalidation
          fi
      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - name: Full Harness revalidation
        continue-on-error: true
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py
      - name: Validate documentation links
        run: python tools/validate_docs.py
      - name: Validate maintained Anki reference implementation
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v
      - name: Upload Topology diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-p1-top-diagnostics
          path: |
            .harness/topology-revalidation-report.yaml
            .harness/project-publication.next.yaml
