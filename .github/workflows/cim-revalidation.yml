name: STAGE-P0-CIM revalidation

on:
  push:
    branches:
      - stage/p0-cim-revalidation
    paths:
      - ".harness/candidates/conceptual-interface-journey-evidence.yaml"
      - "tools/revalidate_cim_publication.py"
      - ".github/workflows/cim-revalidation.yml"

permissions:
  contents: write

concurrency:
  group: stage-p0-cim-revalidation
  cancel-in-progress: true

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Prep branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        shell: bash
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v7
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Revalidate only Conceptual Interface Model
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/revalidate_cim_publication.py

      - name: Publish revalidated snapshot to branch
        shell: bash
        run: |
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml
          if git diff --cached --quiet; then
            echo "Publication already current"
          else
            git commit -m "Publish CIM revalidation"
            git push origin HEAD:stage/p0-cim-revalidation
          fi

      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py

      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Full Harness revalidation
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py

      - name: Validate documentation links
        run: python tools/validate_docs.py

      - name: Validate maintained Anki reference implementation
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v

      - name: Upload CIM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-p0-cim-diagnostics
          path: |
            .harness/cim-revalidation-report.yaml
            .harness/project-publication.next.yaml
