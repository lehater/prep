name: Harness Scenario Suite

on:
  push:
    branches: [experiment/scenario-suite]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/application/task-model.yaml"
      - "docs/vision/problem-space.md"
      - "tools/semantic_baseline.py"
      - "experiments/harness_scenarios/**"
      - ".github/workflows/harness-scenario-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read Harness experiment ref
        id: harness
        run: echo "ref=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.ref }}
          path: .harness-tool

      - run: python -m pip install PyYAML

      - name: Run Prep scenarios through Harness
        env:
          HARNESS_ROOT: .harness-tool
          PYTHONPATH: .
        run: |
          python .harness-tool/scenario_suite.py \
            experiments/harness_scenarios/scenarios \
            --catalog experiments/harness_scenarios/catalog.yaml \
            --driver-module experiments.harness_scenarios.drivers \
            --json-report /tmp/prep-harness-scenarios.json
