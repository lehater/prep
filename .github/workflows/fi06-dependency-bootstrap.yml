name: FI-06 dependency bootstrap

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/fi06-dependency-bootstrap.yml"

permissions:
  contents: write

jobs:
  lock-query-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/problem-space-revalidation
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Add pinned TanStack Query dependency
        working-directory: web
        run: npm install --save-exact @tanstack/react-query@5.103.2
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package.json web/package-lock.json
          git commit -m "Pin FI-06 TanStack Query dependency"
          git push origin HEAD:research/problem-space-revalidation
