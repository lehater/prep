name: Fast repository validation

on:
  push:
    branches-ignore: [main]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".github/workflows/repository-fast.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".github/workflows/repository-fast.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-fast:
    name: Repository fast
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py

      - name: Validate Harness integration and frontend closure
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Validate documentation links
        run: python tools/validate_docs.py
