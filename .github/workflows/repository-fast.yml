name: Fast repository validation

on:
  push:
    branches-ignore: [main]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".github/workflows/repository-fast.yml"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - ".harness/**"
      - ".harness-version"
      - "docs/**"
      - "tools/**"
      - "AGENTS.md"
      - ".github/workflows/repository-fast.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-fast:
    name: Repository fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Materialize pinned Harness Consumer Pack
        id: pack
        shell: bash
        run: |
          PACK="$(python .harness/harnessw.py sync)"
          echo "path=$PACK" >> "$GITHUB_OUTPUT"

      - name: Capture routed Consumer procedure
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.harness/diagnostics/consumer-route"
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.skill_router operation --surface consumer --operation project-bootstrap-reconcile > "$GITHUB_WORKSPACE/.harness/diagnostics/consumer-route/route.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path.cwd()
          out = Path(os.environ["GITHUB_WORKSPACE"]) / ".harness/diagnostics/consumer-route"
          route = json.loads((out / "route.json").read_text(encoding="utf-8"))
          selected = [route["skill"], *route.get("instruction_contracts", [])]
          for index, relative in enumerate(selected):
              shutil.copyfile(root / relative, out / f"{index:02d}-{Path(relative).name}")
          PY

      - name: Build lossless compact Project Publication representation
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          from harness.application.project_publication import (
              _yaml_serialization_projection,
              read_project_publication,
              validate_project_publication,
          )
          root = Path(os.environ["GITHUB_WORKSPACE"])
          graph = yaml.safe_load((root / ".harness/engineering-graph.yaml").read_text(encoding="utf-8"))
          source = root / ".harness/project-publication.yaml"
          publication = read_project_publication(source, graph=graph)
          projected = _yaml_serialization_projection(publication)
          diagnostics = root / ".harness/diagnostics"
          diagnostics.mkdir(parents=True, exist_ok=True)
          output = diagnostics / "project-publication.yaml"
          output.write_text(yaml.safe_dump(projected, sort_keys=False, allow_unicode=True), encoding="utf-8")
          roundtrip = yaml.safe_load(output.read_text(encoding="utf-8"))
          assert roundtrip == publication
          validate_project_publication(graph, roundtrip)
          metrics = {
              "revision": publication["revision"],
              "source_bytes": source.stat().st_size,
              "projected_bytes": output.stat().st_size,
              "reduction_percent": round(100 * (1 - output.stat().st_size / source.stat().st_size), 1),
          }
          (diagnostics / "publication-storage-metrics.json").write_text(json.dumps(metrics, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(metrics, indent=2))
          PY

      - name: Validate Harness integration and current publication integrity
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Upload publication migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-storage-migration
          path: .harness/diagnostics

      - name: Validate documentation links
        run: python tools/validate_docs.py
