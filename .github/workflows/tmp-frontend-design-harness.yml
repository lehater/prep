name: Frontend design Harness checkpoint

on:
  push:
    branches:
      - consolidate/frontend-design-2026-10-06

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Sync Consumer Pack
        id: pack
        shell: bash
        run: |
          PACK="$(python .harness/harnessw.py sync)"
          echo "path=$PACK" >> "$GITHUB_OUTPUT"
          mkdir -p .harness/diagnostics
          echo "$PACK" > .harness/diagnostics/consumer-pack-path.txt
      - name: Route frontend procedures
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.skill_router operation --surface consumer --operation project-bootstrap-reconcile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-project-bootstrap-reconcile.json"
          for kind in system-architecture engineering-policy component-design verification-strategy test-design implementation-design; do
            python -m harness.application.skill_router artifact --knowledge-kind "$kind" > "$GITHUB_WORKSPACE/.harness/diagnostics/route-artifact-$kind.json"
          done
      - name: Print contracts and skills
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path.cwd()
          pack=Path((root/".harness/diagnostics/consumer-pack-path.txt").read_text().strip())
          for rp in sorted((root/".harness/diagnostics").glob("route-*.json")):
              data=json.loads(rp.read_text())
              print(f"===== ROUTE {rp.name} =====")
              print(json.dumps(data,indent=2))
              for ref in data.get("instruction_contracts",[]):
                  print(f"===== CONTRACT {ref} =====")
                  print((pack/ref).read_text())
              if data.get("skill"):
                  print(f"===== SKILL {data['skill']} =====")
                  print((pack/data["skill"]).read_text())
          PY
      - name: Inspect current frontend semantic closure
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication
          from harness.application.semantic_closure import evaluate_semantic_closure
          root=Path(os.environ["GITHUB_WORKSPACE"])
          graph=yaml.safe_load((root/".harness/engineering-graph.yaml").read_text())
          pub=read_project_publication(root/".harness/project-publication.yaml",graph=graph)
          registry=yaml.safe_load((Path.cwd()/"skills/artifact-skill-registry-v0.yaml").read_text())
          contracts=yaml.safe_load((Path.cwd()/"spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml").read_text())
          decisions=yaml.safe_load((Path.cwd()/"spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml").read_text())
          policy=yaml.safe_load((root/".harness/candidates/application-design-decision-policy.yaml").read_text())
          for target in ("FRONTEND-PROTOTYPE","FRONTEND-IMPLEMENTATION"):
              result=evaluate_semantic_closure(
                  graph=graph,model=pub["state"]["core_model"],target=target,
                  skill_registry=registry,
                  semantic_evaluations=pub["state"]["semantic_evaluations"],
                  lifecycle=pub["state"]["lifecycle"],
                  knowledge_contracts=contracts,decision_contracts=decisions,
                  decision_policy=policy,
              )
              print("===== "+target+" =====")
              print(json.dumps({
                  "status":result.get("status"),
                  "semantic_gaps":result.get("semantic_gaps"),
                  "currentness_gaps":result.get("currentness_gaps"),
                  "revalidate":result.get("revalidate"),
              },indent=2))
          PY

      - name: Validate frontend consumer graph
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.project_model.engineering_graph validate "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml"
          python -m harness.application.graph_doctor "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" --core-model "$GITHUB_WORKSPACE/.harness/core.yaml" --target FRONTEND-IMPLEMENTATION --source-root "$GITHUB_WORKSPACE" --json
