name: temporary frontend derivation provenance audit

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-normalize-derivations.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit required target provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          root=Path(".")
          candidates={}
          for path in sorted((root/".harness/candidates").glob("*-admission.yaml")):
              try: doc=yaml.safe_load(path.read_text())
              except Exception: continue
              if doc.get("kind")=="harness-artifact-admission-candidate" and isinstance(doc.get("capability"),str):
                  candidates.setdefault(doc["capability"],[]).append((path,doc))

          def choose(cap):
              rows=candidates.get(cap,[])
              if len(rows)==1: return rows[0]
              # Prefer canonical artifact id matching the target artifact/capability slug only for audit;
              # report ambiguity instead of guessing.
              canonical=[r for r in rows if r[1].get("id")]
              if len(canonical)==1: return canonical[0]
              raise SystemExit(f"ambiguous candidate for {cap}: {[str(p) for p,_ in rows]}")

          missing=[]
          checked=[]
          for path in sorted((root/".harness/candidates").glob("frontend-*-derivation-contract.yaml")):
              doc=yaml.safe_load(path.read_text())
              if doc.get("kind")!="harness-semantic-derivation-contract": continue
              source_cap=doc["source_capability"]; target_cap=doc["target_capability"]
              source_path,source=choose(source_cap)
              target_path,target=choose(target_cap)
              target_derived={
                  d
                  for assertion in target.get("semantic_assertions",[]) or []
                  if isinstance(assertion,dict)
                  for d in assertion.get("derived_from",[]) or []
                  if isinstance(d,str)
              }
              for obligation in doc.get("obligations",[]) or []:
                  if not obligation.get("require_target_provenance"): continue
                  matches=[]
                  for assertion in source.get("semantic_assertions",[]) or []:
                      if not isinstance(assertion,dict): continue
                      if obligation.get("source_kind") and assertion.get("kind")!=obligation.get("source_kind"): continue
                      if obligation.get("subject") and assertion.get("subject")!=obligation.get("subject"): continue
                      matches.append(assertion.get("id"))
                  matches=[m for m in matches if isinstance(m,str)]
                  checked.append((str(path),source_cap,target_cap,obligation.get("id"),matches))
                  absent=[m for m in matches if m not in target_derived]
                  if absent:
                      missing.append({
                          "contract":str(path),
                          "source":source_cap,
                          "target":target_cap,
                          "target_candidate":str(target_path),
                          "obligation":obligation.get("id"),
                          "required_source_ids":absent,
                      })
          print("CHECKED",len(checked))
          print("MISSING",len(missing))
          print(yaml.safe_dump(missing,sort_keys=False,allow_unicode=True))
          PY
