name: temporary frontend derivation provenance audit

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-normalize-derivations.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Audit required target provenance
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,sys,yaml
          root=Path(".")
          harness_root=Path(os.environ["HARNESS_ROOT"])
          sys.path.insert(0,str(harness_root/"src"))
          from harness.application.project_publication import read_project_publication
          from harness.assurance.semantic_fingerprint import semantic_assertion_fingerprints

          graph=yaml.safe_load((root/".harness/engineering-graph.yaml").read_text())
          pub=read_project_publication(root/".harness/project-publication.yaml",graph=graph)
          life={
              row["capability"]:row
              for row in pub["state"]["lifecycle"].get("providers",[]) or []
              if isinstance(row,dict) and isinstance(row.get("capability"),str)
          }
          candidates={}
          for path in sorted((root/".harness/candidates").glob("*-admission.yaml")):
              try: doc=yaml.safe_load(path.read_text())
              except Exception: continue
              if doc.get("kind")=="harness-artifact-admission-candidate" and isinstance(doc.get("capability"),str):
                  candidates.setdefault(doc["capability"],[]).append((path,doc))

          def choose(cap):
              rows=candidates.get(cap,[])
              expected=(life.get(cap) or {}).get("semantic_atom_fingerprints")
              if isinstance(expected,dict) and expected:
                  matches=[r for r in rows if semantic_assertion_fingerprints(r[1])==expected]
                  if len(matches)==1:return matches[0]
              if len(rows)==1:return rows[0]
              raise SystemExit(f"ambiguous current candidate for {cap}: {[str(p) for p,_ in rows]}")

          missing=[]
          zero=[]
          checked=[]
          for path in sorted((root/".harness/candidates").glob("frontend-*-derivation-contract.yaml")):
              doc=yaml.safe_load(path.read_text())
              if doc.get("kind")!="harness-semantic-derivation-contract": continue
              source_cap=doc["source_capability"]; target_cap=doc["target_capability"]
              _,source=choose(source_cap)
              target_path,target=choose(target_cap)
              target_derived={
                  d
                  for assertion in target.get("semantic_assertions",[]) or []
                  if isinstance(assertion,dict)
                  for d in assertion.get("derived_from",[]) or []
                  if isinstance(d,str)
              }
              for obligation in doc.get("obligations",[]) or []:
                  if not obligation.get("require_target_provenance"): continue
                  matches=[]
                  for assertion in source.get("semantic_assertions",[]) or []:
                      if not isinstance(assertion,dict): continue
                      if obligation.get("source_kind") and assertion.get("kind")!=obligation.get("source_kind"): continue
                      if obligation.get("subject") and assertion.get("subject")!=obligation.get("subject"): continue
                      matches.append(assertion.get("id"))
                  matches=[m for m in matches if isinstance(m,str)]
                  checked.append((str(path),source_cap,target_cap,obligation.get("id"),matches))
                  if not matches:
                      zero.append({
                          "contract":str(path),
                          "source":source_cap,
                          "target":target_cap,
                          "obligation":obligation.get("id"),
                          "source_kind":obligation.get("source_kind"),
                          "subject":obligation.get("subject"),
                      })
                  absent=[m for m in matches if m not in target_derived]
                  if absent:
                      missing.append({
                          "contract":str(path),
                          "source":source_cap,
                          "target":target_cap,
                          "target_candidate":str(target_path),
                          "obligation":obligation.get("id"),
                          "required_source_ids":absent,
                      })
          print("CHECKED",len(checked))
          print("ZERO_SOURCE_MATCH",len(zero))
          print(yaml.safe_dump(zero,sort_keys=False,allow_unicode=True))
          print("MISSING_PROVENANCE",len(missing))
          print(yaml.safe_dump(missing,sort_keys=False,allow_unicode=True))
          PY
