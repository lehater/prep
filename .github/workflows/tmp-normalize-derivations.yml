name: temporary normalize stale derivation subjects

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-normalize-derivations.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize stale source kind/subject selectors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          updates={
            "frontend-architecture-component-derivation-contract.yaml": ("architecture-boundary","task-feature-topology"),
            "frontend-architecture-engineering-policy-derivation-contract.yaml": ("architecture-dependency","frontend-dependency-direction"),
            "frontend-architecture-frontend-verification-derivation-contract.yaml": ("architecture-dependency","frontend-dependency-direction"),
            "frontend-component-implementation-derivation-contract.yaml": ("component-boundary","public-task-features"),
            "frontend-interface-presentation-verification-derivation-contract.yaml": ("verification-obligation","interface-traceability"),
            "frontend-policy-component-derivation-contract.yaml": ("engineering-policy-obligation","dependency-direction"),
            "frontend-presentation-frontend-verification-derivation-contract.yaml": ("verification-obligation","dominant-task-composition"),
            "frontend-test-implementation-derivation-contract.yaml": ("test-obligation","frontend-workflow-tests"),
            "frontend-verification-implementation-derivation-contract.yaml": ("verification-obligation","product-interface-traceability"),
            "frontend-verification-test-derivation-contract.yaml": ("verification-obligation","product-interface-traceability"),
          }
          root=Path(".harness/candidates")
          for name,(kind,subject) in updates.items():
              path=root/name
              doc=yaml.safe_load(path.read_text())
              obligations=doc.get("obligations",[]) or []
              if len(obligations)!=1:
                  raise SystemExit(f"{name}: expected one obligation")
              obligations[0]["source_kind"]=kind
              obligations[0]["subject"]=subject
              path.write_text(yaml.safe_dump(doc,sort_keys=False,allow_unicode=True),encoding="utf-8")
              print(name,kind,subject)
          PY
      - name: Commit normalized contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/candidates/frontend-*-derivation-contract.yaml
          git commit -m "Align strict derivation selectors with current semantics"
          git push origin HEAD:audit/ui-view-boundaries-clean
