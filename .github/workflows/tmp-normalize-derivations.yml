name: temporary route missing lifecycle capabilities

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-normalize-derivations.yml"

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Route missing capability artifact skills
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.skill_router --help
          for kind in concurrency-consistency-design system-architecture data-design; do
            echo "=== ROUTE $kind ==="
            python -m harness.application.skill_router artifact --surface consumer --knowledge-kind "$kind" | tee "/tmp/$kind.json"
            python - "$kind" <<'PY'
          import json, pathlib, sys
          kind=sys.argv[1]
          r=json.loads(pathlib.Path(f"/tmp/{kind}.json").read_text())
          for p in r.get("instruction_contracts", []):
              print(f"=== CONTRACT {p} ===")
              print(pathlib.Path(p).read_text())
          print("=== SKILL ===")
          print(pathlib.Path(r["skill"]).read_text())
          PY
          done
