name: Heavy repository validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-heavy:
    name: Repository and frontend heavy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            experiments/knowledge_representation/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend fast validation
        working-directory: frontend
        run: npm run fast

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend supply-chain evidence
        working-directory: frontend
        run: npm run supply-chain

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v7
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py

      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Full Harness revalidation
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py

      - name: Validate documentation links
        run: python tools/validate_docs.py

      - name: Validate maintained Anki reference implementation
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v

      - name: Install Chromium headless shell
        working-directory: frontend
        run: npx playwright install --only-shell chromium

      - name: Run frontend browser E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Install preserved knowledge experiment dependencies
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: experiments/knowledge_representation
        run: npm ci

      - name: Lint preserved knowledge experiment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: experiments/knowledge_representation
        run: npm run lint

      - name: Build preserved knowledge experiment
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: experiments/knowledge_representation
        run: npm run build

      - name: Build preserved knowledge experiment Storybook
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        working-directory: experiments/knowledge_representation
        run: npm run build-storybook
