name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          frontend=false
          while IFS= read -r changed; do
            case "$changed" in
              web/*|.github/workflows/validate.yml|.github/workflows/frontend-fast.yml)
                frontend=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  repository-full:
    name: Repository full
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py

      - name: Validate Decision Governance pilot
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/decision_governance_pilot.py

      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Full Harness revalidation
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py

      - name: Validate documentation links
        run: python tools/validate_docs.py

      - name: Validate maintained Anki reference implementation
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v

  frontend-full:
    name: Frontend full
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run deterministic frontend checks
        run: npm run verify

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:e2e

      - name: Run graph stress evidence
        run: npm run benchmark:graph

      - name: Build frontend container
        env:
          FRONTEND_IMAGE: prep-web-ci:${{ github.sha }}
        run: |
          docker build \
            --build-arg PREP_FRONTEND_VERSION="${GITHUB_SHA}" \
            --tag "${FRONTEND_IMAGE}" \
            .

      - name: Verify frontend image identity
        env:
          FRONTEND_IMAGE: prep-web-ci:${{ github.sha }}
        run: |
          test "$(docker image inspect "${FRONTEND_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          docker image inspect "${FRONTEND_IMAGE}" --format 'image={{.Id}} revision={{ index .Config.Labels "org.opencontainers.image.revision" }}'
