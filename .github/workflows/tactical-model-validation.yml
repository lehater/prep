name: Tactical model validation

on:
  push:
    branches:
      - model/tactical-domain-redesign

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - name: Full Harness revalidation
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py
      - name: Validate documentation links
        run: python tools/validate_docs.py
      - name: Validate maintained Anki reference
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v
