name: Visual composition experiment

on:
  push:
    branches: [experiment/parallel-visual-composition-header]

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - run: python tools/validate_docs.py
      - run: python tools/validate_architecture.py
      - run: python tools/validate_questions.py
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/curation.spec.ts --project=chromium-mock
      - name: Capture Knowledge header
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/prep-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1366, height: 768}});
          await page.goto("http://127.0.0.1:4173/curation/knowledge");
          await page.screenshot({path: "knowledge-header.png", fullPage: false});
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-header
          path: web/knowledge-header.png
