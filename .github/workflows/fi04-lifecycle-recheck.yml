name: FI-04 lifecycle recheck

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/fi04-lifecycle-recheck.yml"

permissions:
  contents: read

jobs:
  repository-semantic:
    name: Repository semantic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML

      - name: Validate strict semantic baseline
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py

      - name: Validate Harness integration
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Validate documentation links
        run: python tools/validate_docs.py

      - name: Validate architecture boundaries
        run: python tools/validate_architecture.py

      - name: Validate question model and banks
        run: python tools/validate_questions.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
