name: Harness reconcile audit

on:
  push:
    branches:
      - model/tactical-domain-redesign

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - name: Read pinned Harness
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Reconcile authority registry
        run: |
          python .harness-tool/project_status.py reconcile             --catalog .harness-tool/catalogs/software-authorities-v0.yaml             --registry .harness/authority-assessments.yaml             --core .harness/core.yaml             --write /tmp/reconciled.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          current=yaml.safe_load(Path(".harness/authority-assessments.yaml").read_text())
          reconciled=yaml.safe_load(Path("/tmp/reconciled.yaml").read_text())
          print("REGISTRY_SEMANTIC_DIFF=" + ("yes" if current != reconciled else "no"))
          if current != reconciled:
              print(Path("/tmp/reconciled.yaml").read_text())
          PY

      - name: Validate reconciled registry
        run: |
          python .harness-tool/project_status.py validate             --catalog .harness-tool/catalogs/software-authorities-v0.yaml             --registry /tmp/reconciled.yaml

      - name: Project engineering status
        run: |
          python .harness-tool/project_status.py status             --catalog .harness-tool/catalogs/software-authorities-v0.yaml             --registry /tmp/reconciled.yaml             --core .harness/core.yaml

      - name: Build semantic evidence for coverage diagnostic
        env:
          HARNESS_ROOT: .harness-tool
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          from tools.semantic_baseline import build_strict_semantic_baseline
          graph=yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          core=yaml.safe_load(Path(".harness/core.yaml").read_text())
          evaluations,_=build_strict_semantic_baseline(graph,core)
          Path("/tmp/semantic-evaluations.yaml").write_text(yaml.safe_dump(evaluations,sort_keys=False))
          PY

      - name: Engineering Coverage diagnostic
        run: |
          python .harness-tool/engineering_coverage.py             .harness/engineering-graph.yaml             .harness/core.yaml             FRONTEND-IMPLEMENTATION             --scope frontend             --overlay .harness/engineering-coverage.yaml             --semantic-evaluations /tmp/semantic-evaluations.yaml             > /tmp/coverage.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/coverage.json"))
          print("COVERAGE_COMPLETION_READY=",x["completion_ready"])
          print("COVERAGE_REMAINING_WORK=",x["remaining_work_count"])
          print("COVERAGE_QUESTIONS=",x["question_frontier_count"])
          for item in x.get("work_items",[]):
              print("COVERAGE_FINDING",json.dumps(item,sort_keys=True))
          PY

      - name: Graph Doctor diagnostic
        run: |
          python - <<'PY'
          import sys,yaml,json
          from pathlib import Path
          sys.path.insert(0,".harness-tool")
          from graph_doctor import diagnose_project
          graph=yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          core=yaml.safe_load(Path(".harness/core.yaml").read_text())
          model=dict(core)
          model["authorities"]=[{"id":x["id"]} for x in graph.get("authorities",[]) if isinstance(x,dict) and x.get("id")]
          for consumer in ["CURRENT-REVALIDATION","FRONTEND-PROTOTYPE","FRONTEND-IMPLEMENTATION"]:
              d=diagnose_project(graph,model=model,target=consumer,source_root=Path("."))
              s=d["summary"]
              print(f"DOCTOR {consumer} ERROR={s['ERROR']} WARN={s['WARN']} INFO={s['INFO']}")
              for row in d["findings"]:
                  print("DOCTOR_FINDING",consumer,json.dumps(row,sort_keys=True))
          PY
