name: Learning progression publication revalidation

on:
  push:
    branches:
      - docs/learning-progression-semantics
    paths:
      - "docs/domain/learning-design.md"
      - "docs/architecture/model-context-map.md"
      - "docs/application/**"
      - "docs/interface/conceptual-interface-model.yaml"
      - "docs/interface/information-architecture.yaml"
      - "docs/interface/interaction-design.yaml"
      - ".harness/candidates/**"
      - "tools/revalidate_learning_progression_publication.py"
      - ".github/workflows/learning-progression-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install runtime dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Revalidate learning progression publication
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/revalidate_learning_progression_publication.py

      - name: Publish revalidated snapshot to branch
        if: success()
        shell: bash
        run: |
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml
          if git diff --cached --quiet; then
            echo "Publication already current"
          else
            git commit -m "Publish revalidated learning progression semantics"
            git push origin HEAD:docs/learning-progression-semantics
          fi

      - name: Upload revalidation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-progression-revalidation
          path: |
            .harness/project-publication.next.yaml
            .harness/revalidation-report.yaml
