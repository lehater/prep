name: FI-05 frontend recheck

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/fi05-frontend-recheck.yml"

permissions:
  contents: read

jobs:
  frontend-full:
    name: Frontend full
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build --tag prep-web-fi05 .
