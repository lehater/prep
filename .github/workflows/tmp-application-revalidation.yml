name: temporary decision explorer skill

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Locate decision explorer and print contract
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          echo "=== MATCHING SKILLS ==="
          find skills -type f -name SKILL.md -print | grep -E 'decision|explor' || true
          echo "=== DECISION PIPELINE SKILL ==="
          cat skills/agent/decision-pipeline/SKILL.md
          echo "=== DOMAIN MODEL CONTRACT ==="
          python - <<'PY'
          import yaml
          d=yaml.safe_load(open('spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml'))
          for x in d.get('contracts',[]):
              if x.get('knowledge_kind')=='domain-model':
                  print(yaml.safe_dump(x,sort_keys=False,allow_unicode=True))
          PY
