name: temporary frontend admission contracts

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Print frontend admission contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python - <<'PY'
          import yaml
          kinds=[
            'system-architecture','engineering-policy','component-design',
            'verification-strategy','test-design','implementation-design'
          ]
          sem=yaml.safe_load(open('spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml'))
          dec=yaml.safe_load(open('spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml'))
          sm={x['knowledge_kind']:x for x in sem.get('contracts',[])}
          dm={x['knowledge_kind']:x for x in dec.get('contracts',[])}
          for k in kinds:
              print('=== SEMANTIC',k,'===')
              print(yaml.safe_dump(sm.get(k),sort_keys=False,allow_unicode=True))
              print('=== DECISION',k,'===')
              print(yaml.safe_dump(dm.get(k),sort_keys=False,allow_unicode=True))
          PY
