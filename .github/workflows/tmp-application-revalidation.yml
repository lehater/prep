name: temporary decision request api

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect decision request API
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          grep -n -A180 -B20 -E '^def .*decision.*request|^def build_.*request|build_decision_explorer_request' src/harness/application/decision_explorer_request.py || true
