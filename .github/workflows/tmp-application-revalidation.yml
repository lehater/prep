name: temporary policy revalidation probe

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_probe_policy_revalidation.py"
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Probe policy revalidation prefix
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_probe_policy_revalidation.py
