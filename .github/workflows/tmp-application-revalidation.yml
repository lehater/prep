name: temporary strict frontend tail admission

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_admit_frontend_tail.py"
      - ".harness/candidates/frontend-*-admission.yaml"
      - ".harness/candidates/presentation-verification-admission.yaml"
      - ".harness/candidates/frontend-*-exploration-draft.yaml"
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Admit frontend tail
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_admit_frontend_tail.py
      - name: Upload next publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-frontend-tail
          path: |
            .harness/project-publication.next.yaml
            .harness/frontend-tail-report.yaml
            .harness/candidates/frontend-component-design-exploration.yaml
            .harness/candidates/frontend-implementation-design-exploration.yaml
