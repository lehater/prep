name: temporary publication coverage audit

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Compare publication semantic and lifecycle coverage
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication
          from harness.project_model.engineering_graph import production_index
          graph=yaml.safe_load(Path('.harness/engineering-graph.yaml').read_text())
          prod=production_index(graph)
          p=read_project_publication(Path('.harness/project-publication.yaml'),graph=graph)
          sem={x.get('capability') for x in p['state']['semantic_evaluations'].get('semantic_evaluations',[])}
          life={x.get('capability') for x in p['state']['lifecycle'].get('providers',[])}
          seen=set(); order=[]
          def visit(c):
              if c in seen:return
              for r in prod[c].get('requires',[]) or []: visit(r['capability'])
              seen.add(c);order.append(c)
          visit('prep.frontend-implementation-design')
          for c in order:
              print(c, 'SEM='+('yes' if c in sem else 'NO'), 'LIFE='+('yes' if c in life else 'NO'))
          PY
