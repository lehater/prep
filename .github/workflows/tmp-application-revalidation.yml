name: temporary strict frontend publication revalidation

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Build next strict publication
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/revalidate_frontend_publication.py
      - name: Verify next strict closure
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=yaml.safe_load(Path(".harness/project-publication.next.yaml").read_text())
          state=p["state"]
          for path,key in [
              ("/tmp/core.yaml","core_model"),
              ("/tmp/evals.yaml","semantic_evaluations"),
              ("/tmp/lifecycle.yaml","lifecycle"),
          ]:
              Path(path).write_text(yaml.safe_dump(state[key],sort_keys=False,allow_unicode=True))
          PY
          cd "${{ steps.sync.outputs.pack }}"
          for TARGET in FRONTEND-PROTOTYPE FRONTEND-IMPLEMENTATION; do
            python -m harness.application.semantic_closure               "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" "$TARGET"               /tmp/core.yaml /tmp/evals.yaml /tmp/lifecycle.yaml               --decision-policy "$GITHUB_WORKSPACE/.harness/candidates/application-design-decision-policy.yaml"
          done
      - name: Diff hygiene
        run: git diff --check
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-frontend-revalidation
          path: |
            .harness/project-publication.next.yaml
            .harness/candidates/current-lifecycle.next.yaml
            .harness/revalidation-report.yaml
