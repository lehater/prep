name: temporary application design revalidation route

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Load routed Application Design procedure
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.skill_router artifact --knowledge-kind application-design | tee /tmp/route.json
          python - <<'PY'
          import json, pathlib
          route=json.loads(pathlib.Path('/tmp/route.json').read_text())
          for p in route.get('instruction_contracts', []):
              print(f"=== CONTRACT {p} ===")
              print(pathlib.Path(p).read_text())
          print("=== SKILL ===")
          print(pathlib.Path(route['skill']).read_text())
          PY
