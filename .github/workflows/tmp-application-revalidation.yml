name: temporary Harness reconcile route

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Route reconcile
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.skill_router operation --surface consumer --operation project-bootstrap-reconcile | tee /tmp/route.json
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('/tmp/route.json').read_text())
          for p in r.get('instruction_contracts', []):
              print(f'=== CONTRACT {p} ===')
              print(pathlib.Path(p).read_text())
          print('=== SKILL ===')
          print(pathlib.Path(r['skill']).read_text())
          PY
