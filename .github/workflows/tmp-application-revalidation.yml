name: temporary strict prefix revalidation

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_revalidate_publication_prefix.py"
      - ".harness/candidates/*-admission.yaml"
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Revalidate strict prefix
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_revalidate_publication_prefix.py
      - name: Upload candidate publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-prefix-revalidation
          path: |
            .harness/project-publication.next.yaml
            .harness/prefix-revalidation-report.yaml
            .harness/candidates/*-exploration-current.yaml
