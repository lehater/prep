name: temporary frontend decision roadmap

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Evaluate frontend roadmap from publication
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication
          graph=yaml.safe_load(Path('.harness/engineering-graph.yaml').read_text())
          p=read_project_publication(Path('.harness/project-publication.yaml'), graph=graph)
          s=p['state']
          Path('/tmp/core.yaml').write_text(yaml.safe_dump(s['core_model'],sort_keys=False))
          Path('/tmp/evals.yaml').write_text(yaml.safe_dump(s['semantic_evaluations'],sort_keys=False))
          Path('/tmp/lifecycle.yaml').write_text(yaml.safe_dump(s['lifecycle'],sort_keys=False))
          Path('/tmp/failures.yaml').write_text(yaml.safe_dump(s['decision_failures'],sort_keys=False))
          print('PUBLICATION',p['revision'])
          PY
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.decision_pipeline             "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml"             FRONTEND-IMPLEMENTATION             /tmp/core.yaml             /tmp/lifecycle.yaml             --semantic-evaluations /tmp/evals.yaml             --decision-failures /tmp/failures.yaml             --decision-policy "$GITHUB_WORKSPACE/.harness/candidates/application-design-decision-policy.yaml"
