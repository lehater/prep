name: temporary decision request signature

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect request builder signatures
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          python - <<'PY'
          import inspect
          from harness.application.decision_explorer_request import build_decision_explorer_request
          from harness.decision.decision_exploration import validate_explorer_request_binding
          print("BUILD", inspect.signature(build_decision_explorer_request))
          print(inspect.getsource(build_decision_explorer_request))
          print("BIND", inspect.signature(validate_explorer_request_binding))
          print(inspect.getsource(validate_explorer_request_binding))
          PY
