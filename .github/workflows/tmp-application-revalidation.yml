name: temporary publication semantic surface audit

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Print frontend publication semantic evaluations
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication
          graph=yaml.safe_load(Path('.harness/engineering-graph.yaml').read_text())
          p=read_project_publication(Path('.harness/project-publication.yaml'),graph=graph)
          wanted={
            'prep.frontend-system-architecture','prep.frontend-engineering-policy',
            'prep.frontend-component-design','prep.interface-verification',
            'prep.presentation-verification','prep.frontend-verification',
            'prep.frontend-test-design','prep.frontend-implementation-design'
          }
          for e in p['state']['semantic_evaluations'].get('semantic_evaluations',[]):
              if e.get('capability') in wanted:
                  print('===',e['capability'],'===')
                  print(yaml.safe_dump(e,sort_keys=False,allow_unicode=True))
          PY
