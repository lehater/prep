name: temporary derivation contract discovery

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Discover derivation contract surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          echo "=== modules ==="
          find src/harness/application src/harness/assurance -maxdepth 1 -type f -printf '%p\n' | sort | grep -E 'deriv|semantic' || true
          echo "=== contract builders ==="
          grep -RIn --exclude='*.pyc' -E 'build_.*derivation|derivation_contract|semantic derivation contract|harness-semantic-derivation-contract' src/harness skills docs/design spec | head -n 260 || true
