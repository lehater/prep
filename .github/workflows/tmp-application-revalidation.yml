name: temporary strict prefix revalidation

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_revalidate_publication_prefix.py"
      - ".harness/candidates/*-admission.yaml"
      - ".github/workflows/tmp-application-revalidation.yml"

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Revalidate strict prefix
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_revalidate_publication_prefix.py
      - name: Publish strict prefix snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          rm .harness/project-publication.next.yaml .harness/prefix-revalidation-report.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml .harness/candidates/*-exploration-current.yaml
          git commit -m "Publish strict semantic prefix revalidation"
          git push origin HEAD:audit/ui-view-boundaries-clean
      - name: Upload candidate publication
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-prefix-revalidation
          path: |
            .harness/project-publication.next.yaml
            .harness/prefix-revalidation-report.yaml
            .harness/candidates/*-exploration-current.yaml
