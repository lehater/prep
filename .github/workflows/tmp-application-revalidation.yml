name: temporary implementation request inspection

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect request builder and admission invocation
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          python - <<'PY'
          import inspect
          import harness.application.semantic_admission as sa
          from harness.application.decision_explorer_request import build_decision_explorer_request
          print("=== SIGNATURE ===")
          print(inspect.signature(build_decision_explorer_request))
          print("=== BUILDER ===")
          print(inspect.getsource(build_decision_explorer_request))
          print("=== ADMISSION CALL SITE ===")
          src=inspect.getsource(sa.admit_artifact)
          i=src.find("build_decision_explorer_request")
          print(src[max(0,i-3500):i+5000])
          PY
