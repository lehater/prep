name: temporary semantic closure API inspection

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect semantic closure API
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python - <<'PY'
          import inspect
          from harness.application.semantic_closure import evaluate_semantic_closure
          print(inspect.signature(evaluate_semantic_closure))
          print(inspect.getsource(evaluate_semantic_closure))
          PY
