name: temporary strict frontend publication

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_admit_frontend_tail.py"
      - ".harness/candidates/frontend-*-admission.yaml"
      - ".harness/candidates/presentation-verification-admission.yaml"
      - ".harness/candidates/frontend-*-exploration-draft.yaml"
      - ".github/workflows/tmp-application-revalidation.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Admit frontend tail
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_admit_frontend_tail.py
      - name: Validate strict semantic closure
        shell: bash
        env:
          PYTHONPATH: ${{ steps.sync.outputs.pack }}/src
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication

          graph=yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          pub=read_project_publication(Path(".harness/project-publication.next.yaml"), graph=graph)
          state=pub["state"]
          Path("/tmp/next-core.yaml").write_text(yaml.safe_dump(state["core_model"],sort_keys=False,allow_unicode=True))
          Path("/tmp/next-evals.yaml").write_text(yaml.safe_dump(state["semantic_evaluations"],sort_keys=False,allow_unicode=True))
          Path("/tmp/next-lifecycle.yaml").write_text(yaml.safe_dump(state["lifecycle"],sort_keys=False,allow_unicode=True))
          print("validated publication", pub["revision"])
          PY
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.semantic_closure             "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" FRONTEND-PROTOTYPE             /tmp/next-core.yaml /tmp/next-evals.yaml /tmp/next-lifecycle.yaml             --decision-policy "$GITHUB_WORKSPACE/.harness/candidates/application-design-decision-policy.yaml"
          python -m harness.application.semantic_closure             "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" FRONTEND-IMPLEMENTATION             /tmp/next-core.yaml /tmp/next-evals.yaml /tmp/next-lifecycle.yaml             --decision-policy "$GITHUB_WORKSPACE/.harness/candidates/application-design-decision-policy.yaml"
      - name: Publish validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          rm -f .harness/project-publication.next.yaml .harness/frontend-tail-report.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml             .harness/candidates/frontend-component-design-exploration.yaml             .harness/candidates/frontend-implementation-design-exploration.yaml
          if git diff --cached --quiet; then
            echo "No publication changes to commit"
          else
            git commit -m "Publish strict frontend semantic closure"
            git push origin HEAD:audit/ui-view-boundaries-clean
          fi
