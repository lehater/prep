name: temporary not applicable contract inspection

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect NOT_APPLICABLE evaluator
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          grep -RIn -A25 -B25 "DECISION_NOT_APPLICABLE_EVIDENCE_REQUIRED" src/harness
