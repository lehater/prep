name: temporary semantic contract defaults

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Print semantic contract defaults
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          python - <<'PY'
          import yaml
          from pathlib import Path
          d=yaml.safe_load(Path("spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml").read_text())
          print(yaml.safe_dump(d.get("defaults",{}),sort_keys=False,allow_unicode=True))
          PY
