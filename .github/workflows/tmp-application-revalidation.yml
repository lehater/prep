name: temporary strict frontend frontier admission

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_admit_frontend_frontier.py"
      - ".harness/candidates/frontend-system-architecture-admission.yaml"
      - ".harness/candidates/interface-verification-admission.yaml"
      - ".github/workflows/tmp-application-revalidation.yml"

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Admit frontend frontier
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_admit_frontend_frontier.py
      - name: Publish frontend frontier snapshot
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp .harness/project-publication.next.yaml .harness/project-publication.yaml
          rm .harness/project-publication.next.yaml .harness/frontend-frontier-report.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml .harness/candidates/frontend-system-architecture-exploration.yaml
          git commit -m "Publish strict frontend frontier"
          git push origin HEAD:audit/ui-view-boundaries-clean
      - name: Upload next publication
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: strict-frontend-frontier
          path: |
            .harness/project-publication.next.yaml
            .harness/frontend-frontier-report.yaml
            .harness/candidates/frontend-system-architecture-exploration.yaml
