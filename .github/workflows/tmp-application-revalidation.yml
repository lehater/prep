name: temporary decision exploration contract

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-application-revalidation.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect current request and exploration contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          echo "=== decision explorer request source ==="
          sed -n '1,320p' src/harness/application/decision_explorer_request.py
          echo "=== decision exploration evaluator source ==="
          sed -n '1,360p' src/harness/decision/decision_exploration.py
          echo "=== request schema ==="
          cat spec/decision-governance/decision-explorer-request-contract-v1.yaml
