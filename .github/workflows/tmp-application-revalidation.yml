name: temporary derivation schema audit

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect derivation schema
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.sync.outputs.pack }}"
          sed -n '1,260p' spec/semantic-derivation/semantic-derivation-v1.yaml
          echo "=== EVALUATOR RULES ==="
          sed -n '280,520p' src/harness/assurance/semantic_derivation.py
