name: Baseline semantic publication checkpoint

on:
  push:
    branches:
      - consolidate/baseline-architecture-2026-10-06
    paths:
      - "tools/revalidate_baseline_publication.py"
      - ".github/workflows/tmp-baseline-semantic-publication.yml"
      - ".harness/candidates/**"
      - ".harness/semantic-baseline.yaml"
      - "docs/architecture/**"
      - "docs/verification/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Sync active Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          python .harness/harnessw.py sync | tee /tmp/harness-sync.txt
          PACK="$(tail -n 1 /tmp/harness-sync.txt)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"

      - name: Revalidate and build semantic publication
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/revalidate_baseline_publication.py

      - name: Validate resulting CURRENT-REVALIDATION closure
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import yaml

          root = Path(".").resolve()
          harness_root = Path(os.environ["HARNESS_ROOT"]).resolve()
          sys.path.insert(0, str(harness_root / "src"))
          sys.path.insert(0, str(root / "tools"))

          from harness.application.graph_doctor import diagnose_project
          from harness.application.semantic_closure import evaluate_semantic_closure
          from harness.project_model.engineering_graph import evaluate_engineering_target
          from semantic_baseline import build_strict_semantic_baseline

          def load(path):
              value = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{path} must contain a mapping")
              return value

          target = "CURRENT-REVALIDATION"
          graph = load(root / ".harness/engineering-graph.yaml")
          core = load(root / ".harness/core.yaml")
          registry = load(harness_root / "skills/artifact-skill-registry-v0.yaml")

          doctor_model = dict(core)
          doctor_model["authorities"] = [
              {"id": item["id"]}
              for item in graph.get("authorities", [])
              if isinstance(item, dict) and item.get("id")
          ]
          doctor = diagnose_project(graph, model=doctor_model, target=target, source_root=root)
          if doctor["summary"]["ERROR"]:
              raise SystemExit(f"{target} Graph Doctor errors: {doctor['findings']}")

          structural = evaluate_engineering_target(graph, target, core)
          if structural["status"] != "COMPLETE":
              raise SystemExit(f"{target} structural closure: {structural}")

          semantic_evaluations, lifecycle = build_strict_semantic_baseline(graph, core)
          closure = evaluate_semantic_closure(
              graph=graph,
              model=core,
              target=target,
              skill_registry=registry,
              semantic_evaluations=semantic_evaluations,
              lifecycle=lifecycle,
          )
          print(f"{target} strict semantic/currentness: {closure['status']}")
          if closure["status"] != "COMPLETE":
              raise SystemExit(
                  f"{target} semantic closure incomplete: "
                  f"semantic_gaps={closure['semantic_gaps']} "
                  f"currentness_gaps={closure['currentness_gaps']}"
              )
          PY

      - name: Publish accepted state to branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml
          if git diff --cached --quiet; then
            echo "Publication already current"
          else
            git commit -m "Publish baseline architecture and verification semantics"
            git push origin HEAD:consolidate/baseline-architecture-2026-10-06
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-semantic-checkpoint
          path: |
            .harness/project-publication.next.yaml
            .harness/baseline-revalidation-report.yaml
