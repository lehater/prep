name: Branch currentness diagnostic

on:
  push:
    branches:
      - docs/learning-progression-semantics
    paths:
      - ".github/workflows/branch-currentness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Evaluate branch currentness
        continue-on-error: true
        env:
          HARNESS_ROOT: ${{ github.workspace }}/.harness-tool
        run: python tools/full_harness_revalidate.py
