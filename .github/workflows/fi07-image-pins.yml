name: FI-07 image pins

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/fi07-image-pins.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact image digests
        run: |
          docker pull node:24.21.0-alpine
          docker pull nginx:1.28.0-alpine
          echo "NODE=$(docker image inspect node:24.21.0-alpine --format '{{index .RepoDigests 0}}')"
          echo "NGINX=$(docker image inspect nginx:1.28.0-alpine --format '{{index .RepoDigests 0}}')"
