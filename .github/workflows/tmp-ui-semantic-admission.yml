name: UI semantic admission checkpoint

on:
  push:
    branches:
      - consolidate/ui-architecture-2026-10-06
  workflow_dispatch:

permissions:
  contents: write

jobs:
  current-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Prep experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Materialize pinned Harness Consumer Pack
        id: pack
        shell: bash
        run: |
          mkdir -p .harness/diagnostics
          PACK="$(python .harness/harnessw.py sync)"
          echo "path=$PACK" >> "$GITHUB_OUTPUT"
          echo "$PACK" > .harness/diagnostics/consumer-pack-path.txt

      - name: Route public operations
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.skill_router operation --surface consumer --operation project-bootstrap-reconcile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-project-bootstrap-reconcile.json"
          python -m harness.application.skill_router operation --surface consumer --operation design-profile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-design-profile.json"
          python -m harness.application.skill_router operation --surface consumer --operation project-reconcile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-project-reconcile.json"
          python -m harness.application.skill_router operation --surface consumer --operation decision-pipeline > "$GITHUB_WORKSPACE/.harness/diagnostics/route-decision-pipeline.json"

      - name: Route interface topology artifact
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.skill_router --help > "$GITHUB_WORKSPACE/.harness/diagnostics/skill-router-help.txt"
          python -m harness.application.skill_router artifact --help > "$GITHUB_WORKSPACE/.harness/diagnostics/skill-router-artifact-help.txt"
          python -m harness.application.skill_router artifact --knowledge-kind information-architecture-design > "$GITHUB_WORKSPACE/.harness/diagnostics/route-information-architecture.json"
          python -m harness.application.skill_router artifact --knowledge-kind interface-topology-design > "$GITHUB_WORKSPACE/.harness/diagnostics/route-interface-topology.json"
          python -m harness.application.skill_router artifact --knowledge-kind screen-view-design > "$GITHUB_WORKSPACE/.harness/diagnostics/route-screen-view.json"

      - name: Capture routed Consumer instructions
        shell: bash
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path(r"${{ steps.pack.outputs.path }}")
          out = root / ".harness" / "diagnostics" / "routed"
          out.mkdir(parents=True, exist_ok=True)

          for route_name in ("route-project-bootstrap-reconcile.json", "route-project-reconcile.json", "route-decision-pipeline.json", "route-design-profile.json", "route-information-architecture.json", "route-interface-topology.json", "route-screen-view.json"):
              route = json.loads((root / ".harness" / "diagnostics" / route_name).read_text())
              for rel in [*route.get("instruction_contracts", []), route["skill"]]:
                  src = pack / rel
                  dst = out / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
          PY

      - name: Capture reconciliation API
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY' > "$GITHUB_WORKSPACE/.harness/diagnostics/reconciliation-api.txt"
          import inspect
          import harness.application.reconciliation as r
          for name in ("plan_reconciliation", "execute_reconciliation"):
              fn = getattr(r, name)
              print(name, inspect.signature(fn))
              print(inspect.getdoc(fn) or "")
              print("---")
          PY

      - name: Capture semantic admission API
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.semantic_admission --help > "$GITHUB_WORKSPACE/.harness/diagnostics/semantic-admission-help.txt" 2>&1 || true
          python - <<'PY' > "$GITHUB_WORKSPACE/.harness/diagnostics/semantic-admission-api.txt"
          import inspect
          import harness.application.semantic_admission as m
          for name in sorted(dir(m)):
              if "admi" not in name.lower() and "evalu" not in name.lower():
                  continue
              obj = getattr(m, name)
              if callable(obj):
                  try:
                      print(name, inspect.signature(obj))
                  except Exception:
                      pass
          PY

      - name: Admit Information Architecture revision
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.semantic_admission import admit_artifact
          from harness.assurance.semantic_derivation import evaluate_derivation

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())

          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          model = publication["state"]["core_model"]
          lifecycle = publication["state"]["lifecycle"]
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")
          candidate = load(root / ".harness/candidates/information-architecture-admission.yaml")

          prerequisite_candidates = [
              ("CONCEPTUAL-INTERFACE-MODEL", root / ".harness/candidates/conceptual-interface-model-admission.yaml"),
              ("TASK-MODEL", root / ".harness/candidates/task-model-admission.yaml"),
              ("USER-JOURNEYS", root / ".harness/candidates/process-migration-user-journeys-admission.yaml"),
          ]
          by_artifact = {}
          all_assertions = []
          for artifact_id, path in prerequisite_candidates:
              data = load(path)
              assertions = []
              for raw in data.get("semantic_assertions", []):
                  item = copy.deepcopy(raw)
                  item["source_artifact"] = artifact_id
                  assertions.append(item)
                  all_assertions.append(copy.deepcopy(item))
              by_artifact[artifact_id] = {"semantic_assertions": assertions}

          derivation_specs = [
              (
                  "conceptual",
                  "CONCEPTUAL-INTERFACE-MODEL",
                  root / ".harness/candidates/information-architecture-conceptual-contract.yaml",
                  root / ".harness/candidates/process-migration-information-architecture-conceptual-evidence.yaml",
              ),
              (
                  "task",
                  "TASK-MODEL",
                  root / ".harness/candidates/process-migration-information-architecture-task-contract.yaml",
                  root / ".harness/candidates/process-migration-information-architecture-task-evidence.yaml",
              ),
              (
                  "journey",
                  "USER-JOURNEYS",
                  root / ".harness/candidates/process-migration-information-architecture-journey-contract.yaml",
                  root / ".harness/candidates/process-migration-information-architecture-journey-evidence.yaml",
              ),
          ]

          derivations = []
          for label, artifact_id, contract_path, evidence_path in derivation_specs:
              result = evaluate_derivation(
                  graph=graph,
                  contract=load(contract_path),
                  source=by_artifact[artifact_id],
                  candidate=candidate,
                  evidence=load(evidence_path),
              )
              derivations.append(result)
              (diag / f"ia-derivation-{label}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True)
              )

          result = admit_artifact(
              graph=graph,
              model=model,
              skill_registry=registry,
              knowledge_contracts=contracts,
              decision_contracts=decision_contracts,
              capability="prep.information-architecture",
              sources={"semantic_assertions": all_assertions},
              candidate=candidate,
              acceptance_id="PREP-INFORMATION-ARCHITECTURE-STRICT-6",
              lifecycle=lifecycle,
              derivation_evaluations=derivations,
              decision_request_mode="REVISION",
          )
          (diag / "ia-semantic-admission.json").write_text(
              json.dumps(result, indent=2, sort_keys=True)
          )
          print(json.dumps({
              "status": result.get("status"),
              "acceptance_id": result.get("admission", {}).get("acceptance_id"),
              "findings": result.get("findings", []),
              "questions": result.get("question_proposals", []),
          }, indent=2))
          if result.get("status") != "ACCEPTED":
              raise SystemExit(1)
          PY

      - name: Prepare IA capability publication transition
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import (
              prepare_capability_transition,
              read_project_publication,
          )

          root = Path(os.environ["GITHUB_WORKSPACE"])
          diag = root / ".harness" / "diagnostics"
          graph = yaml.safe_load((root / ".harness/engineering-graph.yaml").read_text())
          current = read_project_publication(
              root / ".harness/project-publication.yaml",
              graph=graph,
          )
          admission = json.loads((diag / "ia-semantic-admission.json").read_text())
          if admission.get("status") != "ACCEPTED":
              raise SystemExit("IA admission is not ACCEPTED")

          semantic = copy.deepcopy(current["state"]["semantic_evaluations"])
          semantic["semantic_evaluations"] = [
              admission if item.get("capability") == "prep.information-architecture" else item
              for item in semantic.get("semantic_evaluations", [])
          ]
          new_derivations = [
              json.loads((diag / name).read_text())
              for name in (
                  "ia-derivation-conceptual.json",
                  "ia-derivation-task.json",
                  "ia-derivation-journey.json",
              )
          ]
          semantic["derivation_evaluations"] = [
              item for item in semantic.get("derivation_evaluations", [])
              if item.get("target_capability") != "prep.information-architecture"
          ] + new_derivations

          lifecycle = copy.deepcopy(current["state"]["lifecycle"])
          lifecycle["providers"] = [
              admission["lifecycle_assertion"]
              if item.get("capability") == "prep.information-architecture"
              else item
              for item in lifecycle.get("providers", [])
          ]

          next_publication = prepare_capability_transition(
              graph=graph,
              current_publication=current,
              expected_revision=current["revision"],
              capability="prep.information-architecture",
              outcome="CURRENT",
              core_model=current["state"]["core_model"],
              semantic_evaluations=semantic,
              lifecycle=lifecycle,
              decision_failures=current["state"]["decision_failures"],
          )
          (diag / "ia-publication-next.yaml").write_text(
              yaml.safe_dump(next_publication, sort_keys=False, allow_unicode=True)
          )
          print(json.dumps({
              "current_revision": current["revision"],
              "next_revision": next_publication["revision"],
              "parent_revision": next_publication["parent_revision"],
              "ia_acceptance_id": admission["admission"]["acceptance_id"],
          }, indent=2))
          PY

      - name: Publish IA capability transition
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          from harness.application.project_publication import (
              publish_project_publication,
              read_project_publication,
          )

          root = Path(os.environ["GITHUB_WORKSPACE"])
          graph = yaml.safe_load((root / ".harness/engineering-graph.yaml").read_text())
          current = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          next_publication = yaml.safe_load(
              (root / ".harness/diagnostics/ia-publication-next.yaml").read_text()
          )
          publish_project_publication(
              root / ".harness/project-publication.yaml",
              graph=graph,
              publication=next_publication,
              expected_revision=current["revision"],
          )
          PY
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- .harness/project-publication.yaml; then
            echo "No publication change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .harness/project-publication.yaml
            git commit -m "Publish IA acceptance transition [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Admit Interface Topology revision
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.semantic_admission import admit_artifact
          from harness.assurance.semantic_derivation import evaluate_derivation

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())

          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          model = publication["state"]["core_model"]
          lifecycle = copy.deepcopy(publication["state"]["lifecycle"])
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")

          ia_result = json.loads((diag / "ia-semantic-admission.json").read_text())
          if ia_result.get("status") != "ACCEPTED":
              raise SystemExit("IA admission is not ACCEPTED")
          ia_lifecycle = ia_result["lifecycle_assertion"]
          lifecycle["providers"] = [
              ia_lifecycle if item.get("capability") == "prep.information-architecture" else item
              for item in lifecycle.get("providers", [])
          ]

          candidate = load(root / ".harness/candidates/frontend-boundary-topology-admission.yaml")

          def source_from_candidate(path, artifact_id):
              data = load(path)
              assertions = []
              for raw in data.get("semantic_assertions", []):
                  item = copy.deepcopy(raw)
                  item["source_artifact"] = artifact_id
                  assertions.append(item)
              return {"semantic_assertions": assertions}

          source_sets = {
              "prep.information-architecture": source_from_candidate(
                  root / ".harness/candidates/information-architecture-admission.yaml",
                  "INFORMATION-ARCHITECTURE",
              ),
              "prep.interaction-design": source_from_candidate(
                  root / ".harness/candidates/frontend-boundary-interaction-admission.yaml",
                  "INTERACTION-DESIGN",
              ),
          }
          all_assertions = [
              copy.deepcopy(item)
              for source in source_sets.values()
              for item in source["semantic_assertions"]
          ]

          accepted_derivations = publication["state"]["semantic_evaluations"].get("derivation_evaluations", [])
          def accepted_evidence(source_capability):
              old = next(
                  item for item in accepted_derivations
                  if item.get("source_capability") == source_capability
                  and item.get("target_capability") == "prep.interface-topology"
                  and item.get("status") == "ACCEPTED"
              )
              return {
                  "version": 1,
                  "kind": "harness-semantic-derivation-evidence",
                  "source_capability": source_capability,
                  "target_capability": "prep.interface-topology",
                  "links": copy.deepcopy(old.get("links", [])),
                  "dispositions": copy.deepcopy(old.get("dispositions", [])),
              }

          specs = [
              (
                  "ia",
                  "prep.information-architecture",
                  root / ".harness/candidates/fb-topology-ia-contract.yaml",
              ),
              (
                  "interaction",
                  "prep.interaction-design",
                  root / ".harness/candidates/fb-topology-interaction-contract.yaml",
              ),
          ]
          derivations = []
          for label, source_capability, contract_path in specs:
              result = evaluate_derivation(
                  graph=graph,
                  contract=load(contract_path),
                  source=source_sets[source_capability],
                  candidate=candidate,
                  evidence=accepted_evidence(source_capability),
              )
              derivations.append(result)
              (diag / f"topology-derivation-{label}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True)
              )

          result = admit_artifact(
              graph=graph,
              model=model,
              skill_registry=registry,
              knowledge_contracts=contracts,
              decision_contracts=decision_contracts,
              capability="prep.interface-topology",
              sources={"semantic_assertions": all_assertions},
              candidate=candidate,
              acceptance_id="PREP-INTERFACE-TOPOLOGY-STRICT-6",
              lifecycle=lifecycle,
              derivation_evaluations=derivations,
              decision_request_mode="REVISION",
          )
          (diag / "topology-semantic-admission.json").write_text(
              json.dumps(result, indent=2, sort_keys=True)
          )
          print(json.dumps({
              "status": result.get("status"),
              "acceptance_id": result.get("admission", {}).get("acceptance_id"),
              "findings": result.get("findings", []),
              "questions": result.get("question_proposals", []),
          }, indent=2))
          if result.get("status") != "ACCEPTED":
              raise SystemExit(1)
          PY

      - name: Re-admit Presentation System against revised topology
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.semantic_admission import admit_artifact
          from harness.assurance.semantic_derivation import evaluate_derivation

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())

          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          model = publication["state"]["core_model"]
          lifecycle = copy.deepcopy(publication["state"]["lifecycle"])
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")

          for filename, capability in [
              ("ia-semantic-admission.json", "prep.information-architecture"),
              ("topology-semantic-admission.json", "prep.interface-topology"),
          ]:
              result = json.loads((diag / filename).read_text())
              if result.get("status") != "ACCEPTED":
                  raise SystemExit(f"{capability} admission is not ACCEPTED")
              replacement = result["lifecycle_assertion"]
              lifecycle["providers"] = [
                  replacement if item.get("capability") == capability else item
                  for item in lifecycle.get("providers", [])
              ]

          candidate = load(root / ".harness/candidates/presentation-screen-presentation-admission.yaml")

          def source_from_candidate(path, artifact_id):
              data = load(path)
              assertions = []
              for raw in data.get("semantic_assertions", []):
                  item = copy.deepcopy(raw)
                  item["source_artifact"] = artifact_id
                  assertions.append(item)
              return {"semantic_assertions": assertions}

          source_specs = {
              "prep.conceptual-interface-model": (
                  "CONCEPTUAL-INTERFACE-MODEL",
                  root / ".harness/candidates/conceptual-interface-model-admission.yaml",
                  root / ".harness/candidates/ps-concept-contract.yaml",
              ),
              "prep.information-architecture": (
                  "INFORMATION-ARCHITECTURE",
                  root / ".harness/candidates/information-architecture-admission.yaml",
                  root / ".harness/candidates/ps-ia-contract.yaml",
              ),
              "prep.interface-topology": (
                  "INTERFACE-TOPOLOGY",
                  root / ".harness/candidates/frontend-boundary-topology-admission.yaml",
                  root / ".harness/candidates/ps-topology-contract.yaml",
              ),
              "prep.interaction-design": (
                  "INTERACTION-DESIGN",
                  root / ".harness/candidates/frontend-boundary-interaction-admission.yaml",
                  root / ".harness/candidates/ps-interaction-contract.yaml",
              ),
              "prep.frontend-performance-capacity": (
                  "FRONTEND-PERFORMANCE-CAPACITY",
                  root / ".harness/candidates/frontend-performance-capacity-admission.yaml",
                  root / ".harness/candidates/ps-quality-contract.yaml",
              ),
          }
          source_sets = {
              capability: source_from_candidate(path, artifact_id)
              for capability, (artifact_id, path, _contract) in source_specs.items()
          }
          all_assertions = [
              copy.deepcopy(item)
              for source in source_sets.values()
              for item in source["semantic_assertions"]
          ]

          accepted_derivations = publication["state"]["semantic_evaluations"].get("derivation_evaluations", [])
          def accepted_evidence(source_capability):
              old = next(
                  item for item in accepted_derivations
                  if item.get("source_capability") == source_capability
                  and item.get("target_capability") == "prep.presentation-system"
                  and item.get("status") == "ACCEPTED"
              )
              links = copy.deepcopy(old.get("links", []))
              if source_capability == "prep.interface-topology":
                  links.append({
                      "sources": ["TOP-EVIDENCE-REVIEW"],
                      "relation": "CONSTRAINS",
                      "targets": ["PS-CONTROLS", "PS-PATTERN-STATE-BASIS", "PS-PATTERN-ACTIVITY"],
                  })
              return {
                  "version": 1,
                  "kind": "harness-semantic-derivation-evidence",
                  "source_capability": source_capability,
                  "target_capability": "prep.presentation-system",
                  "links": links,
                  "dispositions": copy.deepcopy(old.get("dispositions", [])),
              }

          derivations = []
          for capability, (_artifact_id, _path, contract_path) in source_specs.items():
              result = evaluate_derivation(
                  graph=graph,
                  contract=load(contract_path),
                  source=source_sets[capability],
                  candidate=candidate,
                  evidence=accepted_evidence(capability),
              )
              derivations.append(result)
              label = capability.replace("prep.", "").replace("-", "_")
              (diag / f"presentation-derivation-{label}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True)
              )

          result = admit_artifact(
              graph=graph,
              model=model,
              skill_registry=registry,
              knowledge_contracts=contracts,
              decision_contracts=decision_contracts,
              capability="prep.presentation-system",
              sources={"semantic_assertions": all_assertions},
              candidate=candidate,
              acceptance_id="PREP-PRESENTATION-SYSTEM-STRICT-6",
              lifecycle=lifecycle,
              derivation_evaluations=derivations,
              decision_request_mode="REVISION",
          )
          (diag / "presentation-semantic-admission.json").write_text(
              json.dumps(result, indent=2, sort_keys=True)
          )
          print(json.dumps({
              "status": result.get("status"),
              "acceptance_id": result.get("admission", {}).get("acceptance_id"),
              "findings": result.get("findings", []),
              "questions": result.get("question_proposals", []),
          }, indent=2))
          if result.get("status") != "ACCEPTED":
              raise SystemExit(1)
          PY

      - name: Admit Screen View revision
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.semantic_admission import admit_artifact
          from harness.assurance.semantic_derivation import evaluate_derivation

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())

          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          model = publication["state"]["core_model"]
          lifecycle = copy.deepcopy(publication["state"]["lifecycle"])
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")

          for filename, capability in [
              ("ia-semantic-admission.json", "prep.information-architecture"),
              ("topology-semantic-admission.json", "prep.interface-topology"),
              ("presentation-semantic-admission.json", "prep.presentation-system"),
          ]:
              result = json.loads((diag / filename).read_text())
              if result.get("status") != "ACCEPTED":
                  raise SystemExit(f"{capability} admission is not ACCEPTED")
              replacement = result["lifecycle_assertion"]
              lifecycle["providers"] = [
                  replacement if item.get("capability") == capability else item
                  for item in lifecycle.get("providers", [])
              ]

          candidate = load(root / ".harness/candidates/presentation-screen-screen-admission.yaml")

          def source_from_candidate(path, artifact_id):
              data = load(path)
              assertions = []
              for raw in data.get("semantic_assertions", []):
                  item = copy.deepcopy(raw)
                  item["source_artifact"] = artifact_id
                  assertions.append(item)
              return {"semantic_assertions": assertions}

          source_specs = {
              "prep.interface-topology": (
                  "INTERFACE-TOPOLOGY",
                  root / ".harness/candidates/frontend-boundary-topology-admission.yaml",
                  root / ".harness/candidates/sv-topology-contract.yaml",
              ),
              "prep.interaction-design": (
                  "INTERACTION-DESIGN",
                  root / ".harness/candidates/frontend-boundary-interaction-admission.yaml",
                  root / ".harness/candidates/sv-interaction-contract.yaml",
              ),
              "prep.presentation-system": (
                  "PRESENTATION-SYSTEM",
                  root / ".harness/candidates/presentation-screen-presentation-admission.yaml",
                  root / ".harness/candidates/sv-presentation-contract.yaml",
              ),
              "prep.machine-interfaces": (
                  "MACHINE-INTERFACES",
                  root / ".harness/candidates/frontend-boundary-machine-admission.yaml",
                  root / ".harness/candidates/sv-machine-contract.yaml",
              ),
              "prep.frontend-performance-capacity": (
                  "FRONTEND-PERFORMANCE-CAPACITY",
                  root / ".harness/candidates/frontend-performance-capacity-admission.yaml",
                  root / ".harness/candidates/sv-quality-contract.yaml",
              ),
          }
          source_sets = {
              capability: source_from_candidate(path, artifact_id)
              for capability, (artifact_id, path, _contract) in source_specs.items()
          }
          all_assertions = [
              copy.deepcopy(item)
              for source in source_sets.values()
              for item in source["semantic_assertions"]
          ]

          accepted_derivations = publication["state"]["semantic_evaluations"].get("derivation_evaluations", [])
          def accepted_evidence(source_capability):
              old = next(
                  item for item in accepted_derivations
                  if item.get("source_capability") == source_capability
                  and item.get("target_capability") == "prep.screen-view-design"
                  and item.get("status") == "ACCEPTED"
              )
              links = copy.deepcopy(old.get("links", []))
              if source_capability == "prep.interface-topology":
                  links.append({
                      "sources": ["TOP-EVIDENCE-REVIEW"],
                      "relation": "CONSTRAINS",
                      "targets": ["SV-FRAME", "SV-EVIDENCE"],
                  })
              return {
                  "version": 1,
                  "kind": "harness-semantic-derivation-evidence",
                  "source_capability": source_capability,
                  "target_capability": "prep.screen-view-design",
                  "links": links,
                  "dispositions": copy.deepcopy(old.get("dispositions", [])),
              }

          derivations = []
          for capability, (_artifact_id, _path, contract_path) in source_specs.items():
              result = evaluate_derivation(
                  graph=graph,
                  contract=load(contract_path),
                  source=source_sets[capability],
                  candidate=candidate,
                  evidence=accepted_evidence(capability),
              )
              derivations.append(result)
              label = capability.replace("prep.", "").replace("-", "_")
              (diag / f"screen-derivation-{label}.json").write_text(
                  json.dumps(result, indent=2, sort_keys=True)
              )

          result = admit_artifact(
              graph=graph,
              model=model,
              skill_registry=registry,
              knowledge_contracts=contracts,
              decision_contracts=decision_contracts,
              capability="prep.screen-view-design",
              sources={"semantic_assertions": all_assertions},
              candidate=candidate,
              acceptance_id="PREP-SCREEN-VIEW-DESIGN-STRICT-6",
              lifecycle=lifecycle,
              derivation_evaluations=derivations,
              decision_request_mode="REVISION",
          )
          (diag / "screen-semantic-admission.json").write_text(
              json.dumps(result, indent=2, sort_keys=True)
          )
          print(json.dumps({
              "status": result.get("status"),
              "acceptance_id": result.get("admission", {}).get("acceptance_id"),
              "findings": result.get("findings", []),
              "questions": result.get("question_proposals", []),
          }, indent=2))
          if result.get("status") != "ACCEPTED":
              raise SystemExit(1)
          PY

      - name: Publish accepted UI reconciliation batch
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import (
              prepare_reconciliation_publication,
              publish_project_publication,
              read_project_publication,
          )

          root = Path(os.environ["GITHUB_WORKSPACE"])
          diag = root / ".harness" / "diagnostics"
          graph = yaml.safe_load((root / ".harness/engineering-graph.yaml").read_text())
          current = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)

          results = {}
          for capability, filename in [
              ("prep.interface-topology", "topology-semantic-admission.json"),
              ("prep.presentation-system", "presentation-semantic-admission.json"),
              ("prep.screen-view-design", "screen-semantic-admission.json"),
          ]:
              value = json.loads((diag / filename).read_text())
              if value.get("status") != "ACCEPTED":
                  raise SystemExit(f"{capability} admission is not ACCEPTED")
              results[capability] = value

          semantic = copy.deepcopy(current["state"]["semantic_evaluations"])
          semantic["semantic_evaluations"] = [
              results.get(item.get("capability"), item)
              for item in semantic.get("semantic_evaluations", [])
          ]

          replacement_derivations = {
              "prep.interface-topology": [
                  json.loads((diag / "topology-derivation-ia.json").read_text()),
                  json.loads((diag / "topology-derivation-interaction.json").read_text()),
              ],
              "prep.presentation-system": [
                  json.loads((diag / name).read_text())
                  for name in (
                      "presentation-derivation-conceptual_interface_model.json",
                      "presentation-derivation-information_architecture.json",
                      "presentation-derivation-interface_topology.json",
                      "presentation-derivation-interaction_design.json",
                      "presentation-derivation-frontend_performance_capacity.json",
                  )
              ],
              "prep.screen-view-design": [
                  json.loads((diag / name).read_text())
                  for name in (
                      "screen-derivation-interface_topology.json",
                      "screen-derivation-interaction_design.json",
                      "screen-derivation-presentation_system.json",
                      "screen-derivation-machine_interfaces.json",
                      "screen-derivation-frontend_performance_capacity.json",
                  )
              ],
          }
          replaced_targets = set(replacement_derivations)
          semantic["derivation_evaluations"] = [
              item for item in semantic.get("derivation_evaluations", [])
              if item.get("target_capability") not in replaced_targets
          ]
          for capability in (
              "prep.interface-topology",
              "prep.presentation-system",
              "prep.screen-view-design",
          ):
              semantic["derivation_evaluations"].extend(
                  replacement_derivations[capability]
              )

          lifecycle = copy.deepcopy(current["state"]["lifecycle"])
          lifecycle["providers"] = [
              results[item["capability"]]["lifecycle_assertion"]
              if item.get("capability") in results
              else item
              for item in lifecycle.get("providers", [])
          ]

          outcomes = {capability: "CURRENT" for capability in results}
          next_publication = prepare_reconciliation_publication(
              graph=graph,
              current_publication=current,
              expected_revision=current["revision"],
              outcomes=outcomes,
              core_model=current["state"]["core_model"],
              semantic_evaluations=semantic,
              lifecycle=lifecycle,
              decision_failures=current["state"]["decision_failures"],
          )
          publish_project_publication(
              root / ".harness/project-publication.yaml",
              graph=graph,
              publication=next_publication,
              expected_revision=current["revision"],
          )
          (diag / "ui-publication-next.yaml").write_text(
              yaml.safe_dump(next_publication, sort_keys=False, allow_unicode=True)
          )
          print(json.dumps({
              "parent_revision": current["revision"],
              "next_revision": next_publication["revision"],
              "outcomes": outcomes,
          }, indent=2))
          PY
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- .harness/project-publication.yaml; then
            echo "No UI publication change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .harness/project-publication.yaml
            git commit -m "Publish contextual evidence UI reconciliation [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Plan downstream reconciliation
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.reconciliation import plan_reconciliation
          from harness.application.semantic_closure import evaluate_semantic_closure

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())
          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")

          summaries = {}
          for target in ("CURRENT-REVALIDATION", "FRONTEND-PROTOTYPE", "FRONTEND-IMPLEMENTATION"):
              closure = evaluate_semantic_closure(
                  graph=graph,
                  model=publication["state"]["core_model"],
                  target=target,
                  skill_registry=registry,
                  semantic_evaluations=publication["state"]["semantic_evaluations"],
                  lifecycle=publication["state"]["lifecycle"],
                  knowledge_contracts=contracts,
                  decision_contracts=decision_contracts,
              )
              next_actions = [
                  {
                      "source": "SEMANTIC_CLOSURE",
                      "action": "REVALIDATE_SEMANTICS",
                      "capability": item["capability"],
                      "state": item["state"],
                  }
                  for item in closure.get("currentness_gaps", [])
                  if item.get("state") == "STALE"
              ]
              frontier = {
                  "version": 1,
                  "kind": "harness-project-frontier",
                  "target": target,
                  "status": "READY" if next_actions else closure["status"],
                  "next_actions": next_actions,
                  "failed_validation": [],
                  "blocked": [],
                  "waiting": [],
                  "gaps": [],
                  "source_status": {
                      "decision": "COMPLETE",
                      "semantic": closure["status"],
                      "structural": closure["structural_status"],
                      "coverage_completion_ready": True,
                  },
              }
              plan = plan_reconciliation(
                  graph=graph,
                  target=target,
                  current_publication_revision=publication["revision"],
                  project_frontier=frontier,
                  semantic_closure=closure,
              )
              (diag / f"reconciliation-closure-{target}.json").write_text(
                  json.dumps(closure, indent=2, sort_keys=True)
              )
              (diag / f"reconciliation-plan-{target}.json").write_text(
                  json.dumps(plan, indent=2, sort_keys=True)
              )
              summaries[target] = {
                  "status": closure["status"],
                  "stale": [
                      item["capability"] for item in closure.get("currentness_gaps", [])
                      if item.get("state") == "STALE"
                  ],
                  "affected": plan.get("affected", []),
                  "unchanged_count": len(plan.get("unchanged", [])),
                  "blocked": plan.get("blocked", []),
                  "gaps": plan.get("gaps", []),
              }
          print(json.dumps(summaries, indent=2))
          PY

      - name: Execute downstream reconciliation in memory
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          import yaml

          from harness.application.project_publication import read_project_publication
          from harness.application.reconciliation import execute_reconciliation

          root = Path(os.environ["GITHUB_WORKSPACE"])
          pack = Path.cwd()
          diag = root / ".harness" / "diagnostics"
          load = lambda p: yaml.safe_load(Path(p).read_text())
          graph = load(root / ".harness/engineering-graph.yaml")
          publication = read_project_publication(root / ".harness/project-publication.yaml", graph=graph)
          registry = load(pack / "skills/artifact-skill-registry-v0.yaml")
          contracts = load(pack / "spec/semantic-acceptance/knowledge-kind-contracts-v1.yaml")
          decision_contracts = load(pack / "spec/decision-governance/knowledge-kind-decision-contracts-v1.yaml")
          plan = json.loads((diag / "reconciliation-plan-FRONTEND-PROTOTYPE.json").read_text())

          def source_from_candidate(path, artifact_id):
              data = load(path)
              assertions = []
              for raw in data.get("semantic_assertions", []):
                  item = copy.deepcopy(raw)
                  item["source_artifact"] = artifact_id
                  assertions.append(item)
              return assertions

          ia = source_from_candidate(
              root / ".harness/candidates/information-architecture-admission.yaml",
              "INFORMATION-ARCHITECTURE",
          )
          interaction = source_from_candidate(
              root / ".harness/candidates/frontend-boundary-interaction-admission.yaml",
              "INTERACTION-DESIGN",
          )
          topology = source_from_candidate(
              root / ".harness/candidates/frontend-boundary-topology-admission.yaml",
              "INTERFACE-TOPOLOGY",
          )
          presentation = source_from_candidate(
              root / ".harness/candidates/presentation-screen-presentation-admission.yaml",
              "PRESENTATION-SYSTEM",
          )
          conceptual = source_from_candidate(
              root / ".harness/candidates/conceptual-interface-model-admission.yaml",
              "CONCEPTUAL-INTERFACE-MODEL",
          )
          quality = source_from_candidate(
              root / ".harness/candidates/frontend-performance-capacity-admission.yaml",
              "FRONTEND-PERFORMANCE-CAPACITY",
          )
          machine = source_from_candidate(
              root / ".harness/candidates/frontend-boundary-machine-admission.yaml",
              "MACHINE-INTERFACES",
          )

          admission_inputs = {
              "prep.interface-topology": {
                  "sources": {"semantic_assertions": ia + interaction},
                  "candidate": load(root / ".harness/candidates/frontend-boundary-topology-admission.yaml"),
                  "acceptance_id": "PREP-INTERFACE-TOPOLOGY-STRICT-6",
                  "decision_request_mode": "REVISION",
                  "derivation_evaluations": [
                      json.loads((diag / "topology-derivation-ia.json").read_text()),
                      json.loads((diag / "topology-derivation-interaction.json").read_text()),
                  ],
              },
              "prep.presentation-system": {
                  "sources": {"semantic_assertions": conceptual + ia + topology + interaction + quality},
                  "candidate": load(root / ".harness/candidates/presentation-screen-presentation-admission.yaml"),
                  "acceptance_id": "PREP-PRESENTATION-SYSTEM-STRICT-6",
                  "decision_request_mode": "REVISION",
                  "derivation_evaluations": [
                      json.loads((diag / name).read_text())
                      for name in (
                          "presentation-derivation-conceptual_interface_model.json",
                          "presentation-derivation-information_architecture.json",
                          "presentation-derivation-interface_topology.json",
                          "presentation-derivation-interaction_design.json",
                          "presentation-derivation-frontend_performance_capacity.json",
                      )
                  ],
              },
              "prep.screen-view-design": {
                  "sources": {"semantic_assertions": topology + interaction + presentation + machine + quality},
                  "candidate": load(root / ".harness/candidates/presentation-screen-screen-admission.yaml"),
                  "acceptance_id": "PREP-SCREEN-VIEW-DESIGN-STRICT-6",
                  "decision_request_mode": "REVISION",
                  "derivation_evaluations": [
                      json.loads((diag / name).read_text())
                      for name in (
                          "screen-derivation-interface_topology.json",
                          "screen-derivation-interaction_design.json",
                          "screen-derivation-presentation_system.json",
                          "screen-derivation-machine_interfaces.json",
                          "screen-derivation-frontend_performance_capacity.json",
                      )
                  ],
              },
          }

          result = execute_reconciliation(
              graph=graph,
              target="FRONTEND-PROTOTYPE",
              current_publication=publication,
              expected_revision=publication["revision"],
              plan=plan,
              skill_registry=registry,
              knowledge_contracts=contracts,
              decision_contracts=decision_contracts,
              admission_inputs=admission_inputs,
              resume_token=plan["resume_token"],
          )
          serializable = copy.deepcopy(result)
          publication_next = serializable.pop("publication", None)
          (diag / "reconciliation-execution.json").write_text(
              json.dumps(serializable, indent=2, sort_keys=True)
          )
          if publication_next is not None:
              (diag / "reconciliation-publication-next.yaml").write_text(
                  yaml.safe_dump(publication_next, sort_keys=False, allow_unicode=True)
              )
          print(json.dumps({
              "status": result.get("status"),
              "completed": result.get("completed", []),
              "blocked": result.get("blocked", []),
              "gaps": result.get("gaps", []),
              "failed_validation": result.get("failed_validation", []),
              "waiting": result.get("waiting", []),
              "closure": result.get("closure"),
              "next_revision": publication_next.get("revision") if publication_next else None,
          }, indent=2))
          PY

