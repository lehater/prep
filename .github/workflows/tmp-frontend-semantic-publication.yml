name: Frontend semantic publication checkpoint

on:
  push:
    branches:
      - consolidate/frontend-design-2026-10-06
    paths:
      - "tools/tmp_revalidate_frontend_tail.py"
      - ".github/workflows/tmp-frontend-semantic-publication.yml"

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Sync current pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          PACK="$(python .harness/harnessw.py sync)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"

      - name: Revalidate selected frontend tail
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
          PUBLISH: "1"
        run: python tools/tmp_revalidate_frontend_tail.py

      - name: Validate published current frontend closure
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          python tools/check_harness_integration.py
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.graph_doctor "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" --core-model "$GITHUB_WORKSPACE/.harness/core.yaml" --target FRONTEND-IMPLEMENTATION --source-root "$GITHUB_WORKSPACE" --json

      - name: Publish accepted state to branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml
          for f in             .harness/candidates/frontend-system-architecture-exploration.yaml             .harness/candidates/frontend-component-design-exploration.yaml             .harness/candidates/frontend-implementation-design-exploration.yaml; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Frontend publication already current"
          else
            git commit -m "Publish current frontend design semantics"
            git push origin HEAD:consolidate/frontend-design-2026-10-06
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-tail-semantic-revalidation
          path: |
            .harness/project-publication.frontend-next.yaml
            .harness/frontend-tail-revalidation-report.yaml
