name: Fast frontend validation

on:
  push:
    branches-ignore: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend-fast.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/frontend-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-fast:
    name: Frontend fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run fast deterministic checks
        run: npm run verify:fast
