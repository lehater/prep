name: PR validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-fast:
    name: Frontend fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect maintained knowledge experiment changes
        id: knowledge-experiment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            changed=true
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -Eq '^(experiments/knowledge_representation/|\.github/workflows/pr-validation\.yml$)'; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "knowledge_experiment_changed=$changed"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            experiments/knowledge_representation/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run deterministic frontend checks
        working-directory: frontend
        run: npm run fast

      - name: Install preserved knowledge experiment dependencies
        if: ${{ steps.knowledge-experiment.outputs.changed == 'true' }}
        working-directory: experiments/knowledge_representation
        run: npm ci

      - name: Lint preserved knowledge experiment
        if: ${{ steps.knowledge-experiment.outputs.changed == 'true' }}
        working-directory: experiments/knowledge_representation
        run: npm run lint

      - name: Build preserved knowledge experiment
        if: ${{ steps.knowledge-experiment.outputs.changed == 'true' }}
        working-directory: experiments/knowledge_representation
        run: npm run build

      - name: Build preserved knowledge experiment Storybook
        if: ${{ steps.knowledge-experiment.outputs.changed == 'true' }}
        working-directory: experiments/knowledge_representation
        run: npm run build-storybook

  repository-fast:
    name: Repository fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Harness
        uses: actions/checkout@v7
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Validate Harness integration and current publication integrity
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py

      - name: Revalidate UI materiality through Harness APIs
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/revalidate_ui_materiality.py

      - name: Generate interface-topology Decision Explorer request
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          pub = yaml.safe_load(Path(".harness/project-publication.yaml").read_text())
          Path("/tmp/prep-lifecycle.yaml").write_text(
              yaml.safe_dump(pub["state"]["lifecycle"], sort_keys=False)
          )
          PY
          cd .harness-tool
          python -m harness.application.decision_explorer_request \
            "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" \
            "$GITHUB_WORKSPACE/.harness/core.yaml" \
            prep.interface-topology \
            "$GITHUB_WORKSPACE/.harness/candidates/ui-materiality-decision-policy.yaml" \
            --lifecycle /tmp/prep-lifecycle.yaml

      - name: Probe full Harness currentness
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py

      - name: Capture UI revalidation outputs
        shell: bash
        run: |
          git diff --binary HEAD -- \
            .harness/project-publication.yaml \
            .harness/candidates/frontend-boundary-topology-request.json \
            .harness/candidates/frontend-boundary-topology-exploration.yaml \
            .harness/candidates/presentation-screen-presentation-request.json \
            .harness/candidates/presentation-screen-presentation-exploration.yaml \
            .harness/candidates/presentation-screen-screen-request.json \
            .harness/candidates/presentation-screen-screen-exploration.yaml \
            > /tmp/ui-revalidation.patch
          cp .harness/project-publication.yaml /tmp/project-publication.yaml
          mkdir -p /tmp/ui-candidates
          cp .harness/candidates/frontend-boundary-topology-request.json /tmp/ui-candidates/
          cp .harness/candidates/frontend-boundary-topology-exploration.yaml /tmp/ui-candidates/
          cp .harness/candidates/presentation-screen-presentation-request.json /tmp/ui-candidates/
          cp .harness/candidates/presentation-screen-presentation-exploration.yaml /tmp/ui-candidates/
          cp .harness/candidates/presentation-screen-screen-request.json /tmp/ui-candidates/
          cp .harness/candidates/presentation-screen-screen-exploration.yaml /tmp/ui-candidates/

      - name: Upload UI revalidation outputs
        uses: actions/upload-artifact@v4
        with:
          name: ui-revalidation-outputs
          path: |
            /tmp/ui-revalidation.patch
            /tmp/project-publication.yaml
            /tmp/ui-candidates/

      - name: Persist UI revalidation outputs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .harness/project-publication.yaml \
            .harness/candidates/frontend-boundary-topology-request.json \
            .harness/candidates/frontend-boundary-topology-exploration.yaml \
            .harness/candidates/presentation-screen-presentation-request.json \
            .harness/candidates/presentation-screen-presentation-exploration.yaml \
            .harness/candidates/presentation-screen-screen-request.json \
            .harness/candidates/presentation-screen-screen-exploration.yaml
          if git diff --cached --quiet; then
            echo "UI revalidation outputs already persisted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish UI materiality revalidation"
          git push origin HEAD:"$HEAD_REF"

      - name: Validate documentation links
        run: python tools/validate_docs.py

      - name: Validate maintained Anki reference implementation
        run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v
