name: FI-00 bootstrap materialization

on:
  push:
    branches:
      - implementation/fi00-frontend-bootstrap-2026-10-06
    paths:
      - "frontend/package.json"
      - "docs/implementation/frontend-implementation-design.md"
      - ".harness/candidates/frontend-implementation-design-admission.yaml"
      - ".harness/candidates/frontend-implementation-design-exploration.yaml"
      - "tools/tmp_revalidate_frontend_tail.py"
      - ".github/workflows/tmp-fi00-bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run deterministic frontend checks
        working-directory: frontend
        run: npm run fast

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for bootstrap E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run bootstrap E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Audit dependency vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Harness runtime dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          PACK="$(python .harness/harnessw.py sync)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"

      - name: Re-admit implementation design
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
          PUBLISH: "1"
        run: python tools/tmp_revalidate_frontend_tail.py

      - name: Validate published implementation closure
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          python tools/check_harness_integration.py
          cd "${{ steps.sync.outputs.pack }}"
          python -m harness.application.graph_doctor "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" --core-model "$GITHUB_WORKSPACE/.harness/core.yaml" --target FRONTEND-IMPLEMENTATION --source-root "$GITHUB_WORKSPACE" --json

      - name: Publish generated lock and accepted semantics
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .harness/project-publication.yaml .harness/candidates/frontend-implementation-design-exploration.yaml
          if git diff --cached --quiet; then
            echo "Bootstrap outputs already current"
          else
            git commit -m "Materialize FI-00 locked bootstrap"
            git push origin HEAD:implementation/fi00-frontend-bootstrap-2026-10-06
          fi
