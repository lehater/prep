name: Frontend redesign semantic checkpoint

on:
  push:
    branches:
      - research/problem-space-revalidation
    paths:
      - ".github/workflows/frontend-redesign-semantic-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - name: Strict semantic baseline against pinned Harness
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - name: Harness integration against pinned Harness
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - run: python tools/validate_docs.py
      - run: python tools/validate_architecture.py
      - run: python tools/validate_questions.py
      - run: python -m unittest discover -s tests -v

# rerun after explicit quality coverage ownership

