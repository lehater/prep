name: Baseline revalidation routing diagnostic

on:
  push:
    branches:
      - revalidate/baseline-architecture-verification
    paths:
      - ".github/workflows/baseline-routing-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Harness runtime dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Sync active Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          python .harness/harnessw.py sync | tee /tmp/harness-sync.txt
          PACK="$(tail -n 1 /tmp/harness-sync.txt)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"

      - name: Route required artifact procedures
        env:
          PACK: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          for kind in concurrency-consistency-design verification-strategy system-architecture data-design; do
            echo "===== $kind ====="
            PYTHONPATH="$PACK/src" python -m harness.application.skill_router artifact --knowledge-kind "$kind" --root "$PACK"
          done

      - name: Print routed instruction contracts
        env:
          PACK: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          for path in \
            docs/design/agent-instruction-architecture-v0.md \
            skills/artifacts/concurrency-consistency-design/SKILL.md \
            skills/artifacts/verification-strategy/SKILL.md \
            skills/artifacts/system-architecture/SKILL.md \
            skills/artifacts/data-design/SKILL.md; do
            echo "===== FILE: $path ====="
            cat "$PACK/$path"
          done

      - name: Inspect method registry for decision exploration
        env:
          PACK: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          echo "===== METHOD REGISTRY ====="
          cat "$PACK/skills/method-skill-registry-v0.yaml"
