name: Consolidation Harness checkpoint

on:
  push:
    branches:
      - consolidate/ui-architecture-2026-10-06

permissions:
  contents: read

jobs:
  harness-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Materialize pinned Consumer Pack
        id: pack
        shell: bash
        run: |
          PACK="$(python .harness/harnessw.py sync)"
          echo "path=$PACK" >> "$GITHUB_OUTPUT"
          mkdir -p .harness/diagnostics
          echo "$PACK" > .harness/diagnostics/consumer-pack-path.txt

      - name: Route required consumer procedures
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.application.skill_router operation --surface consumer --operation project-bootstrap-reconcile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-project-bootstrap-reconcile.json"
          python -m harness.application.skill_router operation --surface consumer --operation design-profile > "$GITHUB_WORKSPACE/.harness/diagnostics/route-design-profile.json"

      - name: Print routed instruction contracts then skills
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workspace = Path.cwd()
          pack = Path((workspace / ".harness/diagnostics/consumer-pack-path.txt").read_text().strip())
          diagnostics = workspace / ".harness/diagnostics"

          for route_path in sorted(diagnostics.glob("route-*.json")):
              data = json.loads(route_path.read_text())
              print(f"===== ROUTE {route_path.name} =====")
              print(json.dumps(data, indent=2))

              for ref in data.get("instruction_contracts", []):
                  p = pack / ref
                  print(f"===== INSTRUCTION CONTRACT {ref} =====")
                  print(p.read_text())

              skill_ref = data.get("skill")
              if skill_ref:
                  p = pack / skill_ref
                  print(f"===== SKILL {skill_ref} =====")
                  print(p.read_text())
          PY

      - name: Route UI artifact procedures
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          for kind in information-architecture-design interface-topology-design screen-view-design; do
            python -m harness.application.skill_router artifact --knowledge-kind "$kind" > "$GITHUB_WORKSPACE/.harness/diagnostics/route-artifact-$kind.json"
          done

      - name: Print UI artifact contracts then skills
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          workspace = Path.cwd()
          pack = Path((workspace / ".harness/diagnostics/consumer-pack-path.txt").read_text().strip())
          diagnostics = workspace / ".harness/diagnostics"
          for route_path in sorted(diagnostics.glob("route-artifact-*.json")):
              data = json.loads(route_path.read_text())
              print(f"===== ROUTE {route_path.name} =====")
              print(json.dumps(data, indent=2))
              for ref in data.get("instruction_contracts", []):
                  print(f"===== INSTRUCTION CONTRACT {ref} =====")
                  print((pack / ref).read_text())
              skill_ref = data.get("skill")
              if skill_ref:
                  print(f"===== SKILL {skill_ref} =====")
                  print((pack / skill_ref).read_text())
          PY

      - name: Validate current project publication
        shell: bash
        run: |
          cd "${{ steps.pack.outputs.path }}"
          python -m harness.project_model.engineering_graph validate "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml"
          python -m harness.application.graph_doctor "$GITHUB_WORKSPACE/.harness/engineering-graph.yaml" --core-model "$GITHUB_WORKSPACE/.harness/core.yaml" --target FRONTEND-IMPLEMENTATION --source-root "$GITHUB_WORKSPACE" --json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-harness-checkpoint
          path: .harness/diagnostics
