name: Knowledge experiment validation

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/knowledge_representation/**"
      - ".github/workflows/knowledge-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-experiment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-experiment:
    name: Knowledge experiment fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: experiments/knowledge_representation/package-lock.json

      - name: Install locked dependencies
        working-directory: experiments/knowledge_representation
        run: npm ci

      - name: Lint preserved knowledge experiment
        working-directory: experiments/knowledge_representation
        run: npm run lint

      - name: Build preserved knowledge experiment
        working-directory: experiments/knowledge_representation
        run: npm run build

      - name: Build preserved knowledge experiment Storybook
        working-directory: experiments/knowledge_representation
        run: npm run build-storybook
