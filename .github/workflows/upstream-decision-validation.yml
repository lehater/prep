name: Upstream decision validation

on:
  push:
    branches:
      - model/tactical-domain-redesign

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read pinned Harness
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - name: Semantic baseline
        continue-on-error: true
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/semantic_baseline.py
      - name: Harness integration
        continue-on-error: true
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/check_harness_integration.py
      - name: Full revalidation
        continue-on-error: true
        env:
          HARNESS_ROOT: .harness-tool
        run: python tools/full_harness_revalidate.py
      - name: Documentation
        continue-on-error: true
        run: python tools/validate_docs.py
