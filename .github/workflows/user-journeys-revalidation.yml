name: Stage P0 user-journeys revalidation

on:
  push:
    branches:
      - stage-p0-user-journeys-revalidation
    paths:
      - ".harness/candidates/process-migration-user-journeys-admission.yaml"
      - "tools/revalidate_user_journeys_publication.py"
      - ".github/workflows/user-journeys-revalidation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bootstrap dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Sync pinned Harness Consumer Pack
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync --cache "$RUNNER_TEMP/harness-cache" | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          binding=json.loads(Path(".harness/harness-binding.json").read_text())
          expected="ed04058ff35ffbbaf735d0ecbd7c1f592e3abf71"
          actual=binding["source"]["revision"]
          assert actual == expected, (actual, expected)
          assert Path(".harness-version").read_text().strip() == expected
          print("Pinned Harness baseline:", actual)
          PY

      - name: Resolve typed user-journey procedure
        shell: bash
        run: |
          set -euo pipefail
          PACK="${{ steps.harness.outputs.pack }}"
          PYTHONPATH="$PACK/src" python -m harness.application.skill_router \
            artifact --knowledge-kind user-journey-design --root "$PACK" \
            | tee .harness/user-journey-route.json
          python - <<'PY'
          import json
          from pathlib import Path
          route=json.loads(Path(".harness/user-journey-route.json").read_text())
          assert route["route_class"] == "artifact-production"
          assert route["route_key"] == "user-journey-design"
          assert route["skill"] == "skills/artifacts/user-journey-design/SKILL.md"
          assert route.get("instruction_contracts")
          print("Typed route: PASS")
          PY

      - name: Revalidate only prep.user-journeys
        shell: bash
        env:
          HARNESS_ROOT: ${{ steps.harness.outputs.pack }}
        run: |
          set -euo pipefail
          python tools/revalidate_user_journeys_publication.py | tee .harness/stage-p0-revalidation.log

      - name: Run post-publication validation
        shell: bash
        env:
          HARNESS_ROOT: ${{ steps.harness.outputs.pack }}
        run: |
          set +e
          python tools/semantic_baseline.py > .harness/stage-p0-semantic-baseline.log 2>&1
          SEMANTIC_RC=$?
          python tools/check_harness_integration.py > .harness/stage-p0-integration.log 2>&1
          INTEGRATION_RC=$?
          python tools/full_harness_revalidate.py > .harness/stage-p0-full-revalidate.log 2>&1
          FULL_RC=$?
          python tools/validate_docs.py > .harness/stage-p0-validate-docs.log 2>&1
          DOCS_RC=$?
          printf 'semantic_baseline=%s\ncheck_harness_integration=%s\nfull_harness_revalidate=%s\nvalidate_docs=%s\n' \
            "$SEMANTIC_RC" "$INTEGRATION_RC" "$FULL_RC" "$DOCS_RC" \
            | tee .harness/stage-p0-validation-status.txt
          cat .harness/stage-p0-semantic-baseline.log
          cat .harness/stage-p0-integration.log
          cat .harness/stage-p0-full-revalidate.log
          cat .harness/stage-p0-validate-docs.log
          test "$SEMANTIC_RC" -eq 0
          test "$INTEGRATION_RC" -eq 0
          test "$DOCS_RC" -eq 0

      - name: Publish revalidated snapshot to branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/project-publication.yaml
          if git diff --cached --quiet; then
            echo "Publication already current"
          else
            git commit -m "Publish STAGE-P0 user journey revalidation"
            git push origin HEAD:stage-p0-user-journeys-revalidation
          fi

      - name: Upload STAGE-P0 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-p0-user-journeys-revalidation
          path: |
            .harness/revalidation-report.yaml
            .harness/user-journey-route.json
            .harness/stage-p0-*.log
            .harness/stage-p0-validation-status.txt
