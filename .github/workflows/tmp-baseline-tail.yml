name: temporary publication API inspection

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-baseline-tail.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect publication API
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: |
          python - <<'PY'
          import inspect, os, sys
          from pathlib import Path
          root=Path(os.environ["HARNESS_ROOT"]); sys.path.insert(0,str(root/"src"))
          from harness.application.project_publication import publish_project_publication
          print(inspect.signature(publish_project_publication))
          print(inspect.getsource(publish_project_publication))
          PY
