name: temporary full policy revalidation

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - "tools/tmp_revalidate_full_publication.py"
      - ".github/workflows/tmp-baseline-tail.yml"

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Revalidate entire published capability set
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        run: python tools/tmp_revalidate_full_publication.py
      - name: Upload revalidation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-policy-revalidation
          include-hidden-files: true
          path: |
            .harness/project-publication.next.yaml
            .harness/full-policy-revalidation-report.yaml
            .harness/candidates/*exploration*.yaml
