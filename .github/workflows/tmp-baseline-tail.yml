name: temporary Harness revalidation API discovery

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-baseline-tail.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Discover revalidation/publication application surfaces
        shell: bash
        run: |
          set -euo pipefail
          PACK="${{ steps.sync.outputs.pack }}"
          cd "$PACK"
          echo "=== APPLICATION MODULES ==="
          find src/harness/application -maxdepth 1 -type f -printf '%f\n' | sort | grep -E 'admission|closure|decision|publication|revalid|lifecycle|pipeline|status'
          echo "=== REVALIDATE SYMBOLS ==="
          grep -R -nE 'def .*revalid|class .*Revalid|revalidate_target|revalidation' src/harness/application src/harness/assurance | head -n 200 || true
          echo "=== PUBLICATION SYMBOLS ==="
          grep -R -nE '^def (build|publish|read)_project_publication|project_publication' src/harness/application/project_publication.py | head -n 120 || true
          echo "=== ROUTER OPERATIONS ==="
          python -m harness.application.skill_router operation --help || true
