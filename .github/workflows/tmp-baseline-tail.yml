name: temporary Harness closure API inspection

on:
  push:
    branches:
      - audit/ui-view-boundaries-clean
    paths:
      - ".github/workflows/tmp-baseline-tail.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pinned Harness Consumer Pack
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          PACK="$(python .harness/harnessw.py sync | tail -n 1)"
          echo "pack=$PACK" >> "$GITHUB_OUTPUT"
      - name: Inspect strict closure API
        env:
          HARNESS_ROOT: ${{ steps.sync.outputs.pack }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect, os, sys
          from pathlib import Path
          root=Path(os.environ["HARNESS_ROOT"])
          sys.path.insert(0,str(root/"src"))
          from harness.application.semantic_closure import evaluate_semantic_closure
          from harness.application.semantic_admission import derive_acceptance_policy_fingerprints
          print("CLOSURE_SIGNATURE", inspect.signature(evaluate_semantic_closure))
          print("POLICY_SIGNATURE", inspect.signature(derive_acceptance_policy_fingerprints))
          print("=== CLOSURE SOURCE ===")
          print(inspect.getsource(evaluate_semantic_closure))
          print("=== POLICY SOURCE ===")
          print(inspect.getsource(derive_acceptance_policy_fingerprints))
          PY
