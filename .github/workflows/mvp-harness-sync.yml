name: MVP Harness synchronization
on:
  push:
    branches: [chore/mvp-harness-sync]
  pull_request:
    branches: [mvp-vertical-slice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Harness
        uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML==6.0.3
      - name: Verify Consumer Pack pin agreement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = Path(".harness-version").read_text().strip()
          binding = json.loads(Path(".harness/harness-binding.json").read_text())
          assert binding["source"]["revision"] == version
          print("Harness pin consistent:", version)
          PY
      - name: Prepare fresh MVP publication candidate without replacing accepted history
        run: |
          python tools/prepare_mvp_publication.py --output .harness/diagnostics/mvp-publication-candidate.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import validate_project_publication
          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          candidate = yaml.safe_load(Path(".harness/diagnostics/mvp-publication-candidate.yaml").read_text())
          validate_project_publication(graph, candidate)
          assert candidate["state"]["lifecycle"]["providers"] == []
          print("MVP publication candidate validated; existing publication unchanged.")
          PY
        env:
          PYTHONPATH: .harness-tool/src
      - name: Validate CAS-linked unaccepted MVP candidate
        env:
          PYTHONPATH: .harness-tool/src
        run: |
          python tools/prepare_mvp_publication.py --parent-publication .harness/project-publication.yaml --output .harness/diagnostics/mvp-publication-child-candidate.yaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.application.project_publication import read_project_publication, validate_project_publication
          root = Path(".harness")
          graph = yaml.safe_load((root / "engineering-graph.yaml").read_text())
          core = yaml.safe_load((root / "core.yaml").read_text())
          previous = read_project_publication(root / "project-publication.yaml", graph=graph)
          candidate = yaml.safe_load((root / "diagnostics/mvp-publication-child-candidate.yaml").read_text())
          validate_project_publication(graph, candidate)
          assert candidate["parent_revision"] == previous["revision"]
          assert candidate["state"]["core_model"] == core
          assert candidate["state"]["semantic_evaluations"]["semantic_evaluations"] == []
          assert candidate["state"]["lifecycle"]["providers"] == []
          print("CAS-linked MVP candidate PASS: previous revision linked, no legacy acceptance inherited")
          PY
      - name: Validate MVP Engineering Graph and Core independently of readiness
        env:
          PYTHONPATH: .harness-tool/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from harness.project_model.engineering_graph import validate_engineering_graph, validate_realization
          from harness.application.project_publication import validate_project_publication
          root = Path(".harness")
          graph = yaml.safe_load((root / "engineering-graph.yaml").read_text())
          core = yaml.safe_load((root / "core.yaml").read_text())
          validate_engineering_graph(graph)
          validate_realization(graph, core)
          genesis = yaml.safe_load((root / "diagnostics/mvp-publication-candidate.yaml").read_text())
          validate_project_publication(graph, genesis)
          print("MVP structural compatibility PASS; incomplete capabilities are permitted.")
          PY
      - name: Validate accepted design frontier through Model Context Strategy
        env:
          PYTHONPATH: .harness-tool/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          graph = yaml.safe_load(Path(".harness/engineering-graph.yaml").read_text())
          core = yaml.safe_load(Path(".harness/core.yaml").read_text())
          frontier = {
              "DISCOVERY", "PRODUCT-REQUIREMENTS",
              "DOMAIN-STRATEGY", "MODEL-CONTEXT-STRATEGY",
          }
          producers = {
              row["capability"]: (authority["id"], row)
              for authority in graph["authorities"]
              for row in authority["produces"]
          }
          artifacts = [
              row for row in core["artifacts"] if row["authority"] in frontier
          ]
          realized = {cap: a for a in artifacts for cap in a["provides"]}
          expected = {
              cap for cap, (authority, _) in producers.items() if authority in frontier
          }
          assert set(realized) == expected, {
              "missing": sorted(expected - set(realized)),
              "unexpected": sorted(set(realized) - expected),
          }
          for cap in sorted(expected):
              authority, definition = producers[cap]
              artifact = realized[cap]
              assert artifact["authority"] == authority, cap
              assert Path(artifact["path"]).is_file(), cap
              for item in definition.get("requires", []):
                  required = item if isinstance(item, str) else item["capability"]
                  assert required in realized, (cap, required)
          print(f"MVP frontier PASS: {len(expected)} capabilities through MODEL-CONTEXT-STRATEGY")
          print("Tactical Domain Design and all subsequent layers excluded from readiness checks.")
          PY
