name: Temporary heavy branch validation

on:
  push:
    branches:
      - fix/user-centered-product-flow
    paths:
      - ".github/workflows/temporary-heavy-branch-validation.yml"

permissions:
  contents: read

jobs:
  repository-heavy:
    name: Repository heavy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read pinned Harness version
        id: harness
        run: echo "sha=$(cat .harness-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: lehater/harness
          ref: ${{ steps.harness.outputs.sha }}
          path: .harness-tool
      - run: python -m pip install PyYAML
      - name: Strict semantic baseline
        env: {HARNESS_ROOT: .harness-tool}
        run: python tools/semantic_baseline.py
      - name: Harness integration
        env: {HARNESS_ROOT: .harness-tool}
        run: python tools/check_harness_integration.py
      - name: Full Harness revalidation
        env: {HARNESS_ROOT: .harness-tool}
        run: python tools/full_harness_revalidate.py
      - run: python tools/validate_docs.py
      - run: python -m unittest discover -s experiments/anki_adapter_reference/tests -v

  frontend-heavy:
    name: Frontend heavy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run verify:fast
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run benchmark:graph
      - name: Build frontend container
        env:
          FRONTEND_IMAGE: prep-web-ci:${{ github.sha }}
        run: |
          docker build --build-arg PREP_FRONTEND_VERSION="${GITHUB_SHA}" --tag "${FRONTEND_IMAGE}" .
      - name: Verify frontend image identity
        env:
          FRONTEND_IMAGE: prep-web-ci:${{ github.sha }}
        run: |
          test "$(docker image inspect "${FRONTEND_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${GITHUB_SHA}"
          docker image inspect "${FRONTEND_IMAGE}" --format 'image={{.Id}} revision={{ index .Config.Labels "org.opencontainers.image.revision" }}'
