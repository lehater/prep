  - predicate: irreversible_transform
    value: false
    evidence: [docs/architecture/data-design.md, docs/architecture/system-architecture.md]
    basis: No accepted irreversible migration/transform is part of the current implementation target.
  - predicate: separate_schema_migration
    value: false
    evidence: [docs/architecture/data-design.md]
    basis: Migration tooling remains an implementation freedom; no separate migration contract is currently accepted.
  - predicate: engineering_policy_selected
