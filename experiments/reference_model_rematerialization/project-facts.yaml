  - predicate: durable_state
    value: true
    evidence: [docs/architecture/data-design.md]
    basis: Canonical data is required to survive ordinary backend/container restarts.
  - predicate: persistence_independent
    value: true
    evidence: [docs/architecture/data-design.md]
    basis: Physical persistence constraints, uniqueness and transaction boundaries form an independently accepted design contract.
  - predicate: concurrent_mutation
    value: true
    evidence: [docs/architecture/import-consistency.md, docs/architecture/data-design.md]
    basis: Concurrent import attempts and conflicting updates have explicit correctness semantics.
  - predicate: retries
    value: true
    evidence: [docs/architecture/import-consistency.md]
    basis: Repeated delivery, retry and idempotency semantics are explicit.
  - predicate: multiple_writers
    value: false
    evidence: [docs/architecture/system-architecture.md, docs/architecture/data-design.md]
    basis: Current scope has one backend application boundary and one user/data scope; concurrency is handled separately without an accepted multi-writer topology.
  - predicate: replicated_state
    value: false
    evidence: [docs/architecture/system-architecture.md]
    basis: Current topology explicitly excludes distributed synchronization/event infrastructure; offline synchronization is a reopening condition.
  - predicate: quality_constraints_material
    value: true
    evidence: [docs/architecture/performance-capacity.md]
    basis: Explicit workload, responsiveness, idle-resource and semantic-preservation constraints are accepted.
  - predicate: hard_realtime
    value: false
    evidence: [docs/architecture/performance-capacity.md]
    basis: Performance targets are interactive browser envelopes, not hard real-time correctness constraints.
  - predicate: internet_exposed
    value: false
    evidence: [docs/architecture/system-architecture.md]
    basis: Current accepted deployment/trust scope is local; later remote deployment is anticipated but not current exposure truth.
  - predicate: network_exposed
    value: true
    evidence: [docs/architecture/system-architecture.md]
    basis: Browser/frontend, backend and configured external-runtime endpoints cross machine-consumed runtime boundaries even within the current trusted deployment.
  - predicate: credentials
    value: true
    evidence: [docs/architecture/system-architecture.md, docs/architecture/data-design.md]
    basis: The configured external-runtime boundary may use an API key as deployment configuration.
  - predicate: privileged_operations
    value: false
    evidence: [docs/architecture/system-architecture.md, docs/vision/vision.md]
    basis: No privileged administrative operation or multi-user administration is accepted in the current scope.
  - predicate: external_identity_provider
    value: false
    evidence: [docs/architecture/system-architecture.md]
    basis: Authentication and multi-user identity are explicitly deferred.
  - predicate: security_analysis_material
    value: false
    evidence: [docs/architecture/system-architecture.md]
    basis: The current canonical architecture defines a local trust boundary but no independently accepted threat/control analysis artifact; security activation may still follow from concrete exposure/credential facts.
  - predicate: normative_source
    value: false
    evidence: [docs/architecture/context-map.md, docs/vision/vision.md]
    basis: External standards/literature are research evidence rather than binding project obligations in the current accepted scope.
  - predicate: production_runtime
    value: false
    evidence: [docs/implementation/frontend-implementation-design.md]
    basis: The selected current realization is explicitly a coded interactive prototype and usability-validation target, not production UI deployment.
  - predicate: external_dependencies
    value: true
    evidence: [docs/architecture/system-architecture.md, docs/implementation/frontend-implementation-design.md]
    basis: The accepted realization includes external runtime/provider and selected frontend toolchain dependencies.
  - predicate: operability_contract_material
    value: false
    evidence: [docs/architecture/system-architecture.md]
    basis: Hostnames, TLS termination, reverse proxy and production orchestration remain deferred deployment/operability decisions.
  - predicate: mixed_version_window
    value: false
