version: 1
kind: harness-engineering-graph
id: PREP-REFERENCE-V0
default_subject: PREP-REFERENCE-V0
authorities:
- id: DISCOVERY
  responsibility: Own problem observations, actors, desired outcomes and motivating
    evidence without deciding product requirements or solution semantics.
  boundary:
    semantic_cohesion: Evidence and observations about the problem space.
    independent_change: Evidence can be refined before accepted product requirements
      change.
    public_contract: Provides accepted problem evidence and unresolved discovery questions.
  produces:
  - capability: prep-reference-v0.problem-evidence
    requires: []
    knowledge_kind: problem-evidence
    semantic_claims:
    - engineering.intent.problem
  - capability: prep-reference-v0.user-needs
    requires:
    - capability: prep-reference-v0.problem-evidence
    knowledge_kind: user-needs
- id: PRODUCT-REQUIREMENTS
  responsibility: Own accepted product intent, scope, externally observable behavior,
    constraints and acceptance expectations.
  boundary:
    semantic_cohesion: Decisions about what the product must achieve.
    independent_change: Product intent can change without directly deciding domain
      or technical realization.
    public_contract: Provides accepted behavioral and acceptance semantics to downstream
      design.
  produces:
  - capability: prep-reference-v0.product-acceptance
    requires:
    - capability: prep-reference-v0.product-intent
    knowledge_kind: product-requirements
  - capability: prep-reference-v0.product-intent
    requires:
    - capability: prep-reference-v0.problem-evidence
    - capability: prep-reference-v0.user-needs
    knowledge_kind: product-requirements
    semantic_claims:
    - engineering.intent.behavior
    - engineering.intent.quality-targets
    - engineering.intent.scope
- id: DOMAIN-STRATEGY
  responsibility: Own problem-space domain decomposition, subdomain landscape, strategic
    classification and domain investment intent without deciding model-language boundaries
    or tactical structures.
  boundary:
    semantic_cohesion: Strategic decisions about domain responsibilities and investment.
    independent_change: Strategic classification can change without redefining model-context
      relationships or tactical realization.
    public_contract: Provides accepted subdomain landscape and strategic classification
      to relevant downstream consumers.
  produces:
  - capability: prep-reference-v0.domain-strategy
    requires:
    - capability: prep-reference-v0.product-intent
    knowledge_kind: domain-strategy
    semantic_claims:
    - engineering.domain.boundaries
- id: MODEL-CONTEXT-STRATEGY
  responsibility: Own where models/languages apply and how independently modeled contexts
    relate or translate without re-owning domain investment strategy or tactical internals.
  boundary:
    semantic_cohesion: Model-language applicability, context relationships and translation
      contracts.
    independent_change: Context boundaries and translations can change while strategic
      domain classification remains stable.
    public_contract: Provides accepted model-context and translation knowledge to
      tactical, application and interface consumers.
  produces:
  - capability: prep-reference-v0.model-context-strategy
    requires:
    - capability: prep-reference-v0.domain-strategy
    - capability: prep-reference-v0.product-intent
    knowledge_kind: model-context-strategy
- id: TACTICAL-DOMAIN-DESIGN
  responsibility: Own tactical domain language, identities, lifecycles, invariants,
    decisions and public domain semantics.
  boundary:
    semantic_cohesion: Decisions about how accepted domain behavior is modeled semantically.
    independent_change: Tactical semantics can evolve behind stable strategic/use-case
      contracts without selecting storage or transport.
    public_contract: Provides accepted tactical domain semantics to application and
      technical design.
  produces:
  - capability: prep-reference-v0.domain-model.knowledge-model
    requires:
    - capability: prep-reference-v0.domain-strategy
    - capability: prep-reference-v0.model-context-strategy
    - capability: prep-reference-v0.product-intent
    knowledge_kind: domain-model
    semantic_claims:
    - claim: engineering.domain.model
      subject: KNOWLEDGE-MODEL
  - capability: prep-reference-v0.domain-model.learner-model
    requires:
    - capability: prep-reference-v0.domain-strategy
    - capability: prep-reference-v0.model-context-strategy
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.domain-model.knowledge-model
    knowledge_kind: domain-model
    semantic_claims:
    - claim: engineering.domain.model
      subject: LEARNER-MODEL
  - capability: prep-reference-v0.domain-model.learning-design
    requires:
    - capability: prep-reference-v0.domain-strategy
    - capability: prep-reference-v0.model-context-strategy
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.domain-model.knowledge-model
    knowledge_kind: domain-model
    semantic_claims:
    - claim: engineering.domain.model
      subject: LEARNING-DESIGN
- id: APPLICATION-DESIGN
  responsibility: Own application-level composition of accepted domain/product behavior.
  boundary:
    semantic_cohesion: Decisions about orchestration across domain responsibilities
      and user/system journeys.
    independent_change: Application composition can evolve without re-owning underlying
      domain truth or technical architecture.
    public_contract: Provides accepted application flows and orchestration semantics.
  produces:
  - capability: prep-reference-v0.application-failure-contract
    requires:
    - capability: prep-reference-v0.product-intent
    knowledge_kind: application-design
    semantic_claims:
    - engineering.application.failures
    - engineering.reliability.dependency-failure
  - capability: prep-reference-v0.application-orchestration
    requires:
    - capability: prep-reference-v0.application-failure-contract
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.domain-model.knowledge-model
    - capability: prep-reference-v0.domain-model.learning-design
    - capability: prep-reference-v0.domain-model.learner-model
    knowledge_kind: application-design
    semantic_claims:
    - engineering.application.orchestration
  - capability: prep-reference-v0.task-model
    requires:
    - capability: prep-reference-v0.application-orchestration
    - capability: prep-reference-v0.product-intent
    knowledge_kind: task-model
  - capability: prep-reference-v0.user-journey
    requires:
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.task-model
    knowledge_kind: user-journey-design
    semantic_claims:
    - engineering.interface.human.journeys
- id: SYSTEM-ARCHITECTURE
  responsibility: Own system structure, runtime boundaries, dependency topology and
    technical interaction topology.
  boundary:
    semantic_cohesion: Structural and runtime decisions that constrain implementation.
    independent_change: Architecture can evolve behind stable product/domain contracts
      without changing their semantic ownership.
    public_contract: Provides accepted system topology and architectural constraints.
  produces:
  - capability: prep-reference-v0.runtime-architecture
    requires:
    - capability: prep-reference-v0.system-structure
    knowledge_kind: system-architecture
    semantic_claims:
    - engineering.architecture.deployment
  - capability: prep-reference-v0.system-boundary-rules
    requires:
    - capability: prep-reference-v0.system-structure
    knowledge_kind: system-architecture
    semantic_claims:
    - engineering.architecture.boundaries
  - capability: prep-reference-v0.system-structure
    requires:
    - capability: prep-reference-v0.application-orchestration
    - capability: prep-reference-v0.product-intent
    knowledge_kind: system-architecture
    semantic_claims:
    - engineering.architecture.structure
- id: CONCURRENCY-CONSISTENCY-DESIGN
  responsibility: Own concurrent-state correctness contracts without re-owning domain
    invariants, storage representation or system topology.
  boundary:
    semantic_cohesion: Ordering, isolation, atomicity, conflict, retry/idempotency
      and consistency semantics for interacting executions.
    independent_change: Concurrency semantics can change when execution/delivery behavior
      changes while system decomposition remains stable.
    public_contract: Provides accepted concurrency/consistency constraints to data,
      component, implementation and verification consumers.
  produces:
  - capability: prep-reference-v0.concurrency-consistency
    requires:
    - capability: prep-reference-v0.application-failure-contract
    - capability: prep-reference-v0.data-design
    - capability: prep-reference-v0.system-structure
    - capability: prep-reference-v0.machine-interface-contract.prep-application-api
    - capability: prep-reference-v0.machine-interface-contract.external-learning-runtime
    knowledge_kind: concurrency-consistency-design
    semantic_claims:
    - engineering.reliability.consistency
- id: MACHINE-INTERFACE-DESIGN
  responsibility: Own supported external machine interaction and representation contracts.
  boundary:
    semantic_cohesion: Machine-consumed protocol, API, message and representation
      semantics.
    independent_change: Machine interface contracts can evolve while preserving accepted
      product/domain semantics and human interaction design.
    public_contract: Provides canonical machine interface contracts to integrations
      and technical consumers.
  produces:
  - capability: prep-reference-v0.machine-interface-contract.external-learning-runtime
    requires:
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.system-boundary-rules
    knowledge_kind: interface-contract
    semantic_claims:
    - claim: engineering.interface.machine.compatibility
      subject: EXTERNAL-LEARNING-RUNTIME
    - claim: engineering.interface.machine.contract
      subject: EXTERNAL-LEARNING-RUNTIME
    - claim: engineering.interface.machine.errors
      subject: EXTERNAL-LEARNING-RUNTIME
  - capability: prep-reference-v0.machine-interface-contract.prep-application-api
    requires:
    - capability: prep-reference-v0.product-intent
    - capability: prep-reference-v0.system-boundary-rules
    knowledge_kind: interface-contract
    semantic_claims:
    - claim: engineering.interface.machine.compatibility
      subject: PREP-APPLICATION-API
    - claim: engineering.interface.machine.contract
      subject: PREP-APPLICATION-API
    - claim: engineering.interface.machine.errors
      subject: PREP-APPLICATION-API
- id: HUMAN-INTERFACE-DESIGN
  responsibility: Own human interaction semantics and presentation/view composition
    without re-owning product behavior or machine interface contracts.
  boundary:
    semantic_cohesion: Human interaction, information/navigation structure, presentation
      system and screen/view composition.
    independent_change: Human interface realization can evolve while product/domain
      and machine-interface semantics remain stable.
    public_contract: Provides accepted human-interface and presentation/view contracts
      to architecture, component, implementation and test consumers.
  produces:
  - capability: prep-reference-v0.conceptual-interface-model
    requires:
    - capability: prep-reference-v0.user-journey
    knowledge_kind: conceptual-interface-model
    semantic_claims:
